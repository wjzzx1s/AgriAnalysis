代码: "600251"
名称: "冠农股份"
定位: "新疆生产建设兵团第二师国资背景的农产品精深加工企业，产业涉及棉花加工、番茄制品、甜菜制糖、棉籽蛋白与生物发酵饲料；核心利润来自对国投罗钾（20.3%）和开都河水电（25.28%）的权益法投资收益，主业加工板块盈利能力较弱。"
沿革:
  - 年: "2003"
    事件: "经中国证监会证监发行字[2003]46 号文核准，2003 年 5 月 26 日以向沪市、深市二级市场投资者定价配售方式发行 4,000 万股、每股面值 1.00 元的人民币普通股，发行价 5.75 元/股；4,000 万股社会公众股于 2003 年 6 月 9 日在上海证券交易所挂牌交易"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=600251&id=17018"
  - 年: "2017"
    事件: "2017 年 12 月新疆生产建设兵团第二师国资委将其持有新疆冠源投资有限责任公司（现已更名为“新疆冠农集团有限责任公司”）100% 国有股权无偿划转至新疆绿原国有资产经营集团有限公司，划转完成后绿原国资间接持有公司 40.89% 股份，控股股东和实际控制人均未发生变化"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/2017-12-20/600251_20171220_3.pdf"
  - 年: "2019"
    事件: "2019 年 10 月 25 日新疆证监局下发《关于对新疆冠农果茸股份有限公司的监管关注函》（新证监函【2019】306 号），指出公司治理、信息披露与财务核算方面多项问题，其中包括商誉计提减值核算不规范、销售运费核算不规范、存货计提跌价准备不规范等"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-06-22/600251_20210622_8_akjFGaNj.pdf"
  - 年: "2020"
    事件: "2020 年 1 月 14 日上海证券交易所对公司及时任财务总监邱照亮予以监管关注（上证公监函【2019】0137 号），原因为 2019 年 11 月披露会计差错更正，合并减少公司 2018 年度归母净利润 124.52 万元"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-06-22/600251_20210622_8_akjFGaNj.pdf"
  - 年: "2021"
    事件: "公司拟向不特定对象公开发行可转换公司债券并启动申报（拟募集资金总额 110,000.00 万元），2022 年 1 月 4 日向中国证监会申报申请文件"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-10-28/600251_20211028_3_W2hMlMQe.pdf"
  - 年: "2023"
    事件: "2023 年 3 月 21 日公司七届十五次（临时）董事会审议通过《关于终止公司向不特定对象发行可转换公司债券事项的议案》，并于 2023 年 3 月 22 日公告终止该次可转债发行"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2023-03-22/600251_20230322_QCK6.pdf"
主营与结构:
  - 事件: "公司是兵团第二师铁门关市国有全资公司新疆冠农集团有限责任公司的控股子公司，注册地址新疆铁门关市，注册资本 7.8 亿元；产业涉及棉花加工、番茄制品、甜菜制糖、棉籽蛋白、生物发酵饲料等农产品精深加工，以及数字农业综合服务和第三方检测服务两个平台"
    来源: "https://www.gngf.cn/company.html"
  - 事件: "公司已发展为集 32 万吨番茄制品、5 万吨甜菜制糖、13 万吨皮棉加工、110 万吨棉花仓储、20 万吨饲料、60 万吨毛棉籽等农产品深加工及销售于一体的集团化上市公司"
    来源: "https://www.gngf.cn/contact.html"
  - 事件: "核心资产为对国投新疆罗布泊钾盐有限责任公司、开都河水电的战略股权投资，持股比例分别为 20.3%、25.28%，均采用权益法核算"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600251&id=12107679"
  - 事件: "2024 年参股公司国投罗钾实现营业收入 637,851.38 万元、营业利润 243,542.78 万元、净利润 204,991.35 万元；开都河水电实现营业收入 43,171.67 万元、营业利润 19,023.64 万元、净利润 15,755.05 万元"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-04-03/600251_20250403_BYWG.pdf"
  - 事件: "2025 年营业收入 25.15 亿元，同比下降 28.40%；利润总额 3.70 亿元，同比增长 33.44%；归母净利润 3.48 亿元，同比增长 70.31%"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260417/2851fd65fcc1422ba7c00c4ed5a9eb57.PDF"
  - 事件: "2026 年上半年利润总额、归母净利润、扣非归母净利润分别比上年同期增加 75.82%、79.09%、71.69%，主要系报告期内参股公司国投罗钾投资收益增加"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-26/1225505433.PDF"
