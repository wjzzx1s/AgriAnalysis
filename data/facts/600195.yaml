    来源: "http://static.cninfo.com.cn/finalpage/2013-10-19/63169049.PDF"
  - 年: 2025
    事件: "截至2025年12月31日公司注册资本与股本均为人民币102,114.83万元，均为无限售条件的流通股；中国农业发展集团有限公司通过其子公司中国牧工商集团有限公司持有公司49.37%的国有法人股，为公司最终控制方；主营范围涵盖畜牧产业链供应链上游关键环节的兽用生物制品、兽药、饲料及饲料添加剂、原料贸易等核心业务。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225162984.PDF"

