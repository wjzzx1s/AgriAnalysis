代码: "600195"
名称: 中牧股份
定位: "北京丰台的央企动保平台，全称中牧实业股份有限公司，1998年12月由中国牧工商（集团）总公司独家发起以募集方式设立，1999年1月7日在上海证券交易所上市；专业从事动物保健品和动物营养品研发、生产、销售及技术服务，设立20余个生产基地，产品覆盖兽用生物制品、兽用化药、饲料及饲料添加剂与饲料原料贸易，年营收超60亿元。控股股东为中国牧工商集团有限公司（持股49.37%），实际控制人为中国农业发展集团有限公司。2025年归母净利润1.71亿元、同比增长141.68%，但扣非净利润仅0.20亿元、同比下降67.42%；2026年上半年归母净利润0.50亿元、同比下降39.04%。"

沿革:
  - 年: 1998
    事件: "1998年12月22日经原国家经贸委（国经贸委企改[1998]822号文）批准，由中国牧工商（集团）总公司（现更名为中国牧工商集团有限公司）独家发起，以募集方式设立股份有限公司，并于1998年12月25日取得企业法人营业执照，统一社会信用代码9111000071092358XT。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225162984.PDF"
  - 年: 1999
    事件: "1998年11月13日经中国证券监督管理委员会（证监发字[1998]285号文）批准，首次向社会公众发行人民币普通股，并于1999年1月7日在上海证券交易所上市，发行价6.28元/股，发行8,000.00万股。"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/600195.phtml"
  - 年: 2004
    事件: "根据国务院国有资产监督管理委员会批准，2004年至2005年间中国牧工商（集团）总公司和中国水产（集团）总公司进行重组；重组后中国水产（集团）总公司更名为中国农业发展集团有限公司，中国牧工商（集团）总公司成为其全资子公司，公司最终控制方变更为中国农业发展集团有限公司。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225162984.PDF"
