主营与结构:
  - 事件: "公司是专业从事动物保健品和动物营养品研发、生产、销售及技术服务的高新技术企业，共设立20余个生产基地，所属骨干企业研发制造历史超过90年，涵盖近千个产品，年营收超过60亿元；重大动物疫病疫苗、复合维生素添加剂、蛋鸡预混料、泰妙菌素等产品品质、产销量、市场占有率位居国内前列，并为全球60多个国家和地区提供产品与技术支持。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225162984.PDF"
  - 事件: "兽用生物制品包括禽用疫苗、畜用疫苗和宠物用疫苗，主要产品有高致病性禽流感疫苗、鸡马立克系列产品、口蹄疫类疫苗、ST猪瘟疫苗、猪圆环病毒灭活疫苗、猪伪狂犬病活疫苗、牛结节性皮肤病灭活疫苗、狂犬病灭活疫苗、犬四联疫苗、猫三联灭活疫苗及其他各类常规兽用疫苗产品和诊断制剂。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225162984.PDF"
  - 事件: "兽用化药包括兽药制剂和兽药原料药，主要产品有泰妙菌素、泰万菌素原料药、氟苯尼考原料药、牧乐星、氟欣泰、磺胺氯哒嗪钠、宠物用消毒剂等；饲料及饲料添加剂以复合维生素和复合预混料为主，“华罗”品牌在行业内具有一定知名度。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225162984.PDF"
  - 事件: "贸易业务主要是玉米及玉米副产品、豆粕、鱼粉和赖氨酸等饲料原料及饲料添加剂的贸易，下游客户主要为国内较大规模的饲料生产厂和养殖场，通过贸易形成采购的规模效应。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225162984.PDF"
  - 事件: "公司主要经营主体包括中牧实业股份有限公司兰州生物药厂、成都药械厂、江西生物药厂、黄冈动物药品厂、长春华罗、新乡华罗、武汉华罗、天津华罗分公司，以及内蒙古中牧生物药业有限公司、湖北中牧安达药业有限公司、山东胜利生物工程有限公司、中牧智合（北京）生物技术有限公司、中牧南京动物药业有限公司、中牧（北京）动物营养科技有限公司、乾元浩生物股份有限公司、中牧华罗畜牧科技（山东）有限公司、中普生物制药有限公司、中牧全药（南京）动物药品有限公司、兰州中牧药械科技有限公司等；参股企业包括厦门金达威集团股份有限公司、江苏哈工智能机器人股份有限公司、华农财产保险股份有限公司、广西华桂源种禽有限公司等。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225162984.PDF"

