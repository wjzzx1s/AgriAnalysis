代码: "603182"
名称: "嘉华股份"
定位: "山东聊城莘县起家的大豆蛋白深加工企业（前身山东嘉华保健品股份有限公司，曾在新三板挂牌），主营大豆蛋白、大豆油、大豆膳食纤维、低温食用豆粕及蒸汽电力，是国内大豆蛋白主要生产企业之一，2022 年 9 月 9 日上交所主板上市；公司原无控股股东、由张冠玲等六名一致行动人共同控制，2026 年 4 月山东省土地发展集团以协议受让加定增认购方式入主，5 月 21 日控股股东变更为土地集团、实际控制人变更为山东省国资委；2025 年营业收入 13.86 亿元、归母净利润 9,470.06 万元，2026 年上半年营业收入 8.56 亿元、归母净利润 5,666.84 万元。"

