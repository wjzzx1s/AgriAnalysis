  - 事项: 立足禽用基因工程疫苗先发优势，利用新技术、新平台积极推进禽腺病毒亚单位系列联苗、鸡传染性支气管炎（悬浮培养）系列联苗等产品的研发和推广上市，为公司发展提供新动能
    来源: http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260824/819cb0a8c3554587a727d03d100444b7.PDF
  - 事项: 控股子公司中普生物2026年上半年净利润亏损2,540万元，但报告期口蹄疫疫苗政府采购中标金额同比提升近80%，行业监管趋严有利于头部企业提升市场份额
    来源: https://finance.eastmoney.com/a/202608243851227357.html
