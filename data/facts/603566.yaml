代码: "603566"
名称: "普莱柯"
定位: "河南洛阳的综合性兽用疫苗与兽药企业，2002 年成立、2015 年 5 月在上交所上市，产品覆盖猪用、禽用疫苗及兽用化药；2022 年 9 月完成 8.98 亿元非公开发行投向兽用灭活疫苗产能，2025 年归母净利润 1.85 亿元、同比增长 99.33%，但 2026 年上半年受下游生猪价格低位、动保行业竞争加剧及生物制品增值税率上调影响，营收 4.91 亿元、同比下降 12.18%，归母净利润同比下降 33.45%。"

沿革:
  - 年: "2002"
    事件: "6 月公司前身洛阳普莱柯生物工程有限公司成立"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP201709080869285404_1.pdf?1601214329000.pdf"
  - 年: "2011"
    事件: "公司整体变更为普莱柯生物工程股份有限公司，注册资本 1.2 亿元"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP201709080869285404_1.pdf?1601214329000.pdf"
  - 年: "2015"
    事件: "经中国证监会证监许可[2015]706 号文批复核准首次公开发行 A 股 4,000 万股，经上交所自律监管决定书[2015]188 号批准，于 2015 年 5 月 18 日在上海证券交易所上市，证券简称“普莱柯”、代码 603566"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=603566&id=1789249"
  - 年: "2022"
    事件: "9 月完成向特定对象发行股票，公司注册地在河南省洛阳市洛龙区政和路 15 号；募集资金于 2022 年 9 月 5 日到位"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-29/1225231345.PDF"

股权与控制权:
  - 事项: 控股股东、实际控制人为张许科，2026年6月末持股31.58%（109,299,168股），报告期内持股数量未发生变化且不存在质押、冻结
    来源: http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260824/819cb0a8c3554587a727d03d100444b7.PDF
  - 事项: 第二大股东孙进忠持股4.92%（17,027,218股）；中信农业科技股份有限公司持股2.33%（8,061,615股），为国有法人股东
    来源: http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260824/819cb0a8c3554587a727d03d100444b7.PDF
  - 事项: 报告期内公司控股股东、实际控制人张许科先生不存在未履行法院生效判决、所负数额较大的债务到期未清偿的情况，公司控制权保持稳定
    来源: http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260824/819cb0a8c3554587a727d03d100444b7.PDF
主营与结构:
  - 事件: "主营兽用生物制品（猪用疫苗、禽用疫苗）、兽用化药与中兽药等，2025 年实现主营业务收入 1,076,948,740.09 元、较上年同期上升 4.17%，全年研发投入占营业收入比例 9.14%"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-29/1225231206.PDF"
  - 事件: "2025 年实现营业收入 1,089,878,016.95 元、同比增长 4.54%，归属于上市公司股东的净利润 1.85 亿元、同比增长 99.33%，扣非后归母净利润 1.23 亿元、同比增长 53.41%；净利润增速显著高于营收增长，主要得益于提质降本增效使各项费用大幅降低，以及投资收益和公允价值变动损益增加"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-29/1225231206.PDF"
  - 事件: "2024 年实现营业收入 1,042,561,095.67 元、同比下降 16.77%，归属于上市公司股东的净利润 92,806,499.78 元、同比下降 46.82%，扣非后 80,496,984.42 元、同比下降 47.72%"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603566&id=10958083"
  - 事件: "2026 年上半年实现营业收入 491,269,576.20 元、同比下降 12.18%，利润总额 73,426,162.84 元、同比下降 43.87%，归属于上市公司股东的净利润 77,324,243.29 元、同比下降 33.45%，扣非后 64,287,537.57 元、同比下降 35.80%；营业收入与净利润下降主要系下游生猪出栏价格长期处于低位、动保行业竞争加剧导致猪用疫苗销量和价格下降，同时叠加生物制品增值税适用税率由 3% 上调至 13%"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-25/1225497501.PDF"
  - 事件: "2026 年一季度实现营业收入 2.49 亿元、同比下降 10.54%，归母净利润 0.41 亿元、同比下降 23.01%，扣非后归母净利润 0.35 亿元、同比下降 27.58%"
    来源: "https://finance.sina.com.cn/wm/2026-05-09/doc-inhxfxrr3858761.shtml"

竞争优势:
  - 事项: 拥有国家兽用药品工程技术研究中心、国家级企业技术中心、农业农村部兽用药品创制重点实验室等多个创新平台，科技创新能力与综合实力位居行业前列
