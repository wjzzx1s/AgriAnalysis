代码: "603566"
名称: "普莱柯"
定位: "河南洛阳的综合性兽用疫苗与兽药企业，2002 年成立、2015 年 5 月在上交所上市，产品覆盖猪用、禽用疫苗及兽用化药；2022 年 9 月完成 8.98 亿元非公开发行投向兽用灭活疫苗产能，2025 年归母净利润 1.85 亿元、同比增长 99.33%，但 2026 年上半年受下游生猪价格低位、动保行业竞争加剧及生物制品增值税率上调影响，营收 4.91 亿元、同比下降 12.18%，归母净利润同比下降 33.45%。"

沿革:
  - 年: "2002"
    事件: "6 月公司前身洛阳普莱柯生物工程有限公司成立"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP201709080869285404_1.pdf?1601214329000.pdf"
  - 年: "2011"
    事件: "公司整体变更为普莱柯生物工程股份有限公司，注册资本 1.2 亿元"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP201709080869285404_1.pdf?1601214329000.pdf"
  - 年: "2015"
    事件: "经中国证监会证监许可[2015]706 号文批复核准首次公开发行 A 股 4,000 万股，经上交所自律监管决定书[2015]188 号批准，于 2015 年 5 月 18 日在上海证券交易所上市，证券简称“普莱柯”、代码 603566"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=603566&id=1789249"
  - 年: "2022"
    事件: "9 月完成向特定对象发行股票，公司注册地在河南省洛阳市洛龙区政和路 15 号；募集资金于 2022 年 9 月 5 日到位"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-29/1225231345.PDF"

主营与结构:
  - 事件: "主营兽用生物制品（猪用疫苗、禽用疫苗）、兽用化药与中兽药等，2025 年实现主营业务收入 1,076,948,740.09 元、较上年同期上升 4.17%，全年研发投入占营业收入比例 9.14%"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-29/1225231206.PDF"
  - 事件: "2025 年实现营业收入 1,089,878,016.95 元、同比增长 4.54%，归属于上市公司股东的净利润 1.85 亿元、同比增长 99.33%，扣非后归母净利润 1.23 亿元、同比增长 53.41%；净利润增速显著高于营收增长，主要得益于提质降本增效使各项费用大幅降低，以及投资收益和公允价值变动损益增加"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-29/1225231206.PDF"
  - 事件: "2024 年实现营业收入 1,042,561,095.67 元、同比下降 16.77%，归属于上市公司股东的净利润 92,806,499.78 元、同比下降 46.82%，扣非后 80,496,984.42 元、同比下降 47.72%"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603566&id=10958083"
  - 事件: "2026 年上半年实现营业收入 491,269,576.20 元、同比下降 12.18%，利润总额 73,426,162.84 元、同比下降 43.87%，归属于上市公司股东的净利润 77,324,243.29 元、同比下降 33.45%，扣非后 64,287,537.57 元、同比下降 35.80%；营业收入与净利润下降主要系下游生猪出栏价格长期处于低位、动保行业竞争加剧导致猪用疫苗销量和价格下降，同时叠加生物制品增值税适用税率由 3% 上调至 13%"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-25/1225497501.PDF"
  - 事件: "2026 年一季度实现营业收入 2.49 亿元、同比下降 10.54%，归母净利润 0.41 亿元、同比下降 23.01%，扣非后归母净利润 0.35 亿元、同比下降 27.58%"
    来源: "https://finance.sina.com.cn/wm/2026-05-09/doc-inhxfxrr3858761.shtml"

融资历史:
  - 时间: "2015-05-18"
    方式: "IPO（上海证券交易所主板）"
    规模: "发行 4,000 万股，发行价 15.52 元/股；2015 年募集资金总额 55,988.47 万元"
    用途: "动物疫苗产业化建设项目（新增 6 条生产线用于 17 个产品生产）、技术研发中心建设等项目"
    说明: "经证监许可[2015]706 号文核准，采用网下向投资者询价配售与网上按市值申购定价发行相结合的方式，发行后总股本不超 1.6 亿股；2015 年 8 月 20 日披露的募集资金使用情况显示募集资金总额 55,988.47 万元，本报告期已使用 10,255.73 万元、尚未使用 45,732.74 万元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=603566&id=1789249"
  - 时间: "2020-06-20"
    方式: "非公开发行股票（获核准批文）"
    规模: "拟发行股票募集资金总额不超过 8.98 亿元"
    用途: "兽用灭活疫苗生产项目等；其中全资子公司普莱柯（南京）拟投资 4 亿元建设兽用灭活疫苗生产项目（一期），建设 4.8 万平方米厂房及附属设施、三条高致病性禽流感疫苗生产线"
    说明: "公司于 2020 年 6 月 20 日公告非公开发行股票申请获得中国证监会核准批文；该次发行最终于 2022 年 9 月实施完成"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202206271575068347_1.pdf"
  - 时间: "2022-09-05"
    方式: "非公开发行股票（向特定对象）"
    规模: "发行 31,420,573 股，发行价 28.58 元/股，募集资金总额 897,999,976.34 元，扣除不含税发行费用 12,179,453.12 元后净额 885,820,523.22 元"
    用途: "兽用灭活疫苗生产项目等（截至 2026 年 6 月末累计投入 650,547,715.58 元、投入进度 73.44%）"
    说明: "经中国证监会证监许可[2022]1251 号文核准非公开发行不超过 64,299,200 股；投资者于 2022 年 9 月 2 日 17:00 前足额缴款，募集资金 2022 年 9 月 5 日到位"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-29/1225231345.PDF"

风险与困境:
  - 时间: "2026-06-30"
    事项: "2026 年半年报披露经营承压：报告期营业收入同比下降 12.18%、归属于上市公司股东的净利润同比下降 33.45%，主要系下游生猪出栏价格长期处于低位、动保行业竞争加剧、猪用疫苗销量和价格下降，同时生物制品增值税适用税率由 3% 上调至 13%"
    来源: "https://finance.sina.com.cn/stock/hkstock/ggscyd/2026-08-24/doc-inipmxck5916448.shtml"
  - 时间: "2024-09-30"
    事项: "公司存在因企业合并形成的商誉（收购普莱柯（南京）形成商誉资产组），2024 年三季度末商誉账面价值 17,812,208.99 元；公司需每年年度终了对商誉进行减值测试"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2024-10-30/603566_20241030_IRG9.pdf"
  - 时间: "2024-12-31"
    事项: "2024 年年度报告披露公司经营业绩下降：营业收入同比下降 16.77%、归母净利润同比下降 46.82%"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603566&id=10958083"

战略与转型:
  - 时间: "2020-06-20"
    事项: "以非公开发行募集资金投向兽用灭活疫苗生产项目，通过全资子公司普莱柯（南京）突破现有产能瓶颈、抓住高致病性禽流感疫苗发展机遇"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202206271575068347_1.pdf"
  - 时间: "2025-12-31"
    事项: "2025 年公司推进提质降本增效，各项费用大幅降低，净利润增速显著高于营收增速；同期投资收益及公允价值变动损益增加亦对业绩形成支撑"
    来源: "https://static.weeklyonstock.com/26/0428/AB2617555581522.html"
  - 时间: "2026-06-30"
    事项: "面对猪用疫苗量价下降与生物制品增值税率上调，公司 2026 年上半年经营业绩下滑；同期公司披露利润分配预案，延续现金分红回报股东策略（2024、2025 年度均为每 10 股派 4.00 元、预计派发现金红利 136,767,749.20 元）"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12246305"

融资需求线索:
  - 时间: "2026-06-30"
    事项: "2022 年非公开发行募集资金净额 885,820,523.22 元截至 2026 年 6 月末累计投入 650,547,715.58 元（进度 73.44%）、变更用途募资总额 330,653.17 元，尚未使用部分继续投向兽用灭活疫苗生产项目；截至检索未查得新的定增、可转债或发债预案"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-25/1225497501.PDF"
  - 时间: "2025-12-31"
    事项: "2025 年现金分红总额 2.05 亿元（其中年度分配预案派发现金红利 136,767,749.20 元、每股派 0.4 元），并设有回购专户；公司未披露其他融资安排"
    来源: "https://finance.sina.com.cn/wm/2026-05-09/doc-inhxfxrr3858761.shtml"

