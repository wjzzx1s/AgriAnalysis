代码: "002679"
名称: "福建金森"
定位: "福建三明将乐县的国有控股林业上市公司（福建金森林业股份有限公司），2012 年 6 月在深交所中小板上市，是全国首家纯森林资源培育型国有控股上市公司、南方集体林区 FSC 国际森林认证用材林蓄积量最大的企业；主营森林经营与木材采运，2025 年营业收入 1.487 亿元、归母净利润 923.06 万元，2026 年上半年受季节性因素影响归母净利润 -1,358.18 万元（同比减亏 30.03%），近年无新增股权融资、以存货抵押贷款为主要融资方式。"

沿革:
  - 年: "2012"
    事件: "经中国证监会证监许可[2012]473 号文核准，公司于 2012 年 5 月 11 日刊登招股意向书，发行不超过 3,468 万股社会公众股，最终发行 3,468 万股（网下配售 1,046.40 万股、网上定价发行 2,421.60 万股），发行价格 12.00 元/股，经深证上[2012]150 号文同意于 2012 年 6 月 5 日在深圳证券交易所上市"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002679&id=921896"
  - 年: "2012"
    事件: "首次公开发行募集资金总额为 41,616 万元，扣除发行相关费用 4,415.41 万元后实际募集资金净额为 37,200.59 万元，募集资金原计划投资《商品材基地建设林木资源资产并购项目》25,668.71 万元，2012 年实际投入该项目 13,923.16 万元"
    来源: "http://static.cninfo.com.cn/finalpage/2014-04-23/63896122.PDF"
  - 年: "2015"
    事件: "10 月公司控股股东福建省将乐县林业总公司更名为福建金森集团有限公司，其作为公司控股股东在首次公开发行股票并上市申请中做出的承诺均由福建金森集团有限公司继承（2015 年 10 月 28 日）"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2025/2025-4/2025-04-26/10999330.PDF"

主营与结构:
  - 事件: "公司为全国首家纯森林资源培育型国有控股上市公司，也是南方集体林区 FSC 国际森林认证用材林蓄积量最大的企业，主营森林经营和管护、造林更新、林木育苗育种、木材竹材采运加工销售等业务，2025 年营业收入 96.65% 来自主营业务"
    来源: "https://www.stcn.com/article/detail/4115704.html"
  - 事件: "2025 年实现营业收入 148,714,638.55 元、同比减少 1.33%，营业利润 8,604,255.41 元、同比减少 1.30%，归属于母公司净利润 9,230,595.19 元、同比减少 11.34%，扣非后 10,796,964.11 元、同比减少 12.92%，基本每股收益 0.04 元"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-04-29/e50c9343-2935-4b8d-971c-fb7826a8b440.PDF"
  - 事件: "2026 年上半年实现营业收入 45,468,266.13 元、同比减少 9.50%，营业利润 -13,985,527.90 元、同比增加 28.08%，归属于母公司净利润 -13,581,758.25 元、同比增加 30.03%，每股收益 -0.06 元；上半年为林业采伐与销售淡季，中期业绩相对较低"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002679&id=12526881"
  - 事件: "2024 年实现营业收入 150,722,798.06 元、归属于上市公司股东的净利润 10,410,990.25 元；2023 年营业收入 147,650,078.15 元、归母净利润 8,006,342.42 元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12256419"
  - 事件: "截至 2025 年 6 月 30 日，公司存货账面价值 783,885,478.30 元全部用于抵押（抵押贷款），另有 4,250.00 元货币资金为 ETC 保证金被冻结"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2025/2025-8/2025-08-29/11410315.PDF"

融资历史:
  - 时间: "2012-06-05"
    方式: "IPO（深圳证券交易所中小板）"
    规模: "发行 3,468 万股，发行价 12.00 元/股，募集资金总额 41,616 万元，发行费用 4,415.41 万元，实际募集资金净额 37,200.59 万元"
    用途: "商品材基地建设林木资源资产并购项目（原计划投入 25,668.71 万元，2012 年实际投入 13,923.16 万元），其余为补充流动资金等项目"
    说明: "经证监许可[2012]473 号文核准，采用网下向股票配售对象询价配售与网上向社会公众投资者定价发行相结合的方式；2016 年 1 月披露的募投项目资金使用情况显示累计使用率 100%"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002679&id=921896"
  - 时间: "2015-12-02"
    方式: "资产转让（向控股股东出售资产）"
    规模: "公司与控股股东福建金森集团有限公司签订《资产转让协议》（附生效条款），转让下属福建金森林业股份有限公司细胞工程种苗繁育中心、将乐县绿园经营分公司及将乐县相关经营资产，交易金额 8,423.66 万元，支付方式为现金"
    用途: "优化资产结构、收缩非核心经营资产"
    说明: "该公告于 2015 年 12 月 4 日披露；交易对手为公司控股股东，构成关联交易"
    来源: "https://basic.10jqka.com.cn/002679/capital.html"
  - 时间: "2025-06-30"
    方式: "存货抵押贷款（银行融资）"
    规模: "账面价值 783,885,478.30 元的存货全部抵押用于银行借款"
    用途: "生产经营周转资金"
    说明: "同一报告期受限资产还包括 4,250.00 元 ETC 保证金冻结货币资金；公司未披露具体授信额度"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2025/2025-8/2025-08-29/11410315.PDF"
  - 时间: "2023-12-31"
    方式: "现金分红"
    规模: "以 235,756,000 股为基数，向全体股东每 10 股派发现金红利 0.255 元（含税），送红股 0 股、不以公积金转增股本"
    用途: "回报股东"
    说明: "经公司董事会审议通过的 2023 年度利润分配预案"
    来源: "http://rdfile.dzh.com.cn/new/dzh/tb_gg/2024/4/30/0B4613E53933EF1A5A639D36B8CF3CC1_10164176.pdf"

风险与困境:
  - 时间: "2025"
    事项: "中国证监会福建监管局出具《关于对福建金森集团有限公司采取出具警示函措施的决定》（行政监管措施决定书〔2025〕22 号）：控股股东福建金森集团有限公司于 2024 年 11 月 6 日将所持 37,501,968 股福建金森股票质押给厦门银行股份有限公司三明分行，质押股票占其所持公司股票的 25%、占公司总股本的 15.91%，但迟至 2024 年 11 月 14 日才将股票质押情况告知公司，导致公司迟至 2024 年 11 月 16 日才披露相关公告"
    来源: "https://www.csrc.gov.cn/fujian/c104066/c7546780/content.shtml"
  - 时间: "2024"
    事项: "福建监管局出具《关于对福建金森林业股份有限公司采取责令改正措施并对林煜星采取出具警示函措施的决定》（[2024]36 号），决定对公司采取责令改正的行政监管措施、对林煜星采取出具警示函的行政监管措施，并记入证券期货市场诚信档案数据库"
    来源: "https://stock.stockstar.com/notice/SN2026042900009680.shtml"
  - 时间: "2026-03-31"
    事项: "2026 年一季报显示控股股东福建金森集团有限公司持股 150,007,874 股、占 63.63%，其中质押 39,370,000 股；2023 年半年报显示其质押数量曾为 75,933,800 股，2026 年 8 月 28 日披露的质押总比例为 31.81%、质押总股数 7,500.39 万股、质押总笔数 2 笔"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=830737219064&code=002679&dannoun=lcdetail&announ=lc"
  - 时间: "2026-06-30"
    事项: "2026 年上半年归属于上市公司股东的净利润 -13,581,758.25 元、扣非后 -14,861,398.83 元，经营活动产生的现金流量净额 -46,026,227.09 元（上年同期 -33,123,515 元量级）；公司主要盈利资产为消耗性生物资产，业绩受林业采伐季节性影响明显"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002679&id=12526884"
  - 时间: "2025-12-31"
    事项: "2025 年公司归母净利润同比下降 11.34%、扣非后同比下降 12.92%，营业收入连续多年在 1.5 亿元左右波动，公司未在 2025 年年度报告中披露重大诉讼、仲裁及处罚事项"
    来源: "https://stock.stockstar.com/notice/SN2026042900009680.shtml"

战略与转型:
  - 时间: "2015-12-02"
    事项: "向控股股东福建金森集团有限公司转让细胞工程种苗繁育中心、将乐县绿园经营分公司等资产（交易金额 8,423.66 万元），收缩非核心经营资产、聚焦森林资源培育主业"
    来源: "https://basic.10jqka.com.cn/002679/capital.html"
  - 时间: "2023-02-25"
    事件: "公司披露《关于对外投资暨设立控股子公司的公告》，围绕碳汇政策契机对外投资设立控股子公司金森碳汇（上海）科技服务有限公司，积极对外开展碳汇业务以增加新的利润增长点"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2023-08-25/43a3b1ee-7938-4746-a795-03c45bf67bc4.PDF"
  - 时间: "2023-04-28"
    事项: "公司披露《关于对外投资设立全资子公司及注销分公司的公告》（公告编号：JS-2023-031），根据战略布局及经营发展需要进一步优化组织架构"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2023-08-25/43a3b1ee-7938-4746-a795-03c45bf67bc4.PDF"
  - 时间: "2026-08-24"
    事项: "公司提出依托“绿水青山就是金山银山”把资源禀赋转化为成长动能，以森林“四库”（水库、钱库、粮库、碳库）思路推进主业经营与碳汇等增值业务"
    来源: "https://www.stcn.com/article/detail/4115704.html"

融资需求线索:
  - 时间: "2025-06-30"
    事项: "公司主要融资方式为以存货（林木资产）抵押取得银行借款，期末抵押存货账面价值 783,885,478.30 元；公司未在定期报告中披露具体银行授信额度"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2025/2025-8/2025-08-29/11410315.PDF"
  - 时间: "2026-06-30"
    事项: "截至检索未查得公司新的定增、配股、可转债或公司债预案；公司自 2012 年首发后未再实施股权再融资，2026 年上半年经营活动现金流净额为 -46,026,227.09 元、主要由采伐销售季节性所致"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002679&id=12526884"

