代码: "002548"
名称: "金新农"
定位: "深圳的饲料与生猪养殖双主业企业，2011 年上市，历经 2019 年、2020 年两轮控制权与股东结构变动后由广州金农产投控股；2026 年上半年猪价创近十年新低，归母净利润亏损 3.88 亿元，净资产大幅收缩。"
沿革:
  - 年: "2008"
    事件: "4 月 30 日由深圳市金新农饲料有限公司整体变更为股份有限公司（深圳市金新农科技股份有限公司）"
    来源: "http://static.cninfo.com.cn/finalpage/2018-04-24/1204702134.PDF"
  - 年: "2011"
    事件: "2 月 9 日首次向社会公众公开发行人民币普通股 2,400 万股，发行价 24.00 元/股，募集资金总额 57,600.00 万元，在深圳证券交易所上市"
    来源: "http://static.cninfo.com.cn/finalpage/2018-04-24/1204702134.PDF"
  - 年: "2019"
    事件: "4 月控股股东舟山大成欣农股权投资合伙企业（有限合伙）将其持有的公司股份 9,400 万股转让给广州湾区金农投资合伙企业（有限合伙），控股股东变更"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002548&id=12221184"
  - 年: "2021"
    事件: "控股股东广州湾区金农投资合伙企业（有限合伙）更名为广州金农产业投资合伙企业（有限合伙）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002548&id=12221184"
主营与结构:
  - 事件: "营业收入主要来源于饲料销售与生猪销售；2024 年度营业收入 456,209.91 万元，其中饲料销售 276,783.75 万元（占 60.67%）、生猪销售 164,775.36 万元（占 36.12%）"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002548&id=10871772"
  - 事件: "2026 年上半年饲料业务与生猪养殖业务占营业收入比重分别为 69.67% 和 28.85%"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-08-27/0287cf18-428b-4908-9d61-540a1128c579.PDF"
  - 事件: "公司控股股东金农产投的控股股东为粤港澳大湾区产融投资有限公司，粤港澳产融共有 48 名股东，股权结构较为分散，任何一名股东所持股权比例没有绝对优势，股东之间没有签订一致行动协议；公司披露控股股东性质为无控股主体、实际控制人性质为无实际控制人"
    来源: "https://static.cninfo.com.cn/finalpage/2025-04-15/1223093006.PDF"
  - 事件: "2026 年上半年饲料销量 53.28 万吨（不含内销 14.23 万吨），同比增长 2.27%；其中猪用饲料 46.40 万吨占 87.08%"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-08-27/0287cf18-428b-4908-9d61-540a1128c579.PDF"
