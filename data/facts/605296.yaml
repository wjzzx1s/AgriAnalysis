代码: "605296"
名称: "神农集团"
定位: "云南本土生猪一体化企业，饲料—养殖—屠宰全链条布局，2021 年在沪市主板上市后逆周期扩产、出栏量快速攀升；2026 年上半年猪价深跌致大额亏损，此前两项定增计划先后终止。"
沿革:
  - 年: "1999"
    事件: "8 月 9 日成立（云南神农农业产业集团股份有限公司），以饲料与生猪产业为主业"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-04-16/605296_20250416_J8UL.pdf"
  - 年: "2021"
    事件: "5 月 28 日在上海证券交易所上市，发行 4,003 万股，发行价 56.08 元/股，发行后总股本 400,229,012 股"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=605296&id=7278633"
  - 年: "2021"
    事件: "IPO 合计募集资金约 22 亿元；2024 年 11 月 28 日首发限售股 4.54 亿股解禁，公司股价仍处破发状态"
    来源: "http://finance.ce.cn/stock/gsgdbd/202411/28/t20241128_39218362.shtml"
  - 年: "2024"
    事件: "4 月公告终止 2023 年度非公开发行（原计划最高融资 11.5 亿元），同时启动以简易程序向特定对象发行股票的方案并大幅下调融资额"
    来源: "https://finance.sina.com.cn/stock/observe/2025-03-11/doc-inephsqc9586225.shtml"
  - 年: "2025"
    事件: "7 月 28 日公告终止 2024 年度以简易程序向特定对象发行 A 股股票事项并撤回申请文件（原拟募资 2.9 亿元，用于仔猪扩繁基地建设及补充流动资金）"
    来源: "https://www.nbd.com.cn/articles/2025-07-28/3966061.html"
主营与结构:
  - 事件: "以生猪养殖为核心，配套饲料加工与屠宰业务，一体化经营；2024 年出栏生猪 227 万头，2025 年 1—6 月销售生猪 153.95 万头"
    来源: "https://www.cls.cn/detail/2126778"
  - 事件: "2026 年上半年累计出栏商品猪 172.4 万头；2026 年 7 月完全成本 12.0 元/公斤、断奶成本 248 元/头、PSY 31 头、料肉比 2.46"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/investor/2026/20260825/6f301880131a72209604ecf07974691b.pdf"
  - 事件: "2026 年 6 月销售商品猪 28.03 万头（同比 +31.53%），商品猪销售收入 3.24 亿元（同比 -15.18%），销售均价 9.06 元/公斤"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=605296&id=12433831"
  - 事件: "公司为云南区域一体化企业，同时推进饲料及屠宰板块产能利用率提升以摊薄单位成本"
    来源: "https://finance.sina.com.cn/stock/observe/2025-03-11/doc-inephsqc9586225.shtml"
融资历史:
  - 时间: "2021-05-28"
    方式: "IPO（上交所主板）"
    规模: "发行 4,003 万股，发行价 56.08 元/股，募集资金约 22 亿元"
    用途: "生猪养殖、饲料加工等项目"
    说明: "证监许可[2021]1314 号核准；主承销商中泰证券"
    来源: "http://finance.ce.cn/stock/gsgdbd/202411/28/t20241128_39218362.shtml"
  - 时间: "2023-06"
    方式: "定向增发（预案，后终止）"
    规模: "拟募资不超过 11.5 亿元"
    用途: "两个饲料加工建设类项目及一个生猪养殖建设类项目"
    说明: "2024 年 4 月公告终止该次定增，同时启动简易程序定增方案"
    来源: "https://finance.sina.com.cn/stock/observe/2025-03-11/doc-inephsqc9586225.shtml"
  - 时间: "2024-2025"
    方式: "以简易程序向特定对象发行股票（后终止）"
    规模: "拟募资 2.9 亿元（1.37 亿元投红河弥勒五山乡年出栏 24 万头优质仔猪扩繁基地项目、2,500 万元投石林林口铺养殖场生物安全技改、4,333.06 万元投产业链数字化智能化项目、8,437.41 万元补充流动资金）"
    用途: "产能扩张、技改与补充流动资金"
    说明: "2025 年 3 月披露预案修订稿，发行对象拟为泰康资产管理有限责任公司等；2024 年度定增已获上交所审核通过，但 2025 年 7 月 28 日公司公告终止并撤回申请文件，原因为市场环境变化"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-03-08/605296_20250308_CLZA.pdf"
风险与困境:
  - 时间: "2024-04-26"
    事项: "2023 年度归属于上市公司股东的净利润 -4.01 亿元，2023 年度不进行现金分红"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=605296&id=10077405"
  - 时间: "2025-03-11"
    事项: "媒体分析指出公司面临偿债压力：2023 年底现金短债比 1.45，2024 年三季末账面现金 9.52 亿元、短期有息负债 4.19 亿元，应付账款及票据增长至 6.5 亿元；大额定增终止被市场解读为对大额融资能力不自信"
    来源: "https://finance.sina.com.cn/stock/observe/2025-03-11/doc-inephsqc9586225.shtml"
  - 时间: "2026-08-24"
    事项: "2026 年上半年营业收入 24.89 亿元（同比 -11.02%），归母净利润 -8.09 亿元、扣非 -8.15 亿元，同比由盈转亏；经营活动现金流量净额 -3.75 亿元"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-08-24/doc-inipmhfn9990522.shtml"
  - 时间: "2024-04-29"
    事项: "2024 年度拟不进行现金分红，原因为 2024 年度以简易程序向特定对象发行 A 股股票事项已获上交所审核通过、相关工作尚未结束"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2025/04/29/1223366047.PDF"
