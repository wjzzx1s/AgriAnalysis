    来源: "https://finance.sina.com.cn/stock/observe/2025-03-11/doc-inephsqc9586225.shtml"
  - 时间: "2023-2025"
    事项: "成本战略清晰推进：2023 年生猪养殖完全成本约 16.2 元/公斤，2024 年控制在 14 元/公斤以内，2025 年 3 月降至 12 元/公斤；2024 年平均完全成本 13.9 元/公斤"
