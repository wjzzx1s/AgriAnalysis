代码: "600371"
名称: "万向德农"
定位: "黑龙江起家、2002年上市的玉米种子企业（原华冠科技），控股股东为万向三农集团（实际控制人鲁伟鼎，其全部股权由慈善信托持有）；主营高度集中于玉米杂交种子，收入自2025年起大幅下滑，但资产负债率低、无银行借款、分红与增持持续。"

沿革:
  - 年: "1995"
    事件: "经黑龙江省体改委黑体改复〔1995〕92号文批准，1995年9月13日以发起设立方式成立股份有限公司，设立时总股本6,000万股，全部由发起人认购"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600371&id=10916467"
  - 年: "2002"
    事件: "经证监发行字〔2002〕86号核准，2002年8月29日在上交所以每股3.47元发行人民币普通股4,000万股，发行后股本总额10,000万股、注册资本10,000万元，公司简称华冠科技"
    来源: "http://static.cninfo.com.cn/finalpage/2005-03-17/15108091.PDF"
  - 年: "2003"
    事件: "2003年5月12日经2002年度股东大会通过，以2002年末总股本10,000万股为基数向全体股东每10股派发红股1股转增4.5股，派发后股本总额15,500万股"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600371&id=3286877"
  - 年: "2003"
    事件: "公司收购北京德农种业有限公司41%股权并追加投资，持股增至75%；2003年度报告期末公司持有北京德农种业92.78%股权"
    来源: "http://static.cninfo.com.cn/finalpage/2014-04-24/63901035.PDF"
  - 年: "2004"
    事件: "2004年6月15日万向集团公司将所持36,812,500股（占股本总额23.75%）转让给万向三农有限公司；2004年10月完成收购后万向三农持有46,422,500股、占29.95%，成为第一大股东"
    来源: "http://static.cninfo.com.cn/finalpage/2005-03-17/15108091.PDF"
  - 年: "2006"
    事件: "2006年9月12日上海海博鑫惠国际贸易有限公司将其所持32,937,500股（21.25%）过户转让给万向三农有限公司，经多次股权转让后万向三农持股比例达51.20%"
    来源: "http://static.cninfo.com.cn/finalpage/2014-04-24/63901035.PDF"
  - 年: "2007"
    事件: "2007年6月华冠科技更名为万向德农"
    来源: "http://www.ce.cn/cysc/newmain/yc/jsxw/201807/09/t20180709_29667948.shtml"
  - 年: "2018"
    事件: "鲁冠球去世后其子鲁伟鼎继承，2018年设立鲁冠球三农扶志基金慈善信托，无偿持有万向三农集团有限公司全部股权（慈善信托间接控股，家族不享收益）"
    来源: "http://www.ce.cn/cysc/newmain/yc/jsxw/201807/09/t20180709_29667948.shtml"
  - 年: "2020"
    事件: "2020年5月21日经2019年度股东大会通过，向全体股东每10股送2.5股、同时以资本公积每10股转增0.5股，派发后股本总额29,257.80万股、注册资本29,257.80万元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600371&id=7126230"

主营与结构:
  - 事件: "报告期内公司从事的主要业务为玉米杂交种子研发、生产、销售，主营包括京科968、德单系列等玉米杂交种的生产与销售"
