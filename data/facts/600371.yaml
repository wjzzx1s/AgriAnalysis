  - 事件: "控股子公司德农种业股份公司注册资本1.86亿元，公司持股90%，主营玉米种子的生产、销售和科研，是公司重要利润来源"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/2025/2025-04-22/1123c51f1e9b11f0811efa163e957f7a.pdf"
  - 事件: "主营品种京科968为北京农林科学院授权公司及顺鑫农科、中种国际、北京屯玉、山东登海、河南现代五家共同生产、经营"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202004281378841366_1.pdf"
  - 事件: "2023年度德农种业实现主营业务收入313,067,804.89元、主营业务利润108,717,742.98元、净利润71,948,452.61元"
