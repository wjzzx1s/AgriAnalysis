代码: "001313"
名称: "粤海饲料"
定位: "总部位于广东湛江的特种水产饲料龙头，以虾料、海水鱼料为核心，2022 年 2 月登陆深交所主板；2024 年因水产行情低迷陷入亏损，2025 年起业绩修复并推进海外与上游纵向并购。"
沿革:
  - 年: "1994"
    事件: "前身湛江粤海饲料有限公司设立，注册资本 238 万美元，主营水产饲料"
    来源: "http://pdf.dfcfw.com/pdf/H2_AN202201251542624737_1.pdf"
  - 年: "2016"
    事件: "整体变更为股份有限公司（广东粤海饲料集团股份有限公司），法定代表人郑石轩"
    来源: "http://pdf.dfcfw.com/pdf/H2_AN202201251542624737_1.pdf"
  - 年: "2022"
    事件: "2 月 16 日在深圳证券交易所主板上市，股票代码 001313"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=001313&id=7833412"
主营与结构:
  - 事件: "主营业务为水产配合饲料的研发、生产与销售，以虾料、海水鱼料等特种水产饲料为核心；2025 年实现饲料销量 88 万吨"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001313&id=12318495"
  - 事件: "2026 年 1 月完成收购宜兴市天石饲料有限公司 60% 股权并纳入合并报表，新增饲料产业上游核心添加剂业务板块"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001313&id=12535136"
  - 事件: "公司整体设计产能 250 万吨以上，实际产能约 150 万吨，产能布局以华南为主并覆盖华东、华中"
    来源: "http://file.finance.sina.com.cn/cn/diaoyan/jgdy/2026/2026-03/2026-03-20/10176141_1.PDF"
融资历史:
  - 时间: "2022-02"
    方式: "IPO（深交所主板）"
    规模: "公开发行 10,000 万股，发行价 5.38 元/股，募集资金总额 53,800.00 万元，扣除发行费用 5,792.05 万元后净额 48,007.95 万元"
    用途: "安徽年产 10 万吨水产配合饲料项目、海南年产 12 万吨水产配合饲料项目、中山泰山年产 15 万吨水产配合饲料扩建项目、研发创新中心项目"
    说明: "保荐机构（主承销商）为第一创业证券承销保荐有限责任公司；募集资金 2022 年 2 月 9 日到位"
    来源: "https://epaper.stcn.com/pic/202508/29/4ce5789249453867ac02c7d75be88b54.pdf"
  - 时间: "2025-11-17"
    方式: "现金收购股权"
    规模: "1.32 亿元收购宜兴市天石饲料有限公司 60% 股权"
    用途: "纵向整合饲料产业上游核心添加剂领域"
    说明: "2026 年 1 月完成工商变更登记"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-04-27/22c6e947-8469-49fa-9a3f-3a671a8c68a6.PDF"
风险与困境:
  - 时间: "2024"
    事项: "受水产品市场低迷、价格低及台风暴雨等极端天气影响，2024 年实现营业收入 59.12 亿元（同比 -13.98%），归属于上市公司股东的净利润 -0.85 亿元（同比 -307.55%）；饲料销量 78.71 万吨，同比下降 9.57%"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202504301665049712_1.pdf"
  - 时间: "2026-08-26"
    事项: "披露《关于计提 2026 年半年度资产减值准备的公告》，报告期内计提各项资产减值准备合计 4,919.85 万元（其中应收账款坏账损失 7,905.72 万元，财务担保相关减值损失转回 3,434.90 万元）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001313&id=12535129"
  - 时间: "2026-06-30"
    事项: "2026 年半年度末合并报表应收账款规模随业务扩张上升，公司对应收款项大额计提坏账准备"
    来源: "https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/841132251648/index.phtml"
战略与转型:
  - 时间: "2025-10"
    事项: "在海外投资设立的首家全资子公司越南粤海饲料有限公司正式投产，总体规划 20 万吨产能，一期工程产能 10 万吨，计划 2—3 年达产"
    来源: "http://file.finance.sina.com.cn/cn/diaoyan/jgdy/2026/2026-05/2026-05-13/10180514_1.PDF"
  - 时间: "2026-01"
    事项: "完成对宜兴市天石饲料有限公司 60% 股权的收购，宜兴天石成为控股子公司并纳入合并报表，实现向饲料上游核心添加剂领域的纵向整合"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-08-26/cb6f8e31-3dbf-4073-a767-eac7b977eb51.PDF"
  - 时间: "2026-09"
    事项: "2026 年上半年海外收入同比增长 468.48%，公司以越南为支点辐射东南亚市场，并规划在西南、华北、西北及海外其他养殖区域继续布局产能"
    来源: "https://static.weeklyonstock.com/26/0904/wd110349.html"
  - 时间: "2025-07-07"
    事项: "第四届董事会第二次会议审议通过《关于以固定资产对全资子公司进行增资的议案》，以固定资产对全资子公司增资"
    来源: "https://epaper.stcn.com/pic/202507/09/6c7fe699e0ddae1f232de3e1a31831e7.pdf"
