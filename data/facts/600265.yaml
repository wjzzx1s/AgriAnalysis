代码: "600265"
名称: "*ST景谷"
定位: "云南景谷的林业与木材加工上市壳资源型公司（云南景谷林业股份有限公司），2000 年 8 月在上交所上市，2008 年后多次易主、三度被实施退市风险警示；2018 年 8 月周大福投资入主（最终控制方郑家纯），2023 年现金 2.703 亿元收购汇银木业 51% 后业绩暴雷、2025 年以 13,336.60 万元将汇银木业 51% 股权回售给控股股东，2025 年 10 月起无偿受赠算力服务公司博达数科 100% 股权；2025 年净利润 -2.46 亿元且扣除后营业收入低于 3 亿元，2026 年 4 月 27 日起简称变更为“*ST景谷”。"

沿革:
  - 年: "2000"
    事件: "经中国证监会证监发行字[2000]99 号文批准，公司于 2000 年 7 月 21 日、7 月 22 日以上网定价方式和向二级市场投资者配售方式合计发行人民币普通股（A 股）4,000 万股，发行价格每股 5.19 元，募集资金总额 19,590 万元，发行后注册资本 10,500 万元；经上证上[2000]64 号文批准于 2000 年 8 月 25 日在上海证券交易所上市，股票简称“景谷林业”"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600265&id=11673112"
  - 年: "2012"
    事件: "9 月 27 日公司因生产经营活动受到严重影响且预计在三个月内不能恢复正常，股票被上海证券交易所实施“其他风险警示”（ST）"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600265&id=3027725"
  - 年: "2013"
    事件: "公司股票被实施“*ST”退市风险警示，公司通过 2013 年 4 月、9 月两次董事会及 2013 年第三次临时股东大会审议通过对部分林木存货进行转让出售等方式实现扭亏、化解暂停上市风险"
    来源: "http://static.cninfo.com.cn/finalpage/2013-11-23/63295322.PDF"
  - 年: "2015"
    事件: "2014 年度、2015 年度公司连续两年亏损，根据《上海证券交易所股票上市规则》，公司股票在 2015 年年度报告披露后被实施“退市风险警示”处理；2016 年度经审计的净资产及净利润为正值、生产经营活动正常，公司申请撤销退市风险警示及其他风险警示"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600265&id=3027725"
  - 年: "2017"
    事件: "公司消除退市风险警示成功，2017 年确认债务重组利得 5,670,664.60 元（各法人及自然人债权豁免）；2017 年公司发生净亏损 30,959,730.77 元"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/2018-03-24/600265_2017_n.pdf"
  - 年: "2018"
    事件: "原控股股东重庆小康控股有限公司与周大福投资有限公司签署《股份转让协议》，将其持有的公司 30% 股份（38,939,900 股）以协议转让方式转让给周大福投资，2018 年 8 月 14 日完成过户登记、9 月 28 日取得外商投资企业备案回执，公司控股股东变更为周大福投资、实际控制人变更为郑家纯"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600265&id=11673117"
  - 年: "2020"
    事件: "公司 2020 年度经审计的净利润为负值且营业收入低于人民币 1 亿元，股票在 2020 年年度报告披露后被实施“退市风险警示”（股票前冠以“*ST”）；同时因 2018 年、2019 年、2020 年连续三年扣非前后净利润孰低者均为负值、且最近一年审计报告显示持续经营能力存在不确定性，被实施“其他风险警示”"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600265&id=8102658"
  - 年: "2026"
    事件: "因 2025 年度经审计的利润总额、净利润或扣非净利润孰低者为负值且扣除后的营业收入低于 3 亿元，公司股票于 2026 年 4 月 24 日停牌、4 月 27 日复牌后被实施退市风险警示，简称由“ST景谷”变更为“*ST景谷”；同时因最近连续三个会计年度扣非前后净利润孰低者均为负值且审计报告显示持续经营能力存在不确定性，被继续实施其他风险警示"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-04-23/doc-inhvnxnw8551973.shtml"

主营与结构:
  - 事件: "公司原主营为营林造林、林板林化产品（人造板、林化产品）的生产销售；2023 年 2 月以现金收购唐县汇银木业有限公司 51% 股权后，汇银木业成为核心资产，2024 年其营业收入占公司营业收入比重达 87.02%"
    来源: "https://paper.cnstock.com/html/2025-08/27/content_2110910.htm"
  - 事件: "2024 年公司实现营业收入 44,703.40 万元、同比下降 24.20%，归属于上市公司股东的净利润 -7,287.20 万元（由盈转亏），毛利率下降至 1.74%；林化产品已连续三年大幅下降、2024 年仅实现 0.09 亿元收入"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600265&id=11048799"
  - 事件: "2025 年公司实现营业收入 19,470.06 万元，归属于母公司的净利润 -24,558.15 万元，基本每股收益 -1.89 元；2025 年末合并报表归属于上市公司股东的未分配利润 -770,876,825.42 元，董事会决定 2025 年度不进行利润分配、也不以公积金转增股本"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-24/1225165688.PDF"
  - 事件: "2026 年上半年实现营业收入 55,931,688.02 元、同比下降 54.65%，利润总额 6,435,387.83 元（上年同期 -223,248,728.88 元），归属于上市公司股东的净利润 -209,327.84 元、同比大幅减亏；期末总资产 458,027,186.00 元、归属于上市公司股东的净资产 330,128,592.47 元（较上年度末增长 55.25%）"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600265&id=12524192"
  - 事件: "2026 年上半年按合并口径营业收入 5,593.17 万元中，上海博达数智科技有限公司贡献 3,807.20 万元（占比 68.07%、净利润 1,013.41 万元），景谷永恒木业有限公司贡献 1,465.88 万元（占比 26.21%、净利润 9.50 万元），收入引擎由林业制造切换至算力服务"
    来源: "https://stock.stockstar.com/RB2026082600018827.shtml"
  - 事件: "截至 2026 年 6 月 30 日，公司母公司为周大福投资有限公司，最终控制方为郑家纯先生"
    来源: "https://stockmc.xueqiu.com/202608/600265_20260825_GY50.pdf"

