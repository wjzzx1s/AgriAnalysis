代码: "600598"
名称: "北大荒"
定位: "黑龙江垦区核心农业上市公司，以国有耕地承包经营（土地发包）为主业，土地承包费收入长期占营业收入七成左右；2026 年上半年因补缴 2021—2025 年企业所得税及滞纳金 14.10 亿元而由盈转亏。"
沿革:
  - 年: "1998"
    事件: "11 月 27 日在黑龙江省工商行政管理局注册登记成立，系由黑龙江北大荒农垦集团总公司独家发起，以其下属友谊、宝泉岭、八五四、八五九等十六家农场和浩良河化肥厂的优质资产重组设立，经国家经贸委批准"
    来源: "https://baike.baidu.com/item/%E9%BB%91%E9%BE%99%E6%B1%9F%E5%8C%97%E5%A4%A7%E8%8D%92%E5%86%9C%E4%B8%9A%E8%82%A1%E4%BB%BD%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8/9019138"
  - 年: "2002"
    事件: "3 月 13 日以网上累计投标询价方式发行 30,000 万股人民币普通股，发行价 5.38 元/股；首次发行后总股本由 116,996 万股增至 146,996 万股；3 月 29 日起在上交所挂牌交易"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/2007-07-12/600598_20070712_2.pdf"
  - 年: "2005"
    事件: "6 月实施资本公积转增股本 293,992,000 股（以 2004 年底股本 1,469,960,000 股为基数每 10 股转增 2 股派 0.50 元）；12 月 29 日完成股权分置改革相关股份对价，2006 年 1 月 4 日起简称变更为“G 北大荒”"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2006/2006-4/2006-04-18/141793.PDF"
  - 年: "2006"
    事件: "3 月定向回购农垦集团所持本公司股份 129,660,000 股"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600598&id=10827041"
  - 年: "2007"
    事件: "12 月公开发行可转换公司债券，募集资金 15 亿元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600598&id=10827041"
  - 年: "2014"
    事件: "因 2012、2013 年连续两年亏损，3 月底股票被实施退市风险警示，简称由“北大荒”变更为“*ST 大荒”"
    来源: "https://finance.china.com.cn/roll/20150422/3072469.shtml"
  - 年: "2015"
    事件: "4 月一举摘掉“退市风险警示”帽子，*ST 大荒恢复为“北大荒”；2014 年年度报告显示归属上市公司股东净利润 8 亿元"
    来源: "https://finance.china.com.cn/roll/20150422/3072469.shtml"
主营与结构:
  - 事件: "公司为耕地发包主体，通过承包方式取得国有耕地承包经营权；实行以统一经营管理为主导、家庭农场承包经营为基础的统分结合双层经营体制，家庭农场（农户）与农业分公司签订《农业生产承包协议》"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600598&id=12009689"
  - 事件: "2024 年、2025 年土地承包费收入分别为 37.32 亿元、37.50 亿元，占营业收入的比重为 69.90%、71.71%"
    来源: "https://finance.sina.com.cn/roll/2026-07-14/doc-inihtmen8612405.shtml"
  - 事件: "2025 年度营业收入 522,919.05 万元，其中土地承包收入 374,971.35 万元"
    来源: "https://static.cninfo.com.cn/finalpage/2026-03-21/1225023732.PDF"
  - 事件: "主营业务还包括农产品收购、销售及种植，农副产品初加工，肥料制造及销售，农药经营等"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600598&id=10827041"
  - 事件: "2026 年上半年化肥等农业投入品经营模式由购销模式变更为代销模式，导致销售收入同比减少 8.86 亿元"
    来源: "https://stockmc.xueqiu.com/202608/600598_20260828_NR1D.pdf"
融资历史:
  - 时间: "2002-03"
    方式: "IPO（上海证券交易所）"
    规模: "发行 30,000 万股，发行价 5.38 元/股，募集资金总额 161,400 万元，扣除发行费用 5,074 万元后余额 156,326 万元"
    用途: "百万吨稻谷精深加工及十万立方米绿色稻草板生产项目、农业高新技术大规模综合应用项目、浩良河分公司油改煤化肥工程项目"
    说明: "经证监发行字[2002]19 号文核准；募集资金于 2002-03-19 全部划入公司指定账户，经信永中和会计师事务所验资"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/2007-07-12/600598_20070712_2.pdf"
  - 时间: "2003"
    方式: "变更募投并收购资产"
    规模: "收购农垦集团所持黑龙江省北大荒米业有限公司 98.55% 股权，投资金额 47,613 万元（另调减稻谷加工项目投资 10,500 万元用于设立哈尔滨龙垦麦芽有限责任公司）"
    用途: "由原投资新建改为收购控股股东资产"
    说明: "其中 3.50 亿元来自北大荒上市募集资金"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/2007-07-12/600598_20070712_2.pdf"
  - 时间: "2007-12"
    方式: "可转换公司债券"
    规模: "发行数量 150,000 万元（15 亿元），面值 100 元，按面值发行"
    用途: "未查得"
    说明: "经证监发行字[2007]451 号文核准；原股东享有优先配售权；截至 2010-12-31 累计转股 143,387,909 股，其余部分因触发提前赎回条款全部赎回"
    来源: "http://static.cninfo.com.cn/finalpage/2007-12-14/36011302.PDF"
  - 时间: "2025-05"
    方式: "现金分红（2024 年度）"
    规模: "以总股本 1,777,679,909 股为基数每股派 0.55 元，共派发现金红利 9.78 亿元，分红比例 89.93%"
    用途: "回报股东"
    说明: "现金红利发放已于 5 月 23 日完成"
    来源: "https://static.cninfo.com.cn/finalpage/2026-03-21/1225023732.PDF"
  - 时间: "2026-03"
    方式: "现金分红预案（2025 年度）"
    规模: "每 10 股派发现金股利 5.5 元（含税），合计拟派发 977,723,949.95 元，现金分红比例 83.84%"
    用途: "回报股东"
    说明: "不送红股，不实施资本公积金转增股本"
    来源: "https://static.cninfo.com.cn/finalpage/2026-03-21/1225023732.PDF"
风险与困境:
  - 时间: "2010 年起"
    事项: "因盲目扩张，企业背上 70 多亿元的贷款包袱"
    来源: "https://finance.china.com.cn/roll/20150422/3072469.shtml"
  - 时间: "2012-2013"
    事项: "8 家下属非农企业中 6 家出现严重亏损，累计亏损额每年均高达 13 亿元，直接导致连续两年亏损；2012 年因资金违规拆借引起信息披露问题被上海证券交易所公开谴责；2012、2013 年财务报告审计非标准意见、内控审计连续两年否定意见"
    来源: "https://finance.china.com.cn/roll/20150422/3072469.shtml"
  - 时间: "2014-03-31"
    事项: "完成对米业公司的处置，以 6,161 万元将所持黑龙江省北大荒米业集团有限公司 98.55% 股权出售给控股股东农垦集团（2003 年购入价为 4.76 亿元）"
    来源: "http://finance.people.com.cn/stock/n/2014/0401/c222942-24788140.html"
  - 时间: "2026-06-18"
    事项: "收到国家税务总局哈尔滨市税务局第一税务分局《税务事项通知书》（哈税一通〔2026〕28 号）：下属 16 家农业分公司从非职工家庭农场取得的土地承包费收入不应享受企业所得税优惠政策，需补缴 2021—2025 年期间企业所得税 102,412.62 万元、滞纳金 38,577.25 万元，合计 140,989.87 万元"
    来源: "https://stockmc.xueqiu.com/202608/600598_20260828_NR1D.pdf"
  - 时间: "2026-06-22"
    事项: "就补缴税款公告说明：本次补缴不涉及税务行政处罚，不属于前期会计差错，不涉及前期财务数据追溯调整，税款及滞纳金将一次性计入 2026 年当期损益，预计减少 2026 年归母净利润约 14.1 亿元；公司称系税收政策理解偏差"
    来源: "https://www.stcn.com/article/detail/3972209.html"
  - 时间: "2026-06-30"
    事项: "2026 年上半年营业收入 21.28 亿元（同比 -29.39%），归母净利润 -5.37 亿元（同比减少 15.21 亿元，-154.50%），基本每股收益 -0.302 元；资产负债率 39.52%，较上年末增加 26.59 个百分点；已于上半年补缴完毕税款和滞纳金"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600598&id=12563994"
  - 时间: "2026-07-13"
    事项: "发布 2026 年半年度业绩预告，预计上半年归母净利润 -5.37 亿元左右，扣非净利润 -2.09 亿元左右"
    来源: "https://www.stcn.com/article/detail/4015558.html"
战略与转型:
  - 时间: "2014"
    事项: "剥离北大荒米业集团股权，收缩非农与低效业务，回归耕地发包主业，当年实现扭亏"
    来源: "https://finance.china.com.cn/roll/20150422/3072469.shtml"
  - 时间: "2026-06-30"
    事项: "报告期末“合同负债”比上期期末增长 25,848.03%，主要系按《农业生产承包协议》约定预收全年土地承包费及生产资料款形成"
    来源: "https://stockmc.xueqiu.com/202608/600598_20260828_NR1D.pdf"
融资需求线索:
  - 时间: "2026-06-30"
    事项: "补缴 14.10 亿元税款及滞纳金计入当期损益，资产负债率升至 39.52%（较上年末增加 26.59 个百分点）"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600598&id=12563994"
  - 时间: "2026-07-14"
    事项: "媒体分析指出 14.1 亿元补缴总额已超过公司 2025 年全年归母净利润（11.66 亿元），按 2026 年一季度增速推算全年或将出现亏损"
    来源: "https://finance.sina.com.cn/jjxw/2026-06-23/doc-iniekeev9733691.shtml"
其他要点:
  - 要点: "截至 2025-12-31，公司累计发行股本总数 1,777,679,909 股"
    来源: "https://static.cninfo.com.cn/finalpage/2026-03-21/1225023732.PDF"
  - 要点: "2025 年年度营业收入 52.29 亿元，归属于上市公司股东的净利润 11.66 亿元"
    来源: "https://finance.sina.com.cn/jjxw/2026-06-23/doc-iniekeev9733691.shtml"
  - 要点: "2026 年一季度营业收入 10.47 亿元（+9.54%），归母净利润 5.81 亿元（+7.84%）"
    来源: "https://finance.sina.com.cn/jjxw/2026-06-23/doc-iniekeev9733691.shtml"
  - 要点: "公司土地承包费收入按承包期内分摊确认，合同签订后固定期限内全额缴纳承包费"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600598&id=12009698"
  - 要点: "2010 年 5 月 29 日股东大会通过 2009 年度分配方案，以 2009 年末总股本 1,714,481,800 股为基数每 10 股派现金红利 1.53 元；2011 年 4 月拟以 2010 年末总股本 1,777,679,909 股为基数每 10 股派 1.55 元"
