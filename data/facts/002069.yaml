代码: "002069"
名称: "獐子岛"
定位: "辽宁大连长海县獐子岛镇起家的海洋牧场企业，2006 年 9 月深交所上市，A 股“水产第一股”，因 2014 年以来多次“扇贝绝收/跑路”及 2016—2017 年年度报告虚假记载于 2020 年 6 月被证监会处罚、原董事长吴厚刚被终身市场禁入并获刑 15 年；2022 年 3 月原控股股东所持股份被拍卖、大连市国资入主，2022 年 5 月被实施其他风险警示（ST獐子岛）、2023 年 5 月撤销；现由大连市国资委实际控制，公司以“扭亏、瘦身、聚焦、增效”为主线剥离非核心资产，2026 年上半年营业收入 7.31 亿元、归母净利润 1,287.14 万元。"

