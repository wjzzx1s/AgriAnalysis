代码: "300189"
名称: "神农种业"
定位: "海南起家的水稻、玉米、油菜等农作物种子企业，2011年创业板上市（原名神农大丰，历经神农基因、神农科技更名）；因信披违法被证监会处罚、主业长期亏损，2025年靠处置联营企业股权实现账面盈利，2026年上半年再度亏损。"

沿革:
  - 年: "2000"
    事件: "2000年12月26日经海南省股份制企业办公室琼股办〔2000〕96号文批准，由黄培劲、长丰（集团）有限责任公司等十位股东共同出资发起设立股份有限公司（2000年12月29日注册成立）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300189&id=6321189"
  - 年: "2011"
    事件: "2011年3月7日经证监许可〔2011〕264号核准首次公开发行4,000万股，发行价24.00元/股，2011年3月16日在深交所创业板上市，证券代码300189"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300189&id=3831376"
  - 年: "2011"
    事件: "根据2011年度股东大会决议，以未分配利润每10股送红股2股、资本公积每10股转增4股，合计转增股本9,600万元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300189&id=6321189"
  - 年: "2015"
    事件: "2015年11月公司更名为海南神农基因科技股份有限公司，股票简称变更为神农基因"
    来源: "https://baike.baidu.com/item/%E6%B5%B7%E5%8D%97%E7%A5%9E%E5%86%9C%E5%A4%A7%E4%B8%B0%E7%A7%8D%E4%B8%9A%E7%A7%91%E6%8A%80%E8%82%A1%E4%BB%BD%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8/2997597"
  - 年: "2015"
    事件: "拟以发行股份方式购买波莲基因61.52%股权，向塔牌集团、黄培劲、孙敏华3名交易对方发行165,484,634股；交易文件明确公司实际控制人一直为黄培劲、不构成借壳上市"
    来源: "http://qccdata.qichacha.com/ReportData/PDF/62e128d0c54cf453023013f5aefbaf4c.pdf"
  - 年: "2019"
    事件: "2019年6月经海南省市场监督管理局核准，公司全称由海南神农基因科技股份有限公司变更为海南神农科技股份有限公司"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300189&id=6321189"
  - 年: "2024"
    事件: "2024年7月完成工商变更登记，公司名称由海南神农科技股份有限公司变更为海南神农种业科技股份有限公司，证券简称由神农科技变更为神农种业"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202408271639483842_1.pdf"
  - 年: "2025"
    事件: "2025年1月23日第七届董事会第二十二次会议通过转让控股子公司福建神农大丰种业88.67%股权的议案，交易价格1,303.40万元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300189&id=12178654"

主营与结构:
  - 事件: "主营水稻、油菜、玉米等农作物种子的选育、繁育、制种、销售及技术服务，销售区域覆盖国内主要种植区及南亚、非洲等境外地区"
    来源: "https://www.sina.cn/news/detail/5340086208037026.html"
  - 事件: "2024年制种产量469.91万公斤，较2023年度增加11.51%；2024年油菜种子销售收入首次超过水稻种子销售收入，收入贡献占比28.36%，并新增油菜籽销售收入（占比3.91%）"
    来源: "https://epaper.stcn.com/pic/202504/26/e289cb3dddbef40c38216825bb630ac4.pdf"
  - 事件: "2026年上半年分产品收入：杂交水稻种子2,931.84万元、油菜种子15.65万元、农化产品及其他101.17万元，同比分别下降16.48%、69%、94%"
    来源: "https://www.nbd.com.cn/articles/2026-08-25/4556928.html"
  - 事件: "2026年上半年杂交水稻种子营收占比51.95%，为第一大收入来源"
    来源: "https://www.sina.cn/news/detail/5340086208037026.html"
  - 事件: "总股本102,400万股，注册资本102,400万元"
    来源: "https://q.stock.sohu.com/cn/300189/index.shtml"

融资历史:
  - 时间: "2011-03"
    方式: "IPO（深交所创业板）"
    规模: "发行4,000万股，发行价24.00元/股，募集资金总额960,000,000.00元，扣除发行费用后净额871,688,510.00元"
    用途: "与主营业务相关的项目及主营业务发展所需营运资金"
    说明: "发行后股份总数由12,000万股增至16,000万股"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300189&id=3831376"
  - 时间: "2015"
    方式: "发行股份购买资产（拟）"
    规模: "拟购买波莲基因61.52%股权，向塔牌集团、黄培劲、孙敏华发行165,484,634股（交易前总股本1,024,000,000股）"
    用途: "购买标的公司股权"
    说明: "交易文件认定不构成重大资产重组、不构成借壳上市"
    来源: "http://qccdata.qichacha.com/ReportData/PDF/62e128d0c54cf453023013f5aefbaf4c.pdf"
  - 时间: "2019"
    方式: "行政处罚（罚款）"
    规模: "公司被罚60万元，黄培劲被罚70万元，其他责任人分别被罚3万至20万元"
    用途: ""
    说明: "海南监管局〔2019〕4号行政处罚决定书，非融资事项，列此以说明资本运作约束"
    来源: "http://www.csrc.gov.cn/hainan/c104738/c1351861/content.shtml"
  - 时间: "2024"
    方式: "债务融资"
    规模: "2024年度筹资活动产生的现金流量净额为2.12亿元，同比增加1908.04%"
    用途: "补充运营资金"
    说明: "2025年财务费用316.53万元，同比暴增2128.36%，当期利息支出325.39万元（上年49.42万元）"
    来源: "http://finance.sina.com.cn/stock/aigc/stockfs/2025-04-26/doc-ineunmfc8778545.shtml"

风险与困境:
  - 时间: "2017-06-09"
    事项: "收到中国证监会海南监管局《调查通知书》（琼调查字2017001号），因涉嫌信息披露违法违规被立案调查"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vGP_GetOutOfLine/stockid/300189.phtml"
  - 时间: "2019-09-16"
    事项: "海南监管局作出〔2019〕4号行政处罚：公司2014年至2016年通过虚构种子销售业务分别虚增主营业务收入5,405.77万元、2,223.60万元、751.40万元，2015年通过无商业实质的品种权转让虚增利润2,515.00万元；未按规定披露黄培劲与海南谷韵湘的关联关系，公司被警告并罚款60万元"
    来源: "http://www.csrc.gov.cn/hainan/c104738/c1351861/content.shtml"
  - 时间: "2020-01-06"
    事项: "披露前期会计差错更正及追溯调整：分别调减2014年至2016年归属于上市公司股东的净利润152.78万元、2,783.64万元、111.09万元，更正后2015年净利润由盈转亏"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vGP_GetOutOfLine/stockid/300189.phtml"
  - 时间: "2020"
    事项: "深交所作出《关于对海南神农科技股份有限公司及相关当事人给予通报批评处分的决定》（深证上〔2020〕1286号），公司及时任董事长黄培劲等被通报批评"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vGP_GetOutOfLine/stockid/300189.phtml"
  - 时间: "2025-04-26"
    事项: "2024年净利润-5,224.47万元，同比增亏59.78%；归母净利润-5,061.65万元，同比增亏40.51%，主要因超强台风摩羯造成存货损失970.94万元、固定资产损失39.00万元；扣非归母净利润-4,636.66万元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300189&id=11009714"
  - 时间: "2026-04-25"
    事项: "2025年归母净利润1.07亿元（同比增长311.61%）中，非经常性损益合计10,281.58万元、占净利润95.95%，其中处置非流动性资产收益13,083.71万元；扣非净利润仅434.19万元，主业盈利水平薄弱"
    来源: "https://finance.sina.com.cn/stock/aigc/stockfs/2026-04-24/doc-inhvramw7877847.shtml"
  - 时间: "2026-04-25"
    事项: "截至报告期末母公司未分配利润-201,214,908.81元、合并未分配利润-488,878,148.25元，2025年度不派发现金红利、不送红股、不以公积金转增股本"
    来源: "http://xinpi.zqrb.cn/pdf/CYB/300189/2026/0425/bc66c5123a5c5c1a0aa4a308eef1c744.pdf"
  - 时间: "2026-01-13"
    事项: "因2025年1月1日起改变部分资产价值计量模式、先后两次评估，公司披露2025年第一季度报告（更正后）并对追溯调整作出说明"
    来源: "http://static.cninfo.com.cn/finalpage/2026-01-13/1224931425.PDF"
  - 时间: "2026-08-25"
    事项: "2026年上半年营业收入5,643.41万元，同比下降35.30%；归母净利润-1,349.91万元，扣非净利润-956.88万元（亏损同比扩大50.04%）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300189&id=12533552"
  - 时间: "2026-08-25"
    事项: "2026年上半年水产品收入仅39.25万元，同比骤降86.53%，毛利率-60.37%，公司称主要系水产种源受赤潮影响造成损失，确认385万元营业外支出"
    来源: "https://www.sohu.com/a/1070963752_116062"
  - 时间: "2026-08-18"
    事项: "股票于2026年8月17日、18日连续两个交易日收盘价格涨幅偏离值累计超过30%，公司发布股票交易异常波动公告"
    来源: "https://www.sohu.com/a/1070963752_116062"

战略与转型:
  - 时间: "2025-01-23"
    事项: "转让控股子公司福建神农大丰种业科技有限公司88.67%股权给李坤泰，价格1,303.40万元，2025年2月完成工商变更，此后不再纳入合并报表（处置收益637,680.23元）"
    来源: "https://epaper.stcn.com/pic/202504/26/e289cb3dddbef40c38216825bb630ac4.pdf"
  - 时间: "2025-01-01"
    事项: "对投资性房地产的后续计量由成本模式变更为公允价值模式（会计政策变更），并将部分自用房地产转为出租目的"
    来源: "http://static.cninfo.com.cn/finalpage/2025-10-29/1224748457.PDF"
  - 时间: "2026-04-25"
    事项: "2025年投资收益141,150,153.03元，占利润总额95.60%，形成原因为处置联营企业部分股权产生的投资收益及对剩余股权按准则调整至其他权益工具投资所产生的收益，公司明确该损益不具有可持续性"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300189&id=12178654"
  - 时间: "2025-04-26"
    事项: "公司构建农作物种业与海洋水产种业双线布局，立足海南自贸港区位优势；对水稻品种进行战略性调整，加大优势油菜品种科研投入"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300189&id=11009714"

