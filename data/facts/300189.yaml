    事项: "2025年度利润分配预案为不分配，因母公司及合并报表未分配利润均为大额负数，长期不具备现金分红能力"
    来源: "http://xinpi.zqrb.cn/pdf/CYB/300189/2026/0425/bc66c5123a5c5c1a0aa4a308eef1c744.pdf"
  - 时间: "2026-04-25"
    事项: "公司披露《关于未弥补亏损达到实收股本总额三分之一的公告》"
    来源: "http://money.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/300189.phtml"

