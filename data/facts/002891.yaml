    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225158412.PDF"
  - 事件: "公司主营业务表述为宠物食品的生产、销售及相关业务；国内销售主要通过抖音、小红书等新媒体投放，海外由国际营销中心专设自主品牌部负责自主品牌推广。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225158412.PDF"

