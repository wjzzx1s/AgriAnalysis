代码: "002891"
名称: 中宠股份
定位: "山东烟台的宠物食品企业，全称烟台中宠食品股份有限公司，2014年11月24日由烟台中宠食品有限公司整体变更设立，2017年8月21日在深圳证券交易所上市；主营宠物食品和用品的研发、生产与销售，采取自主品牌与OEM/ODM双轨并行模式，自有品牌包括“Wanpy顽皮”“TOPTREES领先”“新西兰ZEAL真致”等。控股股东为烟台中幸生物科技有限公司，实际控制人为自然人郝忠礼。2025年归母净利润3.65亿元、同比下降7.28%；2026年上半年营收32.806亿元、同比增长34.88%，但归母净利润1.27亿元、同比下降37.63%。公司近年连续通过可转债与非公开发行融资，2026年3月完成可转债提前赎回。"

