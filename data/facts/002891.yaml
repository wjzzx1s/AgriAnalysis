主营与结构:
  - 事件: "公司主营业务为宠物食品和用品的研发、生产和销售，拥有独立的生产及辅助生产系统、采购和销售系统以及独立的研发体系，与控股股东、实际控制人及其控制的其他企业间不存在同业竞争。"
