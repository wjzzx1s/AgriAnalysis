代码: "002157"
名称: "正邦科技"
定位: "曾经的江西养猪龙头企业，2022—2023 年陷入债务危机并被法院裁定重整，由双胞胎集团牵头联合体接盘；2024 年 6 月撤销退市风险警示，现依托双胞胎协同恢复生猪与饲料业务，控股股东承诺 4 年内完成资产整体上市。"
沿革:
  - 年: "2007"
    事件: "8 月 17 日在深交所挂牌上市（证券代码 002157），首次公开发行 1,900 万股 A 股，发行价 11.09 元/股（其中网下配售 380 万股、网上 1,520 万股）"
    来源: "http://money.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/002157.phtml"
  - 年: "2007"
    事件: "经证监发行字[2007]197 号文核准发行，2007 年 8 月 15 日获深证上[2007]131 号文批准上市"
    来源: "http://static.cninfo.com.cn/finalpage/2007-12-25/36215528.PDF"
  - 年: "2020"
    事件: "报告期内完成总额 16 亿元的可转债（正邦转债，128114）发行，并披露总额 75 亿元的非公开发行计划，两次再融资募集资金主要用于养殖产能扩张"
    来源: "http://file.finance.qq.com/finance/hs/pdf/2020/08/28/1208279405.PDF"
  - 年: "2021"
    事件: "2020 年度非公开发行新增股份 569,908,811 股于 2021 年 2 月 1 日在深交所上市"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2021/2021-8/2021-08-31/7511598.PDF"
  - 年: "2024"
    事件: "6 月 12 日起撤销退市风险警示并复牌，股票简称由“*ST 正邦”恢复为“正邦科技”，日涨跌幅限制由 5% 恢复为 10%"
    来源: "https://m.bjnews.com.cn/detail/1718168037169755.html"
股权与控制权:
  - 事项: 控股股东为江西双胞胎农业有限公司，持股15.13%；实际控制人为鲍洪星、华涛、鲍华悦。双胞胎控股持有双胞胎农业100%股权，鲍洪星与华涛合计控制双胞胎控股57.4094%股权。
    来源: http://static.cninfo.com.cn/finalpage/2023-12-13/1218595954.PDF
  - 事项: 2023年7月20日南昌中院裁定公司破产重整，双胞胎农业作为产业投资人认购资本公积金转增的14亿股A股股票，占重整后总股本的15.06%，2023年12月27日正式变更为控股股东。
    来源: http://static.cninfo.com.cn/finalpage/2023-12-13/1218595954.PDF
  - 事项: 2023年12月董事会提前换届，双胞胎农业提名3名非独立董事与2名独立董事人选，鲍洪星出任公司董事长，双胞胎集团由此完整接管上市公司治理体系。
    来源: http://basic.10jqka.com.cn/002157/company.html
  - 事项: 2026年上半年资产减值损失3.86亿元，主要系对往来账款计提预期信用损失及对部分存货计提减值准备，公司总资产189.19亿元、归母净资产101.47亿元。
    来源: https://www.nbd.com.cn/articles/2026-08-24/4552770.html
主营与结构:
  - 事件: "重整后集中资源布局生猪养殖，同时恢复饲料业务；2025 年生猪出栏 853.69 万头（其中商品猪 373.82 万头），销售饲料（含调拨至养殖板块）合计 266 万吨"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=830745586513&code=002157&dannoun=lcdetail&announ=lc"
  - 事件: "2026 年上半年生猪出栏约 558.2 万头；1—8 月累计销售生猪 726.76 万头，同比上升 47.07%，累计销售收入 52.75 亿元"
    来源: "https://www.stcn.com/article/detail/4176847.html"
  - 事件: "控股股东双胞胎集团持续为公司的饲料业务团队打造、经营管理、平台系统、运营资金提供支持"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202405101632828391_1.pdf"
竞争优势:
  - 事项: 依托双胞胎集团一体化管理平台输出养殖技术与管理体系，饲料板块成为业绩压舱石，上半年饲料收入逆势增长28.47%并向外部拓展客户，养殖、饲料、动保多业态协同共享客户资源。
    来源: https://caifuhao.eastmoney.com/news/20260827123954177366990
  - 事项: 2023年公司持续处于预重整及重整阶段，引入双胞胎集团作为产业投资人并招募16位财务投资人，重整投资人合计提供投资款43.40亿元，2023年12月15日执行完毕重整计划并终结重整程序。
    来源: https://paper.cnstock.com/html/2024-06/08/content_1929246.htm
  - 事项: 据新猪派统计，16家头部猪企成本分层清晰，正邦、京基智农等4家处于6.5至7元/斤的第三梯队，与第一梯队的牧原、温氏等存在明显差距，降本是公司当前主要任务。
    来源: https://finance.sina.com.cn/wm/2026-08-31/doc-iniqepet7887268.shtml
行业基本面:
  - 事项: 2026年上半年全国生猪出栏37246万头、同比增长1.7%，猪肉产量3119万吨、同比增长3.3%；二季度末生猪存栏42491万头，能繁母猪存栏3780万头、同比下降6.5%。
    来源: https://www.stats.gov.cn/sj/zxfbhjd/202607/t20260716_1964140.html
  - 事项: 2026年4月14日全国外三元生猪均价跌至8.67元/公斤，创近8年新低，同比降幅超41%，部分区域价格已先行走低至8元/公斤以下，低于行业现金成本。
    来源: https://finance.eastmoney.com/a/202604213712016730.html
  - 事项: 2026年5月农业农村部将能繁母猪正常保有量下调至3750万头左右，绿色区域收紧至92%至103%，并将大型集团养殖企业纳入监测名单实行年度生产备案管理。
    来源: https://stcn.com/article/detail/3909962.html
经营要点:
  - 事项: 2026年上半年营业收入77.20亿元、同比增长12.90%，归母净利润亏损7.36亿元、由盈转亏，扣非归母净利润亏损7.50亿元，生猪养殖板块销售生猪558.21万头。
    来源: https://www.nbd.com.cn/articles/2026-08-24/4552770.html
  - 事项: 2026年1至8月累计销售生猪726.76万头、同比上升47.07%，累计销售收入52.75亿元、同比下降3.34%；8月商品猪（扣除仔猪后）销售均价11.14元/公斤。
    来源: https://www.stcn.com/article/detail/4176847.html
  - 事项: 2026年上半年饲料业务收入34.21亿元、同比增长28.47%，占营业收入44.31%；母猪场平均PSY提升至27头，生猪养殖料肉比降至2.68，猪场栏位利用率回升至85%以上。
    来源: https://caifuhao.eastmoney.com/news/20260827123954177366990
  - 事项: 2026年上半年商品猪（扣除仔猪后）销售均价5.23元/斤、较上年同期下降2.04元/斤，销售费用同比下降18.05%、管理费用同比下降30.02%。
    来源: https://www.nbd.com.cn/articles/2026-08-24/4552770.html
