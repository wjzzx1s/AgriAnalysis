代码: "300498"
名称: "温氏股份"
定位: "以“公司+农户”模式经营的畜禽养殖龙头，肉鸡规模居全国首位、肉猪规模居行业前列，2015 年换股吸收合并大华农实现整体上市；2026 年上半年猪价深跌导致大额亏损，肉禽板块盈利部分对冲。"
沿革:
  - 年: "2015"
    事件: "11 月 2 日通过换股吸收合并广东大华农动物保健品股份有限公司在深交所创业板整体上市，换股比例为每 1 股大华农换 0.8070 股温氏股份，大华农同日终止上市"
    来源: "http://finance.cnr.cn/jysk/20151102/t20151102_520364164.shtml"
  - 年: "2015"
    事件: "上市公告书披露换股吸收合并大华农事项经证监会核准后实施，股票在深交所创业板上市"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=300498&id=2034464"
  - 年: "2021"
    事件: "3 月 29 日发行 92.97 亿元可转换公司债券（温氏转债，123107），4 月 21 日在深交所上市"
    来源: "https://www.wens.com.cn/uploadfiles/2023/09/202309111130185504.pdf"
主营与结构:
  - 事件: "肉猪与肉鸡双主业；2026 年上半年累计销售肉猪（含毛猪和鲜品）1,781 万头、肉鸡（含毛鸡、鲜品和熟食）6.3 亿只、肉鸭约 2,300 万只"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-8/2026-08-27/12554592.PDF"
  - 事件: "2026 年上半年肉猪上市率 93.1%、料肉比 2.55，6 月 PSY 达 28.5 头创历史新高；肉猪养殖账面综合成本 6.1 元/斤，剔除跌价准备影响后约 6 元/斤"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-8/2026-08-27/12554592.PDF"
  - 事件: "2026 年上半年生猪养殖业务销售收入 266.48 亿元（同比 -18.60%），肉鸡养殖业务销售收入 174.32 亿元"
    来源: "https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/841330979290/index.phtml"
  - 事件: "2025 年肉鸡销量中鲜品约 1 亿只（鲜销比例约 15%）、熟食约 680 万只、白羽肉鸡约 1,600 万只，禽类向下游鲜品与熟食延伸"
    来源: "https://finance.sina.com.cn/jjxw/2026-08-27/doc-iniptnuz5843346.shtml"
