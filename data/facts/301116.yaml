代码: "301116"
名称: "益客食品"
定位: "江苏肉禽（肉鸭、肉鸡）屠宰与加工企业，2022 年 1 月创业板上市，形成肉鸡、肉鸭双产业链协同，产品覆盖鸭产品、鸭苗、鸡产品、鸡苗、饲料、调理品、熟食与羽绒；控股股东益客农牧持股 70.11%，2026 年上半年营业收入 99.02 亿元、归母净利润 3,370.62 万元实现扭亏。"

沿革:
  - 年: "2008"
    事件: "8 月 7 日公司成立（江苏益客食品集团股份有限公司），2010 年 1 月 10 日在原公司基础上改组为股份有限公司"
    来源: "https://reportdocs.static.szse.cn/UpFiles/rasinfodisc1/202312/RAS_202312_472C780FE9344B93AFA5C4A62839DC27.pdf"
  - 年: "2022"
    事件: "1 月 18 日在深圳证券交易所创业板上市，经证监许可[2021]3800 号批复核准公开发行 44,897,960 股、发行价 11.40 元/股，募集资金净额 44,422.33 万元"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=301116&id=7790775"
  - 年: "2023"
    事件: "4 月 7 日披露向控股股东益客农牧发行股票预案（拟募资不超 4.5 亿元、价格 12.64 元/股、不超 3,955.69 万股），2024 年 1 月获中国证监会同意注册批复，后于 2024 年 9 月 11 日公告终止该次定增"
    来源: "https://stcn.com/article/detail/1317323.html"
  - 年: "2024"
    事件: "2 月 18 日第三届董事会第九次会议审议通过回购公司股份事项；截至 2024 年半年报，公司已通过股份回购专用证券账户以集中竞价交易方式累计回购 7,015,503 股，成本 65,601,815.37 元"
    来源: "http://static.cninfo.com.cn/finalpage/2024-08-27/1220984063.PDF"

主营与结构:
  - 事件: "依托肉鸡、肉鸭双产业链协同优势，主要产品包括鸭产品、鸭苗、鸡产品、鸡苗、饲料、调理品、熟食、羽绒等"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-27/1225508072.PDF"
  - 事件: "2026 年上半年公司实现营业收入 99.02 亿元，同比增加 13.21%，主要系鸡产品、饲料、鸡苗、鸭苗、调理品、羽绒等产品销量、售价同比升高所致"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-27/1225508072.PDF"
  - 事件: "2025 年肉鸭产业链屠宰、鸭苗等业务环节市场需求不及预期，呈现周期性、暂时性产能相对过剩，产品价格降幅大于成本降幅，其中鸭产品毛利同比减少约 2.2 亿元、鸭苗毛利同比减少约 2.7 亿元"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-24/1225160345.PDF"
  - 事件: "IPO 募投项目包括益客产业肉鸭屠宰线建设项目、扩建年产 2 万吨禽肉熟食项目、益客食品供应链数字化建设项目、山东益客食品产业有限公司专用饲料研发及产业化项目及补充流动资金"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-26/10082098.PDF"

融资历史:
  - 时间: "2022-01"
    方式: "IPO（深圳证券交易所创业板）"
    规模: "发行 44,897,960 股、发行价 11.40 元/股，募集资金总额 51,183.67 万元，扣除发行费用 6,761.34 万元（不含增值税）后净额 44,422.33 万元"
    用途: "肉鸭屠宰线建设、禽肉熟食扩建、供应链数字化、专用饲料研发及产业化项目及补充流动资金"
    说明: "截至 2023 年 6 月 30 日公司已使用募集资金 44,422.33 万元，投入比例 100.00%"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-26/10082098.PDF"
  - 时间: "2023-04-07"
    方式: "向特定对象发行股票（向控股股东益客农牧，后终止）"
    规模: "拟募集资金不超过 4.5 亿元（发行不超过 3,955.69 万股，发行价格 12.64 元/股，后调整为不超过 45,000.00 万元）"
    用途: "扣除发行费用后全部用于补充流动资金"
    说明: "2024 年 1 月获中国证监会同意注册批复；2024 年 9 月 11 日公司公告因外部客观环境和市场环境发生变化，决定终止向控股股东益客农牧发行股票事项"
    来源: "https://stcn.com/article/detail/1317323.html"
  - 时间: "2026-06-10"
    方式: "向特定对象发行股票（预案，含控股股东认购）"
    规模: "拟募集资金不超过 9 亿元（发行股票数量不超过 1.35 亿股），其中控股股东益客农牧拟以现金认购不低于 5,000 万元且不高于 1.5 亿元"
    用途: "益客食品科技谷项目、肉禽产业链综合研发项目、数智化升级建设项目、补充流动资金项目"
    说明: "发行对象为包括益客农牧在内的不超过 35 名特定对象；公司于 2026 年 6 月 10 日与益客农牧签署《附条件生效的股份认购协议》；2026 年 8 月 21 日发行申请获深交所受理"
    来源: "https://www.stcn.com/article/detail/3954365.html"

风险与困境:
  - 时间: "2024-02"
    事项: "公司公告由控股股东江苏益客农牧投资有限公司、实际控制人田立余及其配偶时美英、董事公丽云为公司及子公司向银行申请综合授信额度不超过 28 亿元提供总额度不超过 18 亿元的担保（2024 年 2 月 1 日董事会、2024 年 2 月 22 日临时股东大会审议通过）"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301116&id=10935199"
  - 时间: "2025-06-30"
    事项: "2025 年上半年归属于上市公司股东的净利润 -181,250,421.43 元、扣非归母净利润 -210,209,808.86 元；经营活动产生的现金流量净额 -275,239,019.81 元"
    来源: "https://static.cninfo.com.cn/finalpage/2026-08-27/1225508071.PDF"
  - 时间: "2026-04-24"
    事项: "2025 年公司主要产品销量同比变化不大，营业收入同比下降约 9%，下降主要系主要产品销售价格下降所致；净利润、归母净利润降低主要系鸭产品、鸭苗等主要产品销售价格降幅大于成本降幅、毛利减少所致"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-24/1225160345.PDF"

