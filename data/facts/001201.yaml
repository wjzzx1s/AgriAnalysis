代码: "001201"
名称: "东瑞股份"
定位: "广东河源的供港澳活大猪供应商与粤港澳大湾区“菜篮子”重要生产基地，2002 年成立、2021 年 4 月深交所主板上市（发行价 63.38 元、募资总额 20.07 亿元），形成饲料、育种、扩繁、养殖、屠宰冷链一体化生猪全产业链，2026 年上半年出栏生猪 88.60 万头但归母净亏损 4.25 亿元。"

沿革:
  - 年: "2002"
    事件: "3 月 27 日前身河源市瑞昌畜牧发展有限公司成立（由袁建康主导设立，发展生猪产业）"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001201&id=12229804"
  - 年: "2003"
    事件: "公司取得供港澳地区生猪资格；此后成为内地供港活大猪前三大供应商之一和粤港澳大湾区“菜篮子”生产基地"
    来源: "https://finance.sina.cn/fund/jjgdxw/2021-06-24/detail-ikqcfnca3041841.d.html"
  - 年: "2013"
    事件: "8 月公司正式更名为“东瑞食品集团有限公司”"
    来源: "https://finance.sina.cn/fund/jjgdxw/2021-06-24/detail-ikqcfnca3041841.d.html"
  - 年: "2016"
    事件: "12 月 2 日由东瑞有限整体变更设立东瑞食品集团股份有限公司，注册资本 9,500.00 万元，股本 9,500.00 万股"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=001201&id=7038050"
  - 年: "2021"
    事件: "4 月 28 日在深圳证券交易所主板上市，经证监许可〔2021〕1009 号核准公开发行 3,167 万股人民币普通股，发行后股本 12,667 万元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=001201&id=7141979"

主营与结构:
  - 事件: "形成集饲料生产、生猪育种、种猪扩繁、商品猪饲养、活大猪供港、生猪内地销售、屠宰加工及冷链配送于一体的生猪全产业链"
    来源: "https://www.dongruifoods.com/"
  - 事件: "优质生猪产能已攀升至 200 万头，其中拥有供港澳活猪注册饲养场 7 个，这些饲养场严格按照港澳市场的标准和要求进行管理"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2025/2025-4/2025-04-26/11002345.PDF"
  - 事件: "2025 年生猪（养殖行业）收入 20.56 亿元，占营业收入 96.33%，同比增长 48.20%"
    来源: "https://stock.stockstar.com/RB2026090700018540.shtml"
  - 事件: "2024 年公司养殖行业销售量同比增加 40.02%、生产量同比增加 58.82%，系报告期内公司扩大生产规模、销量提升所致"
    来源: "https://static.cninfo.com.cn/finalpage/2025-04-26/1223312424.PDF"
  - 事件: "历史上内地供应香港、澳门活猪实行出口主动配额管理，公司官网称自身为内地供港澳活大猪优质领先供应商"
    来源: "https://finance.sina.cn/fund/jjgdxw/2021-06-24/detail-ikqcfnca3041841.d.html"

融资历史:
  - 时间: "2021-04"
    方式: "IPO（深圳证券交易所主板）"
    规模: "公开发行 3,167 万股、发行价 63.38 元/股，募集资金总额 20.07 亿元，扣除发行费用后净额 18.10 亿元"
    用途: "紫金东瑞农业发展有限公司富竹生态养殖项目、连平东瑞农牧发展有限公司传统养殖改高床养殖节能减排增效项目、和平东瑞农牧发展有限公司高床生态养殖项目等（招股说明书拟募集资金 18.10 亿元）"
    说明: "保荐机构（主承销商）为招商证券，保荐代表人罗虎、康自强"
    来源: "https://finance.sina.com.cn/jjxw/2026-09-24/doc-inisxnuv5181817.shtml"
  - 时间: "2021-05-21"
    方式: "募集资金置换自筹资金"
    规模: "以募集资金置换预先投入募投项目的自筹资金 43,962.75 万元"
    用途: "置换预先投入募投项目的自筹资金"
    说明: "截至 2021 年 12 月 31 日，公司募集资金累计投入募投项目 112,281.04 万元"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2022-04-28/4b56bb3a-bdfa-410c-a2f5-e5ee64f27631.PDF"
  - 时间: "2023-12-28"
    方式: "向特定对象发行股票（2023 年度定增）"
    规模: "发行 44,978,401 股，募集资金总额 92,475.59 万元（含发行费用 1,374.39 万元），净额 91,101.20 万元"
    用途: "东源东瑞农牧发展有限公司东源县船塘现代农业综合体项目（黄沙基地）及补充公司流动资金项目（原拟募集资金总额不超过 103,300.00 万元）"
    说明: "经证监许可〔2023〕1377 号核准；新增股份上市时间 2023 年 12 月 28 日"
    来源: "https://www.100est.com/res/financial-report/r2023/SZ001201_202404291631627113.pdf"

风险与困境:
  - 时间: "2024-12-06"
    事项: "公司披露《关于终止部分募集资金投资项目并将募集资金永久补充流动资金》——终止“惠州东瑞多层楼房生猪养殖项目”（调整前项目总投资 55,000.00 万元、其中使用募集资金 10,000.00 万元，原计划建成达产后形成 20 万头商品猪产能），终止后相关募集资金及利息、理财收益永久补充流动资金"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001201&id=11002357"
  - 时间: "2024-12-31"
    事项: "截至 2024 年 12 月 31 日，公司募集资金累计投入 174,492.41 万元，终止部分募集资金投资项目并将募集资金永久补充流动资金 10,334.10 万元，募集资金已全部使用完毕，募集资金投资项目均已结项、专户均已注销"
    来源: "https://static.cninfo.com.cn/finalpage/2025-04-26/1223312424.PDF"
  - 时间: "2026-07-15"
    事项: "2026 年半年度业绩预告预计净利润为负值：归属于上市公司股东的净利润亏损 38,000 万元–46,000 万元（上年同期盈利 332.08 万元），扣非后净利润亏损 38,000 万元–46,000 万元（上年同期盈利 261.14 万元）"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-07-15/549a2007-84ba-44ca-bee1-b849972571d2.PDF"
  - 时间: "2026-06-30"
    事项: "2026 年上半年营业收入 10.39 亿元，同比减少 5.09%；归属于上市公司股东的净利润 -4.25 亿元、扣非 -4.23 亿元；受生猪价格下行影响计提各类减值准备（其中生物资产减值约 1.18 亿元）"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?CompanyCode=80665406&gather=1&id=12573895"
  - 时间: "2026-09-24"
    事项: "媒体报道东瑞股份破发，公司上市以来在 A 股共募资 29 亿元"
    来源: "https://finance.sina.com.cn/jjxw/2026-09-24/doc-inisxnuv5181817.shtml"

战略与转型:
  - 时间: "2024-12-06"
    事项: "终止“惠州东瑞多层楼房生猪养殖项目”并将该项目募集资金及利息、理财收益永久补充流动资金，相关议案经第三届董事会第十三次会议、第三届监事会第十二次会议及 2024 年第二次临时股东大会审议通过"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001201&id=11002357"
  - 时间: "2026-06-30"
    事项: "受猪价下行影响业绩承压后，公司经营重心转向提质增效"
    来源: "https://stock.stockstar.com/RB2026090700018540.shtml"
  - 时间: "2026-06-30"
    事项: "公司坚持以生猪全产业链布局和供港澳活大猪业务为特色，2025 年生猪养殖行业收入占比达 96.33%"
    来源: "https://stock.stockstar.com/RB2026090700018540.shtml"

融资需求线索:
  - 时间: "2024-12-31"
    事项: "IPO 与 2023 年度定增的募集资金均已全部使用完毕、募投项目全部结项、专户全部注销；截至 2024 年末无存续的募集资金余额可用于后续投入"
    来源: "https://static.cninfo.com.cn/finalpage/2025-04-26/1223312424.PDF"

