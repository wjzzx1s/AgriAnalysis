代码: "000876"
名称: "新希望"
定位: "农牧全产业链龙头（饲料+生猪养殖与屠宰），2023 年底白羽肉禽与食品深加工引战出表以聚焦主业；2026 年上半年饲料创新高，猪价探底致亏损 17.02 亿元。"
沿革:
  - 年: "1998"
    事件: "经四川省政府批准，由原绵阳希望饲料有限公司整体变更设立四川新希望农业股份有限公司；公众股 3,600 万股与内部职工股 400 万股分别于 1998 年 3 月 11 日、9 月 15 日在深交所上市（000876）"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000876&id=11963982"
  - 年: "2011"
    事件: "实施资产出售、资产置换及发行股份购买资产：新增股份 905,298,070 股、发行价 8.00 元/股，2011 年 10 月 14 日完成登记，公司声明本次交易不构成借壳上市"
    来源: "http://static.cninfo.com.cn/finalpage/2011-01-10/58879252.PDF"
  - 年: "2013"
    事件: "整合新希望集团此前收购的山东六和集团，公司更名为新希望六和股份有限公司，主业整合为饲料、白羽肉禽养殖、生猪养殖、食品、海外五大板块"
    来源: "https://weekly.caixin.com/m/2024-01-12/102155738.html"
  - 年: "2023"
    事件: "12 月启动白羽肉禽与食品深加工两个板块引战转让，两块业务整体估值接近 80 亿元，交易金额分别约 27 亿元和 15.01 亿元，负债率预计下降 4—5 个百分点"
    来源: "https://www.guancha.cn/GongSi/2023_12_19_719639.shtml"
  - 年: "2026"
    事件: "8 月完成 26 亿元向特定对象发行，新增股份 4.59 亿股于 9 月 1 日在深交所上市，总股本由 45.03 亿股增至 49.62 亿股"
    来源: "https://finance.sina.com.cn/roll/2026-08-31/doc-iniqetnr7912650.shtml"
主营与结构:
  - 事件: "2025 年饲料销量 2,974.26 万吨、同比增长 14.58%，创历史新高"
    来源: "https://stock.stockstar.com/RB2026090600010432.shtml"
  - 事件: "2025 年共销售仔猪 375.52 万头、肥猪 1,379.02 万头，合计 1,754.55 万头，实现营业收入 209.92 亿元"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=830746720430&code=000876&dannoun=lcdetail&announ=lc"
  - 事件: "2026 年上半年饲料销量合计 1,625 万吨（外销 1,316 万吨：禽料 908 万吨、猪料 271 万吨、水产料 98 万吨、反刍料 32 万吨），销量与利润均创半年度历史新高；饲料收入同比 +16.80%、国外收入同比 +18.61%"
    来源: "https://stock.stockstar.com/RB2026090600010432.shtml"
  - 事件: "2026 年上半年营业收入 555.89 亿元、同比 +7.68%，归母净利润 -17.02 亿元（上年同期 +7.55 亿元）；期末资产负债率 70.70%、货币资金 79.63 亿元"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000876&id=12570769"
