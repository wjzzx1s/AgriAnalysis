代码: "601118"
名称: "海南橡胶"
定位: "全球最大的天然橡胶种植、加工与贸易企业之一，控股股东为海南省农垦投资控股集团（海南省国资委为实际控制人）；长期处于扣非亏损状态，盈利对胶价与汇率高度敏感，并以举债和海外并购支撑规模扩张。"
沿革:
  - 年: "2005"
    事件: "3 月 29 日，海南天然橡胶产业集团股份有限公司成立"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-12/2022-12-16/8732147.PDF"
  - 年: "2010"
    事件: "12 月 27 日，经证监许可[2010]1826 号文核准，向社会公众发行 786,000,000 股新股，每股发行价格 5.99 元，发行后总股本 3,931,171,600 股"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-12/2022-12-16/8732147.PDF"
  - 年: "2011"
    事件: "1 月 7 日，股票在上海证券交易所挂牌上市，股票简称“海南橡胶”，代码 601118；本次发行募集资金总额 4,708,140,000 元"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=601118&id=647408"
  - 年: "2018"
    事件: "2 月 12 日完成非公开发行股票新增股份登记托管，实际发行 348,256,197 股，发行价格 5.16 元/股，发行后总股本增至 427,942.78 万股"
    来源: "https://paper.cnstock.com/html/2026-08/28/content_2261513.htm"
主营与结构:
  - 事件: "2026 年半年报披露：公司在全球范围内经营管理土地 490 万亩，其中胶园土地 380 万亩，拥有境内外天然橡胶种植基地共 30 个"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-28/1225519329.PDF"
  - 事件: "2025 年公司天然橡胶加工产能约 235 万吨（含受托管理的 KM 公司），全球销售贸易量 337 万吨（含受托管理的 KM 公司和 ART 公司）"
    来源: "https://finance.sina.com.cn/stock/relnews/cn/2026-09-10/doc-inirinuw2924476.shtml"
  - 事件: "正分阶段推进 180 万亩省级标准化胶园建设；因生态环境整治，多数基地区域橡胶林被划为生态公益林，约占胶园总面积的 25%，更新受林业政策限制"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=601118&id=12558872"
  - 事件: "自产橡胶来自自有胶园采割原料，运送至自有加工厂加工销售；2023 年公司自产橡胶 13.95 万吨，销售量 13.88 万吨，销售金额 153,147.56 万元；下属加工厂（含受托管理 KM、ART）2023 年共加工生产橡胶产品约 140 万吨"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=601118&id=10344114"
