  - 时间: "2022-11"
    事项: "第六届董事会第十五次会议、2022 年第二次临时股东大会通过重大资产购买方案：通过境外全资子公司橡胶投资以现金 0.315 美元/股收购中化新所持 HAC 公司 574,204,299 股（约 36.00%），对价 180,874,354.19 美元；2023-02-03 完成协议转让交割，要约收购结束后合计持有 1,086,256,025 股（约 68.10%）"
