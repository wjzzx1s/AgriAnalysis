    用途: "偿还公司本部及下属企业有息负债"
    说明: "债券代码 102583120，发行日 2025-07-28，起息日 2025-07-29，每年付息、赎回日还本；东方金诚维持公司主体信用等级 AAA、该中票 AAAsti"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=835434330174&code=601118&dannoun=lcdetail&announ=lc"
  - 时间: "2026-04"
    方式: "2026 年度融资额度议案"
    规模: "公司及子公司拟通过金融机构借款、发行债券、银行票据等方式融资，融资余额较上年度净增加不超过 47 亿元"
    用途: "债务性和权益性融资"
    说明: "第六届董事会相关会议审议通过，2026 年 4 月 29 日披露"
    来源: "https://epaper.stcn.com/att/202604/29/ZQ29B932-TT_eBook.pdf"
  - 时间: "2026-06"
    方式: "银行授信（关联方）"
    规模: "海南农垦集团财务有限公司授予公司授信总额 60 亿元，本期实际发生额 4.37 亿元"
    用途: "关联方授信业务"
    说明: "截至 2026 年 3 月末，公司合并口径共获得金融机构授信总额合计 362.74 亿元"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-28/1225519329.PDF"
风险与困境:
  - 时间: "2023"
    事项: "2023 年度归母净利润 2.97 亿元，但扣非净利润 -9.63 亿元，长期处于扣非亏损状态；因年报信息披露问题收到上海证券交易所监管问询函"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=601118&id=10344114"
  - 时间: "2024"
    事项: "2024 年营业收入 496.73 亿元（+31.80%），归母净利润 1.03 亿元（-65.20%），扣非净利润 -5.81 亿元；子公司合盛农业 2024 年营业收入 268.99 亿元、净利润 -4.68 亿元，亏损主因贷款规模较高、外币借款利息与汇兑损失合计约 5.17 亿元"
    来源: "https://stockmc.xueqiu.com/202507/601118_20250801_AKW6.pdf"
  - 时间: "2024"
    事项: "收购合盛农业产生的商誉账面原值 17.24 亿元，至今未计提减值"
    来源: "https://stockmc.xueqiu.com/202507/601118_20250801_AKW6.pdf"
  - 时间: "2026-06-30"
    事项: "2026 年上半年营业收入 151.23 亿元（同比 -25.4%），归母净利润 -1.30 亿元（上年同期 -1.76 亿元），扣非净利润 -2.89 亿元（上年同期 -2.19 亿元，亏损扩大）；资产负债率约 70.69%"
    来源: "https://finance.sina.com.cn/stock/aiassist/agqsjs/2026-08-28/doc-inipuuqi9097239.shtml"
  - 时间: "2026-06-30"
    事项: "亏损主要受美元汇率下跌导致汇兑损失增加、金融工具平仓损失、合同纠纷判决款等偶发性支出及递延所得税费用增加影响"
    来源: "https://finance.sina.com.cn/jjxw/2026-08-27/doc-inipucst5815871.shtml"
