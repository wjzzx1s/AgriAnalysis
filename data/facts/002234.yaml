代码: "002234"
名称: "民和股份"
定位: "山东蓬莱的白羽肉鸡一体化企业，以父母代肉种鸡饲养和商品代鸡苗销售为核心，兼营鸡肉制品与有机废弃物资源化利用；白羽鸡行业已连续亏损多年，公司2025年、2026年上半年持续亏损，母公司存在累计未弥补亏损。"
沿革:
  - 年: "1997"
    事件: "公司前身由农业部山东蓬莱良种肉鸡示范场股份制改制后设立（设立时名称为蓬莱民和牧业有限责任公司）"
    来源: "https://baike.baidu.com/item/%E6%B0%91%E5%92%8C%E8%82%A1%E4%BB%BD/12650038"
  - 年: "2000"
    事件: "2000年12月1日整体变更为山东民和牧业股份有限公司，变更后股本总额4,025万元"
    来源: "https://baike.baidu.com/item/%E6%B0%91%E5%92%8C%E8%82%A1%E4%BB%BD/12650038"
  - 年: "2006"
    事件: "2006年12月25日经第三次临时股东大会决议，以2005年末未分配利润向全体股东每10股送10股，总股本由4,025万股增至8,050万股"
    来源: "https://baike.baidu.com/item/%E6%B0%91%E5%92%8C%E8%82%A1%E4%BB%BD/12650038"
  - 年: "2008"
    事件: "经证监发行字〔2008〕547号核准首次公开发行2,700万股，发行价10.61元/股，2008年5月16日在深圳证券交易所上市（中小板），简称“民和股份”"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002234&id=326440"
  - 年: "2011"
    事件: "完成一次非公开发行，新增股份43,523,316股于2011年11月15日在深交所上市"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002234&id=804558"
  - 年: "2014"
    事件: "因2012年、2013年连续两个会计年度亏损，公司股票自2014年4月22日起被实施退市风险警示，简称由“民和股份”变更为“*ST民和”"
    来源: "https://companies.caixin.com/2014-04-20/100667679.html"
  - 年: "2021"
    事件: "完成2020年非公开发行，新增46,913,580股于2021年4月23日在深交所上市，股本总额增至348,960,212股"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002234&id=7088748"
股权与控制权:
  - 事项: 控股股东、实际控制人为孙宪法、孙希民、孙宪秋；孙宪法持股63,356,348股、占总股本18.16%，其中限售15,839,087股、无质押；孙希民持股13.51%（47,155,000股），孙宪秋持股5.73%（20,004,400股）。
    来源: http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002234&id=12515522
  - 事项: 孙希民与孙宪法为父子关系、与孙宪秋为父女关系，孙宪秋与孙宪法为姐弟关系，三人系一致行动人，共同为公司控股股东及实际控制人。
    来源: http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002234&id=12515522
主营与结构:
  - 事件: "主营业务包括父母代肉种鸡饲养、商品代肉雏鸡生产与销售，商品代肉鸡饲养与屠宰加工，鸡肉制品生产与销售，以及有机废弃物资源化开发利用"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002234&id=12029432"
  - 事件: "主要产品为商品代肉鸡苗，除自用外主要销售给大型养殖公司、大中型养殖户和经销商；下属公司生产肉鸡分割产品、熟食和调理品"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002234&id=12029432"
  - 事件: "2025年公司销售商品代鸡苗3.15亿羽、鸡肉制品销量10.16万吨，商品代鸡苗与鸡肉制品销量均实现增长"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202603271820805351_1.pdf"
  - 事件: "2025年营业收入216,150.07万元，其中雏鸡收入88,011.30万元"
    来源: "http://notice.10jqka.com.cn/api/pdf/c8ea38edcbb3a756_1774608714/%E6%B0%91%E5%92%8C%E8%82%A1%E4%BB%BD%EF%BC%9A2025%E5%B9%B4%E5%B9%B4%E5%BA%A6%E6%8A%A5%E5%91%8A.pdf"
  - 事件: "注册地山东省烟台市蓬莱区南关路2号附3号，注册资本34,896万元"
    来源: "https://q.stock.sohu.com/cn/002234/index.shtml"
竞争优势:
  - 事项: 形成父母代种鸡养殖、商品鸡养殖、屠宰加工、熟食调理品等较为完整的产业链，商品代鸡苗为核心产品、毛利最高且价格弹性最大、销售价格波动较大。
    来源: http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002234&id=12515522
  - 事项: 通过加大熟食产业投资延长产业链、提高鸡肉产品附加值，鸡肉熟食调理品等深加工环节利润较为稳定，可为公司提供相对稳定的收益来源。
    来源: http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002234&id=12515522
行业基本面:
  - 事项: 2026年7—8月白羽鸡苗价格快速上涨，7月10日白羽鸡苗报价约2元/只，8月2日报价快速上涨至4.3元/只，半月内几近翻倍。
    来源: http://www.chinafeedm.com/h-nd-22059.html
  - 事项: 2026年上半年全国白羽鸡苗均价2.70元/羽、同比涨幅12.50%，全国鸡苗成交均价波动区间为1.54—3.29元/羽。
    来源: https://www.163.com/dy/article/L0F089ER0514AHGG.html
  - 事项: 2026年1—5月父母代鸡苗市场成交均价40.63元/套、同比上涨21.03%，益生股份6月父母代鸡苗报价已上调至55元/套。
    来源: https://news.qq.com/rain/a/20260702A0248D00
经营要点:
  - 事项: 2026年上半年营业收入10.27亿元、同比增长4.17%；归母净利润-9,524.12万元、同比增加55.60%；销售商品代鸡苗1.53亿羽、鸡肉制品4.27万吨。
    来源: http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002234&id=12515522
  - 事项: 目前公司商品代雏鸡产量约3.5亿羽，采用多层笼养、“三阶段全进全出”、鸡精液稀释等规模化饲养技术，可适当增加新的产能带动业绩增长。
    来源: http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002234&id=12515522
融资历史:
  - 时间: "2008-05"
    方式: "IPO（深交所中小板）"
    规模: "发行2,700万股（网下配售540万股、网上定价发行2,160万股），发行价10.61元/股，扣除发行费用后实际募集资金净额268,692,500.00元"
    用途: "募投项目建设（含粪污处理大型沼气工程及资源化利用项目）"
    说明: "网上定价发行的2,160万股于2008年5月16日上市交易，发行后总股本10,750万股"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002234&id=326440"
  - 时间: "2011-11"
    方式: "非公开发行（A股）"
    规模: "发行43,523,316股，发行价19.30元/股，募集资金总额839,999,998.80元，募集资金净额812,299,998.80元"
    用途: "募投项目建设"
    说明: "10名发行对象认购股份限售期12个月，新增股份2011年11月15日上市"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002234&id=804558"
  - 时间: "2021-04"
    方式: "非公开发行（证监许可〔2020〕3346号）"
    规模: "发行46,913,580股，发行价12.15元/股，募集资金总额569,999,997.00元，募集资金净额560,469,997.04元"
    用途: "募投项目建设"
    说明: "23名发行对象以现金认购，新增股份2021年4月23日上市；资金于2021年4月2日汇入专户，2024年度使用募集资金2,757.06万元投入项目"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002234&id=7088748"
风险与困境:
  - 时间: "2013"
    事项: "2013年全年实现营业收入996,313,767.09元、较上年下降16.36%，当年继续亏损（公司披露主要因鸡苗价格长期低迷），并提示股票将被实施退市风险警示"
    来源: "http://static.cninfo.com.cn/finalpage/2014-04-19/63870251.PDF"
  - 时间: "2014-04-22"
    事项: "股票交易实行退市风险警示特别处理，股票简称由“民和股份”变更为“*ST民和”，日涨跌幅限制为5%"
    来源: "https://companies.caixin.com/2014-04-20/100667679.html"
  - 时间: "2015-07"
    事项: "2015年半年度业绩预告修正为亏损近1.4亿元，原因为商品代鸡苗价格长久低迷、营业外收入减少及子公司沼气提纯压缩项目开始计提折旧等，公司股票于2015年7月15日复牌"
    来源: "https://stock.stockstar.com/SS2015071500000270.shtml"
  - 时间: "2025-07"
    事项: "业绩预告预计2025年1-6月归母净利润亏损20,000万元至23,000万元，原因为白羽肉鸡市场整体疲软、鸡苗和鸡肉产品销售价格较低，并对父母代种鸡、种蛋等相关资产计提减值"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vFD_AchievementNotice/stockid/002234.phtml"
  - 时间: "2025"
    事项: "2025年实现营业收入2,161,500,683.95元（同比+0.09%），归属于上市公司股东的净利润-268,510,783.44元（同比下降7.78%）"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202603271820805351_1.pdf"
  - 时间: "2025-12-31"
    事项: "母公司财务报表存在累计未弥补亏损239,331,714.91元，公司不满足实施现金分红的前提条件"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002234&id=12029452"
  - 时间: "2026-08-21"
    事项: "2026年上半年营业收入10.27亿元（同比+4.2%），归母净利润-9,524万元，扣非净利润-9,992万元，亏损同比收窄；其中第二季度归母净利润-2,774万元"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-08-21/doc-inipakut1652161.shtml"
战略与转型:
  - 时间: "2025"
    事项: "公司已形成以父母代肉种鸡饲养、商品代肉雏鸡生产销售，肉鸡饲养、屠宰加工，鸡肉熟食和调理品生产销售为核心，有机废弃物资源化开发利用为辅助的经营模式"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002234&id=12029432"
  - 时间: "2015"
    事项: "子公司沼气提纯压缩项目完工转固并开始计提折旧，同时投入水溶肥业务广告、人力与研发费用（公司将其列为当期亏损原因之一）"
    来源: "https://stock.stockstar.com/SS2015071500000270.shtml"
融资需求线索: []
