    来源: "https://finance.sina.com.cn/stock/relnews/cn/2025-04-09/doc-inespptv6311166.shtml"
  - 时间: "2026-06-30"
    事项: "上海宣晟种业相关业绩承诺：云南宣晟种业业绩承诺期为 2023—2025 年，2026 年及 2027 年扣非净利润不低于上一年度且不低于 3,602.45 万元"
