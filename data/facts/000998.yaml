代码: "000998"
名称: "隆平高科"
定位: "由袁隆平院士发起设立、中信集团为实际控制人的综合性跨国种业集团，全球种业企业前八强，杂交水稻种子国内领先；因国内玉米种业高库存与巴西业务大幅承压，2026 年上半年亏损扩大，商誉规模较大。"
沿革:
  - 年: "1999"
    事件: "由袁隆平院士作为主要发起人设立，是国内规模领先的“育繁推一体化”种业企业"
    来源: "https://finance.sina.com.cn/jjxw/2024-08-11/doc-incifkuq3964266.shtml"
  - 年: "2000"
    事件: "在深圳证券交易所上市"
    来源: "https://finance.sina.com.cn/jjxw/2024-08-11/doc-incifkuq3964266.shtml"
  - 年: "2004"
    事件: "湖南省农业科学院将持有的公司 25.24% 股份转让给新大新集团，转让完成后新大新成为公司第一大股东"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP201809161196406562_1.pdf"
  - 年: "2016"
    事件: "1 月公司通过非公开发行股份，中信兴业投资、中信建设和信农投资合计持有公司股份 18.72%，中信集团成为公司实际控制人，最终控制人为中国财政部"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP201809161196406562_1.pdf"
  - 年: "2018"
    事件: "12 月 21 日，以非公开发行股份方式购买王义波、彭泽斌等 45 名交易对方持有的联创种业 90% 股份之新增股份 60,775,624 股在深交所上市，公司总股本 1,316,970,298 股；中信农业、中信兴业、中信建设和信农投资合计持股比例 20.56%"
    来源: "https://cn.agropages.com/News/printnew-32239.htm"
主营与结构:
  - 事件: "综合覆盖水稻、玉米、蔬菜瓜果、小麦、食葵、杂谷等种子；2020 年水稻加玉米营收占比合计 72%"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202201191541363915_1.pdf"
  - 事件: "2026 年上半年水稻种子营业收入 7.15 亿元（-8.22%），玉米种子 5.18 亿元（-42.95%，其中国内玉米主营业务收入 0.34 亿元、同比 -72.67%），专精特新种子 2.97 亿元（-1.17%）"
    来源: "https://stock.stockstar.com/JC2026082700020218.shtml"
  - 事件: "杂交水稻种子业务全球领先，国内市场占有率近 20%，在菲律宾、巴基斯坦市场份额领先；国内杂交玉米种子推广面积 6,000 万亩、市场份额约 10%；巴西玉米种子业务市场份额 20% 以上"
    来源: "https://finance.sina.com.cn/jjxw/2024-08-11/doc-incifkuq3964266.shtml"
  - 事件: "隆平发展以隆平巴西为经营主体，主要在巴西从事玉米种子的研发、生产及销售；2026 年上半年巴西玉米种子业务实现营业收入 4.83 亿元，同比减少 38.21%"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-21/1225486132.PDF"
  - 事件: "公司主营业务分为水稻种子、玉米种子、专精特新种子（谷子、辣椒、食葵、棉花等）等板块；2026 年上半年专精特新业务中谷子受益杂粮扶持政策营收高增，棉花种子受新疆种植面积缩减拖累收入下滑"
    来源: "https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/840651185868/index.phtml"
融资历史:
  - 时间: "2016-01"
    方式: "定向增发（非公开发行）"
    规模: "向中信兴业、中信建设、信农投资、现代种业基金和汇添富－优势企业定增计划 5 号资产管理计划合计非公开发行 260,094,674 股"
    用途: "未查得"
    说明: "发行完成后中信系合计持股 18.72%，中信集团成为实际控制人"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000998&id=8077566"
  - 时间: "2018-03"
    方式: "发行股份购买资产"
    规模: "向王义波、彭泽斌等 45 名自然人发行股份购买联创种业 90% 股权，发行价格 22.92 元/股，交易总金额 138,690.00 万元，新增股份 60,775,624 股"
    用途: "注入优质玉米种子资产"
    说明: "2018 年 8 月通过证监会审批，新增股份 2018-12-21 在深交所上市"
    来源: "https://cn.agropages.com/News/printnew-32239.htm"
  - 时间: "2023-08"
    方式: "股权受让（现金收购）"
    规模: "斥资 8 亿元受让隆平农业发展股份有限公司 7.14% 股份，持股比例升至 49.42%，隆平发展并表"
    用途: "获取巴西玉米种子业务，扩大营收规模"
    说明: "隆平发展 2023 年实现营收 92.23 亿元，同比增长 22.45%"
    来源: "https://finance.sina.com.cn/jjxw/2024-08-11/doc-incifkuq3964266.shtml"
  - 时间: "2025-05"
    方式: "定向增发（向特定对象发行）"
    规模: "发行价格 7.87 元/股，数量不超过 1.52 亿股；实际募集资金人民币 1,035,048,646.91 元，公司股本总额由 1,316,970,298 股变更为 1,469,448,061 股"
    用途: "扣除发行费用后全部用于偿还银行贷款及补充流动资金"
    说明: "发行对象为公司控股股东中信农业科技股份有限公司，认购资金不超过 120,000 万元；中信集团通过中信兴业、北京中信信远向中信农业增资 36 亿元，其中 12 亿元在取得发行批准文件后实缴到位；2025-04-08 获中国证监会同意注册批复；发行后中信集团合计持股比例由 17.36% 提升至不超过 25.93%，控制权未发生变化，认购股份锁定期 18 个月"
    来源: "https://finance.sina.com.cn/stock/relnews/cn/2025-04-09/doc-inespptv6311166.shtml"
风险与困境:
  - 时间: "2019、2022"
    事项: "2019 年和 2022 年归属净利润分别录得亏损，合计亏损 11.3 亿元"
    来源: "https://finance.sina.com.cn/jjxw/2024-08-11/doc-incifkuq3964266.shtml"
  - 时间: "2022"
    事项: "本期计提商誉、存货等减值损失合计 46,082.25 万元，导致亏损增加：计提商誉减值损失 12,392.06 万元（天津绿丰园艺 959.13 万元、湖南隆平高科农业开发 1,508.05 万元、三瑞农科 9,924.88 万元），计提存货跌价损失 20,564.34 万元，应收款项坏账损失 12,383.89 万元"
    来源: "http://static.cninfo.com.cn/finalpage/2024-12-04/1221919314.PDF"
  - 时间: "2024-03-31"
    事项: "总负债 168.9 亿元，资产负债率 62.80%，高于行业平均值 34.19%；短期债务及一年内到期的非流动债务合计 65.2 亿元，账面货币资金仅 30.87 亿元"
    来源: "https://finance.sina.com.cn/jjxw/2024-08-11/doc-incifkuq3964266.shtml"
  - 时间: "2024-09-30"
    事项: "公司商誉账面价值 42.07 亿元，主要构成为收购并表隆平发展等企业形成；如标的经营状况远未达预期则存在商誉减值风险"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2025/2025-2/2025-02-18/10748241.PDF"
  - 时间: "2023-03-31"
    事项: "隆平发展商誉账面价值 263,852.84 万元（2021 年末 222,871.49 万元、2022 年末 260,380.84 万元），占非流动资产比例 35.65%，主要系收购隆平巴西形成；截至 2023-03-31 经测试未计提减值"
    来源: "http://static.cninfo.com.cn/finalpage/2023-08-25/1217638355.PDF"
  - 时间: "2026-06-30"
    事项: "2026 年上半年营业收入 17.10 亿元（-21.05%），归属于上市公司股东的净利润 -2.73 亿元（同比 -66.41%），扣非净利润 -2.96 亿元（同比 -88.35%），基本每股收益 -0.1856 元，加权平均净资产收益率 -4.09%"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-21/1225486132.PDF"
  - 时间: "2026-06-30"
    事项: "隆平发展上半年实现营业收入 5.58 亿元、净利润 -3.20 亿元，亏损同比扩大，主因巴西极端天气扰动播种窗口、农资成本抬升、农户购种意愿减弱；公司财务费用 1.71 亿元，同比大幅增长，主要来自外汇套期保值操作成本"
    来源: "https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/840651185868/index.phtml"
战略与转型:
  - 时间: "2017"
    事项: "先后收购湖北惠民科技、湖南金稻米业、三瑞农科、河北巡天农业以及巴西陶氏益农特定玉米种子业务，实现种业资源国内外联通"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202201191541363915_1.pdf"
  - 时间: "2019"
    事项: "成立隆平生物，开启农作物抗虫、抗除草剂转基因性状研发"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202201191541363915_1.pdf"
  - 时间: "2022"
    事项: "隆平高科及旗下主要产业子公司分别入选国家种业阵型企业名单"
    来源: "https://finance.sina.com.cn/jjxw/2024-08-11/doc-incifkuq3964266.shtml"
  - 时间: "2024-08"
    事项: "公司在机构调研中表示正积极应对转基因玉米市场日益增长的机遇，深耕基础品种研发，确保转基因产品质量与性状表现，实现全流程严格管理和可追溯"
    来源: "https://finance.sina.com.cn/jjxw/2024-08-11/doc-incifkuq3964266.shtml"
  - 时间: "2025-03"
    事项: "近年资源整合提速，一方面大力处置和剥离非核心资产（含与主业无关的类金融业务），一方面推进外延式并购"
    来源: "https://finance.sina.com.cn/stock/relnews/cn/2025-03-23/doc-ineqryaf7301170.shtml"
  - 时间: "2026-06-30"
    事项: "持续推进巴西玉米种子业务的组织与治理架构优化，加强本土化经营管理团队，推进制种与加工技术升级与采购协同优化，落实制种生产端降本增效"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-21/1225486132.PDF"
