    来源: "http://xinpi.zqrb.cn/pdf/SZ/002086/2023/1217/7d0f7cd5b53d7627a36408838e476595.pdf"
  - 时间: "2023-12"
    方式: "债务豁免与债务重组"
    规模: "债权人直接豁免东方海洋清偿义务256,217,732.62元；豁免金额相应抵偿原控股股东对上市公司同等金额的非经营性资金占用776,907,937.55元，剩余缺口由重整投资人以现金支付至管理人账户"
    用途: "解决原控股股东非经营性资金占用及违规担保"
    说明: "部分债权人与原控股股东等签订《债务重组与化解协议》；原控股股东非经营性占用资金已全部清偿完毕（最终以审计机构专项审核报告为准）"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2024-04-18/93d18291-e227-425c-b7d2-0d94c1512dd3.PDF"
