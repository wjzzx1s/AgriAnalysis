  - 时间: "2023-12"
    方式: "破产重整投资款（资本公积金转增股票引入重整投资人）"
    规模: "截至2023年12月29日重整投资人向管理人指定银行账户共计支付13.54亿元投资款"
    用途: "偿付债务、支付重整费用、补充公司流动资金、部分解决非经营性资金占用及违规担保问题"
    说明: "以现有总股本756,350,000股为基数，按每10股转增约15.9股实施资本公积金转增，共计转增1,202,596,500股，登记至破产企业财产处置专用账户后按重整计划分配"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002086&id=10175470"
  - 时间: "2023-12-17"
    方式: "重整投资协议"
    规模: "五矿金通股权投资基金管理有限公司牵头设立专项私募投资基金，联合其他投资人共同以重整投资人身份参与重整投资；联合体包含烟台东晨投资、中国长城资产管理股份有限公司山东省分公司、深圳市招平京资二号投资合伙企业（招商平安）、青岛兴锐投资合伙企业、嘉兴鑫扬、绿叶投资集团等"
    用途: "认购公司资本公积转增股本，帮助公司化解债务风险"
