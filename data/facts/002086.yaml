代码: "002086"
名称: "东方海洋"
定位: "山东烟台的海水苗种繁育与养殖、水产品加工企业，2006年深交所上市；2022—2023年因债务危机、资金占用与违规担保进入破产重整，2023年底重整计划执行完毕、2024年6月摘帽，现推进“海洋产业＋大健康（体外诊断）”双主业，但仍持续亏损。"
沿革:
  - 年: "2001"
    事件: "经山东省经济体制改革办公室鲁体改函字[2001]49号同意、山东省人民政府鲁政股字[2001]61号批准，由烟台东方海洋开发有限公司（现更名山东东方海洋集团有限公司）作为主要发起人，联合北京恒百锐商贸有限公司等发起设立山东东方海洋科技股份有限公司"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002086&id=9185205"
  - 年: "2006"
    事件: "经证监发行字[2006]109号文核准，公开发行人民币普通股3,450万股（网下配售690万股、网上定价发行2,760万股），发行价7.49元/股，2006年11月28日在深圳证券交易所上市，证券代码002086"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002086&id=183237"
  - 年: "2022"
    事件: "2022年8月8日债权人烟台市春达工贸有限公司以不能清偿到期债务且明显缺乏清偿能力为由向烟台市中级人民法院提出预重整申请，案件移交烟台市莱山区人民法院；2022年9月2日莱山区法院作出（2022）鲁0613破申（预）1号《决定书》，决定公司进入预重整，指定破产重整工作组为临时管理人"
    来源: "http://xinpi.zqrb.cn/pdf/SZ/002086/2023/1217/7d0f7cd5b53d7627a36408838e476595.pdf"
  - 年: "2023"
    事件: "2023年11月25日烟台市中级人民法院裁定受理北京汉业科技有限公司对公司的破产重整申请并指定莱山区法院管辖；2023年12月18日莱山区法院裁定批准《重整计划》并终止重整程序"
    来源: "http://notice.10jqka.com.cn/api/pdf/c347f66ab65caabf.pdf"
  - 年: "2023"
    事件: "2023年12月29日莱山区法院作出（2023）鲁0613破2号之二《民事裁定书》，裁定确认《重整计划》执行完毕、终结重整程序"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-2/2024-02-08/9832614.PDF"
  - 年: "2024"
    事件: "2024年4月30日向深交所提交撤销退市风险警示及其他风险警示的申请；2024年6月11日停牌一天、2024年6月12日复牌并撤销退市风险警示及其他风险警示，简称由“*ST东洋”变更为“东方海洋”，日涨跌幅限制由5%变更为10%"
    来源: "http://notice.10jqka.com.cn/api/pdf/c347f66ab65caabf.pdf"
主营与结构:
  - 事件: "主营业务包括海水苗种繁育、养殖，水产品加工，生物科技，保税仓储物流，以及体外诊断试剂的研发、生产与销售和检测服务等"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002086&id=12262732"
  - 事件: "2025年继续推进海洋产业和大健康产业共同发展，实现“双轮驱动”；2025年水产品加工业务收入2.54亿元、同比增长59.05%，占总营收比重由2024年47.02%升至71.45%，成为第一大业务板块"
    来源: "http://finance.sina.com.cn/stock/aigc/stockfs/2026-04-29/doc-inhwckrq6802415.shtml"
  - 事件: "2025年海水养殖收入5,015.29万元、同比下降32.63%；体外诊断收入2,727.60万元、同比下降66.42%，占比由23.88%降至7.66%"
    来源: "http://finance.sina.com.cn/stock/aigc/stockfs/2026-04-29/doc-inhwckrq6802415.shtml"
  - 事件: "2025年半年报分部口径：海洋事业部营业收入14,003.98万元、大健康事业部营业收入2,148.78万元（分部间抵销548.60万元）"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002086&id=11404030"
  - 事件: "海洋主业拥有4.85万亩国家一类水质养殖海域，海参、海带保种育种技术位居国内领先水平，具备年5.8万吨水产品加工、8万吨冷藏仓储产能"
    来源: "https://www.stcn.com/article/detail/3869909.html"
  - 事件: "大健康板块已布局免疫技术平台、质谱技术平台、分子技术平台及第三方医学检验实验室等四大平台；艾维可生物科技有限公司多项体外诊断产品已获注册证，产品涵盖幽门螺杆菌抗原检测试剂盒等"
    来源: "https://static.cninfo.com.cn/finalpage/2026-08-26/1225503666.PDF"
融资历史:
  - 时间: "2006-11-28"
    方式: "IPO（深交所中小板）"
    规模: "发行3,450万股，发行价7.49元/股，实际募集资金合计25,840.50万元，发行费用1,408.37万元，募集资金净额24,432.13万元"
    用途: "全部用于水产品加工贸易基地建设项目"
    说明: "发行市盈率（按发行后总股本）23.77倍；首发前总股本5,180万股，发行后总股本8,630万股；主承销商东海证券"
