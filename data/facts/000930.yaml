代码: "000930"
名称: "中粮科技"
定位: "原名安徽丰原生物化学，现为中粮集团旗下玉米深加工与生物能源平台，主营燃料乙醇、淀粉及淀粉糖、味精等产品，国内燃料乙醇市场份额居前；2025 年盈利微薄，2026 年上半年因产品价格下行转为亏损。"
沿革:
  - 年: "1998"
    事件: "经安徽省人民政府皖政秘〔1998〕268 号文件批准，由安徽丰原集团有限公司（原蚌埠柠檬酸厂）作为主要发起人，与蚌埠市建设投资公司、蚌埠热电厂、安徽省固镇化工总厂、蚌埠市供水总公司共同发起设立，1998 年 8 月 28 日在安徽省工商行政管理局领取企业法人营业执照"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000930&id=12175082"
  - 年: "1999"
    事件: "经中国证监会证监发行字〔1999〕67 号文件批准，1999 年 7 月 12 日股票在深圳证券交易所上市，证券代码 000930，发行价 6.50 元/股，发行方式为网上定价发行，实际发行量 6,000 万股，实际募集资金合计 39,000 万元、募集资金净额 37,560 万元，招股公告日 1999-06-15；更名历史为“丰原生化、G 丰原、丰原生化、中粮生化、中粮科技”"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/000930.phtml"
  - 年: "2003"
    事件: "经中国证监会证监公司字〔2003〕36 号文件批准，2003 年 4 月 24 日向社会公众发行 5 亿元可转换公司债券（“丰原转债”），2003 年 5 月 20 日在深圳证券交易所挂牌交易"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=000930&id=14613"
  - 年: "2005"
    事件: "经 2005 年第二次临时股东大会决议，以股权登记日（2005-12-06）总股本 48,193.11 万股为基数每 10 股转增 10 股，共转增 48,193.11 万股，股本增至 96,441.11 万元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000930&id=12175082"
  - 年: "2018"
    事件: "以发行股份方式向 COFCO Bio-chemical Investment Co., Ltd.（生化投资）收购桦力投资、COFCO Biochemical Holdings Limited（生物化学）、COFCO Biofuel Holdings Limited（生化能源）100% 股权；2018 年 11 月 8 日标的资产过户完成，2018 年 12 月 19 日新增股份 883,223,262 股在深交所上市，重组完成后生化投资持有公司总股本 47.80%，实际控制人仍为中粮集团"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000930&id=8450555"
  - 年: "2018"
    事件: "重组标的资产以 2017 年 10 月 31 日为评估基准日，评估值合计 828,472.80 万元，其中生化能源 100% 股权 336,104.90 万元、生物化学 100% 股权 454,751.16 万元、桦力投资 100% 股权 37,616.74 万元"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000930&id=4819768"
主营与结构:
  - 事件: "主要产品为生物燃料乙醇，主要应用于车用乙醇汽油制备，公司保持燃料乙醇行业领先地位；酒精业务全线具备多元谷物加工能力，可使用玉米、不宜食用的水稻和小麦、木薯等单一或多种原料混投生产"
    来源: "https://stock.stockstar.com/notice/SN2026042400019909.shtml"
  - 事件: "2018 年重组后深加工产能大幅提升：燃料乙醇产能达 135 万吨（原产能 75 万吨 + 生化能源 60 万吨）、淀粉产能 165 万吨、淀粉糖产能 90 万吨"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202111261531119434_1.pdf"
  - 事件: "2025 年营业收入合计 175.12 亿元；分产品“燃料乙醇类及其副产品”营业收入 77.78 亿元，占营业收入 44.42%，同比减少 20.8%"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-24/12175082.PDF"
  - 事件: "2025 年公司通过优化产品结构、扩大淀粉等产品销量，全年总销量同比增加 5.81 万吨，但产品价格下行压力大于销量增长贡献，营业收入同比下滑"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000930&id=12175082"
  - 事件: "2026 年上半年营业收入 81.94 亿元，同比下降 7.01%；归母净利润 -1.69 亿元，同比下降 257.85%；扣非归母净利润 -1.51 亿元；经营活动产生的现金流量净额 -8.75 亿元（上年同期 7.92 亿元）"
    来源: "https://finance.sina.com.cn/stock/relnews/cn/2026-08-28/doc-inipwhrt5706332.shtml"
