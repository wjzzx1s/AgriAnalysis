    事项: "2023 年归属于上市公司股东的净利润 -601,629,843.35 元，扣非净利润 -652,816,861.79 元，为近年最大年度亏损"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225174161.PDF"
  - 时间: "2025"
    事项: "2025 年营业收入 175.12 亿元，同比下降 12.67%；归母净利润仅 3,836.76 万元（同比增长 52.68%），扣非归母净利润 -11,787.25 万元，主业仍处亏损"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-24/1225174161.PDF"
  - 时间: "2026-06"
    事项: "2026 年上半年归母净利润 -1.69 亿元，同比由盈转亏（下降 257.85%）；扣非净利润 -1.51 亿元，同比下降 571.85%；经营现金流由上年同期净流入 7.92 亿元转为净流出 8.75 亿元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000930&id=12560825"
  - 时间: "2025"
    事项: "2025 年上半年受原料价格同比下降及下游需求恢复不足影响，燃料乙醇、淀粉糖、味精等产品价格下降，销售收入有所下降（当期归母净利润 1.07 亿元，同比增长 74.4%）"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2025/08/27/1224586667.PDF"
战略与转型:
  - 时间: "2018"
    事项: "中粮集团将境内玉米深加工与燃料乙醇资产整体注入上市公司，形成生物能源、淀粉、淀粉糖、饲料原料等多元产品结构"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202111261531119434_1.pdf"
  - 时间: "2025"
    事项: "贯彻“以客户为中心”理念，柔性生产无水乙醇、食用酒精、药用乙醇等产品；酒精业务可使用玉米、不宜食用的水稻和小麦、木薯等单一或多种原料混投，实现原料成本最优；推动传统产业数智化转型"
    来源: "https://stock.stockstar.com/notice/SN2026042400019909.shtml"
  - 时间: "2025"
    事项: "广西公司热电系统改造升级项目推进并网（2025 年年报披露）"
    来源: "https://stock.stockstar.com/notice/SN2026042400019909.shtml"
