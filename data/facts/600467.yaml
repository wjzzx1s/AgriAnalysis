    说明: "议案经第十一届董事会第十六次会议审议通过并提交 2025 年度股东会审议；境外债券拟委任天风国际证券与期货有限公司担任主承销商、全球协调人、簿记管理人和牵头安排行，并拟经国家发改委审批注册"
