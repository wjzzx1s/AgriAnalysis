代码: "600467"
名称: "好当家"
定位: "山东荣成的海参养殖与海洋食品加工企业，2004 年 4 月在上交所上市，拥有全国最大海参育苗与养殖基地之一；2025 年受海参价格与需求影响营业收入 10.51 亿元、同比下降 25.76%，归母净利润 2,987.23 万元、同比下降 31.21%，2026 年上半年营收 8.03 亿元、归母净利润 2,997.88 万元，同时推进不超过 1 亿美元的境外债券发行与不超过 35 亿元的年度融资计划。"

沿革:
  - 年: "2004"
    事件: "经中国证监会证监发行字[2004]26 号文批准，公司于 2004 年 3 月向社会公开发行人民币普通股 6,000 万股，发行价 7.00 元/股，2004 年 4 月 5 日在上海证券交易所上市，发行后注册资本变更为 18,000 万元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600467&id=4347471"
  - 年: "2011"
    事件: "11 月 23 日经证监许可[2011]1722 号文核准，公司向特定对象非公开发行人民币普通股 96,897,152 股（A 股），增加注册资本 96,897,152.00 元，募集资金总额 109,172.50 万元"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2013/2013-9/2013-09-03/1209238.PDF"
  - 年: "2015"
    事件: "公司以资本公积向全体股东每 10 股转增 10 股，共计转增股本 730,497,152 元，注册资本增至人民币 1,460,994,304.00 元"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202208261577688057_1.pdf?1661529655000.pdf"
  - 年: "2026"
    事件: "4 月 22 日第十一届董事会第十六次会议审议通过《关于公司 2026-2027 年度（至 2026 年度股东会召开日）授信额度、授信担保条件和贷款授权的议案》和《关于审议公司拟发行境外债券的议案》"
    来源: "https://stockmc.xueqiu.com/202604/600467_20260424_7BYZ.pdf"

主营与结构:
  - 事件: "主营业务为海水养殖（海参育苗、养殖、捕捞与加工）、冷冻调理食品及海洋食品销售，注册与办公地址均为山东省威海荣成市虎山镇沙咀子"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600467&id=4433239"
  - 事件: "2024 年实现营业收入 141,606.01 万元、同比下降 9.45%，归属于母公司所有者的净利润 4,342.76 万元、同比下降 12.17%；截至 2024 年底共有 130 多万平方水体现代海参育苗车间投产使用"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600467&id=10944628"
  - 事件: "2025 年实现营业收入 105,130.27 万元、同比下降 25.76%，归属于母公司所有者的净利润 2,987.23 万元、同比下降 31.21%，扣除非经常性损益的净利润同比降低 116.08%；2025 年度鲜海参累计捕捞 7,448.36 吨、比去年同期增长 21.90%"
    来源: "https://stockmc.xueqiu.com/202604/600467_20260424_XT6F.pdf"
  - 事件: "2026 年上半年实现营业收入 803,063,529.11 元、同比增长 12.99%，利润总额 30,678,047.95 元、同比增长 19.82%，归属于上市公司股东的净利润 29,978,804.61 元、同比增长 21.74%，扣非后 17,185,899.08 元、同比下降 11.64%；增量主要来自海参制品营业收入同比增加 10,710.91 万元，海参产品上半年收入 4.11 亿元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600467&id=12481210"
  - 事件: "2025 年度利润分配方案为以 1,460,994,304 股股本为基数向全体股东每 10 股派发现金红利 0.0614 元（含税），共计派现 8,970,505.03 元、占净利润 30.03%，派现后未分配利润余额 1,186,140,141.26 元"
    来源: "https://stockmc.xueqiu.com/202604/600467_20260424_7BYZ.pdf"

