    规模: "母公司及控股子公司向国内外银行、融资租赁公司、商业保理公司及国内外资本市场融资静态余额拟不超过 350,000 万元，其中银行金融机构不超过 200,000 万元、各类融资租赁公司不超过 20,000 万元、各类商业保理公司不超过 10,000 万元、通过银行间交易市场发行融资不超过 50,000 万元、发行境外公司债券不超过 1 亿美元（等值最高不高于人民币 7 亿元）"
