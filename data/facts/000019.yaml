代码: "000019"
名称: "深粮控股"
定位: "深圳市属国有大型上市粮食企业（深农投旗下），承担深圳市超百万吨粮油储备任务，是深圳“米袋子”和粤港澳大湾区粮油供应保障重要载体；前身为1992年上市的原深圳市深宝实业（深深宝A），2018年发行股份购买深粮集团100%股权完成重组转型。"
沿革:
  - 年: "1991"
    事件: "前身为深圳市深宝罐头食品公司（1981年7月30日在深圳市工商行政管理局进行工商登记），1991年8月1日经深圳市人民政府（1991）978号文批准改组为深圳市深宝实业股份有限公司，又经中国人民银行（1991）第126号文批准在深圳证券交易所上市；首次发行上市股本107,312,935股"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2014/2014-8/2014-08-19/1478872.PDF"
  - 年: "1992"
    事件: "证券简称“深深宝A”自1992年10月12日起使用；后续简称变更为G深宝A（2006-07-27）、深深宝A（2006-10-09）、深粮控股（2019-02-28）"
    来源: "https://quote.eastmoney.com/concept/sz000019.html?jump_to_web=true"
  - 年: "1999"
    事件: "1999年9月10日深圳市投资管理公司与农产品签订《关于深圳市深宝实业股份有限公司股权转让协议》，将其持有的公司股份58,347,695股（占公司原总股本的35%）以每股1.95元的价格转让给农产品，转让后农产品成为公司第一大股东，该项股权转让手续于2003年6月办理完毕"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=200019&id=9977039"
  - 年: "2018"
    事件: "2018年4月3日深圳市投资控股有限公司将其持有的公司79,484,302股A股股份全部过户给深圳市福德国有资本运营有限公司（福德资本），福德资本直接持有16%并通过农产品间接持有19.09%的股份，成为公司控股股东"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=200019&id=9977039"
  - 年: "2018"
    事件: "2018年实施重大资产重组，发行655,752,951股A股股份购买控股股东福德资本持有的深粮集团100%股权；2018年11月12日上述发行股份登记上市，控股股东福德资本（现更名深农投）直接持有公司735,237,253股（占公司现总股本63.79%），并通过农产品间接持有8.23%的股份"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-28/1225213320.PDF"
  - 年: "2019"
    事件: "2019年2月28日起证券简称由“深深宝A”变更为“深粮控股”"
    来源: "https://quote.eastmoney.com/concept/sz000019.html?jump_to_web=true"
主营与结构:
  - 事件: "2018年完成重大资产重组，主营业务在茶及天然植物精深加工为主的食品原料（配料）生产、研发和销售的基础上，增加粮油储备、粮油贸易、粮油加工等粮油流通及粮油储备服务业务"
    来源: "https://disc.static.szse.cn/disc/disk01/finalpage/2019-04-27/ef471555-e5d1-4f7e-9f83-3dcb3b489d62.PDF"
  - 事件: "公司为深圳市地方国有大型上市粮食企业，现为深农控旗下重要成员；承担深圳市超百万吨粮油储备任务，是深圳市“米袋子”和粤港澳大湾区粮油供应保障重要载体"
    来源: "https://zh.wikipedia.org/zh-hans/%E6%B7%B1%E7%B2%AE%E6%8E%A7%E8%82%A1"
  - 事件: "业务载体包括：东莞物流综合园区实现粮油码头、中转储备等五大功能协同；深粮质检作为“广东深圳国家粮食质量监测站”提供专业质检服务；深粮置地作为专业资产管理平台负责物业租赁与商业运营"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-28/1225213319.PDF"
  - 事件: "2025年通过双鸭山基地建设加强上游粮源掌控力度，依托东莞物流枢纽持续提升下游供应链协同能力，“产购储加销”一体化运营效能优化"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000019&id=12228043"
  - 事件: "截至2025年12月31日存货账面余额409,824.33万元，已计提存货跌价准备12,936.01万元，存货账面价值396,888.32万元，占资产总额的比例53.83%"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-04-28/a07805d7-6e55-4604-8c75-27288ef165e4.PDF"
  - 事件: "2026年6月29日召开2026年第一次临时股东大会；全资子公司深粮红荔粮油（深圳）有限公司拟参与竞买深圳市光明区建设用地并投资建设深圳市食用植物油储备库（光明）"
    来源: "https://quote.eastmoney.com/concept/sz000019.html?jump_to_web=true"
  - 事件: "2025年6月17日第十一届董事会第十六次会议审议通过《关于深宝华城饮料茶新质生产力技术升级项目投资决策的议案》，同意全资子公司深圳市深宝华城科技有限公司投资建设饮料茶新质生产力技术升级项目，总投资金额不超过1,837万元"
    来源: "https://epaper.stcn.com/pic/202508/20/996a48baeaadf8624b568c0ce3baf018.pdf"
  - 事件: "2025年4月28日第十一届董事会第十四次会议审议通过《关于东莞市深粮物流有限公司食品加工项目2号钢结构厂房投资决策的议案》"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2025-08-20/4fb76e36-5143-448f-ba2d-bb2cc51fa7ae.pdf"
融资历史:
  - 时间: "2018-11-12"
    方式: "发行股份购买资产（重大资产重组）"
    规模: "向福德资本发行655,752,951股A股购买其持有的深粮集团100%股权；根据中企华评报字（2018）第3558号《资产评估报告》，标的资产在评估基准日2017年9月30日的评估值为587,554.64万元，经协商整体成交金额为587,554.64万元（交易双方最初初步商定作价58.59亿元、预估交易作价585,943.21万元）"
    用途: "注入深圳市粮食集团有限公司（深粮集团）100%股权，实现地方粮企借道深深宝上市"
    说明: "2018年9月21日经中国证监会上市公司并购重组审核委员会审核通过，2018年10月15日获得中国证监会核准批复；股份于2018年11月12日登记上市；控股股东福德资本现更名深农投"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000019&id=5306816"
  - 时间: "2018-03-23"
    方式: "签署重组协议"
    规模: "交易双方初步商定标的资产深粮集团100%股权交易作价为58.59亿元，全部以发行股份的形式支付"
    用途: "本次交易完成后深深宝A将持有深粮集团100%股权"
    说明: "2018年9月25日重大资产重组获证监会审核通过后复牌"
    来源: "https://www.jiemian.com/article/2498284.html"
  - 时间: "2026-01-22"
    方式: "银行综合授信额度计划（董事会决议）"
    规模: "2026年度向银行申请综合授信额度不超过人民币147.5亿元；其中公司和全资子公司深圳市粮食集团有限公司拟向21家银行申请综合授信总额不超过人民币143亿元，授信均为信用方式、无需提供资产抵押"
    用途: "日常经营与粮油储备业务资金需求"
    说明: "同日董事会同意公司（含下属企业）2026年度通过银行流动资金借款、法人透支、国内信用证、银行承兑汇票及商业承兑汇票代理贴现等融资工具对外融资最高余额不超过人民币20亿元"
    来源: "https://paper.cnstock.com/html/2026-01/22/content_2172819.htm"
