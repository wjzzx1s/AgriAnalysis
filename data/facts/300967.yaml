    规模: "发行4,700万股，募集资金总额213,380,000.00元，扣除发行费用66,077,866.74元后实际募集资金净额147,302,133.26元"
    用途: "募投项目建设（后部分变更为红寺堡智慧农业产业示范园父母代种业基地项目）"
