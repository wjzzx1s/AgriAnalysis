    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300967&id=10880691"
  - 时间: "2023-04"
    方式: "向不特定对象发行可转换公司债券（证监许可〔2023〕253号）"
    规模: "发行3,290,000张，每张面值100元，募集资金总额32,900万元（3.29亿元）；初始转股价格19.43元/股，转股期2023年10月12日至2029年4月5日"
    用途: "募投项目建设（截至2025年底募集资金已使用完毕，募投项目均达到预定可使用状态）"
    说明: "截至2026年3月底转股价格调整为19.34元/股，未转股比例99.91%；截至2025年3月底仅累计6,000元面值转债完成转股"
    来源: "https://finance.sina.com.cn/stock/s/2026-07-08/doc-inihattw8228676.shtml"
  - 时间: "2024-12"
    方式: "股份回购（用于员工持股计划或股权激励）"
    规模: "回购总金额不低于2,000.00万元（含）且不超过4,000.00万元（含），回购价格不超过19.74元/股"
    用途: "员工持股计划或股权激励"
    说明: "2024年12月20日第五届董事会第十七次会议、2025年1月10日2025年第一次临时股东大会审议通过，实施期限12个月"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300967&id=12094202"
