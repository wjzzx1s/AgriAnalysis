代码: "300967"
名称: "晓鸣股份"
定位: "宁夏银川的蛋鸡制种龙头，集祖代、父母代蛋种鸡饲养与父母代、商品代雏鸡销售于一体，商品代雏鸡国内市占率约25%；2026年上半年受蛋鸡周期底部拖累，营业收入同比下降约24%、净利润同比下降99%。"
沿革:
  - 年: "1992"
    事件: "创始人魏晓明（1985年毕业于西北农学院畜牧系、曾任宁夏农学院畜牧系教师）自1992年起租赁经营宁夏畜牧兽医研究所实验种禽场，开始蛋种鸡养殖创业"
    来源: "http://jrjgj.nx.gov.cn/djgz/spxw/202110/t20211026_3105010.html"
  - 年: "2011"
    事件: "宁夏晓鸣农牧股份有限公司于2011年7月5日成立，由魏晓明、杜建峰、石玉鑫、朱万前、吴忠红等5位自然人股东共同出资组建，设立时注册资本500万元（其中魏晓明出资447.50万元）"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2022/2022-8/2022-08-30/8490103.PDF"
  - 年: "2021"
    事件: "经证监许可〔2021〕613号同意注册，首次公开发行4,700万股人民币普通股，发行价4.54元/股，2021年4月13日在深圳证券交易所创业板上市，发行后总股本187,506,000股，实际控制人为魏晓明"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=300967&id=7032732"
  - 年: "2023"
    事件: "经证监许可〔2023〕253号同意注册，向不特定对象发行可转换公司债券“晓鸣转债”，2023年4月起在深交所挂牌交易"
    来源: "https://finance.sina.com.cn/stock/s/2026-07-08/doc-inihattw8228676.shtml"
  - 年: "2025"
    事件: "2025年全年营业收入122,129.89万元（同比+25.82%），归母净利润8,471.65万元（同比+89.04%），商品代健母雏销量2.73亿羽，国内市占率约25%"
    来源: "https://www.stcn.com/article/detail/3753950.html"
主营与结构:
  - 事件: "公司是集祖代和父母代蛋种鸡饲养、蛋鸡养殖工程技术研发、种蛋孵化、雏鸡销售、食品销售、技术服务于一体的“引、繁、推”一体化科技型蛋鸡制种企业"
    来源: "http://static.cninfo.com.cn/finalpage/2025-04-16/1223102782.PDF"
  - 事件: "主要产品为父母代雏鸡、商品代雏鸡及其副产品、商品代育成鸡"
    来源: "http://static.cninfo.com.cn/finalpage/2025-04-16/1223102782.PDF"
  - 事件: "2025年公司鸡产品销售27,839.78万羽（同比+21.08%），主营鸡产品收入104,920.69万元（同比+35.83%），占营业收入比重85.91%；商品代雏鸡国内市场占有率提升至约25%"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300967&id=12094208"
  - 事件: "2026年上半年公司鸡产品销售14,318.38万羽，主营鸡产品收入49,216.76万元，占营业收入比重86.66%，商品代蛋鸡产品市占率仍居行业前列"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-18/1225477360.PDF"
  - 事件: "子公司宁夏晓鸣蛋乐道食品有限公司注册资本1,000万元、公司持股100%，报告期实现营业收入405.23万元、净利润-29.69万元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300967&id=12499617"
  - 事件: "注册地为永宁县黄羊滩沿山公路93公里处向西3公里处，办公地址宁夏银川市金凤区创业街36号"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300967&id=10880682"
