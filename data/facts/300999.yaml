代码: "300999"
名称: "金龙鱼"
定位: "益海嘉里旗下粮油食品巨头，主营厨房食品（食用油、大米、面粉）与饲料原料、油脂科技，旗下拥有金龙鱼、胡姬花、香满园、欧丽薇兰等品牌；2020 年登陆创业板并创下当时创业板 IPO 募资最大规模，2023—2024 年利润连续下滑后于 2025 年触底回暖。"
沿革:
  - 年: "2020"
    事件: "2020 年 10 月 15 日股票在深圳证券交易所创业板上市，证券简称“金龙鱼”，代码 300999；首次公开发行后 A 股股本 5,421,591,536 股，其中 356,738,334 股于上市日起上市交易"
    来源: "https://yihaikerry.net/admin/upload/2021-11/163780646212285700.pdf"
  - 年: "2023"
    事件: "上市以来首次出现营业收入与净利润“双降”：营业收入 2,515.24 亿元，同比下降 2.3%；归母净利润 28.48 亿元，同比下降 5.4%；扣非净利润 13.21 亿元，同比下降 58.5%"
    来源: "http://static.cninfo.com.cn/finalpage/2024-02-21/1219146870.PDF"
  - 年: "2024"
    事件: "公司名称由“益海嘉里金龙鱼粮油食品股份有限公司”变更为“益海嘉里金龙鱼食品集团股份有限公司”"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300999&id=12109047"
  - 年: "2024"
    事件: "营业收入 2,388.66 亿元，同比下降 5.03%；利润总额 36.56 亿元，同比增长 7.05%；归母净利润 25.02 亿元，同比下降 12.14%；扣非净利润 9.72 亿元，同比下降 26.42%"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300999&id=10801225"
  - 年: "2025"
    事件: "业绩触底反转：营业收入 2,451.26 亿元，同比增长 2.87%；利润总额 48.89 亿元，同比增长 33.71%；归母净利润 31.53 亿元，同比增长 26.01%；扣非净利润 28.45 亿元，同比增长 193.68%"
    来源: "https://www.cs.com.cn/ssgs/gsxw/202602/t20260227_6538733.html"
主营与结构:
  - 事件: "主要业务为厨房食品（食用油、大米、面粉等）与饲料原料、油脂科技产品；2025 年营业收入增长主要因厨房食品、饲料原料及油脂科技产品销量较上年增加"
    来源: "https://www.cs.com.cn/ssgs/gsxw/202602/t20260227_6538733.html"
  - 事件: "厨房食品知名品牌包括金龙鱼、胡姬花、香满园、欧丽薇兰等"
    来源: "https://finance.sina.com.cn/tech/2020-10-15/doc-iiznezxr6173392.shtml"
  - 事件: "IPO 募集资金投入兰州新区粮油食品加工基地项目（一期）、益海嘉里集团粮油深加工项目、乐清湾港区益海嘉里粮油加工港口综合项目、米、面、油综合加工一期项目"
    来源: "https://finance.sina.com.cn/tech/2020-10-15/doc-iiznezxr6173392.shtml"
  - 事件: "2026 年上半年营业收入 1,228.52 亿元，同比增长 6.20%；归母净利润 22.94 亿元，同比增长 30.69%；扣非净利润 14.81 亿元，同比增长 6.61%；上半年油米面产品在消费品、餐饮、食品工业及电商渠道销量均有增长"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-13/1225470254.PDF"
  - 事件: "2026 年上半年处置相关股权贡献归母净利润 2.63 亿元，剔除该项影响后归母净利润 20.31 亿元，同比增长 15.71%"
    来源: "https://finance.sina.com.cn/roll/2026-08-12/doc-ininaezp3989493.shtml"
融资历史:
  - 时间: "2020-10"
    方式: "IPO（深圳证券交易所创业板）"
    规模: "首次公开发行 542,159,154 股，发行价 25.70 元/股，募集资金总额 1,393,349.03 万元（139.33 亿元），扣除发行费用 24,055.22 万元后募集资金净额 1,369,293.81 万元（136.93 亿元）"
    用途: "兰州新区粮油食品加工基地项目（一期）、益海嘉里集团粮油深加工项目、乐清湾港区益海嘉里粮油加工港口综合项目、米面油综合加工一期项目"
    说明: "经中国证监会证监许可[2020]2121 号同意注册；发行价 25.70 元/股，创下当时创业板 IPO 募资最大规模；上市首日股价大涨 118%，市值突破 3,000 亿元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300999&id=10801225"
  - 时间: "2024-09"
    方式: "以参股公司股权作价对外增资（关联交易）"
    规模: "公司出资作价 22.90 亿元、关联方香港嘉银作价 32.79 亿元，合计 55.69 亿元对山东鲁花集团有限公司增资"
    用途: "取得鲁花集团股权，整合食用植物油业务"
    说明: "2024 年 9 月 3 日董事会审议通过；交易完成后公司持有鲁花集团 10.9536% 股权、香港嘉银持有 15.6864%；按交易推算鲁花集团总估值约 208.65 亿元；2024 年 12 月公告鲁花集团及参股公司已完成工商变更登记"
    来源: "https://finance.sina.com.cn/stock/relnews/cn/2024-12-09/doc-incywqmm5688220.shtml"
风险与困境:
  - 时间: "2021—2024"
    事项: "归母净利润连续下滑：2021 年 41.32 亿元、2022 年 30.11 亿元、2023 年 28.48 亿元，2024 年进一步降至 25.02 亿元"
    来源: "https://finance.sina.com.cn/stock/relnews/cn/2024-08-16/doc-incivrre5668069.shtml"
  - 时间: "2025-04"
    事项: "公司披露 2024 年扣非净利润仅 9.72 亿元，同比下降 26.42%；投资者关系活动记录显示厨房食品零售渠道利润承压"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300999&id=11832204"
  - 时间: "2025-11-19"
    事项: "下属子公司益海（广州）粮油工业有限公司收到安徽省淮北市中级人民法院一审《刑事判决书》，被判决构成合同诈骗罪帮助犯，判处罚金人民币 100 万元，并需对被害单位安徽华文国际经贸股份有限公司的经济损失 18.81 亿元与云南惠嘉进出口有限公司承担共同退赔责任；公司在其所有者权益范围内确认预计负债，导致 2025 年净利润减少约 2.61 亿元，广州益海已提起上诉"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-03-04/doc-inhpvpqk3863433.shtml"
  - 时间: "2025"
    事项: "下属子公司东莞市富之源饲料蛋白开发有限公司因税务行政诉讼一审败诉，需将 2012 年 7 月 1 日—2025 年 12 月 31 日期间少计的不可抵扣进项税额转出并补缴增值税附加税及滞纳金，计提预计负债导致 2025 年净利润减少约 4.72 亿元"
    来源: "https://finance.sina.cn/stock/ggyj/2026-02-28/detail-inhpkhwa9166909.d.html?vt=4"
  - 时间: "2026-02"
    事项: "两起子公司诉讼合计计提预计负债损失约 7.33 亿元，均为一审未生效判决、相关子公司已提起上诉，最终结果尚存在不确定性；若剔除该影响，2025 年归母净利润将同比增长 55.31%"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-03-04/doc-inhpvpqk3863433.shtml"
