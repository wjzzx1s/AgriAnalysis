    事项: "2008 年 11 月 28 日《证券时报》发表《涉嫌造假上市 洞庭水殖大股东掏空上市公司调查》，披露安乡县水产养殖为泓鑫控股的关联公司而公司公开资料未透露该关系；因存在涉嫌披露虚假信息等违反证券法律法规的行为，中国证监会湖南监管局决定自 2008 年 12 月 2 日起对公司立案调查。2010 年 5 月 29 日公司公告称，公司于 2010 年 5 月 28 日收到湖南证监局送达的中国证监会《行政处罚决定书》（[2010]19 号），认定公司在 2007 年以前的年度报告中未如实披露安乡水产与控股股东泓鑫控股之间的关联关系，决定对公司给予警告，对罗祖亮给予警告并处以 10 万元罚款，对曾卫国、彭荣钦给予警告并分别处以 5 万元罚款，对李祖军、黄新元、梁淑敏、曹向钧给予警告并分别处以 3 万元罚款，对赵涌涛给予警告；此后投资者曾向律师咨询并拟抱团起诉公司虚假陈述索赔"
