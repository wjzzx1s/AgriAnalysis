代码: "600257"
名称: "大湖股份"
定位: "湖南常德起家的淡水养殖上市公司（曾名“洞庭水殖”“大湖水殖”，自称“中国淡水渔业第一股”），2000 年 6 月在上交所上市；2016 年定增募资 5.5 亿元后由水产养殖向水产加工、白酒和康复护理医疗延伸，2020—2021 年分步收购并增资东方华康医疗管理有限公司取得 60% 股权（2026 年 4 月增至 61.1103%），2025 年 10 月公司全称变更为“大湖健康产业股份有限公司”；2025 年营业收入 9.20 亿元、归母净利润 506.53 万元，2026 年上半年归母净利润 1,688.13 万元、同比扭亏。"

