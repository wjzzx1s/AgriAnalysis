    事件: "发行 5 亿元公司债券“14北农债”（112203），票面利率 7.24%，2014 年 6 月 13 日上市"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002385&id=1430052"
  - 年: "2015"
    事件: "完成非公开发行股票，募集资金净额 21.94 亿元（219,417.00 万元）"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2023-05-25/67178d25-822d-4faa-b986-38811b36aa47.PDF"
  - 年: "2026"
    事件: "2 月 3 日原实际控制人、董事长邵根伙因病逝世，生前直接持股 927,754,831 股（占总股本约 21.6%）；3 月 21 日披露控股股东、实际控制人变更事项"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002385&id=12547190"
  - 年: "2026"
    事件: "9 月 8 日第二批股份非交易过户完成（4.28 亿股），莫云成为公司控股股东、实际控制人，直接持股 6.96 亿股（约 16.26%）"
    来源: "https://finance.sina.com.cn/roll/2026-09-12/doc-inirqmqy5129445.shtml"
股权与控制权:
  - 事项: 原控股股东、实际控制人邵根伙于2026年2月3日病逝，持股9.28亿股（占21.67%）经法定继承过户，莫云继承6.96亿股（16.26%）、未成年女儿继承2.32亿股（5.42%）并由莫云代行表决权，莫云成为新的控股股东与实际控制人。
    来源: https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxatu6957160.shtml
  - 事项: 莫云于2026年3月31日当选公司董事长；截至9月8日，邵根伙名下仍有7,151.52万股（占总股本1.67%）因质押未解除而未完成过户。
    来源: https://finance.sina.com.cn/stock/zqgd/2026-09-10/doc-iniriaew8602470.shtml
  - 事项: 2026年9月，莫云质押7,151.52万股（占其所持股份10.28%、占总股本1.67%）用于融资，同时解除邵根伙名下同等数量的质押股份。
    来源: https://finance.eastmoney.com/a/202609273884461198.html
主营与结构:
  - 事件: "2025 年营业收入 291.19 亿元（+1.22%），净利润 -4.88 亿元、归母净利润 -6.42 亿元；饲料销量 555.34 万吨（+2.74%，其中猪料 446.70 万吨），养猪产品收入 65.90 亿元（+4.97%），控股公司生猪出栏 445.96 万头"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002385&id=12172381"
  - 事件: "2026 年上半年营业收入 138.11 亿元（+1.86%）、归母净利润 -6.77 亿元（上年同期 +2.35 亿元）；饲料产品收入 93.52 亿元（+8.75%）占比 67.71%，生猪产品收入 29.92 亿元占比 21.67%，种业产品收入 4.61 亿元占比 3.34%"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002385&id=12547190"
  - 事件: "2026 年上半年饲料销量 281.21 万吨（+9.21%），其中猪饲料 229.70 万吨（+12.04%）；控股公司生猪出栏 278.25 万头，商品猪销售均价同比下降约 30%，养殖板块毛利率降至 -4.66%"
    来源: "https://stock.stockstar.com/RB2026090500005190.shtml"
  - 事件: "2026 年上半年板块盈亏：饲料板块创利 2—3 亿元，养殖业务板块亏损 4—5 亿元；公司称种业业务具有季节性、经营侧重在第四季度"
    来源: "https://finance.sina.com.cn/jjxw/2026-09-21/doc-inisqmac7810652.shtml"
  - 事件: "生物育种进展：2026 年 3 月转基因耐除草剂大豆性状产品 DBN9004 获欧盟进口许可；2026 年 5 月初审通过的 73 个转基因玉米品种中，46 个使用公司性状，占比 63.01%"
    来源: "https://stock.stockstar.com/RB2026090500005190.shtml"
竞争优势:
  - 事项: 转基因玉米性状市占率行业第一：截至2026年中报，全国已审定的160个转基因玉米品种中95个使用公司性状、约占59%，19个转基因大豆品种中6个使用、约占32%。
    来源: https://finance.sina.com.cn/stock/aiassist/ggsp/2026-10-09/doc-iniurfep7895232.shtml
  - 事项: 2026年5月国审初审通过的73个转基因玉米品种中，46个品种转化体所有者为北京大北农生物技术有限公司、占比63.01%，公司性状审定品种数与除草剂登记数均列行业第一。
    来源: https://www.cls.cn/detail/2385870
  - 事项: 公司按性状许可收费，2026年预计转基因玉米推广面积占比60%以上，对战略性大客户给予定价优惠以换取长期稳定合作与更大市场覆盖，2025年性状许可收入符合预期。
    来源: https://www.cls.cn/detail/2385870
行业基本面:
  - 事项: 全国玉米制种面积由2023年462万亩降至2024年428万亩、2025年385万亩，2026年约358.5万亩、同比再降7%，预计产种14.3亿公斤，制种向西北优势产区集中、占比达77%。
    来源: https://www.1agri.com/ent/show-559.html
  - 事项: 转基因玉米大豆产业化扩面提速：2024年8省份示范约1,065万亩（玉米1,011万亩、大豆54万亩），2025年以13省份为主全国放开3,200万亩，2026年进入全国适宜地区常规化种植阶段。
    来源: https://www.chr1688.com/news/show-3090.html
  - 事项: 2026年上半年全国工业饲料总产量16,850万吨、同比增长3.9%，其中配合饲料15,798万吨（+4.3%）、浓缩饲料597万吨（-5.7%）、添加剂预混合饲料345万吨（-2.1%）。
    来源: http://xm.shandong.gov.cn/art/2026/7/23/art_24614_10354005.html
经营要点:
  - 事项: 2026年上半年饲料销量281.21万吨、同比增长9.21%，其中猪饲料229.70万吨（+12.04%）、水产饲料11.35万吨（+22.81%）、反刍饲料29.58万吨（+12.35%）、禽饲料10.44万吨（-37.25%）。
    来源: https://stock.stockstar.com/RB2026090500005190.shtml
  - 事项: 2026年上半年营业收入138.11亿元、同比增长1.86%，饲料产品收入93.52亿元（+8.75%）、毛利率11.51%，养猪产品收入29.92亿元（-11.99%）、种业产品收入4.61亿元（-3.32%）。
    来源: https://stock.stockstar.com/RB2026090500005190.shtml
  - 事项: 2026年上半年玉米、水稻、大豆合计销售2,500.92万公斤、同比增长12.44%，其中水稻种子销售2,097.18万公斤、收入3.43亿元（+6.44%），玉米种子184.23万公斤、收入6,442.75万元（-17.27%）。
    来源: https://wap.eastmoney.com/a/202608313860101046.html
  - 事项: 2026年6月商品肥猪销售均价9.44元/公斤，9月回升至10.72元/公斤、当月商品肥猪销量25.91万头；公司称商品猪销售均价同比下降约30%，养殖业务由盈转亏。
