代码: "002385"
名称: "大北农"
定位: "以饲料、种业（含转基因生物育种）、生猪养殖与动保为主业的农业科技公司；2026 年上半年猪价低迷致亏损 6.77 亿元，实控人邵根伙去世后控制权由配偶莫云继承。"
沿革:
  - 年: "2010"
    事件: "3 月 29 日公开发行 6,080 万股、发行价 35.00 元/股（证监许可〔2010〕262 号），4 月 9 日在深交所挂牌上市，首发募集资金净额 20.18 亿元"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002385&id=1430052"
