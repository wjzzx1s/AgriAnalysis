代码: "300313"
名称: "天山生物"
定位: "新疆昌吉的肉牛全产业链畜牧生物企业，以牛品种改良、冻精与活畜养殖起家；因23.73亿元跨界并购大象广告遭合同诈骗巨亏，2025年4月被实施退市风险警示，2026年6月摘帽并恢复“天山生物”简称。"
沿革:
  - 年: "2003"
    事件: "原名“新疆德隆畜牧生物工程有限责任公司”，由天山农牧业发展有限公司（原新疆德隆畜牧良种繁育有限公司）与昌吉州国有资产投资经营有限责任公司发起设立，2003年6月18日在昌吉州工商登记"
    来源: "http://static.cninfo.com.cn/finalpage/2015-07-01/1201220500.PDF"
  - 年: "2012"
    事件: "经证监许可〔2012〕380号核准首次公开发行2,273万股，发行价13.00元/股，2012年4月25日在深圳证券交易所创业板挂牌上市，简称“天山生物”"
    来源: "http://static.cninfo.com.cn/finalpage/2016-03-26/1202085151.PDF"
  - 年: "2016"
    事件: "向呼图壁县天山农业发展有限公司、天山农牧业发展有限公司等发行股份购买资产并募集配套资金（证监许可〔2015〕2393号），该次重组于2016年12月19日实施完毕"
    来源: "http://static.cninfo.com.cn/finalpage/2018-01-03/1204301717.PDF"
  - 年: "2017"
    事件: "2017年9月与陈德宏、华融渝稳、华融天泽等36名交易对方签署《发行股份及支付现金购买资产协议》，以237,261.42万元收购大象广告96.21%股权（现金对价57,696.41万元、股份对价179,565.04万元，发行11,562.46万股）"
    来源: "http://static.cninfo.com.cn/finalpage/2024-03-30/1219474293.PDF"
  - 年: "2018"
    事件: "2018年1月26日获中国证监会核准，4月26日完成资产交割，大象广告成为控股子公司，新增股份2018年5月28日上市；2018年12月公司发现大象广告原实际控制人陈德宏涉嫌合同诈骗"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN201808241182628409_1.pdf"
  - 年: "2022"
    事件: "2022年9月23日控股股东变更为湖州皓辉企业管理咨询有限公司，实际控制人变更为解直锟（中植系）"
    来源: "http://static.cninfo.com.cn/finalpage/2025-08-27/1224579589.PDF"
  - 年: "2025"
    事件: "2025年4月30日开市起被实施退市风险警示并继续被实施其他风险警示，股票简称由“ST天山”变更为“*ST天山”"
    来源: "http://static.cninfo.com.cn/finalpage/2025-04-29/1223376987.PDF"
  - 年: "2025"
    事件: "2025年9月1日湖州皓辉、湖州中植与厦门舍德供应链管理有限公司签署《处置成交协议》《表决权委托协议》，厦门舍德成为控股股东，陈明艺、陈欢夫妇成为实际控制人"
    来源: "https://www.cls.cn/detail/2132948"
  - 年: "2026"
    事件: "2026年6月22日起撤销退市风险警示及其他风险警示，股票简称由“*ST天山”变更为“天山生物”，日涨跌幅限制仍为20%"
    来源: "https://finance.sina.com.cn/cj/2026-06-18/doc-inictxkf6853465.shtml"
主营与结构:
  - 事件: "公司主营业务包括活畜业务、肉类业务、租赁业务、冻精业务、饲料业务"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-6/2026-06-18/12400343.PDF"
  - 事件: "2026年上半年分产品收入：肉类13,191.65万元、活畜2,541.81万元、冻精844.31万元；肉类业务主体深圳牛大娘2026年上半年营业收入13,271.48万元，约为其2025年全年4,795.03万元的三倍"
    来源: "https://stock.stockstar.com/RB2026090800002026.shtml"
  - 事件: "2025年全年肉类收入6,484.88万元、活畜7,838.10万元、冻精1,115.59万元"
    来源: "https://stock.stockstar.com/RB2026090800002026.shtml"
  - 事件: "冻精业务基于新疆维吾尔自治区畜牧兽医局核发的《种畜禽生产经营许可证》，开展牛、羊冻精生产和销售"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-6/2026-06-18/12400343.PDF"
  - 事件: "肉类业务集中在广东省开展，涵盖牛只采购、屠宰分割及最终市场销售"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-6/2026-06-18/12400343.PDF"
  - 事件: "活畜养殖分为育肥饲养（收购架子牛育肥后销售）和调理饲养（收购青年母牛、架子牛隔离检疫后分群饲养）"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-6/2026-06-18/12400343.PDF"
融资历史:
  - 时间: "2012-04"
    方式: "IPO（深交所创业板）"
    规模: "发行2,273万股，发行价13.00元/股，募集资金总额29,549.00万元，募集资金净额26,099.82万元"
    用途: "募投项目建设"
    说明: "2012年年度报告披露口径"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300313&id=1096324"
  - 时间: "2016-06"
    方式: "发行股份购买资产并募集配套资金（证监许可〔2015〕2393号）"
    规模: "募集配套资金3,900万元，扣除发行费用671.35万元后净额3,228.65万元，2016年6月21日全部到位；新增股份2016年7月12日上市"
    用途: "配套募集资金用途相关项目建设"
    说明: "配套资金发行2,401,477股，发行价16.24元/股"
