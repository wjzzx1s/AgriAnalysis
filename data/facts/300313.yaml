  - 时间: "2017-09"
    方式: "发行股份及支付现金购买资产（收购大象广告96.21%股权）"
    规模: "交易作价237,261.42万元，其中现金对价57,696.41万元、股份对价179,565.04万元"
    用途: "跨界并购户外广告资产"
    说明: "该次交易的会计处理于2023年年报中作追溯调整"
    来源: "http://static.cninfo.com.cn/finalpage/2024-03-30/1219474293.PDF"
  - 时间: "2026-03"
    方式: "向特定对象发行A股股票（预案）"
    规模: "发行数量不超过5,900万股，发行价格5.91元/股，募集资金总额不超过34,869.00万元"
    用途: "扣除发行费用后拟全部用于补充流动资金"
    说明: "发行对象为公司实际控制人陈明艺（不超过900万股）和控股股东厦门舍德（不超过5,000万股）"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=830398263877&code=300313&dannoun=lcdetail&announ=lc"
风险与困境:
  - 时间: "2018"
    事项: "因大象广告事件，2018年对大象广告长期股权投资计提资产减值准备17.96亿元，并对公司为大象广告担保形成的预计负债计提1亿元，全年归母净利润亏损19.46亿元"
    来源: "https://news.stcn.com/sd/202110/t20211011_3745305.html"
  - 时间: "2019"
    事项: "全年归属于上市公司股东的净利润为-6,079.10万元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300313&id=7141378"
  - 时间: "2021-10"
    事项: "大象广告合同诈骗案一审宣判：以发行股份支付的17.96亿元属犯罪既遂、未支付的5.77亿元现金对价属犯罪未遂，追缴陈德宏名下公司股票3,728万股及大象广告35名股东所持公司股票7,835万股（合计约1.16亿股）返还公司"
    来源: "https://news.stcn.com/sd/202110/t20211011_3745305.html"
  - 时间: "2023-04-07"
    事项: "公司2023年年报披露，陈德宏合同诈骗案经（2021）新刑终143号《刑事裁定书》终审裁定，被告单位及被告人被判处无期徒刑等刑罚，公司据此对2018年收购大象广告的会计处理进行追溯调整"
    来源: "http://static.cninfo.com.cn/finalpage/2024-03-30/1219474293.PDF"
  - 时间: "2024"
    事项: "2022年、2023年、2024年归母净利润分别为-3,183.21万元、-2,200.16万元、-6,594.79万元，扣非后分别为-2,262.94万元、-2,481.01万元、-6,754.60万元，触及“最近三个会计年度扣非前后净利润孰低者均为负值”情形"
    来源: "http://static.cninfo.com.cn/finalpage/2025-04-29/1223376987.PDF"
  - 时间: "2024-12-31"
    事项: "2024年末归属于上市公司股东的净资产为-377.93万元，扣除后营业收入9,228.12万元，触及创业板股票上市规则第10.3.1条退市风险警示标准"
    来源: "http://static.cninfo.com.cn/finalpage/2025-04-29/1223376987.PDF"
  - 时间: "2025-04-29"
    事项: "中兴财光华会计师事务所对2024年度财务报告出具带“持续经营能力存在不确定性”表述的审计意见；公司称受大象广告案件影响金融机构大幅抽贷、为大象广告融资担保被迫代偿，经营资金严重短缺"
    来源: "http://static.cninfo.com.cn/finalpage/2025-04-29/1223376987.PDF"
  - 时间: "2026-03-03"
    事项: "发布《关于公司股票可能被终止上市的第三次风险提示公告》（公告编号2026-007）"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202603031820224115_1.pdf"
  - 时间: "2026-04-25"
    事项: "向深圳证券交易所申请撤销对公司股票交易实施的退市风险警示及其他风险警示"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225191616.PDF"
战略与转型:
  - 时间: "2023-10"
    事项: "控股股东湖州皓辉与中电投新农创科技有限公司签署控制权转让框架协议，拟协议转让40,718,359股（占13.01%，转让总价2.14亿元）并将剩余28,492,953股（占9.10%）表决权委托，2024年3月双方解除该框架协议"
    来源: "https://m.21jingji.com/article/20231010/herald/9acdfefbf4ff77f27434167e56bd3617.html"
  - 时间: "2025-09"
    事项: "厦门舍德受让湖州皓辉所持5,386.13万股（占总股本17.21%）及湖州中植对公司享有的债权（本金7,649万元及利息），标的股份与债权转让价款合计2.87亿元，并通过表决权委托取得控制权"
    来源: "https://www.cls.cn/detail/2132948"
  - 时间: "2025-04"
    事项: "公司提出“大肉牛战略”：上游强化肉牛品种改良与冻精、胚胎等遗传物质业务，下游启动屠宰、流通环节及牛肉深加工与品牌化运营，以大湾区为核心区域建立牛肉销售网络"
    来源: "http://static.cninfo.com.cn/finalpage/2025-04-29/1223376987.PDF"
  - 时间: "2025-04"
    事项: "公司称将适时启动资本运作项目以改善资本结构，并通过大股东借款协议展期、银行短期借款置换为中长期等方式优化债务结构"
    来源: "http://static.cninfo.com.cn/finalpage/2025-04-29/1223376987.PDF"
