代码: "002286"
名称: "保龄宝"
定位: "山东禹城的功能糖（益生元、膳食纤维、减糖甜味剂）龙头，国内首家完成赤藓糖醇工业化生产的企业，为元气森林等无糖饮品品牌的核心代糖供应商；2009年上市，控股股东永裕投资持股比例不高且近年发生股份司法冻结，公司正谋求以简易程序小额再融资。"
