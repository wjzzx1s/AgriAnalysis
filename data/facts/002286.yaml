主营与结构:
  - 事件: "食品和营养领域主要产品为益生元、膳食纤维、减糖甜味剂等产品；口感和质构改善领域以变性淀粉为主；医药原辅料主要为药用乳果糖、药用赤藓糖醇等产品"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225174961.PDF"
