    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002286&id=12179640"
  - 事件: "从2002年研发赤藓糖醇，到成为元气森林等年轻消费品牌的核心代糖供应商"
    来源: "https://www.stcn.com/article/detail/3431212.html"
  - 事件: "公司重点布局“小精灵”的业务模式（原文片段），产品结构和客户以无糖饮料等新消费为主"
