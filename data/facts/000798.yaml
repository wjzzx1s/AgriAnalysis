代码: "000798"
名称: "中水渔业"
定位: "中国农发集团旗下的远洋渔业上市平台，1998 年 2 月在深交所上市（原中水集团远洋股份有限公司），以金枪鱼等大洋性捕捞为基本盘；2023 年以 17.15 亿元现金收购中渔环球 51% 等农发集团渔业板块资产并配套 11 亿元并购贷款，2025 年扭亏（归母净利润 8,375.42 万元），2026 年上半年归母净利润 1.02 亿元、同比增长 18.60%。"

沿革:
  - 年: "1997"
    事件: "经农业部农财函[1997]28 号文批准，由中国水产（集团）总公司、中国水产舟山海洋渔业公司、中国水产烟台海洋渔业公司采取募集方式设立股份公司；1997 年 11 月 24 日经中国证监会证监发字[1997]480 号文和证监发字[1997]481 号文批准公开发行股票并上市流通，证券简称“中水渔业”"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000798&id=6896861"
  - 年: "1998"
    事件: "1 月 19 日由国家工商行政管理局颁发注册号为 1000001002863 的企业法人营业执照；首发实际发行 6,300 万股、发行价 7.24 元/股，实际募集资金 45,612.00 万元，股票于 1998 年 2 月 12 日在深圳证券交易所上市，首发前总股本 18,900 万股、首发后 25,200 万股"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/000798.phtml"
  - 年: "2006"
    事件: "国务院国资委下发国资产权[2006]363 号文《关于中水集团远洋股份有限公司以股抵债有关问题的批复》，同意中国水产舟山海洋渔业有限公司以所持公司国有法人股等以股抵债；公司原注册资本 25,200.00 万元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000798&id=6896861"
  - 年: "2014"
    事件: "12 月公司以现金方式收购张福赐持有的厦门新阳洲水产品工贸有限公司 55% 股权，并与交易对方签订《业绩补偿协议》及补充协议"
    来源: "http://static.cninfo.com.cn/finalpage/2015-03-05/1200669942.PDF"
  - 年: "2023"
    事件: "以支付现金方式整合中国农发集团渔业板块，取得中渔环球 51% 股权、农发远洋 20.89% 与 51.19% 股权、舟渔制品 100% 股权，7 月 26 日标的资产过户手续全部办理完毕"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202603261820775996_1.pdf"
  - 年: "2024"
    事件: "7 月中国农发集团、华农资产分别与中水公司签署《无偿划转协议》，将所持中水渔业 22.14%、11.76% 股份及中国农发集团持有的舟渔公司 100% 股权无偿划转给中水公司，划转后中水公司直接和间接持有中水渔业 51.67% 股权，实际控制人仍为中国农发集团"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202407191638108212_1.pdf"

主营与结构:
  - 事件: "主营业务包括远洋捕捞（金枪鱼延绳钓/围网、鱿鱼、虾类、过洋性捕捞）、食品加工、渔业服务、水产品贸易与冷藏运输，控股股东中国农发集团定位中水渔业为其远洋渔业板块发展和整合的平台"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000798&id=9906197"
  - 事件: "2023 年以现金收购中渔环球 51% 股权后取得航运项目控制权，该项目以远洋冷藏运输和海上供油业务为主，截至 2026 年 6 月 30 日共运营船舶 13 艘（7 艘运输船、6 艘供油船，其中 1 艘为租赁经营），资产总额 166,443 万元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000798&id=12512045"
  - 事件: "2024 年实现营业收入 493,316.34 万元、同比增长 22.05%，其中捕捞业务产量 137,222.00 吨、捕捞收入 185,458.60 万元，零售及加工贸易业务收入 170,887.10 万元、同比增长 93.83%；当年利润总额 -7,488 万元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000798&id=10908460"
  - 事件: "2025 年实现营业收入 434,205 万元、同比下降 11.98%（零售及加工贸易业务收入 56,237 万元、同比下降 67.09%），利润总额 15,117 万元、同比增加 22,605 万元，归属于上市公司股东的净利润 8,375 万元、同比增加 18,776 万元，主要原因是捕捞产量和销售均价均同比增加"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-03-27/dafe4d97-de86-47d8-b022-33ee3934b37b.PDF"
  - 事件: "2026 年上半年实现营业收入 2,077,972,329.91 元、同比增长 18.92%，归属于上市公司股东的净利润 102,364,433.97 元、同比增长 18.60%，扣非后 100,115,241.67 元、同比增长 16.16%，经营活动产生的现金流量净额 -17,475,493.16 元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000798&id=12512045"
  - 事件: "2026 年一季度实现营业收入 8.4 亿元、同比下降 0.78%，归母净利润亏损 2,615.48 万元（上年同期亏损 1,605.71 万元），主要系所属全资子公司鱿鱼销售均价同比大幅下降"
    来源: "https://www.stcn.com/article/detail/4177700.html"

融资历史:
  - 时间: "1997-11-24"
    方式: "IPO（深圳证券交易所）"
    规模: "发行 6,300 万股，发行价 7.24 元/股，实际募集资金 45,612.00 万元"
    用途: "未查得"
    说明: "经证监发字[1997]480 号、证监发字[1997]481 号文批准，主承销商华夏证券有限公司，承销方式余额包销，发行方式网上定价发行；股票于 1998 年 2 月 12 日上市"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/000798.phtml"
  - 时间: "2014-12"
    方式: "现金收购股权（并购）"
    规模: "以现金购买张福赐持有的厦门新阳洲水产品工贸有限公司 55% 股权，标的公司股东全部权益评估值为 40,002.92 万元"
    用途: "延伸水产品加工与贸易业务"
    说明: "交易对方张福赐承诺新阳洲 2014—2017 年净利润分别不低于 3,937 万元、4,324 万元、4,555 万元、4,707 万元"
    来源: "http://static.cninfo.com.cn/finalpage/2015-03-05/1200669942.PDF"
  - 时间: "2023-06-15"
    方式: "重大资产购买（现金）暨关联交易"
    规模: "交易价格合计 171,455.89 万元，其中中国农发集团所持农发远洋 20.89% 股权作价 11,083.15 万元，其余为中渔环球 51.00% 股权、农发远洋 51.19% 股权、舟渔制品 100% 股权对价"
    用途: "整合中国农发集团渔业板块，将远洋捕捞、食品加工、渔业服务等业务和资产纳入上市公司体内，成为中国农发集团渔业旗舰上市公司"
    说明: "交易对方为中水公司、中国农发集团、舟渔公司，均为同一实际控制人下的关联方；2023 年 7 月 26 日标的资产过户手续全部办理完毕"
    来源: "http://static.cninfo.com.cn/finalpage/2023-06-15/1217066283.PDF"
  - 时间: "2023"
    方式: "并购贷款"
    规模: "拟向合作银行申请总额 11.00 亿元人民币的并购贷款，用于支付本次交易的部分转让现金对价"
    用途: "支付重大资产购买对价"
    说明: "根据《备考审阅报告》，2022 年末公司模拟账面货币资金为 6.03 亿元；本次交易完成后公司资产负债率将从 28.97% 大幅上升至 68.57%"
    来源: "http://reportdocs.static.szse.cn/UpFiles/fxklwxhj/LSD000798179233103839HF.pdf"
  - 时间: "2018-10"
    方式: "对外投资（关联交易）"
    规模: "项目总投资 4.2 亿元，中国农发集团以现金出资 1.00 亿元占 23.81% 股权，舟渔公司以净资产评估价值出资 2.15 亿元占 51.19% 股权，中水渔业以净资产评估价值出资 1.05 亿元占 25.00% 股权"
    用途: "与控股股东及其关联方共同投资渔业相关项目"
    说明: "中水渔业与舟渔公司均系中国农发集团直接控制的企业，本次交易构成关联交易；公司实际控制人为国务院国有资产监督管理委员会"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN201810231219556196_1.pdf?1647697305000.pdf"

风险与困境:
  - 时间: "2015-12-31"
    事项: "子公司新阳洲 2014 年度未完成承诺业绩、需补偿的利润为 439 万元，2015 年 12 月 2 日张福赐将其持有的新阳洲 2% 股权无偿转让给公司以弥补 2014 年承诺业绩；新阳洲 2015 年度实现利润 -25,664 万元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000798&id=5573987"
  - 时间: "2026-06-30"
    事项: "公司因张福赐未完成 2015 年业绩承诺要求张福赐与张福庆承担违约责任，涉案金额 28,386 万元（已形成预计负债），北京仲裁委裁决张福赐应向公司支付 2015 年业绩承诺差额 23,027,761.52 元；除已披露重大诉讼外，其他未达披露标准诉讼涉案总金额 314.0471 万元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000798&id=12512045"
  - 时间: "2024-12-31"
    事项: "2024 年归属于上市公司股东的净利润 -104,014,079.65 元、扣非后 -114,681,601.64 元，加权平均净资产收益率 -25.44%；2023 年归母净利润 -118,084,803.52 元、扣非后 -165,823,242.95 元"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-03-27/42db72cc-bc52-4e41-8437-674909da2a36.PDF"
  - 时间: "2026-03-26"
    事项: "公司披露 2025 年度计提减值准备公告：2025 年度计提信用减值损失合计 17,882,779.77 元、计提资产减值损失合计 65,694,901.32 元（主要为存货及合同履约成本减值损失），两项合计 83,577,681.09 元，相应减少 2025 年度利润总额 83,577,681.09 元"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202603261820775952_1.pdf"
  - 时间: "2025-12-31"
    事项: "公司 2025 年年度报告披露行业风险：受全球气候变化影响世界野生渔业资源不确定性上升，2025 年鱿鱼和虾类捕捞资源显著恢复、捕捞产量同比大幅增加，但金枪鱼等捕捞资源仍未改善，公司主要捕捞品种在各洋区资源波动较为明显"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000798&id=12024408"
  - 时间: "2026-09-08"
    事项: "公司披露股票交易异常波动公告，提示主营业务未发生变化且存在业绩不确定的风险：后续经营受行业周期波动、市场变化、上游原料价格等多重不确定因素影响"
    来源: "https://static.cninfo.com.cn/finalpage/2026-09-08/1225552207.PDF"

战略与转型:
  - 时间: "2020"
    事项: "公司继续坚持“捕捞为基、构筑平台、调整结构、升级转型”的战略方针，战略实施重点由巩固捕捞基础向产业链后端延伸，收购超低温金枪鱼项目、丰汇项目后与原低温金枪鱼项目实现深度融合，并计划建设金枪鱼研发、加工中心、在舟山建设国内渔业综合基地"
    来源: "http://pdf.dfcfw.com/pdf/H2_AN202104021480683441_1.PDF"
  - 时间: "2023-06-15"
    事项: "重组报告书披露：本次交易将整合中国农发集团优质渔业资产，远洋捕捞船队由 74 艘拓展至 186 艘（涵盖金枪鱼延绳钓船、围网船、拖网船、鱿鱼钓船等），捕捞品种拓展至金枪鱼、鱿鱼、硬体鱼、软体鱼、野生虾、南极磷虾等；上市公司在远洋捕捞、水产品贸易的基础上新增水产品加工、渔业服务等多元化业务，形成更为稳定的盈利模式，并有利于解决与标的公司金枪鱼领域的同业竞争、消除与舟渔公司在秋刀鱼捕捞和鱿鱼贸易领域的业务重合"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000798&id=9291921"
  - 时间: "2025-12-31"
    事项: "2025 年年度报告提出大力发展现代化远洋捕捞（投资建造和更新符合国际标准的新型专业化、标准化、现代化远洋渔船，重点做好围网、捕虾和供油等项目船舶更新改造），并推进延链和品牌建设、做好舟山明珠工业园的生产研发与贸易企业市场销售"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-03-27/dafe4d97-de86-47d8-b022-33ee3934b37b.PDF"
  - 时间: "2026-08-21"
    事项: "公司提出构建“大中水、大远洋、大渔业”新发展格局，业务覆盖远洋捕捞、水产品加工贸易、海上渔业服务全板块；旗下拥有“明珠”（中国驰名商标、中华老字号）“中水远洋”“中渔鲜境”“中水海中金”“海思康”等品牌，远洋渔业主业经营规模位居国内前列"
    来源: "https://www.cs.com.cn/ssgs/01/2026/08/21/detail_2026082110032975.html"

融资需求线索:
  - 时间: "2023"
    事项: "以支付现金方式实施 17.15 亿元重大资产购买并申请 11.00 亿元并购贷款（详见融资历史）；该交易导致资产负债率由 28.97% 上升至 68.57%，公司此后主要通过经营现金流与融资滚动安排消化，截至检索未查得新的股权融资预案"
    来源: "http://reportdocs.static.szse.cn/UpFiles/fxklwxhj/LSD000798179233103839HF.pdf"
  - 时间: "2026-03-26"
    事项: "重大资产购买业绩承诺期（2023—2025 年）届满，业绩承诺资产均已完成业绩承诺，经中金公司核查的减值测试结果显示业绩承诺资产未发生减值，业绩承诺方无需现金补偿；公司未披露新的资产注入或再融资方案"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202603261820775996_1.pdf"

