代码: "002458"
名称: "益生股份"
定位: "国内最大的祖代白羽肉种鸡企业，祖代肉种鸡饲养规模连续二十年居全国第一，形成“种鸡＋种猪”双轮驱动；2026 年上半年受益白羽肉鸡行业景气上行与引种受限，净利润同比增长近 49 倍。"
沿革:
  - 年: "1997"
    事件: "4 月 22 日主体设立（山东益生种畜禽股份有限公司），总部位于山东省烟台市福山区"
    来源: "https://finance.sina.com.cn/stock/aiassist/lr/2026-09-07/doc-iniqyeue6395545.shtml"
  - 年: "2010"
    事件: "7 月 28 日发行、8 月 10 日在深交所中小板上市，发行 2,700 万股（网下配售 540 万股、网上定价发行 2,160 万股），发行价 24.00 元/股，发行后总股本 10,800 万股"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002458&id=589553"
  - 年: "2010"
    事件: "招股说明书披露拟募资用于扩大种鸡产能等项目；主承销商安信证券，发行市盈率 32.43 倍"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=002458&id=584828"
  - 年: "2023"
    事件: "完成 2022 年度向特定对象发行股票，募集资金总额 11.6 亿元，用于种猪养殖、种鸡孵化场项目及补充流动资金"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002458&id=12018271"
  - 年: "2025"
    事件: "全年累计引进祖代白羽肉种鸡 26.6 万套，占全国祖代肉种鸡进口总量的 43%，引种量逆势同比增长，稳居行业首位"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2026/01/20/1224942544.PDF"
主营与结构:
  - 事件: "以高代次畜禽种源供应为核心：祖代肉种鸡存栏 40 多万套（满产），父母代肉种鸡存栏规模 700 万套，年销售商品代鸡苗 6 亿多羽"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2026/01/20/1224942544.PDF"
  - 事件: "业务涵盖曾祖代/祖代/父母代/商品代肉种鸡饲养与雏鸡销售、种猪及商品猪饲养销售、农牧设备、饲料、奶牛饲养及牛奶销售、有机肥等"
    来源: "https://finance.sina.com.cn/stock/aiassist/lr/2026-09-07/doc-iniqyeue6395545.shtml"
  - 事件: "2026 年上半年鸡业务实现收入 14.22 亿元（同比 +41.24%），占营业收入 83.78%；父母代肉种鸡销量和销售均价同比均大幅上涨，为核心利润来源"
    来源: "https://m.21jingji.com/article/20260727/herald/3dbb32933f66ded7c415ad91ee138c4a.html"
  - 事件: "2026 年上半年营业收入 16.97 亿元（同比 +28.44%），归母净利润 3.08 亿元（同比 +4,897.29%），扣非归母净利润 3.07 亿元（同比 +9,002.55%）；拟每 10 股派现金红利 1.5 元（含税）"
    来源: "https://www.thepaper.cn/newsDetail_forward_33641603"
融资历史:
  - 时间: "2010-08"
    方式: "IPO（深交所中小板）"
    规模: "2,700 万股，发行价 24.00 元/股（约 6.48 亿元）"
    用途: "种鸡养殖及孵化产能扩张等项目"
    说明: "证监许可[2010]752 号核准；主承销商安信证券"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002458&id=589553"
  - 时间: "2016-01"
    方式: "定向增发（非公开发行）"
    规模: "51,314,641 股，发行价 11.55 元/股，募集资金总额 592,684,103.55 元、净额 582,684,103.55 元"
    用途: "种鸡养殖项目等"
    说明: "承销及保荐费用 1,000 万元；为公司 2016 年至 2021 年之前的最近一次再融资"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002458&id=9283811"
  - 时间: "2021-10"
    方式: "可转换公司债券（申请未获核准）"
    规模: "原拟公开募集不超过 10.4 亿元，修订稿缩减为 8.9 亿元"
    用途: "4 个种猪养殖项目、3 个饲料生产项目和 2 个种鸡孵化场项目（修订后各砍掉一个种猪、种鸡项目）"
    说明: "公司 2022 年公告可转债发行申请未获证监会核准，随后转向定增融资"
    来源: "http://www.stcn.com/article/detail/839042.html"
  - 时间: "2022-09-29"
    方式: "定向增发（2022 年度向特定对象发行股票）"
    规模: "113,502,935 股，发行价 10.22 元/股，募集资金总额 11.60 亿元、净额 11.3911 亿元"
    用途: "种猪养殖项目（双鸭山祖代种猪场 3.9 亿元、山西 3,600 头能繁原种母猪场及公猪站 1.6 亿元等）、种鸡孵化场项目及补充流动资金、偿还银行贷款"
    说明: "2022 年 9 月 29 日披露预案（拟募资不超过 11.6 亿元）；证监许可〔2023〕1598 号同意注册；募集资金 2023 年 11 月 24 日到位，2023 年 12 月 14 日相关股份上市"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002458&id=12018271"
风险与困境:
  - 时间: "2023-04-11"
    事项: "公司收到深交所出具的《关于山东益生种畜禽股份有限公司申请向特定对象发行股票的审核问询函》，涉及 17 个问题；此前可转债申请未获证监会核准，公司被媒体描述为“募资之路坎坷不断”"
    来源: "http://www.stcn.com/article/detail/839042.html"
  - 时间: "2023-04-18"
    事项: "2022 年度不派发现金红利、不送红股、不以公积金转增股本（当年种鸡行业景气度低迷）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002458&id=9001733"
  - 时间: "2026-02-2026-03"
    事项: "2025 年 11 月至 12 月法国种鸡主产区（曼恩-卢瓦尔省、阿摩尔滨海省）暴发禽流感，我国祖代肉种鸡引种处于暂停状态，公司 2026 年 2 月和 3 月暂无引种计划，种源供应存在不确定性"
    来源: "https://finance.sina.com.cn/stock/relnews/cn/2026-03-20/doc-inhrqtzi6928928.shtml"
战略与转型:
  - 时间: "2020-2021"
    事项: "推进种猪业务布局：2020 年以 496 万元、1,558 万元分别收购河北双鸽钰农畜牧科技、灵寿县育博养殖 100% 股权，2021 年以 1,360 万元收购河北润源养殖 100% 股权；先后设立威海益生种猪繁育、山西益生种猪繁育、双鸭山益生种猪科技等公司，形成种鸡与种猪双轮驱动"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202203021550115208_1.pdf"
  - 时间: "2021"
    事项: "公司从丹麦引进 1,300 头纯种母猪，种猪业务已有 4 个种猪场投入使用"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202203021550115208_1.pdf"
  - 时间: "2023-12"
    事项: "11.6 亿元定增完成，募投项目逐步投入使用后种猪产量提升，公司明确朝“种鸡和种猪双轮驱动”战略目标推进"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002458&id=9859571"
  - 时间: "2024-03"
    事项: "2023 年度利润分配：以总股本 1,106,412,915 股为基数，每 10 股派发现金红利 2 元（含税）"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-3/2024-03-07/9859557.PDF"
  - 时间: "2026-07"
    事项: "2026 年半年度拟每 10 股派发现金红利 1.5 元（含税）；业绩增长主要受白羽肉鸡苗量价齐升带动"
    来源: "https://finance.sina.com.cn/wm/2026-07-22/doc-iniistty7952219.shtml"
融资需求线索:
  - 时间: "2025-2026"
    事项: "公司推进“质量回报双提升”行动方案：2025 年累计引进祖代白羽肉种鸡 26.60 万套，占全国祖代肉种鸡进口总量超 42%，依托稳定种源供应保障产业链安全"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002458&id=12018250"
  - 时间: "2026-01"
    事项: "2025 年定增募集资金使用情况：累计使用 75,457.92 万元（占 66.24%），其中 18,500 万元暂时补充流动资金、17,106.24 万元已永久性补充流动资金，剩余存放于募集资金专户"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002458&id=12457778"
其他要点:
  - 要点: "2025 年全国祖代白羽肉鸡引种量约 62 万套（同比下降超 10%），公司引种 26.6 万套同比增加、占比 43%，其他祖代企业引种量同比下降超 20%"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202601111816919913_1.pdf"
  - 要点: "公司祖代肉种鸡饲养规模连续二十年雄居全国第一，是我国最大的白羽肉鸡苗销售企业"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2026/01/20/1224942544.PDF"
  - 要点: "2026 年第一季度净利润 1.03 亿元、第二季度 2.04 亿元，环比增长约 97%"
    来源: "https://finance.sina.com.cn/wm/2026-07-22/doc-iniistty7952219.shtml"
  - 要点: "2026 年上半年经营活动现金流量净额显著改善，鸡业务收入占营业收入 83.78%"
    来源: "http://dz.jjckb.cn/www/pages/webpage2009/html/2026-07/28/content_117537.htm"
