代码: "605198"
名称: "安德利"
定位: "烟台北方安德利果汁股份有限公司，山东安德利集团旗下企业，全球主要浓缩果汁加工企业之一，主营浓缩苹果汁、浓缩梨汁等多品种浓缩果汁；2003 年 H 股在港上市、2020 年回归 A 股，为国内首家饮料类“A+H”双上市企业，2026 年拟跨界收购电子材料资产。"
沿革:
  - 年: "1996"
    事件: "公司创建于 1996 年，是山东安德利集团的支柱企业"
    来源: "https://finance.sina.com.cn/stock/relnews/cn/2025-02-14/doc-ineknexa6612399.shtml"
  - 年: "2003"
    事件: "2003 年 4 月 22 日公司股票在香港联交所创业板上市（股份代号 8259），为国内果汁企业首家在香港上市的公司"
    来源: "https://www.hkexnews.hk/listedco/listconews/sehk/2026/0327/2026032703935_c.pdf"
  - 年: "2011"
    事件: "2011 年 1 月 19 日 H 股由香港联交所创业板转往主板买卖（股份代号 02218）并于同日自创业板除牌"
    来源: "https://www.hkexnews.hk/listedco/listconews/sehk/2026/0327/2026032703935_c.pdf"
  - 年: "2020"
    事件: "2020 年 9 月 18 日 A 股在上海证券交易所上市（证券简称后由“德利股份”变更为“安德利”，代码 605198），成为国内第一家饮料类、烟台市第一家“A+H”双上市企业"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2024-06-15/605198_20240615_XDPQ.pdf"
  - 年: "2023"
    事件: "在永济新建 40 吨浓缩桃汁及 10 吨浓缩山楂汁生产线一条，并通过竞拍在新疆设厂，产业布局由 6 省 8 个工厂增至 7 省 9 个工厂，生产线由 16 条增至 18 条"
    来源: "https://www.stcn.com/article/detail/1200611.html"
主营与结构:
  - 事件: "主营业务为浓缩果汁的加工生产及销售，是全球主要的浓缩果汁加工企业之一；主要产品由浓缩苹果汁、浓缩梨汁和果糖逐渐发展为多品种浓缩果汁"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-3/2024-03-07/9860136.PDF"
  - 事件: "近年来持续扩大生产并通过并购扩大产能，形成 7 省 9 个工厂、18 条生产线的产能布局"
    来源: "https://www.stcn.com/article/detail/1200611.html"
  - 事件: "2025 年实现营业总收入 16.77 亿元，同比增长 18.28%；利润总额 3.30 亿元，同比增长 26.51%；归母净利润 3.30 亿元，同比增长 26.71%；扣非净利润 3.19 亿元，同比增长 22.15%"
    来源: "https://finance.eastmoney.com/a/202603283687744019.html"
