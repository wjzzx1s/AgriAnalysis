代码: "603363"
名称: "傲农生物"
定位: "福建饲料起家、后跨界养猪的农牧企业；2024 年末完成破产重整，控股股东变更为泉州国资牵头联合体且无实际控制人，2026 年上半年猪价低迷亏损 1.90 亿元。"
沿革:
  - 年: "2011"
    事件: "4 月 26 日成立（福建傲农生物科技集团股份有限公司）"
    来源: "http://static.sse.com.cn/stock/disclosure/announcement/c/202303/603363_20230304_VHB4.pdf"
  - 年: "2017"
    事件: "9 月 26 日在上海证券交易所主板上市，首次公开发行 6,000.00 万股、发行价 4.79 元/股，募集资金总额 28,740.00 万元"
    来源: "http://static.sse.com.cn/stock/disclosure/announcement/c/202303/603363_20230304_VHB4.pdf"
  - 年: "2020"
    事件: "5 月完成非公开发行股票，募集资金总额 13.90 亿元、净额 13.65 亿元，其中 4.10 亿元用于偿还银行贷款"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603363&id=6973184"
  - 年: "2022"
    事件: "4 月采用非公开发行方式向 3 名特定对象发行 130,198,914 股，募集资金 143,252.18 万元，5 月 6 日完成登记"
    来源: "http://static.sse.com.cn/stock/disclosure/announcement/c/202303/603363_20230304_BGQB.pdf"
  - 年: "2024"
    事件: "5 月 6 日起因 2023 年末经审计净资产为负值被实施退市风险警示，股票简称变为“*ST傲农”；11 月 5 日漳州中院裁定受理债权人广州市联鲲生物科技有限公司对公司提出的重整申请"
    来源: "https://epaper.stcn.com/pic/202504/12/30c1347766537b27e2fa9daf97515013.pdf"
  - 年: "2024"
    事件: "12 月 26 日漳州中院裁定确认重整计划执行完毕并终结重整程序；控股股东由漳州傲农投资变更为重整产业投资人联合体，公司变更为无实际控制人"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260830/9c580871c846414b86705ec848d99c75.PDF"
  - 年: "2026"
    事件: "6 月 2 日完成 2026 年限制性股票激励计划首次授予限制性股票 12,810 万股登记，股份总数由 2,605,582,626 股增至 2,731,061,826 股"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260907/3e37dd77621247259c1b88c8b1a33eef.PDF"
主营与结构:
  - 事件: "2026 年上半年营业收入 45.21 亿元（+14.25%）、归母净利润 -1.90 亿元、扣非净利润 -2.52 亿元；饲料外销量 97.36 万吨、收入 31.43 亿元（毛利率 5.51%）；生猪销量 110.08 万头、收入 7.64 亿元；屠宰量 83.17 万头、屠宰与肉制品收入 6.03 亿元（毛利率 7.64%）"
    来源: "https://pdf.dfcfw.com/pdf/H22_AN202609091829178175_1.pdf"
  - 事件: "2026 年上半年生猪出栏量同比增加 40.53%（78.33 万头→110.08 万头），主要系提升现有栏位产能利用率、稳步恢复优势产能；养殖业务毛利率 -18.92%，同比减少 36.58 个百分点"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-8/2026-08-31/12574122.PDF"
  - 事件: "公司历史能繁母猪存栏峰值超 30 万头；截至 2026 年 6 月末能繁母猪存栏约 11 万头，8 月末基本维持该水平"
    来源: "https://pdf.dfcfw.com/pdf/H22_AN202609091829178175_1.pdf"
  - 事件: "重整后饲料业务恢复动能较强，猪前期料、特种水产料品牌优势持续巩固，产能利用率稳步回升；2026 年上半年财务费用同比下降 18.33%"
    来源: "https://finance.sina.com.cn/stock/aigc/agcbld/2026-08-31/doc-iniqcrzf4832503.shtml"
  - 事件: "2026 年半年报前 10 名股东中包括公司破产企业财产处置专用账户、厦门国际信托—傲创致和 1 号（4.27%）、兴业银行股份有限公司漳州分行（3.26%，国有法人）"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260830/a8321588afc1464eaa3b1f1e36472458.PDF"
