    事项: "法院裁定终结重整程序后，公司被撤销因重整实施的退市风险警示；但仍因 2023 年经审计净资产为负值、近三年连续亏损等情形保留退市风险警示与其他风险警示，股票简称仍为“*ST傲农”；2026 年半年报相关报道称公司已完成重整“摘帽”后再现中期亏损"
