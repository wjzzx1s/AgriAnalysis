风险与困境:
  - 时间: "2021—2023"
    事项: "2021—2023 年连续亏损，且 2023 年度经审计的期末归属于上市公司股东的净资产为负值，触及上交所股票上市规则 9.3.2 条，2024-05-06 起被实施退市风险警示（*ST）"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2025/04/30/1223410308.PDF"
  - 时间: "2024"
    事项: "2024 年共发布 26 份新增部分债务逾期公告；截至 2024-11-26，公司在银行、融资租赁公司等金融机构累计逾期债务本息达到最近一期经审计净资产的 547.73%"
    来源: "https://finance.sina.com.cn/money/future/wemedia/2025-01-14/doc-ineewwwf8902403.shtml"
  - 时间: "2025-04-22"
    事项: "因公司涉嫌信息披露违法违规，中国证监会决定对公司立案"
    来源: "https://www.stcn.com/article/detail/3781714.html"
  - 时间: "2026-09-02"
    事项: "公司及相关当事人收到福建证监局《行政处罚事先告知书》：公司被罚 250 万元，公司及 4 名高管合计被罚 565 万元；所涉信息披露违法违规行为发生于 2025-03-26 及以前，公司称已自查自纠整改"
    来源: "https://finance.sina.com.cn/roll/2026-09-03/doc-iniqnyaa4327256.shtml"
  - 时间: "2026-H1"
    事项: "2026 年上半年由盈转亏：归母净利润 -1.90 亿元、扣非 -2.52 亿元（上年同期含重整收益基数）；期末净资产同比缩水，期间不实施任何分红及股本转增"
    来源: "https://finance.eastmoney.com/a/202608303859473613.html"
  - 时间: "2024"
    事项: "2022 年度向特定对象发行股票事项终止：方案原拟募集不超过 18 亿元，后调整为不超过 17.78 亿元、再调整为不超过 14.26 亿元，最终公司决定终止增发计划"
    来源: "https://www.stcn.com/article/detail/1116321.html"
战略与转型:
  - 时间: "2024-09-30"
    事项: "与产业投资人泉州发展集团有限公司、厦门谷味德食品有限公司、湖北省粮食有限公司、深圳市前海宏丰私募证券基金管理有限公司、晋江永初贸易有限公司及中国对外经济贸易信托有限公司等共 14 家投资人签署《重整投资协议》"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=&id=10510607"
