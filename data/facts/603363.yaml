    事项: "重整后剥离部分闲置资产、保留规模猪场有序复产，聚焦饲料、养猪、屠宰食品的产业链协同"
    来源: "https://www.stcn.com/article/detail/3781714.html"
  - 时间: "2026"
    事项: "推出 2026 年限制性股票激励计划（拟授予 13,900 万股，占草案公告时股本总额的 5.34%；首次授予 12,900 万股），2026-06-02 完成首次授予登记 12,810 万股"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202604081821065957_1.pdf"
