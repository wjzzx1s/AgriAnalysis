主营与结构:
  - 事件: "公司是我国宠物食品行业较早实施“走出去”的企业，已在越南、新西兰、柬埔寨等国家建立多个生产基地，产品涉及高端主粮、宠物零食等多个品类；其中越南、柬埔寨工厂产能合计超 3 万吨，主要生产宠物零食产品，以 ODM 模式向欧美客户提供产品研发和制造等整套宠物零食供应链服务"
