代码: "300673"
名称: "佩蒂股份"
定位: "浙江温州平阳起家的宠物食品（畜皮咬胶、植物咬胶、营养肉质零食、主粮）出口企业，2017 年 7 月创业板上市，是国内宠物食品行业最早“走出去”经营的企业之一，在越南（好嚼、巴啦啦、德信）、柬埔寨（爵味）、新西兰（北岛小镇、天然纯）建有生产基地，以 ODM 模式向欧美客户提供宠物零食供应链服务；2020 年定增募资 5.31 亿元、2021 年发行 7.2 亿元“佩蒂转债”，2026 年上半年营业收入 7.35 亿元、归母净利润 2,432.07 万元、同比下降 69.25%，控股股东陈振标持股 32.55% 且无质押。"

