  - 事件: "公司在新西兰建有产能规模为 4 万吨的宠物主粮产线，充分依托当地高品质农副产品资源和严格的生产管理；公司在巩固美国市场领先地位的同时加速布局欧洲市场"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300673&id=12524069"
  - 事件: "国内生产基地中温州和平阳是公司总部所在地，江苏泰州工厂主要生产新型主粮和湿粮；海外越南拥有越南好嚼、越南巴啦啦和越南德信三大工厂，柬埔寨爵味工厂处于产能快速爬坡阶段，新西兰干粮产线已建成"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202412101641240864_1.pdf"
