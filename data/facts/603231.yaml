- 事件: 主要子公司山东万得福生物科技有限公司（生物科技）主营大豆蛋白系列产品的研发、生产及销售，注册资本 31,981.75 万元；2025 年上半年该公司实现营业收入 85,537.59 万元、营业利润 76,080.33 万元口径数据见半年报分部披露
