代码: '603231'
名称: 索宝蛋白
定位: 宁波的大豆蛋白深加工企业，2023 年 12 月 15 日在上交所主板上市，产品涵盖大豆分离蛋白、大豆浓缩蛋白、组织化蛋白与非转基因大豆油，主要生产子公司为山东万得福生物科技有限公司，控股股东山东万得福实业集团、实际控制人刘季善。IPO 净额 9.79 亿元、超募 4.25 亿元，2025 年营收 17.48 亿元、归母净利润 1.90 亿元同比增 56.56%；2026 年上半年增收不增利，且多个募投项目出现延期与变更。
沿革:
- 年: '2023'
  事件: 经中国证监会《关于同意宁波索宝蛋白科技股份有限公司首次公开发行股票注册的批复》（证监许可[2023]1851 号）同意注册，并经上海证券交易所同意，公司于 2023 年 12 月 15 日在上海证券交易所主板首次公开发行人民币普通股（A 股）4,786.48 万股并在主板上市，证券简称索宝蛋白，证券代码 603231；本公司股本为 191,459,105 股，其中 46,905,498 股于 2023 年 12 月 15 日起上市交易
  来源: https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603231&id=9709616
- 年: '2025'
  事件: 4 月 23 日第三届董事会第三次会议和第三届监事会第三次会议审议通过《关于部分募投项目延期的议案》，将 3 万吨大豆组织拉丝蛋白生产线建设项目达到预定可使用状态的日期调整至 2026 年 12 月；10 月 30 日第三届董事会第五次会议及第三届监事会第五次会议审议通过《关于部分募投项目变更并向全资子公司增资以实施募投项目的议案》，并于 11 月 17 日经 2025 年第一次临时股东大会决议通过
  来源: https://stockmc.xueqiu.com/202604/603231_20260424_9LCA.pdf
- 年: '2026'
  事件: 1 月 13 日公司完成工商变更登记
  来源: http://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin.php?stockid=603231&Page=1
股权与控制权:
- 时间: '2026-07-28'
  事项: 控股股东为山东万得福实业集团有限公司，增持前持有公司股票 82,748,091 股、占公司总股本 43.22%；刘季善先生通过万得福集团间接持有公司股份；2025 年半年度报告披露实际控制人控制不当的风险，指出万得福集团持股 43.22% 仍处于相对控股地位
  来源: https://paper.cnstock.com/html/2026-07/28/content_2249089.htm
