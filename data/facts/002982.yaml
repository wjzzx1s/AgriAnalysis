代码: "002982"
名称: "湘佳股份"
定位: "湖南石门的黄羽肉鸡一体化企业，集饲料、种禽、养殖、屠宰、冷链与冰鲜禽肉销售于一体，被称为“中国生鲜家禽第一股”，并延伸至生猪养殖；2025年归母净利润3,294.67万元，2026年上半年由盈转亏。"
沿革:
  - 年: "2003"
    事件: "前身湖南双佳农牧科技有限公司由喻自文、邢卫民共同出资组建，2003年4月8日在石门县工商行政管理局登记注册，初始注册资本800万元"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-21/a3b01e22-7b3a-4536-ab72-a863009969f6.PDF"
  - 年: "2012"
    事件: "以2012年3月31日为基准日整体变更为湖南湘佳牧业股份有限公司，2012年6月18日在常德市工商行政管理局办妥登记注册"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-21/a3b01e22-7b3a-4536-ab72-a863009969f6.PDF"
  - 年: "2022"
    事件: "经证监许可〔2021〕1814号核准，公开发行可转换公司债券“湘佳转债”640万张，募集资金于2022年4月25日汇入募集资金监管账户"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=840644775542&code=002982&dannoun=lcdetail&announ=lc"
股权与控制权:
  - 事项: 控股股东、实际控制人喻自文与邢卫民系一致行动人，各持45,080,000股（均占22.19%），各质押2,100,000股；喻薇融为喻自文之女、邢成男为邢卫民之女、吴志刚为喻自文外甥女婿，均为一致行动人。
    来源: https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-08-22/2c996016-4d84-4c3c-845a-93fd903644ba.PDF
  - 事项: 截至2026年3月底，喻自文与邢卫民合计持有的公司股份占公司总股本的44.38%，质押比例占总股本的2.07%，公司总股本为20,319.41万股。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002982&id=12389996
主营与结构:
  - 事件: "主要产品为中国地方优质家禽系列产品，包括活鸡、活鸭及鸡鸭肉冰鲜产品；黄羽肉鸡主要品种为麻鸡、青脚鸡、竹丝鸡、黑土鸡、土三黄、石门土鸡等，使用自主注册的“湘佳”商标"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002982&id=12121044"
  - 事件: "2025年实现营业收入44.71亿元（同比+6.35%），其中活禽业务收入8.91亿元（同比-3.59%）、冰鲜业务收入27.12亿元（同比+5.86%）；全年归母净利润3,294.67万元"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-21/a3b01e22-7b3a-4536-ab72-a863009969f6.PDF"
  - 事件: "2025年出栏活禽9,949.57万羽，其中销售活禽4,756.02万羽，销售冰鲜产品124,436.60吨；截至2025年末公司已有全资及控股子公司24家，总资产45.07亿元（较上年末+8.16%）"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-21/a3b01e22-7b3a-4536-ab72-a863009969f6.PDF"
  - 事件: "2023年归母净利润-14,715.15万元，2024年归母净利润9,809.73万元，2025年归母净利润3,294.67万元（同比-66.41%）"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-21/12121044.PDF"
  - 事件: "2025年公司主营业务及主要产品未发生重大变化"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002982&id=12121044"
竞争优势:
  - 事项: 在黄羽肉鸡冰鲜禽肉领域位居行业龙头，建成涵盖饲料生产、种禽繁育、家禽饲养、禽类屠宰加工及销售的全产业链，销售网络覆盖北京、上海等地。
    来源: https://static.weeklyonstock.com/26/0821/ABB2616254297676.html
  - 事项: 保持屠宰加工、冷链物流、冰鲜自营等全产业链竞争优势，与盒马鲜生、山姆、Costco等新零售连锁超市建立战略合作关系，冰鲜产品经营规模扩大。
    来源: https://static.weeklyonstock.com/26/0821/ABB2616254297676.html
行业基本面:
  - 事项: 2026年上半年黄羽鸡行业持续深度亏损，华东地区商品毛鸡出栏均价仅9.5元/公斤，而行业平均养殖成本约12元/公斤，单只商品鸡亏损5—8元。
    来源: https://www.jbzyw.com/view/515297
  - 事项: 2026年上半年全国禽肉产量1,390万吨、同比增长9.45%，白羽肉鸡约占肉鸡出栏量的68.5%、黄羽肉鸡约占24.1%、地方土杂鸡约占7.4%。
    来源: https://www.sohu.com/a/1056074504_121124575
经营要点:
  - 事项: 2026年上半年营业总收入23.16亿元、同比增长8.57%；归母净利润-1,209.48万元、同比下降306.82%、由盈转亏，主因黄羽肉鸡行业行情低迷；经营活动现金流量净额8,354.19万元。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002982&id=12515454
  - 事项: 2026年上半年冰鲜产品收入13.60亿元，占营业收入的58.72%（上年同期为58.53%），公司营业收入全部来自养殖业。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002982&id=12515454
  - 事项: 主营种禽繁育、家禽饲养及销售、禽类屠宰加工及销售，黄羽肉鸡品种含麻鸡、青脚鸡、竹丝鸡、石门土鸡等，肉鸭以番鸭、樱桃谷肉鸭为主。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002982&id=12515454
