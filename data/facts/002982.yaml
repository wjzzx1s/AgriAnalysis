代码: "002982"
名称: "湘佳股份"
定位: "湖南石门的黄羽肉鸡一体化企业，集饲料、种禽、养殖、屠宰、冷链与冰鲜禽肉销售于一体，被称为“中国生鲜家禽第一股”，并延伸至生猪养殖；2025年归母净利润3,294.67万元，2026年上半年由盈转亏。"
沿革:
  - 年: "2003"
    事件: "前身湖南双佳农牧科技有限公司由喻自文、邢卫民共同出资组建，2003年4月8日在石门县工商行政管理局登记注册，初始注册资本800万元"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-21/a3b01e22-7b3a-4536-ab72-a863009969f6.PDF"
  - 年: "2012"
    事件: "以2012年3月31日为基准日整体变更为湖南湘佳牧业股份有限公司，2012年6月18日在常德市工商行政管理局办妥登记注册"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-21/a3b01e22-7b3a-4536-ab72-a863009969f6.PDF"
  - 年: "2020"
    事件: "2020年4月15日开启申购，2020年4月24日在深圳证券交易所上市（中小板），发行价29.63元/股，成为常德市第六家上市公司、“中国生鲜家禽第一股”"
    来源: "https://dfjrjgj.hunan.gov.cn/dfjrjgj/tslm_71665/jrzx/202004/t20200416_11955062.html"
  - 年: "2022"
    事件: "经证监许可〔2021〕1814号核准，公开发行可转换公司债券“湘佳转债”640万张，募集资金于2022年4月25日汇入募集资金监管账户"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=840644775542&code=002982&dannoun=lcdetail&announ=lc"
主营与结构:
  - 事件: "公司是一家以黄羽肉鸡产业为主导的国家级农业产业化重点龙头企业，集饲料生产、种禽繁育、禽苗孵化、商品鸡养殖、屠宰加工、冷链物流、生鲜禽肉销售、有机肥产销为一体"
    来源: "https://dfjrjgj.hunan.gov.cn/dfjrjgj/tslm_71665/jrzx/202004/t20200416_11955062.html"
  - 事件: "主要产品为中国地方优质家禽系列产品，包括活鸡、活鸭及鸡鸭肉冰鲜产品；黄羽肉鸡主要品种为麻鸡、青脚鸡、竹丝鸡、黑土鸡、土三黄、石门土鸡等，使用自主注册的“湘佳”商标"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002982&id=12121044"
  - 事件: "2025年实现营业收入44.71亿元（同比+6.35%），其中活禽业务收入8.91亿元（同比-3.59%）、冰鲜业务收入27.12亿元（同比+5.86%）；全年归母净利润3,294.67万元"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-21/a3b01e22-7b3a-4536-ab72-a863009969f6.PDF"
  - 事件: "2025年出栏活禽9,949.57万羽，其中销售活禽4,756.02万羽，销售冰鲜产品124,436.60吨；截至2025年末公司已有全资及控股子公司24家，总资产45.07亿元（较上年末+8.16%）"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-21/a3b01e22-7b3a-4536-ab72-a863009969f6.PDF"
  - 事件: "2023年归母净利润-14,715.15万元，2024年归母净利润9,809.73万元，2025年归母净利润3,294.67万元（同比-66.41%）"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-21/12121044.PDF"
  - 事件: "2025年公司主营业务及主要产品未发生重大变化"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002982&id=12121044"
融资历史:
  - 时间: "2020-04"
    方式: "IPO（深交所中小板，证监许可〔2020〕41号）"
    规模: "发行25,630,000股，发行价29.63元/股，募集资金总额759,416,900.00元，扣除发行费用后实际募集资金净额645,635,700.00元"
    用途: "1,250万羽优质鸡标准化养殖基地建设项目（计划26,980.00万元）、年屠宰3,000万羽优质鸡加工厂项目（一期，计划13,583.57万元）、补充流动资金7,000.00万元、偿还银行贷款17,000.00万元"
    说明: "发行前总股本7,625万股，发行后10,188万股；资金到位情况由天健会计师事务所验证（天健验〔2020〕2-9号）"
    来源: "http://static.cninfo.com.cn/finalpage/2024-04-10/1219550513.PDF"
  - 时间: "2022-04"
    方式: "公开发行可转换公司债券“湘佳转债”（证监许可〔2021〕1814号）"
    规模: "发行640.00万张，每张面值100.00元，按面值发行，发行总额64,000.00万元；扣除承销及保荐费720.00万元后实际到账63,280.00万元，扣除其他发行费用233.65万元后募集资金净额63,046.35万元"
    用途: "1,350万羽优质鸡标准化养殖基地建设项目、1万头种猪养殖基地项目和补充流动资金"
    说明: "期限6年，到期兑付日2028年4月19日；初始转股价格42.56元/股，2023年9月28日调整为30.26元/股，2025年5月30日调整为21.13元/股；截至2023年底募集资金用途未变更、累计投入3.92亿元"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=840644775542&code=002982&dannoun=lcdetail&announ=lc"
  - 时间: "2024年度"
    方式: "利润分配（现金分红＋资本公积转增股本）"
    规模: "每10股派发现金红利1元（含税）、以资本公积金每10股转增4股"
    用途: "股东回报"
    说明: "2025年度分配预案为每10股派1元（含税）"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002982&id=10897748"
