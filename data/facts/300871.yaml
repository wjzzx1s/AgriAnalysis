  - 事件: "公司是一家主营兽用药品（包括化药制剂、原料药、中药制剂）、饲料及添加剂的高新技术企业，是农业产业化国家重点龙头企业和全国农业农村信息化示范基地；截至2025年12月31日已取得兽药批准文号317个，产品广泛应用于生猪、家禽、水产、反刍及宠物等领域。"
