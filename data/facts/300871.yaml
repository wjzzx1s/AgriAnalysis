代码: "300871"
名称: 回盛生物
定位: "武汉的兽药企业，全称武汉回盛生物科技股份有限公司，2002年1月25日成立，2020年8月24日在深圳证券交易所创业板上市；主营兽用药品（化药制剂、原料药、中药制剂）及饲料与添加剂，是农业产业化国家重点龙头企业，截至2025年12月31日已取得兽药批准文号317个，产品应用于生猪、家禽、水产、反刍及宠物等领域。控股股东为武汉统盛投资有限公司（持股41.03%），实际控制人为张卫元、余姣娥夫妇，张卫元任董事长。2025年归母净利润2.53亿元、同比增长1356.01%（2024年为亏损0.20亿元）；2026年上半年归母净利润2.06亿元、同比增长75.59%。2026年4月推出逾两年的2024年度定增方案到期失效，5月被深交所终止审核。"

