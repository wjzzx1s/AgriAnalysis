代码: "600313"
名称: "农发种业"
定位: "中国农业发展集团有限公司（中国农发集团）旗下的种业与农资综合企业，主营小麦、玉米、水稻等种子及农药化肥贸易；2026 年 1 月完成向控股股东定增 4.02 亿元，2025 年度实现自 2017 年以来首次现金分红，但母公司累计未分配利润长期为负。"
沿革:
  - 年: "1999"
    事件: "8 月 13 日在国家工商行政管理局登记注册成立，原名为中垦农业资源开发股份有限公司，系由中国农垦（集团）总公司等五家企业共同发起设立的股份有限公司（首次注册地址为北京市丰台区科学城 10D 地块 2 号楼）"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-18/600313_20260418_LS2I.pdf"
  - 年: "2000"
    事件: "经中国证监会证监发行字〔2000〕178 号文批准，12 月 22 日向社会公开发行人民币普通股 8,000 万股，每股发行价格 6.30 元，发行后总股本为 25,220 万股"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600313&id=10451"
  - 年: "2001"
    事件: "1 月 19 日经上海证券交易所上字[2001]11 号文批准，公开发行的 8,000 万股社会公众股在上交所挂牌上市，股票简称“中农资源”，代码 600313"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600313&id=10451"
  - 年: "2007"
    事件: "12 月 20 日实施股权分置改革，以股权登记日流通股总股本 8,000 万股为基数，以资本公积金向登记在册的全体流通股股东转增 5,200 万股（流通股每 10 股获得 6.5 股转增股份），实施后总股本由 25,220 万股增至 30,420 万股"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/2025/2025-04-19/8e9c74281c4211f0852bfa163e957f7a.pdf"
  - 年: "2014"
    事件: "1 月，公司名称由中垦农业资源开发股份有限公司变更为中农发种业集团股份有限公司；2019 年 3 月 12 日取得换发的统一社会信用代码为 91110000710925016E 的营业执照"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-3/2023-03-22/8900546.PDF"
  - 年: "2016"
    事件: "5 月 23 日，2015 年度股东大会通过 2015 年度利润分配方案：以 2015 年末总股本 432,879,465 股为基数向全体股东每 10 股派现金红利 0.60 元（含税），共计派发 25,972,767.90 元；同时以资本公积金向全体股东每 10 股转增 15 股，共计转增 649,319,198 股，转增后总股本增至 1,082,198,663 股"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/2025/2025-08-23/92aa20eb7f3411f09316fa163e957f7a.pdf"
  - 年: "2026"
    事件: "1 月完成向特定对象发行股票，新增股份 79,175,306 股，总股本增至 1,161,373,969 股"
    来源: "https://stockmc.xueqiu.com/202602/600313_20260204_EC2H.pdf"
主营与结构:
  - 事件: "主营业务总体属于农业范畴，包括种子（小麦、玉米、水稻等）与农药、化肥等农资产品；业绩波动受宏观经济、产业政策、行业周期、市场供求、极端天气及内部管理等因素影响"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600313&id=11547771"
  - 事件: "报告期内营业收入分别为 520,628.07 万元、671,960.52 万元、551,198.59 万元和 288,290.20 万元；扣非后归母净利润分别为 5,008.65 万元、8,510.12 万元、-2,751.60 万元及 2,858.03 万元，经营业绩整体波动较大"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600313&id=11547771"
  - 事件: "2024 年公司营业总收入 5,563,002,957.98 元，净利润 88,150,453.62 元，其中归属于母公司所有者的净利润 46,887,176.87 元；归母净利润同比减少主要因农药下游企业出口订单锐减、产品价格下跌，以及国内种子市场供大于求、竞争加剧"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600313&id=10901288"
  - 事件: "2026 年上半年营业总收入 38.73 亿元（同比 +32.84%），归母净利润 5,255.07 万元（同比 -16.64%），扣非归母净利润 3,334.83 万元（同比 +16.68%）；归母净利润减少主要系上年同期取得处置闲置房产收益而本期无该项收益"
    来源: "https://stock.stockstar.com/RB2026082200000017.shtml"
  - 事件: "2026 年上半年合同负债 8.73 亿元，同比增长 46.98%，主要系化肥业务预收款项增加"
    来源: "https://stock.stockstar.com/RB2026082200000017.shtml"
