代码: "000713"
名称: "国投丰乐"
定位: "中国种业首家上市公司（1997年深交所上市，原合肥丰乐种业），主营种子、农化、香料三大板块；2024年国投种业受让20%股份成为控股股东、实际控制人变更为国务院国资委，2025年更名为国投丰乐，2026年1月完成向控股股东定增10.89亿元，但2026年上半年仍亏损。"

沿革:
  - 年: "1997"
    事件: "1997年4月16日成立，1997年4月22日在深交所上市，为中国种业首家上市公司"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000713&id=11507752"
  - 年: "2023"
    事件: "2023年7月17日公司接到合肥建投《关于与央企基金终止筹划控制权变更的函》，因央企乡村产业基金公司服务乡村振兴战略部署调整，双方终止筹划控制权变更事项"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000713&id=10084682"
  - 年: "2023"
    事件: "2023年7月17日合肥建投与国投集团签署《股份转让框架协议》，国投集团拟新设境内全资子公司国投种业（2023年9月26日成立，全称国投种业科技有限公司）以现金收购合肥建投持有的122,802,996股（占股份总数20.00%）；2023年12月6日双方签署《股份转让协议》"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000713&id=10084682"
  - 年: "2024"
    事件: "2024年4月29日发布《关于控股股东股份转让事项完成过户登记暨控股股东和实际控制人发生变更的公告》，国投种业成为控股股东，国务院国资委成为实际控制人"
    来源: "https://www.sdic.com.cn/cn/rmtzx/xwzx/gtyw/webinfo/2024/04/1716131726701576.htm"
  - 年: "2025"
    事件: "经2025年7月17日第七届董事会第九次会议、8月4日2025年第一次临时股东会审议通过，公司名称由合肥丰乐种业股份有限公司变更为国投丰乐种业股份有限公司，证券简称由丰乐种业变更为国投丰乐，证券代码000713不变"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202604231821515218_1.PDF"
  - 年: "2026"
    事件: "2025年12月25日向特定对象发行股票，2026年1月21日新增股份上市，公司总股本由614,014,980股增至798,219,474股，注册资本同步调整为798,219,474元；2026年4月完成工商变更登记"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000713&id=12509977"

主营与结构:
  - 事件: "主营种子、农化、香料三大板块，系育繁推一体化及农业产业化国家重点龙头企业"
