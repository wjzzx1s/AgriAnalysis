代码: 000911
名称: '*ST广糖（广农糖业，原南宁糖业）'
定位: 广西国资控股的制糖企业，所属糖企始建于 1956 年，1999 年 5 月深交所上市，2019 年广西农村投资集团成为控股股东、2023 年 10 月更名为广农糖业。2012—2025 年扣非归母净利润连续 14 年为负，2025 年末归母净资产转为负值，2026 年 4 月 30 日起被实施退市风险警示，并因年报虚假记载被证监会立案处罚而叠加其他风险警示；2026 年 8 月拟向控股股东体系出售物流与种业资产以修复净资产。
