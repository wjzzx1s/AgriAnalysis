- 事件: 2026 年上半年分部数据显示：运输业务实现营业收入约 2.96 亿元、分部营业利润约 2,004 万元；制糖业务分部营业利润约 -2,309 万元
  来源: https://finance.sina.com.cn/roll/2026-09-02/doc-iniqmshw2861087.shtml
- 事件: 甘蔗占公司食糖生产成本约 80%，而甘蔗收购价受政策保护、下行空间有限，糖价下行周期中利润空间被两头挤压；2026 年半年报衍生品投资情况一栏为空，公司报告期不存在衍生品投资
  来源: https://finance.sina.com.cn/roll/2026-09-02/doc-iniqmshw2861087.shtml
