主营与结构:
- 事件: 主营业务为甘蔗制糖，主要产品为白砂糖（明阳牌、云鸥牌），并延伸至食糖仓储物流、纸浆纸制品、复合肥等非糖板块；公司客户包括海天味业、娃哈哈等大型食品饮料企业及鼎华股份等糖类贸易商；截至 2025 年 9 月 30 日，公司生产的白砂糖产品在全国糖业质量评比中连续 23 年获评分第一
  来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000911&id=11584100
- 事件: 2026 年上半年实现营业收入 15.82 亿元，同比增长 17.39%；归母净利润 -1,602.86 万元（上年同期为盈利 912.35 万元），扣非归母净利润 -2,804.29 万元；自产糖毛利率由上年同期的 16.13% 降至 9.87%
