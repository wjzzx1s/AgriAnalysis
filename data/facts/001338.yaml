代码: "001338"
名称: "永顺泰"
定位: "广东省属国企粤海控股旗下的啤酒麦芽制造商，国内产销规模最大的麦芽制造企业，产能规模居亚洲第一、世界第四；2022年11月登陆深交所主板，业绩受大麦成本与啤酒行业景气度影响显著。"
沿革:
  - 年: "1987"
    事件: "粤海集团在广州合资成立广州麦芽有限公司，为国内第一家专业麦芽制造企业，即现粤海永顺泰（广州）麦芽有限公司前身"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2024/05/16/1220074266.PDF"
  - 年: "1996"
    事件: "成立宁麦公司（宁波基地）"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2024/05/16/1220074266.PDF"
  - 年: "2005"
    事件: "成立秦麦公司、昌麦公司"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2024/05/16/1220074266.PDF"
  - 年: "2017"
    事件: "2017年12月5日粤海控股董事会同意设立广东粤海永顺泰麦芽有限公司，注册资本3,500万元，12月20日在广州市设立，用于整合粤海控股下属分散的麦芽生产经营主体；同年立项实施IPO项目"
    来源: "http://pdf.dfcfw.com/pdf/H2_AN202210311579684054_1.pdf"
  - 年: "2020"
    事件: "2020年9月25日完成股份制改造，整体变更为粤海永顺泰集团股份有限公司"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001338&id=10385139"
  - 年: "2022"
    事件: "2022年11月16日在深圳证券交易所主板上市，证券代码001338"
    来源: "https://www.gz.gov.cn/xw/zwlb/bmdt/sdfjrjdglj/content/post_8675292.html"
主营与结构:
  - 事件: "主营麦芽的研发、生产和销售，产品以基础大麦麦芽为主，兼顾特种麦芽；麦芽是啤酒生产环节最主要的原材料"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001338&id=12121258"
  - 事件: "五大生产基地：广麦（广州）、宁麦（宁波）、秦麦（秦皇岛）、昌麦（潍坊昌乐）、宝麦（扬州宝应），覆盖主要啤酒消费区域"
    来源: "http://xinpi.zqrb.cn/pdf/SZ/001338/2025/0826/e2763dc54466d018d289e276572bb349.pdf"
  - 事件: "截至2025年6月30日已有设计产能108万吨/年；其中广麦40万吨/年（含募投广麦4期扩建项目10万吨/年）、宁麦30万吨/年、秦麦17万吨/年、昌麦8万吨/年、宝麦13万吨/年"
    来源: "http://xinpi.zqrb.cn/pdf/SZ/001338/2025/0826/e2763dc54466d018d289e276572bb349.pdf"
  - 事件: "截至2025年12月31日已有设计产能113万吨/年，含正在试生产和收尾确权的宝麦公司新建5万吨/年特制麦芽生产线项目新增产能"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001338&id=12121385"
  - 事件: "我国麦芽行业呈以永顺泰为首的“两超多强、区域性公司并存”格局，公司是生产规模最大、整体装备水平和工艺技术全国领先的企业"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001338&id=12121385"
  - 事件: "主营业务单一，2025年度合并口径主营业务收入37.16亿元全部来自麦芽产品"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-21/285c666c-0074-46d2-b11c-a4bf51fee35e.PDF"
  - 事件: "2025年半年报披露主要采购内容为大麦、小麦，采购金额16.39亿元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001338&id=11351907"
  - 事件: "控股股东为广东省属国有全资投资控股公司广东粤海控股集团有限公司，实际控制人为广东省人民政府国有资产监督管理委员会"
    来源: "http://static.cninfo.com.cn/finalpage/2024-05-16/1220074266.PDF"
融资历史:
  - 时间: "2022-11-16"
    方式: "IPO（深交所主板）"
    规模: "发行125,432,708股，发行价6.82元/股，募集资金总额8.55亿元（855,451,068.56元），扣除发行费用61,205,647.11元后募集资金净额794,245,421.45元"
    用途: "广麦4期扩建项目、年产13万吨中高档啤酒麦芽项目"
    说明: "2022年9月1日取得证监许可[2022]2009号核准批复；募集资金于2022年11月8日到位；发行后总股本501,730,834股"
    来源: "https://epaper.stcn.com/pic/202604/21/aeeabe2acff0ed422e6db66f0be72de7.pdf"
  - 时间: "2022-11"
    方式: "IPO募投项目明细"
    规模: "广麦4期扩建项目投资总额50,305.00万元、拟投入募集资金424,534,039.08元；年产13万吨中高档啤酒麦芽项目投资总额52,204.00万元、拟投入募集资金369,711,382.37元；合计投资总额102,509.00万元、拟投入募集资金794,245,421.45元"
    用途: "产能扩张"
    说明: "年产13万吨中高档啤酒麦芽项目实施地点为江苏省扬州市宝应县安宜工业园，实施主体为全资子公司"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001338&id=8644635"
  - 时间: "2023-12-08"
    方式: "募投项目结项"
    规模: "首次公开发行募投项目（广麦4期扩建项目、年产13万吨中高档啤酒麦芽项目）结项，节余募集资金永久补充流动资金（节余金额在来源页面被截断，不予引用）"
    用途: "补充流动资金"
    说明: "第二届董事会第三次会议、第二届监事会第三次会议审议通过（节余金额原文被截断，仅保留前缀数字24,3）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001338&id=12543868"
  - 时间: "2026-06-30"
    方式: "闲置募集资金现金管理"
    规模: "不超过人民币1,450万元"
    用途: "购买现金管理产品"
    说明: "使用期限为自董事会审议通过之日起12个月内，可循环滚动使用；截至2025年12月31日累计使用募集资金793,742,786.58元，尚未使用募集资金余额502,634.87元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001338&id=12543868"
