代码: "300970"
名称: "华绿生物"
定位: "江苏泗阳的食用菌工厂化企业，以金针菇、真姬菇为主并拓展鹿茸菇等珍稀品种；2021 年创业板上市，2024 年由盈转亏、2025 年随行业回暖大幅回升。"
沿革:
  - 年: "2018"
    事件: "据中国食用菌协会工厂化专业委员会《2017-2018 年中国食用菌工厂化研究报告》，公司 2018 年在全国工厂化规模生产金针菇企业中排名第四"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300970&id=6411111"
  - 年: "2019"
    事件: "截至 2019-12-31 公司食用菌日产能达到 327.14 吨（2017 年末为 203.25 吨）"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300970&id=6411111"
  - 年: "2021"
    事件: "2021-04-12 在深圳证券交易所创业板上市，公开发行 1,459 万股，发行价 44.77 元/股，发行后总股本增至 5,835 万股"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=300970&id=7026379"
  - 年: "2022"
    事件: "2022-09-30 董事会审议通过终止“一厂技术改造项目”“泗阳华茂农业发展有限公司技术改造项目”两个募投项目，并将剩余募集资金 286,506,760.30 元及利息永久补充流动资金"
    来源: "http://static.cninfo.com.cn/finalpage/2024-04-23/1219744144.PDF"
  - 年: "2023"
    事件: "2023-11-30 董事会审议通过“河北华绿之珍生物技术有限公司年产 5.4 万吨鲜品金针菇工厂化生产项目”结项，节余募集资金 856.19 万元永久补充流动资金；截至 2023-12-31 公司募集资金已使用完毕"
    来源: "http://static.cninfo.com.cn/finalpage/2024-04-23/1219744144.PDF"
  - 年: "2024"
    事件: "2024 年下半年河南华绿一期及广西华绿一期二厂建成投产"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300970&id=10951971"
  - 年: "2026"
    事件: "2026-04-09 黄牛肝菌项目公司云南华绿生物科技有限公司注册设立"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-22/1225135105.PDF"
主营与结构:
  - 事件: "自成立以来专业从事食用菌的研发、工厂化种植及销售业务，是食用菌工厂化生产领域的领先企业；已初步形成以金针菇、真姬菇为主，舞茸、虫草花等珍稀食用菌为辅的多品种协同发展格局"
    来源: "http://epaper.stcn.com/att/202604/23/ZQ23B219-XM_eBook.pdf"
  - 事件: "2024 年下半年浙江华绿项目金针菇工厂、广西华绿项目一期二厂真姬菇工厂、河南华绿一期金针菇工厂投产，处于产能爬坡与磨合阶段；广西华绿二期（鹿茸菇）项目处于前期规划设计"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300970&id=10951971"
  - 事件: "2025 年度实现营业收入 1,291,890,340.95 元（同比 +25.17%），归属于上市公司股东的净利润 110,268,302.23 元（同比 +331.82%），主因量价齐升"
    来源: "http://epaper.stcn.com/att/202604/23/ZQ23B219-XM_eBook.pdf"
  - 事件: "2026 年上半年实现营业收入 693,881,412.30 元（同比 +39.18%），归属于上市公司股东的净利润 46,096,252.70 元（同比 +185.85%，上年同期 -53,694,652.84 元）；营业收入增长主要系金针菇价格比上年同期上涨"
    来源: "https://static.cninfo.com.cn/finalpage/2026-08-20/1225482928.PDF"
  - 事件: "2026 年上半年末总资产 2,595,922,533.46 元，归属于上市公司股东的净资产 1,629,697,544.11 元"
