    事项: "2026 年上半年筹资活动产生的现金流量净额净流出同比增加 421,170.52 元，主要原因是本期借款借贷净额较上年同期减少 25,550,000.00 元及上期分红影响"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002041&id=12544165"
