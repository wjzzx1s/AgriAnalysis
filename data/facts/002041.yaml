  - 时间: "长期"
    事项: "公司历经 50 年持续不间断的玉米育种研发创新和高产攻关，完成以掖单 2 号、掖单 6 号、掖单 13 号、登海 661 与登海 605、登海 618 为代表的 5 代玉米杂交种的进步性替代"
