代码: "002041"
名称: "登海种业"
定位: "国内玉米杂交种龙头之一，以“登海”“先玉”系列玉米种为核心，玉米种收入占营业收入约九成，控股股东莱州市农业科学院、李登海为实际控制人；已审定多个转基因玉米品种，2026 年上半年业绩同比明显回升。"
沿革:
  - 年: "2000"
    事件: "12 月 8 日，山东登海种业股份有限公司成立；由莱州市登海种业（集团）有限公司整体变更设立，该集团前身为莱州市登海种业有限公司"
    来源: "https://basic.10jqka.com.cn/002041/company.html"
  - 年: "2005"
    事件: "4 月 12 日首次公开发行人民币普通股（A 股）2,200 万股，发行价 16.70 元/股；4 月 18 日在深圳证券交易所中小企业板上市，发行后总股本 8,800 万股，注册资本 8,800 万元"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2016/2016-7/2016-07-13/2576873.PDF"
  - 年: "2005"
    事件: "经证监发行字【2005】8 号文核准，本次公开发行中网下向询价对象配售 440 万股、网上按市值配售 1,760 万股；保荐机构（主承销商）为东方证券股份有限公司；上市后简称曾变更为“G 登海”"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002041&id=85304"
主营与结构:
  - 事件: "自 2000 年 12 月设立至今，主要从事农作物新品种选育、许可证规定经营范围内的农作物种子生产、分装、销售，主营业务未发生重大变化"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-23/00747de8-fad3-4755-a664-86d0a68cd29a.PDF"
  - 事件: "近几年来玉米种子业务收入占公司营业收入的 90% 左右，主推品种为“登海”“先玉”系列等玉米杂交种；2026 年上半年玉米种收入占比由 2025 年上半年的 91.58% 升至 95.51%"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-08-26/doc-iniprumt6063700.shtml"
  - 事件: "2026 年上半年实现营业收入 46,892.16 万元，同比增长 26.96%；归属于上市公司股东的净利润 4,951.56 万元，同比增长 41.02%；扣非净利润 3,025.69 万元（上年同期为亏损 433 万元，同比增长 799.40%）"
    来源: "https://stock.stockstar.com/RB2026090500001210.shtml"
  - 事件: "2026 年上半年申请植物新品种权 8 项（均为杂交种），获得授权植物新品种权 14 项；截至报告期末累计获得授权植物新品种权 218 项；共拥有有效专利 24 项（其中发明专利 2 项为当年新授权）"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-27/1225508378.PDF"
  - 事件: "产品线还包括小麦种（苗）、水稻种（苗）、蔬菜种（苗）；2026 年上半年蔬菜种收入 1,009.97 万元、小麦种收入 338.68 万元"
    来源: "https://stock.stockstar.com/RB2026090500001210.shtml"
