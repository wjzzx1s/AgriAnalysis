    事件: "经甘肃省人民政府甘政函〔1998〕92号批准，由酒泉地区现代农业（控股集团）有限责任公司、敦煌市供销合作联合社、金塔县供销合作联合社、瓜州县供销合作社联合社、酒泉市农业科学研究院五家单位发起设立，1998年12月28日在甘肃省工商局注册登记"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600354&id=12284068"
  - 年: "2003"
    事件: "2003年12月29日采用向二级市场投资者定价市值配售方式首次公开发行7,500万股人民币A股，每股面值1.00元、发行价5.68元，募集资金42,600万元，扣除发行费用1,877万元后净额40,723万元"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=600354&id=37138"
