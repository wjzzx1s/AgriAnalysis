代码: "600354"
名称: "敦煌种业"
定位: "甘肃酒泉的种业与食品加工企业，2004年上市的老牌种业公司；2018—2019年连续亏损曾被实施退市风险警示（*ST敦种），2021年撤销；2024年控股股东两度无偿划转、最终变更为酒钢集团，2025—2026年种子主业量利齐升，但母公司累计未分配利润仍为大额负数，长期不能分红。"

沿革:
