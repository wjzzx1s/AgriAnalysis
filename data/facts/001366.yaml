代码: "001366"
名称: "播恩集团"
定位: "总部位于广州、注册在江西赣州的猪饲料企业，聚焦教槽料、乳猪料等幼小动物营养产品，2023 年 3 月登陆深交所主板；上市后连续两年亏损，2026 年起通过终止募投项目、以募集资金改道收购希杰三家饲料公司切入反刍料赛道。"
沿革:
  - 年: "2006"
    事件: "前身赣州八维生物科技有限公司在赣州经开区成立，专注幼小动物营养和预混合饲料的研发生产"
    来源: "https://gzjkq.ganzhou.gov.cn/jkqzf/c105053/202309/282415b09a3d4712ae40433d11377677.shtml"
  - 年: "2017"
    事件: "7 月 31 日在赣州八维生物科技有限公司基础上整体变更设立播恩集团股份有限公司，注册资本 10,000 万元，法定代表人邹新华"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-8/2024-08-30/10445009.PDF"
  - 年: "2023"
    事件: "3 月 7 日在深圳证券交易所主板上市，股票代码 001366，成为赣州市第一家、江西省第二家农牧行业主板上市企业"
    来源: "https://gzjkq.ganzhou.gov.cn/jkqzf/c105053/202309/282415b09a3d4712ae40433d11377677.shtml"
主营与结构:
  - 事件: "自设立以来一直专注教槽料、乳猪料等猪幼小动物阶段产品的研发、生产及销售，是农业农村部饲料合成生物技术重点实验室依托单位"
    来源: "http://notice.10jqka.com.cn/api/pdf/ef58ce1704ab70fd.pdf"
  - 事件: "2025 年主营业务收入占比 99.60%，收入主要来源于饲料销售，实现营业收入 135,505.85 万元（同比 +33.48%）；其中猪饲料销售收入 121,018.17 万元（同比 +24.53%），禽类饲料销售收入 14,478.82 万元（同比 +233.64%）"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-04-28/43e4e7cf-58f4-468b-8dd8-88e18c73b4e1.PDF"
  - 事件: "通过全国六大生产基地、15 家分（子）公司的布局，形成覆盖华南、华东、西南的供应链网络；2024 年广西钦州、甘肃兰州的生物饲料项目投产"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001366&id=11015282"
  - 事件: "收购完成后生产基地由集中于华东、华南并向西南逐步布局，扩展至东北、华北地区并新增牛、羊等反刍动物饲料产品线"
    来源: "https://finance.sina.com.cn/roll/2026-09-14/doc-inirvkks3956254.shtml"
融资历史:
  - 时间: "2023-03"
    方式: "IPO（深交所主板）"
    规模: "发行 4,035 万股新股，发行价 9.32 元/股，募集资金总额 3.76 亿元，实际募集资金净额 3.19 亿元"
    用途: "赣州年产 24 万吨饲料项目、浙江播恩年产 12 万吨饲料项目、播恩生物健康产业基地-维生素复合预混料项目、重庆八维生物年产 12 万吨饲料项目、研发中心建设项目"
    说明: "发行市盈率（发行后股本）22.97 倍；截至 2026 年中报累计投入 1.22 亿元，使用比例不到 40%"
    来源: "https://www.tfcaijing.com/article/page/5451594c4c33696b5361383375366c513336375344773d3d"
  - 时间: "2026-05-26"
    方式: "签署股权收购条款清单（Term Sheet）"
    规模: "支付交易保证金 700 万元"
    用途: "拟收购希杰国际控股有限公司持有的希杰（沈阳）、希杰（天津）、希杰（聊城）饲料有限公司各 100% 股权"
    说明: "暂定交易价格 1.25 亿元；约定若截至 2026 年 8 月 31 日未能签署正式股权转让协议等情形，保证金不予退还"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001366&id=12351711"
  - 时间: "2026-09-14"
    方式: "现金收购股权（正式方案）"
    规模: "股权转让款合计 1.125 亿元（较 5 月披露的 1.25 亿元暂定价格下调约 1,250 万元）"
    用途: "由全资子公司广东播恩投资有限公司收购希杰（沈阳）、希杰（天津）、希杰（聊城）饲料有限公司各 100% 股权"
    说明: "三家公司将纳入合并报表范围；2025 年三家标的合计营收约 6.24 亿元，2026 年一季度合计营收约 1.66 亿元"
    来源: "https://finance.sina.com.cn/roll/2026-09-14/doc-inirvkks3956254.shtml"
风险与困境:
  - 时间: "2023"
    事项: "上市首年业绩下滑：2023 年实现营业收入 143,554.99 万元（同比下降 16.02%），归属于上市公司股东的净利润 4,870.64 万元（同比下降 36.90%），扣非净利润 3,355.82 万元（同比下降 48.09%）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=001366&id=10135094"
  - 时间: "2024"
    事项: "2024 年度归属于上市公司股东的净利润 -28,713,852.78 元，较 2023 年由盈转亏"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-04-28/99a25aa3-9ff7-4eba-be7d-5415ccbe40a8.PDF"
  - 时间: "2025"
    事项: "2025 年度归属于上市公司股东的净利润 -19,773,382.91 元（同比减亏 31.14%），扣非净利润 -24,350,184.12 元"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-04-28/99a25aa3-9ff7-4eba-be7d-5415ccbe40a8.PDF"
  - 时间: "2026-08-24"
    事项: "第四届董事会第二次会议审议通过《关于调整部分募投项目投资总额、内部投资结构以及延期的议案》，信息系统平台升级项目调减投资总额并调整内部结构，预定可使用状态时间调整至 2028 年 9 月 30 日；赣州年产 24 万吨饲料项目调整至 2028 年 12 月 31 日"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-8/2026-08-25/12525825.PDF"
  - 时间: "2024-08-28"
    事项: "第三届董事会第十次会议、第三届监事会第七次会议审议通过《关于部分募投项目延期的议案》，将“重庆八维生物年产 12 万吨饲料项目”预定可使用状态时间延期至 2025 年 10 月 31 日"
    来源: "https://epaper.stcn.com/pic/202504/28/5623b96ad438ee7ee5785895c30280c8.pdf"
  - 时间: "2026-04-28"
    事项: "2025 年度董事会工作报告披露公司 2025 年仍处于亏损状态（归母净利润 -1,977.34 万元），主业造血能力尚未完全恢复"
    来源: "https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-04-28/43e4e7cf-58f4-468b-8dd8-88e18c73b4e1.PDF"
战略与转型:
  - 时间: "2024-03-22"
    事项: "第三届董事会第八次会议、第三届监事会第五次会议审议通过《关于调整部分募投项目投资计划及使用自有资金追加投资的议案》，将“浙江播恩年产 12 万吨饲料项目”达到预定可使用状态日期延长至 2025 年 3 月 31 日，研发中心建设项目同步延期"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2025/2025-3/2025-03-15/10785261.PDF"
  - 时间: "2026-05-25"
    事项: "公告拟以现金收购希杰（沈阳）、希杰（天津）、希杰（聊城）饲料有限公司各 100% 股权，暂定交易价格 1.25 亿元，以扩大在东北、华北及华东地区的市场覆盖能力"
    来源: "https://finance.sina.com.cn/roll/2026-05-25/doc-inhzchzh3467791.shtml"
  - 时间: "2026-09-14"
    事项: "确定以 1.125 亿元收购上述三家标的公司；同时终止“浙江播恩年产 12 万吨饲料项目”“重庆八维生物年产 12 万吨饲料项目”两个原募投项目，理由是猪饲料行业产能饱和、下游养殖结构变化导致需求萎缩，原项目已不具备经济可行性"
    来源: "https://finance.sina.com.cn/roll/2026-09-14/doc-inirvkks3956254.shtml"
  - 时间: "2026-09-14"
    事项: "本次收购可新增牛、羊等反刍动物饲料产品线，反刍养殖周期性和价格波动相对生猪较为平缓，有利于平抑公司经营波动"
    来源: "https://finance.sina.com.cn/stock/hkstock/ggscyd/2026-09-14/doc-inirveaq9310454.shtml"
融资需求线索:
  - 时间: "2026-08-31"
    事项: "截至 2026 年 8 月 31 日募集资金结余 2.04 亿元（含募集资金专户利息收入和理财产品投资收益）；终止的两个募投项目尚未使用募集资金合计 8,985.71 万元及利息（合计 9,328.96 万元）变更用于本次股权收购，差额部分由公司以自有及自筹资金解决"
    来源: "https://finance.sina.com.cn/cj/2026-09-15/doc-inirxpin8410671.shtml"
  - 时间: "2026-09-17"
    事项: "IPO 募资改道并购受到媒体关注：公司 2023 年 3 月上市募得 3.19 亿元，截至 2026 年中报累计投入 1.22 亿元，使用比例不到 40%，大部分收购资金来源于 IPO 募资"
    来源: "https://finance.sina.com.cn/wm/2026-09-17/doc-iniscqyc0397146.shtml"
  - 时间: "2026-08-24"
    事项: "2026 年半年度利润分配预案为向全体股东每 10 股派发现金红利 0.5 元（含税）"
    来源: "https://finance.sina.com.cn/roll/2026-08-25/doc-inipmxce9939092.shtml"
