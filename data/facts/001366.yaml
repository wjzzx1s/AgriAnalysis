  - 要点: "子公司产能爬坡效果显现：钦州播恩由 2025 年全年亏损 342.66 万元转为 2026 年上半年盈利 425.28 万元，浙江播恩净利润由 2025 年全年 19.96 万元增至 2026 年上半年 406.41 万元"
