    方式: "IPO（上海证券交易所主板）"
    规模: "公开发行 26,000 万股，发行价 9.32 元/股，募集资金总额 242,320.00 万元，扣除发行费用 13,474.80 万元后净额 228,845.20 万元"
    用途: "百万亩农田改造建设项目（166,767.17 万元）、大华种业集团改扩建项目（13,227.76 万元）、农业科学研究院建设项目、农业信息化建设项目、补充流动资金（30,000 万元）"
    说明: "经证监许可〔2017〕522 号文核准，主承销商国信证券；募集资金 2017-05-09 到账，经天健会计师事务所验证（天健验〔2017〕1-21 号）；发行前农垦集团持股 93.14%，发行后 67.84%"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=601952&id=10843276"
