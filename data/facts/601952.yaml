    用途: "大米加工产能扩建"
    说明: "2024 年 8 月因政策收严、淮海项目用地手续耗时较长，将苏垦米业改扩建项目整体延期至 2025 年 12 月；2025 年 4 月决议将淮海公司项目建设期延长至 2026 年 7 月"
