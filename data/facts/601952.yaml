代码: "601952"
名称: "苏垦农发"
定位: "江苏省农垦集团旗下的农业全产业链上市公司，自主经营耕地约 95.5 万亩，形成种植、种子、大米、农资、食用油一体化经营；控股股东为江苏省农垦集团，2026 年上半年受粮价低位影响利润下滑。"
沿革:
  - 年: "2011"
    事件: "11 月，江苏省农垦农业发展有限公司成立（在江苏省农垦集团有限公司种植业资源整合基础上组建），同月完成公司更名"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=601952&id=9995581"
  - 年: "2012"
    事件: "9 月实施增量改制引入战略投资者（农垦集团 93.14%、航天投资 3.02%、诚鼎创投 1.60%）；12 月 3 日农发有限股东会决议整体变更，12 月 21 日取得江苏省工商局核发营业执照，注册资本 80,000 万元，股份有限公司成立日期 2012-12-21"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/2017-05-02/601952_20170502_1.pdf"
  - 年: "2017"
    事件: "5 月 15 日在上海证券交易所挂牌上市，开盘价 11.18 元，当日最高涨幅 43.99%（发行价 9.32 元/股），成为全国首家农业全产业链上市公司"
    来源: "http://journal.crnews.net/ncgztxcs/2017/dsyq/sd/917991_20170602120741.html"
  - 年: "2019"
    事件: "1 月收购金太阳粮油股份有限公司"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=601952&id=9995581"
  - 年: "2021"
    事件: "4 月与苏州市农业发展集团有限公司合资成立苏州苏垦现代农业发展有限公司"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=601952&id=9995581"
主营与结构:
  - 事件: "截至 2025 年秋播，自主经营耕地面积约 95.5 万亩，土地流转（含土地托管与合作种植）面积约 40.7 万亩；通过下属 19 家分公司和 1 家子公司在自主种植基地种植水稻、小麦及大麦等主要粮食作物"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=601952&id=12502187"
  - 事件: "自主经营基地全部位于江苏省内，主要集中于苏北淮河流域和长江流域；种植业务经营模式包括统一经营（“五统一”管理）和发包经营两种"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=601952&id=12502187"
  - 事件: "2011 年 12 月公司与控股股东农垦集团签订《土地承包协议》，每年向农垦集团缴付土地承包费即可自主种植经营约 95.5 万亩优质生产基地"
    来源: "https://data.eastmoney.com/report/zw_stock.jshtml?infocode=AP202608211828269872"
  - 事件: "种子业务由控股子公司江苏省种业集团有限公司运营，江苏种业于 2022 年设立，2026 年完成增资扩股、注册资本 20 亿元，苏垦农发持股 63.2455%"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-8/2026-08-19/12502187.PDF"
  - 事件: "2026 年上半年实现营业收入 43.32 亿元，归母净利润 1.44 亿元；夏粮总产 14.01 亿斤（70.05 万吨），较上年增产 1.33 亿斤（6.65 万吨），创历史最高水平"
    来源: "https://stock.10jqka.com.cn/20260818/c679060907.shtml"
融资历史:
