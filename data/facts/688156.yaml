代码: "688156"
名称: "路德科技"
定位: "科创板上市的生物发酵饲料企业，前身为以无机固废处理为主的路德环境，2023 年起白酒糟资源化利用成为核心主业并于 2025 年 11 月更名为“路德科技”；连续两年亏损后 2026 年上半年扭亏，正推进简易程序定增扩充产能。"
沿革:
  - 年: "2020"
    事件: "9 月 22 日在上海证券交易所科创板上市（原证券简称“路德环境”），发行价 15.91 元/股，发行后总股本 9,184.00 万股"
    来源: "https://www.road-group.com/upload/resource/93/be512471757ad3410c7c35c187f777c7.pdf"
  - 年: "2023"
    事件: "12 月与运河宿迁港产业园管理委员会签署投资协议，计划新增年产 25 万吨（折算干燥产品 14 万吨）白酒糟生物发酵饲料产能"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-09-25/688156_20260925_BUM9.pdf"
  - 年: "2025"
    事件: "11 月 18 日起证券简称及扩位证券简称由“路德环境”变更为“路德科技”，公司全称和证券代码不变，业务重心从无机固废处理转向生物发酵饲料为核心的生物制造领域"
    来源: "https://www.stcn.com/article/detail/3491968.html"
主营与结构:
  - 事件: "主要产品和服务包括生物饲料系列产品的生产与销售，以及无机固废处理服务"
    来源: "http://epaper.stcn.com/att/202604/24/ZQ24B285-HF_eBook.pdf"
  - 事件: "白酒糟生物发酵饲料业务收入持续增长：2023 年 19,679.48 万元、2024 年 21,684.67 万元、2025 年 28,297.66 万元，占主营业务收入比例分别为 57.64%、83.34%、77.75%"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-09-25/688156_20260925_BUM9.pdf"
  - 事件: "2021 年至 2025 年白酒糟生物发酵饲料业务收入复合增长率达 25.61%，已成为公司核心业绩来源"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-09-25/688156_20260925_BUM9.pdf"
  - 事件: "已正常经营的生产基地包括古蔺路德、金沙路德、遵义路德、亳州路德、永乐路德白酒糟生物发酵饲料生产基地"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-09-25/688156_20260925_BUM9.pdf"
融资历史:
  - 时间: "2020-09"
    方式: "IPO（上交所科创板）"
    规模: "首次公开发行 2,296 万股，发行价 15.91 元/股，募集资金总额 36,529.36 万元，扣除发行费用 4,111.88 万元后净额 32,417.48 万元"
    用途: "研发中心及固废处理相关项目建设"
    说明: "证监许可[2020]1915 号批复；保荐机构安信证券股份有限公司；2020 年 9 月 10 日发行"
    来源: "http://static.cninfo.com.cn/finalpage/2025-04-18/1223125520.PDF"
  - 时间: "2023-05"
    方式: "向特定对象发行股票（定增）"
    规模: "发行 8,340,397 股，发行价 13.57 元/股，募集资金总额 113,179,187.29 元，净额 109,025,187.96 元"
    用途: "补充流动资金及项目建设"
    说明: "发行对象为公司实际控制人季光明，新增股份在上海证券交易所科创板上市交易"
    来源: "http://static.cninfo.com.cn/finalpage/2023-05-27/1216921126.PDF"
  - 时间: "2025-12-22"
    方式: "子公司引入战略投资者增资"
    规模: "国投聚力旗下聚力杭实基金对永乐路德、亳州路德、宿迁路德三家子公司战略性增资，总投资额 1.17 亿元（亳州路德 3,500 万元、宿迁路德 4,500 万元、永乐路德 3,700 万元）"
    用途: "加码白酒糟生物发酵饲料核心主业"
    说明: "公司与国投聚力投资管理有限公司签署《战略合作协议》；聚力杭实基金股东包括国投聚力、杭州汇实投资及萧山经开区产业基金"
    来源: "https://www.stcn.com/article/detail/3552246.html"
  - 时间: "2026-07-27"
    方式: "以简易程序向特定对象发行股票（定增，推进中）"
    规模: "拟募集资金总额不超过 15,050.00 万元（含本数）"
    用途: "洋河酒糟资源化利用项目（拟使用 1.1 亿元）及补充流动资金（4,200 万元）"
    说明: "发行对象为不超过 35 名特定投资者，发行价格不低于定价基准日前 20 个交易日股票交易均价的 80%，限售期 6 个月；2026 年 5 月 18 日 2025 年年度股东会授权董事会办理，2026 年 7 月 27 日、9 月 24 日第五届董事会审议通过方案及修订稿"
    来源: "https://www.caiwennews.com/article/1531784.shtml"
