    事项: "2025 年度归属于上市公司股东的净利润 -70,101,818.34 元（亏损同比扩大 23.96%），扣非净利润 -7,354.91 万元（同比亏损扩大 23.25%）；母公司净利润 -47,461,597.47 元，2025 年度不进行利润分配"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-24/688156_20260424_4RGI.pdf"
  - 时间: "2025-Q4"
    事项: "2025 年第四季度单季营收 1.27 亿元，归母净利润 -5,397.50 万元，扣非净利润 -5,475.75 万元，亏损呈显著季节性集中特征"
    来源: "https://news.qq.com/rain/a/20260424A06NTL00"
