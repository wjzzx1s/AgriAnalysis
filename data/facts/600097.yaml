代码: '600097'
名称: 开创国际
定位: 上海国资（光明食品集团）控制的远洋渔业上市平台。前身为 1997 年上市的海南恒泰芒果，2008 年 12 月经资产置换重组为以远洋渔业为主业的开创国际；旗下拥有 12 艘大型金枪鱼围网船和 2 艘大型拖网加工船，并控股西班牙 ALBO 等境外水产企业。2025 年归母净利润 0.74 亿元，2026 年上半年因渔场资源波动、基里巴斯部分水域关闭与国际油价上涨转为亏损。
