代码: "002299"
名称: "圣农发展"
定位: "国内白羽肉鸡全产业链龙头，覆盖自主育种、饲料、养殖、屠宰与深加工，产能规模居行业前列；2025 年完成对原嘉吉中国白羽鸡项目（太阳谷）的全资控股，2026 年上半年营收突破百亿元、扣非净利同比增长近四成。"
沿革:
  - 年: "2009"
    事件: "10 月 21 日在深交所中小板上市，首次公开发行 4,100 万股，发行价 19.75 元/股，募集资金总额 8.0975 亿元、扣除发行费用后净额 7.6496 亿元"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2016/2016-4/2016-04-25/2401963.PDF"
  - 年: "2017"
    事件: "2 月启动发行股份购买圣农食品 100% 股权，10 月完成资产过户，11 月新增股份在深交所上市，交易价格 20.20 亿元，发行价 15.71 元/股、发行 128,580,517 股"
    来源: "http://pdf.dfcfw.com/pdf/H2_AN201804221127691596_1.pdf"
  - 年: "2025"
    事件: "5 月 21 日完成对安徽太阳谷食品科技（集团）有限公司 54% 股权的收购，持股比例由 46% 增至 100%，太阳谷及其三家子公司自 5 月 21 日起纳入合并范围"
    来源: "http://notice.10jqka.com.cn/api/pdf/1defcca22c1d799b.pdf"
主营与结构:
  - 事件: "以白羽肉鸡养殖加工为核心，形成“饲料—种鸡—养殖—屠宰—深加工”一体化；2025 年鸡肉生食销售量 157.68 万吨、深加工肉制品销售量 44.76 万吨，分别较 2024 年增长 12.40%、41.25%"
    来源: "https://finance.eastmoney.com/a/202604123702175358.html"
  - 事件: "2026 年上半年家禽饲养加工行业收入 53.65 亿元，同比增长 14.80%"
    来源: "https://finance.sina.com.cn/stock/relnews/cn/2026-08-23/doc-iniphssu2501788.shtml"
  - 事件: "2026 年上半年营业收入 107.81 亿元（同比 +21.73%），归母净利润 5.02 亿元、扣非归母净利润 5.24 亿元（同比 +39.46%），毛利率 13.12%"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002299&id=12512771"
  - 事件: "收购太阳谷后获得原嘉吉中国白羽鸡项目产能，2023 年太阳谷产能约 6,500 万羽，公司向 10 亿羽/年产能目标推进"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202401161617509063_1.pdf"
融资历史:
  - 时间: "2009-10"
    方式: "IPO（深交所中小板）"
    规模: "4,100 万股，发行价 19.75 元/股，募集资金总额 8.0975 亿元、净额 7.6496 亿元"
    用途: "优化各生产环节产能（自养自宰模式下的养殖与屠宰项目）"
    说明: "网下配售 820 万股、网上发行 3,280 万股；证监许可[2009]928 号核准"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2016/2016-4/2016-04-25/2401963.PDF"
  - 时间: "2017-10"
    方式: "发行股份购买资产（关联交易）"
    规模: "交易价格 20.20 亿元，发行 128,580,517 股，发行价 15.71 元/股"
    用途: "购买圣农实业等 8 名交易对方合计持有的圣农食品 100% 股权"
    说明: "圣农食品 100% 股权评估值 202,030.39 万元；证监许可[2017]1843 号核准，2017 年 10 月 23 日完成资产过户，新增股份 2017 年 11 月 6 日上市"
    来源: "http://static.cninfo.com.cn/finalpage/2017-08-15/1203800361.PDF"
  - 时间: "2023-11-13"
    方式: "对外投资（收购股权及可转股债权）"
    规模: "圣农发展以 2.4471 亿元受让太阳谷 45.1557% 股权，廖俊杰先生以 1,625.40 万元受让 3.0000% 股权；同时受让德弘钰玺持有的太阳谷可转股债权（本金 6,716 万元、438 万元）"
    用途: "取得原嘉吉中国白羽鸡项目相关主体的股权与债权"
    说明: "公司第六届董事会第二十三次会议审议通过"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002299&id=9639815"
  - 时间: "2025-05-21"
    方式: "现金收购股权"
    规模: "转让总价款 112,590.00 万元"
    用途: "收购德弘钰玺、Ancient Steel (HK) Limited 及廖俊杰先生持有的太阳谷合计 54% 股权，实现全资控股"
    说明: "2024 年 12 月启动；收购完成后确认一次性投资收益 5.46 亿元"
    来源: "https://epaper.stcn.com/pic/202504/07/f02db5a1e1e433f8e1c9a3480c8ee32c.pdf"
风险与困境:
  - 时间: "2026-08-20"
    事项: "2026 年上半年归母净利润同比 -44.80%，主要系上年同期完成太阳谷 54% 股权收购并取得控制权、对原持有 46% 股权按购买日公允价值重新计量确认 5.46 亿元投资收益抬高比较基数；扣非口径同比 +39.46%"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002299&id=12512771"
  - 时间: "2021-2022"
    事项: "白羽肉鸡行业景气下行期间公司业绩承压；2021 年公司实施股份回购（回购注销 2019 年限制性股票激励计划部分限制性股票）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002299&id=8028090"
战略与转型:
  - 时间: "2023-11"
    事项: "并购原嘉吉中国白羽肉鸡项目（太阳谷），从德弘资本手中受让 46% 股权并受让可转股债权，向上游产能扩张"
    来源: "https://news.qq.com/rain/a/20231117A04IU500"
  - 时间: "2025-05-21"
    事项: "完成太阳谷剩余 54% 股权收购，实现 100% 控股，公司产能向 10 亿羽/年目标推进"
    来源: "https://epaper.stcn.com/pic/202504/07/f02db5a1e1e433f8e1c9a3480c8ee32c.pdf"
  - 时间: "2020"
    事项: "食品深加工板块崛起：2020 年食品深加工业务实现营业收入 47.62 亿元，占公司营业收入比重达 34.65%"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002299&id=7072490"
  - 时间: "2021-01"
