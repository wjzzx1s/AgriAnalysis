    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2021/2021-4/2021-04-20/7072493.PDF"
  - 时间: "2026-04"
    事项: "2025 年度营业收入 200.94 亿元（同比 +8.12%）、归母净利润 13.8 亿元（同比 +90.55%），拟每 10 股派发现金红利 2 元"
    来源: "https://www.stcn.com/article/detail/3743277.html"
