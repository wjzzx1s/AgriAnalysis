    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002299&id=9639815"
  - 时间: "2025-05-21"
    方式: "现金收购股权"
    规模: "转让总价款 112,590.00 万元"
    用途: "收购德弘钰玺、Ancient Steel (HK) Limited 及廖俊杰先生持有的太阳谷合计 54% 股权，实现全资控股"
    说明: "2024 年 12 月启动；收购完成后确认一次性投资收益 5.46 亿元"
    来源: "https://epaper.stcn.com/pic/202504/07/f02db5a1e1e433f8e1c9a3480c8ee32c.pdf"
