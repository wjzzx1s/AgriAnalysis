代码: "002299"
名称: "圣农发展"
定位: "国内白羽肉鸡全产业链龙头，覆盖自主育种、饲料、养殖、屠宰与深加工，产能规模居行业前列；2025 年完成对原嘉吉中国白羽鸡项目（太阳谷）的全资控股，2026 年上半年营收突破百亿元、扣非净利同比增长近四成。"
沿革:
  - 年: "2009"
    事件: "10 月 21 日在深交所中小板上市，首次公开发行 4,100 万股，发行价 19.75 元/股，募集资金总额 8.0975 亿元、扣除发行费用后净额 7.6496 亿元"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2016/2016-4/2016-04-25/2401963.PDF"
  - 年: "2017"
    事件: "2 月启动发行股份购买圣农食品 100% 股权，10 月完成资产过户，11 月新增股份在深交所上市，交易价格 20.20 亿元，发行价 15.71 元/股、发行 128,580,517 股"
    来源: "http://pdf.dfcfw.com/pdf/H2_AN201804221127691596_1.pdf"
  - 年: "2025"
    事件: "5 月 21 日完成对安徽太阳谷食品科技（集团）有限公司 54% 股权的收购，持股比例由 46% 增至 100%，太阳谷及其三家子公司自 5 月 21 日起纳入合并范围"
    来源: "http://notice.10jqka.com.cn/api/pdf/1defcca22c1d799b.pdf"
股权与控制权:
  - 事项: 控股股东福建圣农控股集团有限公司持股43.89%（545,510,048股）；公司董事长傅光明、董事傅芬芳分别持有圣农集团40%和60%股权，傅光明、傅长玉、傅芬芳三人为实际控制人，所持股份无质押。
    来源: https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-08-21/6a290263-467b-49cf-9af7-6e8d47bf7d03.PDF
  - 事项: 2025年7月，控股股东圣农集团与一致行动人傅露芳通过大宗交易减持2,003.95万股、占总股本1.6117%；变动后控股股东、实际控制人及其一致行动人合计持股601,659,387股、占总股本48.3882%，控制权未变更。
    来源: http://static.cninfo.com.cn/finalpage/2025-07-29/1224317982.PDF
  - 事项: 第二大股东环胜信息技术（上海）有限公司持股5.01%（62,220,500股），香港中央结算有限公司持股2.33%；报告期末普通股股东总数34,847户。
    来源: https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-08-21/6a290263-467b-49cf-9af7-6e8d47bf7d03.PDF
主营与结构:
  - 事件: "以白羽肉鸡养殖加工为核心，形成“饲料—种鸡—养殖—屠宰—深加工”一体化；2025 年鸡肉生食销售量 157.68 万吨、深加工肉制品销售量 44.76 万吨，分别较 2024 年增长 12.40%、41.25%"
    来源: "https://finance.eastmoney.com/a/202604123702175358.html"
  - 事件: "2026 年上半年家禽饲养加工行业收入 53.65 亿元，同比增长 14.80%"
    来源: "https://finance.sina.com.cn/stock/relnews/cn/2026-08-23/doc-iniphssu2501788.shtml"
  - 事件: "2026 年上半年营业收入 107.81 亿元（同比 +21.73%），归母净利润 5.02 亿元、扣非归母净利润 5.24 亿元（同比 +39.46%），毛利率 13.12%"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002299&id=12512771"
  - 事件: "收购太阳谷后获得原嘉吉中国白羽鸡项目产能，2023 年太阳谷产能约 6,500 万羽，公司向 10 亿羽/年产能目标推进"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202401161617509063_1.pdf"
竞争优势:
  - 事项: 建成白羽肉鸡“自育-自繁-自养-自宰-深加工”全产业链，在白羽肉鸡全产业链企业排名中列亚洲第一、世界第六，产品远销日本、韩国、美国及东南亚等地。
    来源: http://static.cninfo.com.cn/finalpage/2026-08-21/1225487461.PDF
  - 事项: 自主培育的“圣泽901”配套系2021年末获农业农村部批准对外销售，2022年6月起批量出售父母代种鸡，为国内首个打破国外种源垄断的企业；“圣泽903”配套系已在报告期内规模化应用。
    来源: http://static.cninfo.com.cn/finalpage/2026-08-21/1225487461.PDF
  - 事项: 与百胜中国、麦当劳、塔斯汀、德克士、沃尔玛、永辉等国内外知名客户建立长期战略合作，并在产品研发、质量把控、市场开拓和信息共享等方面全方位携手共进。
    来源: http://static.cninfo.com.cn/finalpage/2026-08-21/1225487461.PDF
行业基本面:
  - 事项: 2026年1—7月全国白羽肉鸡祖代更新总量73.43万套、同比增长12.64%；其中7月更新22.70万套、同比增长105.06%，当月父母代鸡苗销量845.15万套、同比增长19.49%。
    来源: https://www.jbzyw.com/view/513889
  - 事项: 2021—2025年国产白羽肉鸡祖代更新量由13.16万套升至54.37万套，国产占比由10.6%升至34.5%；其中圣泽901祖代更新量由13.16万套升至28.19万套，占国产比重逾50%。
    来源: https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/837433860304/index.phtml
  - 事项: 2026年上半年全国家禽出栏87.6亿只、同比增加6.3亿只、增长7.7%；禽肉产量1,390万吨、同比增加120万吨、增长9.4%。
    来源: http://static.cninfo.com.cn/finalpage/2026-08-26/1225506762.PDF
经营要点:
  - 事项: 2026年上半年营业收入107.81亿元、同比增长21.73%；归母净利润5.02亿元、同比下降44.80%；扣非净利润5.24亿元、同比增长39.46%。
    来源: https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-08-21/6a290263-467b-49cf-9af7-6e8d47bf7d03.PDF
  - 事项: 2026年上半年鸡肉生食销售量73.2万吨、同比增长10.3%，深加工肉制品销售量25.1万吨、同比增长46.1%；C端零售渠道收入突破20亿元（含太阳谷），出口收入同比增长超30%。
    来源: http://static.cninfo.com.cn/finalpage/2026-08-21/1225487461.PDF
  - 事项: 白羽鸡养殖产能近8亿羽，已建及在建食品深加工产能合计超60万吨、位列全国第一；生产基地分布于福建、江西、甘肃、安徽，并设上海研发中心与杭州营销中心。
    来源: http://static.cninfo.com.cn/finalpage/2026-08-21/1225487461.PDF
融资历史:
  - 时间: "2009-10"
    方式: "IPO（深交所中小板）"
