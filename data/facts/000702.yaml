    事项: "公司收到控股股东屈原农垦通知，后者正筹划公司控制权变更事项，并同步筹划向观盛投资非公开发行股票"
    来源: "https://m.bjnews.com.cn/detail/1655783775168189.html"
  - 时间: "2023-07"
