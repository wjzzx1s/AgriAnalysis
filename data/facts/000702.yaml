代码: "000702"
名称: "正虹科技"
定位: "湖南岳阳的老牌饲料企业，前身可追溯至 1986 年的国营屈原农场饲料厂，1997 年上市并有“中国饲料第一股”之称；2022 年控制权由屈原农垦转至岳阳国资观盛投资，近年持续亏损并以缩减生猪养殖规模应对。"
沿革:
  - 年: "1994"
    事件: "经岳阳市人民政府岳发[1994]20 号文批准，由岳阳市屈原农垦集团公司作为独家发起人，对其下属正虹饲料厂进行股份制改组，募集设立本公司"
    来源: "https://baike.baidu.com/item/%E6%AD%A3%E8%99%B9%E7%A7%91%E6%8A%80/12649412"
  - 年: "1996"
    事件: "经湖南省人民政府湘政办函〔1996〕343 号文批准，由湖南省岳阳市屈原农垦集团公司独家发起设立，1997 年 3 月 12 日经湖南省工商行政管理局注册登记"
    来源: "https://m.cj.sina.cn/page/aHR0cDovL2ZpbmFuY2Uuc2luYS5jb20uY24vc3RvY2svY29tcGFueS9zei8wMDA3MDIvOV8xLnNodG1s?from=redirect"
  - 年: "1997"
    事件: "2 月 12 日经中国证监会证监发(1997)44 号文批准发行 A 种股票，以“全额预缴、比例配售、余款转存”方式发行社会公众股 5,000 万股（其中职工内部股 500 万股），发行价格每股 7.06 元；3 月 18 日在深圳证券交易所上市"
    来源: "http://static.cninfo.com.cn/finalpage/2003-04-09/10463143.PDF"
  - 年: "2022"
    事件: "11 月 14 日控股股东屈原农垦向观盛农业转让 40,341,811 股无限售流通股完成过户，表决权委托生效，控股股东由屈原农垦变更为观盛投资，实际控制人由岳阳市屈原管理区管理委员会变更为岳阳城陵矶综合保税区管理委员会"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2023/2023-4/2023-04-29/9159744.PDF"
主营与结构:
  - 事件: "主营业务为各类饲料的研制、生产、销售，饲料原料销售，粮食收购加工及农业产业化系列开发；上市以来主营业务未发生变更"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000702&id=10843661"
  - 事件: "饲料业务是公司核心业务，涵盖猪、鸡、鸭、鱼、牛、羊等多个系列，通过多种销售模式提升市场占有率"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-08-25/doc-inipprnn1633195.shtml"
  - 事件: "生猪养殖采取“公司+农户”代养模式，发展区域以湖南、安徽为主；截至 2024 年 12 月 31 日与公司签订合作协议的养殖户 16 户，合作养殖户年出栏规模 4 万头"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2025/2025-4/2025-04-03/10843658.PDF"
  - 事件: "2023 年饲养行业（生猪）生产量同比减少 49.39%、库存量减少 80.46%，主要系缩减生猪养殖规模所致；2024 年累计销售生猪 10.64 万头（同比 -49.58%），销售收入 2.02 亿元（同比 -34.65%）"
    来源: "https://epaper.stcn.com/pic/202504/03/b596957140a8c48cf8029dbd42abedfa.pdf"
融资历史:
  - 时间: "1997-03"
    方式: "IPO（深交所）"
    规模: "发行社会公众股 5,000 万股（含职工内部股 500 万股），发行价 7.06 元/股"
    用途: "饲料产能建设"
    说明: "中国证监会证监发(1997)44 号、45 号文批准；上市时湖南省岳阳市屈原农垦集团公司代表国家持有 61.59% 股权"
    来源: "http://static.cninfo.com.cn/finalpage/2003-04-09/10463143.PDF"
  - 时间: "2022-06-17"
    方式: "控制权安排（股份协议转让 + 表决权委托 + 定增）"
    规模: "屈原农垦向观盛农业转让 40,341,811 股（占发行前总股本 15.13%）；屈原农垦将其剩余 26,675,805 股（10.00%）表决权委托给观盛投资；公司向观盛投资非公开发行不超过 79,990,372 股"
    用途: "巩固控制权并补充流动资金"
    说明: "收购报告书披露变动数量合计 147,007,988 股；认购完成后观盛投资合计将支配公司 42.41% 的表决权"
    来源: "http://static.cninfo.com.cn/finalpage/2022-06-22/1213777595.PDF"
  - 时间: "2023-07"
    方式: "向特定对象发行股票（定增）"
    规模: "向控股股东观盛投资发行不超过 79,990,372 股，募集资金总额不超过 33,835.93 万元（含本数），由观盛投资以现金全额认购"
    用途: "全部用于补充流动资金，以降低财务风险、应对饲料和养殖行业竞争格局变化"
    说明: "2023 年 7 月 3 日向观盛投资送达缴款通知书，7 月 4 日认购资金足额到账，7 月 7 日天健会计师事务所出具验证报告与验资报告"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202307121592212753_1.pdf"
  - 时间: "2022-06-17"
    方式: "发行对象与关联方情况"
    规模: "君泰控股为公司第一大股东观盛农业的少数股东；君泰科技及相关主体系君泰控股控制的企业，2022 年 1-9 月成为公司第三大供应商"
    用途: ""
    说明: "发行人实际控制人 2022 年变更后，董事、监事、高级管理人员变动较大"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2023/2023-3/2023-03-31/8930939.PDF"
风险与困境:
  - 时间: "2023"
    事项: "2023 年度归属于上市公司股东的净利润 -139,850,017.26 元，扣非净利润 -131,227,965.94 元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000702&id=12116899"
  - 时间: "2024"
    事项: "2024 年度归属于上市公司股东的净利润 -65,250,016.96 元，扣非净利润 -78,646,778.42 元；经营活动产生的现金流量净额同比变动 -82.27%"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000702&id=12116899"
  - 时间: "2024-12-31"
    事项: "股东股份质押与冻结：岳阳观盛农业科技有限责任公司持股 11.64%（40,341,811 股），其中质押 32,273,448 股；岳阳市屈原农垦有限责任公司持股 7.70%（26,675,805 股），其中冻结 13,300,000 股"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000702&id=10843658"
  - 时间: "2025"
    事项: "2025 年度实现营业收入 10.19 亿元（同比下降 9.13%），归属于上市公司股东的净利润 -14,297,996.45 元，扣非净利润 -23,196,006.04 元；2025 年末总资产 549,469,530.02 元（同比 -22.33%）"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000702&id=12116899"
  - 时间: "2025-12-31"
    事项: "经中审众环会计师事务所审计，截至 2025 年 12 月 31 日母公司未分配利润为 -620,475,293.25 元，公司目前不具备实施现金分红的前提条件"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000702&id=12116899"
  - 时间: "2026-08-25"
    事项: "2026 年上半年实现营业收入 5.69 亿元（同比 +14.19%），归属于上市公司股东的净利润 -2,069.84 万元（上年同期亏损 799.6 万元，亏损进一步扩大），扣非净利润 -2,167.47 万元（同比 -182.84%）；经营活动现金流量净额 -6,262.29 万元（同比 -239.53%）"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-08-25/doc-inipprnn1633195.shtml"
  - 时间: "2026-06-30"
    事项: "报告期内累计销售生猪 5.32 万头，实现销售收入 5,013.21 万元，销量同比下降 15.61%、销售收入同比下降 39.93%；基本每股收益 -0.0597 元"
    来源: "https://stcn.com/article/detail/4175038.html"
  - 时间: "2026-08-25"
    事项: "2026 年上半年末总资产 5.84 亿元（较上年度末增长 6.4%），归母净资产 3.25 亿元（较上年度末下降 6.5%）"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-08-25/doc-inipprnn1633195.shtml"
  - 时间: "2014-09-03"
    事项: "就网络媒体“湖南国资改革，正虹科技重组势在必行”等资产重组传闻发布澄清公告，称相关传闻不属实，公司与控股股东及实际控制人承诺未来三个月内不筹划重大资产重组、上市公司收购、发行股份等重大事项"
    来源: "https://www.cs.com.cn/ssgs/gsxw/201409/t20140904_4502895.html"
战略与转型:
  - 时间: "2022-06"
    事项: "引入岳阳国资观盛投资作为控股股东，并筹划向观盛投资非公开发行股票募集 3 亿多元用于补充流动资金"
    来源: "https://m.bjnews.com.cn/detail/1655783775168189.html"
  - 时间: "2023"
    事项: "主动缩减生猪养殖规模，2023 年生猪生产量同比减少 49.39%，2024 年生猪销售量同比减少 49.58%"
    来源: "https://epaper.stcn.com/pic/202504/03/b596957140a8c48cf8029dbd42abedfa.pdf"
  - 时间: "2026"
    事项: "公司将继续优化养殖结构以提高效益，加强生物安全防控措施应对非洲猪瘟等重大疫病风险；饲料原料贸易业务适度调整以降低采购成本"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-08-25/doc-inipprnn1633195.shtml"
