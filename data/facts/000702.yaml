    来源: "https://pdf.dfcfw.com/pdf/H2_AN202307121592212753_1.pdf"
  - 时间: "2025-04-03"
    事项: "2024 年年度报告提示重大疫病风险与生猪价格波动风险，生猪价格周期性波动可能对公司生物资产造成减值影响、降低利润水平"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000702&id=10843661"
