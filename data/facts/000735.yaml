代码: "000735"
名称: "罗牛山"
定位: "海南海口的老牌农业上市公司，1997 年深交所上市的中国首家“菜篮子”股份制上市企业，主营生猪养殖与屠宰、冷链仓储物流、房地产开发销售及职业教育服务四大板块；2026 年上半年出栏生猪 45.62 万头、营收逆势增长，但受猪价深跌拖累归母净亏损 3.10 亿元。"

沿革:
  - 年: "1987"
    事件: "公司创立（后为海口农工贸（罗牛山）股份有限公司），是我国“菜篮子”股份制上市公司、农业产业化国家重点龙头企业"
    来源: "https://www.luoniushan.com/introduct"
  - 年: "1997"
    事件: "6 月 11 日在深交所上市，发行价 4.35 元/股，是中国首家“菜篮子”股份制上市企业；首发实际募集资金净额 1.87 亿元"
    来源: "https://q.stock.sohu.com/cn/000735/index.shtml"
  - 年: "2002"
    事件: "实施增发 A 股，实际募集资金净额 4.79 亿元（经证监发行字[2002]107 号文核准增发不超过 10,000 万股）"
    来源: "https://basic.10jqka.com.cn/000735/capital.html"
  - 年: "2016"
    事件: "4 月 13 日 2016 年非公开发行新增股份 271,381,578 股在深交所上市，成为公司历史上规模最大的一次股权融资"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=000735&id=2334513"

主营与结构:
  - 事件: "主营业务涵盖生猪养殖与屠宰、冷链仓储物流、房地产开发销售及职业教育服务四大板块，其中生猪养殖与屠宰是核心主业，已形成“饲料自供—养殖—屠宰—冷链物流”一体化布局"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000735&id=12517288"
  - 事件: "2024 年公司实现营业收入 33.32 亿元，同比下降 21.44%；实现归属于上市公司股东的净利润 2.42 亿元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000735&id=10898037"
  - 事件: "2023 年度共销售生猪 77.92 万头，较上年同期增长 55.73%；屠宰生猪 112.08 万头，较上年同期上升 80.71%，其中代宰 69.73 万头"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000735&id=10104133"
  - 事件: "2025 年全年畜牧业收入 15.32 亿元，同比增长 11.94%；房地产业收入 12.53 亿元，同比下降 4.35%"
    来源: "https://stock.stockstar.com/RB2026082500001421.shtml"

融资历史:
  - 时间: "1997-05"
    方式: "IPO（深圳证券交易所主板）"
    规模: "实际募集资金净额 1.87 亿元"
    用途: "未查得"
    说明: "发行价 4.35 元/股，上市日期 1997-06-11"
    来源: "https://basic.10jqka.com.cn/000735/capital.html"
  - 时间: "1999-01"
    方式: "配股"
    规模: "实际募集资金净额 1.84 亿元"
    用途: "未查得"
    说明: ""
    来源: "https://basic.10jqka.com.cn/000735/capital.html"
  - 时间: "2002-01"
    方式: "增发 A 股"
    规模: "实际募集资金净额 4.79 亿元"
    用途: "募投项目包括海南爱华汽车广场项目（承诺投入 5,000 万元）等"
    说明: "经中国证监会证监发行字[2002]107 号文核准，获准增发不超过 10,000 万股"
    来源: "https://basic.10jqka.com.cn/000735/capital.html"
  - 时间: "2016-04-13"
    方式: "非公开发行股票（向 6 名特定对象，均以现金认购）"
    规模: "募集资金总额 1,649,999,994.24 元，净额 1,630,624,839.08 元（271,381,578 股，发行价 6.08 元/股）"
    用途: "“罗牛山十万头现代化猪场项目”“海南农副产品交易配送中心及产业配套项目”和偿还银行贷款"
    说明: "控股股东罗牛山集团有限公司认购部分限售 36 个月，其余 5 名投资者限售 12 个月；公司承诺募集资金不会直接或变相用于房地产业务"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=000735&id=2334513"
  - 时间: "2020"
    方式: "定增（终止）"
    规模: "未查得"
    用途: "原计划扩大生猪养殖规模"
    说明: "2020 年公司为扩大生猪养殖规模启动定增项目，因涉及房地产业务且无法按照监管要求将房地产项目剥离干净，决定终止定增项目并撤回申报材料；此后依靠自身力量建设猪场"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2023/04/07/1216347994.PDF"
  - 时间: "2023-11-24"
    方式: "定增（终止）"
    规模: "未查得（原 2023 年度向特定对象发行 A 股股票方案）"
    用途: "未查得"
    说明: "公司第十届董事会第十次临时会议及第十届监事会第八次会议审议通过《关于终止公司 2023 年度向特定对象发行 A 股股票事项的议案》，同意终止 2023 年度定增有关事项"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000735&id=10104133"

风险与困境:
  - 时间: "2020-12-31"
    事项: "控股股东罗牛山集团有限公司持股 197,412,938 股（占 17.14%），其中质押 156,205,000 股"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2021/2021-4/2021-04-30/7205194.PDF"
  - 时间: "2023-12-31"
    事项: "2023 年公司实现营业收入 41 亿元，同比增加 42.26%，但归属于上市公司股东的净利润为 -4.94 亿元"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000735&id=10104133"
  - 时间: "2026-06-30"
    事项: "2026 年上半年受猪价超预期下跌影响，归属于上市公司股东的净利润为 -3.10 亿元；经营活动产生的现金流量净额为 -1.32 亿元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000735&id=12517288"
  - 时间: "2026-06-30"
    事项: "2026 年上半年扣非后归母净利润 -3.04 亿元，上年同期为 +889.66 万元，同比由盈转亏；归母净利润 -3.10 亿元，上年同期为 -671.71 万元"
    来源: "https://app.myzaker.com/news/article.php?pk=6a8d2f958e9f096f9d31fd6b"

战略与转型:
  - 时间: "2023-04"
    事项: "公司在投资者关系活动中表示，2020 年定增终止后依靠自身力量建设猪场项目，产能从 50 万头发展到近 130 万头；同时开展黑猪保重育种工作，准备逐步扩大黑猪生产规模"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2023/04/07/1216347994.PDF"
  - 时间: "2024"
    事项: "2024 年利润分配预案：以 1,151,513,578 股为基数，向全体股东每 10 股派发现金红利 0.2 元（含税），不送红股、不以公积金转增股本"
    来源: "http://epaper.stcn.com/pic/202504/19/9d6c1cb55ccc370f3cb0e822d0e14111.pdf"
  - 时间: "2025"
    事项: "2025 年度拟向全体股东每 10 股派发现金红利 0.35 元（含税）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000735&id=12110635"
  - 时间: "2026-06-30"
    事项: "房地产业务继续贯彻“聚焦存量去化、均衡现金回笼”的稳健原则，不再盲目追加新增投资；报告期内该板块实现营业收入 1.34 亿元（同比增长 73.87%），毛利率 44.75%"
    来源: "https://static.cninfo.com.cn/finalpage/2026-08-22/1225490318.PDF"

融资需求线索:
  - 时间: "2023-11-24"
    事项: "终止 2023 年度向特定对象发行 A 股股票事项，原扩张产能的股权融资渠道关闭；此后公司主要通过银行借款等方式推进猪场建设"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000735&id=10104133"

其他要点:
  - 要点: "2026 年上半年共销售生猪 45.62 万头，同比增长 43.73%，其中外三元猪出栏 42.16 万头（同比增长 53.22%）、黑猪出栏 3.46 万头（同比下降 17.99%）；生猪产品收入 4.87 亿元，同比下降 14.56%，占比由上年同期 52.60% 降至 39.26%"
    来源: "https://static.cninfo.com.cn/finalpage/2026-08-22/1225490318.PDF"
  - 要点: "控股股东为罗牛山集团有限公司（持股 17.14%），公司最终控制方为徐自力"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-18/1225119672.PDF"
  - 要点: "公司是海南省规模较大且配套体系完备的畜牧业龙头企业，拥有良种繁育、畜禽商品生产、饲料工业、畜禽防疫、屠宰加工等十大配套体系"
    来源: "https://www.luoniushan.com/introduct"
  - 要点: "2026 年上半年收入增量主要来自饲料（1.89 亿元，同比 +164.12%）、商品房（1.28 亿元，同比 +92.55%）和农副食品加工（2.12 亿元，同比 +44.98%）"
    来源: "https://stock.stockstar.com/RB2026082500001421.shtml"

