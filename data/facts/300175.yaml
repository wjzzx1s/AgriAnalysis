代码: "300175"
名称: "朗源股份"
定位: "山东龙口起家的果品加工出口企业，主营鲜果、干果与烘焙原料的种植管理、加工、仓储及销售，2011 年 2 月创业板上市；2018 年跨界收购数据中心企业广东优世联合，因后者连续四年虚假交易被证监会立案并于 2025 年 4 月被处以 500 万元罚款；2024 年 4 月原大股东通过表决权委托加 2 亿元借款加 100% 股份质押方式易主杭州东方行知（实际控制人赵征），2025 年 3 月被实施其他风险警示（ST朗源）、2026 年 6 月 3 日撤销；2025 年营业收入 2.92 亿元、归母净利润 -1,497.10 万元。"

沿革:
  - 年: "2011"
    事件: "2 月 15 日在深圳证券交易所创业板上市，发行价 17.10 元/股，实际发行量 2,700.00 万股，实际募集资金合计 46,170.00 万元，发行费用总额 3,843.87 万元，募集资金净额 42,326.13 万元；发行市盈率（按发行后总股本）51.82 倍，主承销商国信证券股份有限公司，招股公告日 2011 年 1 月 19 日"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/300175.phtml"
  - 年: "2018"
    事件: "12 月，朗源股份收购广东优世联合控股集团股份有限公司 51% 股权，将其纳入合并报表范围，跨界布局数据中心业务；经公司全面清查，优世联合 2017 年、2018 年存在虚假交易导致虚增资产 2,512.72 万元，2019 年、2020 年存在虚假交易导致合计虚增营业收入 4,215.86 万元、虚增存货 2,830.67 万元"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2025/04/28/1223317486.PDF"
  - 年: "2023"
