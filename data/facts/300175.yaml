    来源: "https://finance.sina.com.cn/jjxw/2024-11-01/doc-incupzme1987769.shtml"
  - 年: "2024"
    事件: "4 月 30 日，大股东新疆尚龙股权投资管理有限公司及王贵美与杭州东方行知股权投资基金合伙企业（有限合伙）签署《表决权委托协议》《借款协议》《股份质押协议》，将其合计持有的 112,752,960 股股份（占公司总股本 23.95%）表决权不可撤销地委托给东方行知行使，东方行知向二者提供 2.00 亿元借款并将其所持股份全部质押给东方行知，东方行知成为公司控股股东、赵征成为实际控制人"
    来源: "http://xinpi.zqrb.cn/pdf/CYB/300175/2025/0426/96a4ae883b184f026d9d554328be494d.pdf"
