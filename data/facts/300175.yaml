    来源: "https://www.stcn.com/article/detail/1602772.html"
  - 年: "2026"
    事件: "6 月 2 日披露《关于撤销其他风险警示暨停复牌的公告》，公司股票自 2026 年 6 月 3 日开市起撤销其他风险警示，证券简称由“ST 朗源”变更为“朗源股份”"
