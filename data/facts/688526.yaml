主营与结构:
  - 事件: "公司是一家专注于兽用生物制品研发、生产、销售及动物防疫技术服务的生物医药企业，主要产品是非国家强制免疫猪用疫苗和禽用疫苗；目前可生产85个兽用生物制品类产品，是我国兽用生物制品行业内产品种类最为丰富的企业之一。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-08/1225082868.PDF"
  - 事件: "公司在病原学与流行病学、微生物基因工程、抗原高效表达、病毒悬浮培养、细菌高密度发酵、抗原浓缩纯化、佐剂与保护剂、多联/多价疫苗、快速诊断与临床服务等领域形成优势，并在禽用疫苗、宠物疫苗、诊断试剂等领域完成产业链布局。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-08/1225082868.PDF"
  - 事件: "公司研发平台包括2015年9月获批设立的博士后科研工作站、2015年9月认定的湖北省企业技术中心、2017年5月湖北省动物生物制剂工程技术研究中心、2017年10月动物生物制剂湖北省工程研究中心、2018年1月农业农村部动物生物制剂创制重点实验室（2023年7月优化重组后再次入围）、2019年12月国家企业技术中心、2020年12月湖北省动物疫病防控技术创新中心。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-08/1225082868.PDF"
  - 事件: "2025年公司研发投入占营业收入的比例为10.15%。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-08/1225082868.PDF"
  - 事件: "2025年公司披露首次公开发行股票募集资金投资项目为“动物生物制品产业化建设项目”“动物生物制品车间技改项目”“科研创新项目”“补充流动资金”4个项目。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-08/1225082868.PDF"

