代码: "688526"
名称: 科前生物
定位: "武汉的兽用生物制品企业，全称武汉科前生物股份有限公司，2020年9月22日在上海证券交易所科创板上市；专注于兽用生物制品研发、生产、销售及动物防疫技术服务，主要产品是非国家强制免疫猪用疫苗和禽用疫苗，可生产85个兽用生物制品类产品，是我国兽用生物制品行业内产品种类最丰富的企业之一，并已向禽用疫苗、宠物疫苗、诊断试剂等领域拓展。公司无控股股东，实际控制人为何启盖、吴斌、方六荣、吴美洲四人（一致行动人协议），第一大股东为武汉华中农大资产经营有限公司（持股16.73%）。2025年归母净利润4.19亿元、同比增长9.51%；2026年上半年归母净利润1.16亿元、同比下降47.37%；2023年一次定增撤回、一次定增被上交所终止审核。"

