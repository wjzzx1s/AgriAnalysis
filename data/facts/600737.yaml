代码: "600737"
名称: "中粮糖业"
定位: "中粮集团旗下食糖与番茄双主业平台，国内食糖行业龙头，拥有从国内外制糖、进口炼糖到贸易、仓储物流的全产业链；番茄制品规模居亚洲第一、世界第二。经历 2004 年德隆系危机后由中粮重组脱困，近年受糖价与番茄酱价格下行影响业绩承压。"
沿革:
  - 年: "1993"
    事件: "前身新疆屯河股份有限公司成立（1993 年 7 月）"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-04-20/600737_20210420_7.pdf"
  - 年: "1996"
    事件: "1996 年 7 月 31 日在上海证券交易所挂牌上市，证券简称“新疆屯河”，证券代码 600737，总股本 6,800 万股"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-04-20/600737_20210420_7.pdf"
  - 年: "1999"
    事件: "德隆集团入主新疆屯河，推动公司由水泥建材向番茄酱加工（“红色产业”）转型，先后投入 2 亿元整合新疆番茄酱企业"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP201906281336801577_1.pdf"
  - 年: "2004"
    事件: "受德隆系危机冲击，披露 2004 年净利润 -6.66 亿元；截至 2005 年 4 月 10 日逾期借款合计 15.44 亿元"
    来源: "http://static.cninfo.com.cn/finalpage/2005-04-15/15489757.PDF"
  - 年: "2005"
    事件: "2005 年 6 月 14 日中粮集团与华融公司及四家德隆系公司签署《股份转让协议》，以 1.54 亿元受让德隆系持有的新疆屯河全部股份（占总股份 37.2%）实施收购重组；2005 年 12 月 13 日中粮集团与德隆债权人委员会债务重组协议生效"
    来源: "http://static.cninfo.com.cn/finalpage/2007-06-20/29188469.PDF"
  - 年: "2007"
    事件: "2007 年 2 月公司名称变更为“中粮屯河股份有限公司”，证券简称变更为“中粮屯河”，证券代码不变"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-04-20/600737_20210420_7.pdf"
  - 年: "2017"
    事件: "2017 年 2 月公司名称变更为“中粮屯河糖业股份有限公司”，证券简称变更为“中粮糖业”"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-04-20/600737_20210420_7.pdf"
主营与结构:
  - 事件: "食糖业务构建覆盖制糖、炼糖、贸易、仓储物流的完整产业体系，全国布局 5 家甘蔗制糖厂、8 家甜菜制糖厂、3 家炼糖厂；甜菜糖产量超过 35 万吨/年，为中国最大的甜菜糖生产企业"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-28/1225220468.PDF"
  - 事件: "2025 年度食糖总经营量约 370.18 万吨；食糖业务营业收入 243.36 亿元，同比下降 18.64%；自产糖产量 127.56 万吨，同比增长 2.35%，自产糖销售量 126.49 万吨，同比增长 6.26%"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-28/1225220574.PDF"
  - 事件: "旗下中粮番茄在黄金番茄产区拥有 12 家番茄工厂、1 家番茄种业公司及 1 家番茄研发中心，年产番茄制品约 30 万吨，约占全国总产量三分之一；主营大包装番茄酱，并拓展小包装番茄酱、番茄饮品、调味品、保健品"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/2025/2025-08-28/2359255d832e11f0a692fa163e957f7a.pdf"
  - 事件: "2025 年番茄业务实现营业收入 21.75 亿元，同比下降 15.92%；营业成本 15.25 亿元"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-28/1225220574.PDF"
  - 事件: "2025 年营业收入 265.11 亿元；2024 年营业收入 324.97 亿元，同比下降 1.86%"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-28/1225220468.PDF"
融资历史:
  - 时间: "1996-07-31"
    方式: "IPO（上海证券交易所，前身新疆屯河）"
    规模: "实际募集资金合计 10,115 万元"
    用途: "未查得"
    说明: "招股公告日 1996-06-29，发行价 5.78 元/股，主承销商君安证券有限公司"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/600737.phtml"
  - 时间: "2007—2008"
    方式: "非公开发行（募集资金全部用于偿还对中粮集团的借款）"
    规模: "未查得"
    用途: "偿还对中粮集团的借款"
    说明: "经公司 2007 年第二次临时股东大会审议，中粮财务公司将持有的本公司债权 8.8 亿元转让给中粮集团"
    来源: "http://static.cninfo.com.cn/finalpage/2008-04-22/39017468.PDF"
  - 时间: "2019-04"
    方式: "非公开发行 A 股（上交所）"
    规模: "发行 86,972,073 股，发行价 7.52 元/股，募集资金总额 654,029,988.96 元（净额约 6.41 亿元）"
    用途: "甘蔗糖技术升级改造及配套优质高产高糖糖料蔗基地建设项目、甜菜糖项目"
    说明: "2018-10-30 取得中国证监会核准批复（证监许可[2018]1624 号），核准非公开发行不超过 410,375,231 股；2019 年 3 月 25 日包括中粮集团在内的 6 名投资者认购全部股份，另有江苏苏豪投资集团、天津农垦宏益联投资、中国华融资产、泰康人寿保险等"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600737&id=5182821"
  - 时间: "2022-12"
    方式: "子公司收购关联方资产"
    规模: "6,843.87 万元"
    用途: "全资子公司中粮屯河番茄有限公司收购中粮集团持有的内蒙古中粮番茄制品有限公司 100% 股权"
    说明: "中粮集团为公司控股股东（持股 50.73%），本次交易构成关联交易"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202212211581274665_1.pdf"
风险与困境:
  - 时间: "2004"
    事项: "德隆系危机爆发，2004 年净利润 -666,007,835.43 元；截至 2005 年 4 月 10 日逾期借款合计 1,544,138,840.00 元，并被抵押或质押于银行的资产逾 23 亿元"
    来源: "http://static.cninfo.com.cn/finalpage/2005-04-15/15489757.PDF"
  - 时间: "2025-12-31"
    事项: "年报披露商誉账面原值合计 358,586,291.61 元，累计计提减值准备 358,568,664.91 元，商誉已基本全额减值"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-28/1225220574.PDF"
  - 时间: "2025-08"
    事项: "2025 年上半年受国内外糖价震荡走弱、大包装番茄酱价格下行影响，营业收入 117.67 亿元，同比减少 21.32%；归母净利润 4.45 亿元，同比减少 48.42%；扣非归母净利润 4.03 亿元，同比减少 50.57%"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/2025/2025-08-28/2359255d832e11f0a692fa163e957f7a.pdf"
  - 时间: "2025"
    事项: "2025 年营业收入 265.11 亿元，归母净利润 9.51 亿元，较 2024 年归母净利润 17.13 亿元明显下滑"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-28/1225220574.PDF"
  - 时间: "2025"
    事项: "2025 年度报告披露公司无重大诉讼、仲裁事项；董事、高管、控股股东、实际控制人不存在涉嫌违法违规及受到处罚情形"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-28/1225220574.PDF"
战略与转型:
  - 时间: "1999"
    事项: "德隆入主后由水泥建材（“灰色产业”）向番茄酱加工（“红色产业”）战略转型，建成全国最大番茄酱生产企业"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP201906281336801577_1.pdf"
  - 时间: "2005—2007"
    事项: "中粮集团收购重组后积极布局糖产业，逐步形成以食糖业务为主、番茄酱加工为辅的业务体系"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP201906281336801577_1.pdf"
  - 时间: "2025"
    事项: "立足 2B 大包装番茄酱出口优势，拓展国内小包装番茄酱、番茄饮品、调味品、保健品等高附加值业务；食糖端稳定自产糖产销并提升小包装糖等终端产品"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/2025/2025-08-28/2359255d832e11f0a692fa163e957f7a.pdf"
