代码: "000048"
名称: "京基智农"
定位: "前身为 1994 年上市的“中国农牧第一股”康达尔，2018—2019 年被京基集团要约收购入主后更名，主业转型为广东、广西区域生猪养殖，房地产转为存量去化业务；2026 年上半年猪价低迷导致大额亏损。"
沿革:
  - 年: "1979"
    事件: "公司前身为深圳市养鸡公司（后为宝安县养鸡公司），1994 年经深圳市人民政府批准在深圳康达尔实业总公司基础上进行股份制改组"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2013/2013-8/2013-08-29/1205652.PDF"
  - 年: "1994"
    事件: "11 月 1 日在深圳证券交易所挂牌上市（股票代码 000048），成为中国首家农牧上市企业，被市场称为“养鸡第一股”“农牧第一股”"
    来源: "https://finance.sina.com.cn/stock/s/2018-12-14/doc-ihmutuec9248945.shtml"
  - 年: "1999"
    事件: "12 月 8 日更名为深圳市中科创业（集团）股份有限公司（后恢复康达尔名称）"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2013/2013-8/2013-08-29/1205652.PDF"
  - 年: "2018"
    事件: "11 月 23 日京基集团有限公司完成对公司的首次要约收购，成为控股股东；2019 年 10 月 11 日完成再次要约收购"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000048&id=6212228"
  - 年: "2019"
    事件: "12 月 26 日董事会审议通过变更公司名称和证券简称的议案，中文名称变更为深圳市京基智农时代股份有限公司，证券简称由“康达尔”变更为“京基智农”"
    来源: "https://www.usmart.hk/zh-hk/news-detail/6615946949780701246"
主营与结构:
  - 事件: "生猪养殖为核心主业：2025 年营业收入 48.72 亿元，其中生猪养殖业务营业收入 37.66 亿元、占比 77.29%；全年累计销售生猪 231.29 万头（含仔猪 32.42 万头）"
    来源: "https://www.stcn.com/article/detail/3736137.html"
  - 事件: "截至 2025 年末生猪养殖项目存栏母猪 11.94 万头，其中能繁母猪 10.29 万头、后备母猪 1.65 万头"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202604091821097530_1.pdf"
  - 事件: "2026 年上半年营业收入 21.30 亿元（同比 -10.75%），其中生猪养殖业务营业收入 15.28 亿元、占比 71.73%；累计销售生猪 112.08 万头"
    来源: "https://www.stcn.com/article/detail/4102822.html"
  - 事件: "房地产为存量去化业务，在售产品仅剩深圳宝安区山海公馆公寓项目及部分商铺；2025 年房地产开发营业收入 2.29 亿元（同比 -81.45%），山海公馆销售 6,974.44 平方米（金额 21,617.30 万元）"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-10/52292c05-ab1e-4c97-ba8b-1874bc0ca96f.PDF"
  - 事件: "饲料业务方面，广东京基智农科技 2026 年上半年实现营业收入 3.17 亿元，受市场竞争影响毛利有所下滑"
    来源: "https://stock.stockstar.com/IG2026082300007100.shtml"
融资历史:
  - 时间: "2019-2024"
    方式: "股权融资（历史合计规模很小）"
    规模: "上市三十年股权融资总额不过 2.7 亿元"
    用途: "历史股权融资规模有限，长期依靠债务与自有资金发展"
    说明: "2024 年 11 月披露 19.3 亿元定增预案前，公司长期未进行大规模股权融资"
    来源: "https://m.21jingji.com/article/20241115/229b667a980d35806b80c2bf7261051a.html"
  - 时间: "2024-11-13"
    方式: "定向增发（预案，发行对象含控股股东）"
    规模: "拟募资不超过 19.3 亿元；拟发行股票数量不超过 159,170,775 股"
    用途: "京基智农云浮生猪养殖一体化项目（7.55 亿元）、京基智农贺州生猪种苗繁育基地项目（5.97 亿元）、补充流动资金（5.78 亿元）"
    说明: "发行对象为包括控股股东京基集团在内的不超过 35 名投资者，京基集团拟以现金认购不少于 3,000 万元且不超过 2 亿元；本次检索未查得该定增的后续审核结果"
    来源: "https://www.stcn.com/article/detail/1411786.html"
风险与困境:
  - 时间: "2018-2020"
    事项: "康达尔时期发生持续近三年的股权之争，原董事长罗爱华被刑拘；京基集团入主后全面掌控公司，股权之争终结"
    来源: "https://www.jiemian.com/article/5439713.html"
  - 时间: "2026-08-28"
    事项: "控股股东京基集团、京基时代分别将其持有的公司股份 921,919 股（占总股本 0.17%）、98,081 股（占总股本 0.02%）质押给自然人郭鉴慷，用于补充流动资金"
    来源: "http://epaper.zqrb.cn/images/2026-09/01/C3/zqrb20260901C3.pdf"
  - 时间: "2026-08-23"
    事项: "2026 年上半年营业收入 21.30 亿元（同比 -10.8%），归母净利润 -4.89 亿元（同比 -316.4%）、扣非 -4.61 亿元，由盈转亏；经营活动现金流量净额 4,051.81 万元（同比 -87.0%）"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-08-23/doc-iniphwyw3620134.shtml"
  - 时间: "2026-06-30"
    事项: "拟将全资子公司深圳市京基智农酒店管理有限公司 100% 股权转让给广东承希科汇投资控股有限公司的事项，因双方未能就关键条款达成一致意见，按补充协议约定于 2026 年 6 月 30 日届满终止"
    来源: "https://paper.cnstock.com/html/2026-08/24/content_2258365.htm"
  - 时间: "2025-04-09"
    事项: "2025 年归母净利润 1.53 亿元，同比下降 78.59%；扣非归母净利润 1.54 亿元，同比下降 80.39%；毛利率下降 14.26 个百分点"
    来源: "https://finance.sina.com.cn/stock/aiassist/yjbg/2026-04-09/doc-inhtxkaq1831111.shtml"
战略与转型:
  - 时间: "2018-2019"
    事项: "京基集团通过要约收购取得控制权并承诺帮助上市公司提升管理效率、优化资源配置；入主后公司更名京基智农并转型生猪养殖"
    来源: "https://disc.static.szse.cn/download/disc/disk02/finalpage/2019-12-05/16f99cde-9710-49c2-abe0-931a6dc588d5.PDF"
  - 时间: "2024-11"
    事项: "“提前布局产能”：拟定增募资不超过 19.3 亿元用于广东云浮、广西贺州生猪与种苗繁育项目，公司测算两个项目达产后可带来 23.6 亿元营收与 4.2 亿元左右利润增量"
    来源: "https://m.21jingji.com/article/20241115/229b667a980d35806b80c2bf7261051a.html"
  - 时间: "2025-12-30"
    事项: "董事会审议通过《关于股权投资的议案》相关意向，拟投资 6.5 亿元对江苏汇博机器人技术股份有限公司增资扩股并取得控制权，跨界机器人领域"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000048&id=12419307"
  - 时间: "2026-06-29"
    事项: "调整机器人领域投资方案：终止原 6.5 亿元控股型《增资协议》，改为出资 6,000 万元认购江苏汇博新增注册资本 586.39 万元，持股比例 3.6145%，转为少数股权投资"
    来源: "https://www.chnfund.com/article/092102a8-c66d-246f-8a09-3a2225b8b29c"
  - 时间: "2025"
    事项: "推进精细化管理与健康养殖，2026 年完全成本目标 12 元/公斤左右；2025 年 1—9 月完全成本约 13.4 元/公斤，2025 年 1—10 月生猪销售均价约 14.7 元/公斤"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=818242168778&code=000048&dannoun=lcdetail&announ=lc"
  - 时间: "2025-2026"
    事项: "以集中竞价交易方式回购公司股份，截至相关时点累计回购 5,438,000 股（占总股本 1.03%），最高成交价 19.50 元/股、最低 15.00 元/股，成交总金额 9,446.39 万元"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-30/3579a705-78e5-4fd6-9729-d7ac5476a8e9.PDF"
融资需求线索:
  - 时间: "2024-11"
    事项: "19.3 亿元定增预案为上市以来最大规模股权融资计划（此前三十年股权融资总额不过 2.7 亿元），拟投向云浮、贺州生猪项目及补充流动资金，控股股东承诺认购 2 亿元以内"
    来源: "https://www.stcn.com/article/detail/1411786.html"
  - 时间: "2026-08"
    事项: "2026 年上半年大额亏损、经营活动现金流量净额同比减少 87%、控股股东股份质押用于补充流动资金，反映资金面压力上升；2025 年度与 2026 年半年度均不进行现金分红"
    来源: "https://finance.sina.com.cn/stock/zqgd/2026-08-23/doc-iniphwyw3620134.shtml"
