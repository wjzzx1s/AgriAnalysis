代码: "002100"
名称: "天康生物"
定位: "新疆兵团国资背景的农牧企业，主营饲料、生猪养殖与食品、动物疫苗；2026 年 6 月收购羌都畜牧 51% 股权扩产生猪，2026 年上半年亏损 4.41 亿元。"
沿革:
  - 年: "2006"
    事件: "12 月 26 日在深交所上市，公开发行 1,600 万股、发行价 10.86 元/股，发行市盈率 25.30 倍"
    来源: "https://finance.sina.cn/sa/2006-12-26/detail-ikknscsi4026370.d.html?from=wap"
  - 年: "2015"
    事件: "7 月 30 日向兵团国资公司、中新建招商、新疆天邦投资等 3 名对象发行 388,102,380 股吸收合并新疆天康（控股）集团（证监许可〔2015〕492 号），天康控股及其原持有的天康生物 293,035,860 股同时注销，新增股份 7 月 31 日上市，实现控股股东业务整体上市"
    来源: "https://www.lhratings.com/reports/A0211-KZZQ01-2017.pdf"
  - 年: "2017"
    事件: "12 月 22 日公开发行 10 亿元可转换公司债券（“天康转债”128030，1,000 万张，6 年期），证监会证监许可〔2017〕2201 号核准"
    来源: "https://disc.static.szse.cn/disc/disk01/finalpage/2017-12-20/71a9ce76-c91e-4c38-a6a1-8a27883de405.PDF"
  - 年: "2021"
    事件: "12 月 24 日 2020 年度非公开发行新增股份 277,449,664 股上市（7.45 元/股），募集资金总额 20.67 亿元（证监许可〔2021〕1771 号）"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002100&id=7739105"
  - 年: "2025"
    事件: "12 月 29 日召开 2025 年第三次临时股东会，审议通过以现金 127,500 万元收购新疆羌都畜牧科技有限公司 51% 股权"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=833830533032&code=002100&dannoun=lcdetail&announ=lc"
  - 年: "2026"
    事件: "6 月 3 日羌都畜牧完成工商变更，公司直接持有其 51% 股权，羌都畜牧成为控股子公司并纳入合并范围"
    来源: "https://stock.stockstar.com/RB2026062400019835.shtml"
