代码: "600540"
名称: "新赛股份"
定位: "新疆兵团系棉花全产业链企业（皮棉、棉籽精深加工、棉油棉蛋白），2004年上交所上市、历史上曾被实施退市风险警示（*ST新赛）；2023年9月控股股东变更为中新建物流、实际控制人为兵团国资委；2024—2025年连续亏损，2026年上半年扭亏且净利同比增逾18倍，同时处于证监会立案调查期间。"

