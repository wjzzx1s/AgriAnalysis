    来源: "https://stock.stockstar.com/notice/SN2026082700055192.shtml"
  - 时间: "2026-06-30"
    事项: "2026 年上半年基本每股收益 -0.2386 元；营业收入 20.51 亿元与净利润变动背离，财务费用上升"
