代码: "002696"
名称: "百洋股份"
定位: "广西南宁的水产企业，以罗非鱼等水产品加工出口起家，2012 年上市；2017 年以 9.74 亿元收购火星时代跨界数字艺术教育、2019 年原价回购剥离，2020 年 5 月控制权转让给青岛国资，现回归水产与饲料主业，2026 年上半年重新陷入亏损。"
沿革:
  - 年: "2000"
    事件: "4 月 19 日成立（后为百洋产业投资集团股份有限公司），注册地广西南宁市高新技术开发区"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2017/2017-9/2017-09-26/3775012.PDF"
  - 年: "2012"
    事件: "8 月经中国证监会证监许可[2012]855 号核准公开发行 2,200 万股人民币普通股，发行价 23.90 元/股，发行后总股本 8,800 万股，在深圳证券交易所上市（时为百洋水产集团股份有限公司）"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002696&id=976352"
  - 年: "2017"
    事件: "8 月以 9.74 亿元作价（发行股份支付 5.6 亿元、现金支付 4.14 亿元）收购北京火星时代科技有限公司 100% 股权，自 2017 年 8 月起并表，切入数字艺术教育"
    来源: "https://www.jiemian.com/article/3807671.html"
  - 年: "2019"
    事件: "因教育文化业务大幅下滑，业绩承诺方于 2019 年原价回购火星时代 100% 股权，火星时代相关资产从公司剥离"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002696&id=6154768"
  - 年: "2020"
    事件: "5 月 29 日完成股份过户，控股股东由孙忠义、蔡晶变更为海洋产业投资基金与海洋新动能基金（青岛国信体系），实际控制人变更为青岛市国资委"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002696&id=8091552"
主营与结构:
  - 事件: "主营业务包括水产品加工及生物制品业务、饲料及饲料原料业务和远洋捕捞业务"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002696&id=12219107"
  - 事件: "首次公开发行时主营业务为罗非鱼产品和水产饲料的生产销售，是全球最大的罗非鱼加工出口贸易企业之一"
    来源: "http://pdf.dfcfw.com/pdf/H3_AP201208230005455378_1.pdf"
  - 事件: "2026 年上半年收入增长由饲料及饲料原料业务拉动：饲料业务营收 8.37 亿元（同比 +34.33%），饲料原料业务营收 2.26 亿元（同比 +41.36%），生猪养殖等其他业务营收 1.97 亿元（同比 +406.3%）"
    来源: "https://finance.sina.com.cn/stock/aigc/stockfs/2026-08-27/doc-inipucsr9104243.shtml"
  - 事件: "2025 年 9 月以 130.00 万元受让海南鲜馔原股东出资义务，持股比例由 25% 增至 51%，2025 年 9 月 8 日完成工商登记变更并纳入合并报表"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002696&id=12219114"
融资历史:
  - 时间: "2012-09"
    方式: "IPO（深交所）"
    规模: "公开发行 2,200 万股，发行价 23.90 元/股，占发行后总股本 25%；募集资金用于“北流年产 1.54 万吨水产食品加工厂建设项目”等项目"
    用途: "水产品加工产能建设"
    说明: "发行时公司名称为百洋水产集团股份有限公司"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002696&id=976352"
  - 时间: "2017-09"
    方式: "非公开发行（配套融资）"
    规模: "向孙忠义等 7 名特定投资者非公开发行 29,521,712 股，发行价 18.19 元/股，募集资金总额 536,999,941.28 元，扣除发行费用 13,030,000.00 元后净额 523,969,941.28 元"
    用途: "支付收购火星时代的现金对价等"
    说明: "新增股份上市日为 2017 年 9 月 27 日"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2017/2017-9/2017-09-26/3775012.PDF"
  - 时间: "2020-03-24"
    方式: "控制权协议转让"
    规模: "孙忠义、蔡晶将其持有的 104,478,461 股（占公司股份总数 29.90%）以 9.45 元/股协议转让给青岛海洋创新产业投资基金有限公司、青岛市海洋新动能产业投资基金（有限合伙），转让对价总额 9.87 亿元"
    用途: "公司控制权变更"
    说明: "2020 年 5 月 29 日完成股份交割过户，实际控制人变更为青岛市国资委"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202009221415934617_1.pdf"
  - 时间: "2024-2025"
    方式: "限制性股票激励计划"
    规模: "2025 年 7 月 31 日为预留部分授予日，以 3.14 元/股向 21 名激励对象授予 98.80 万股限制性股票"
    用途: "核心团队长期激励"
    说明: "2024 年限制性股票激励计划的预留授予实施"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002696&id=12219107"
  - 时间: "2025"
    方式: "股份回购"
    规模: "2024 年度支付回购库存股款项 52,589,018.15 元"
    用途: "回购公司股份"
    说明: "2025 年度利润分配以 2025 年 12 月 31 日总股本扣除回购专户库存股后 346,134,232 股为基数"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002696&id=12219114"
风险与困境:
  - 时间: "2019-10"
    事项: "火星时代业绩承诺未完成（2017—2019 年承诺累计净利润不低于 33,380 万元），新余火星人、王琦应向公司补偿 61,284.70 万元；公司于 2019 年 10 月完成火星时代 100% 股权转让交割，处置价格 47,030.00 万元，并以总价 1 元回购新余火星人持有的公司股份 45,923,781 股并注销"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002696&id=6154768"
  - 时间: "2023"
    事项: "2023 年度归属于上市公司股东的净利润 -27,593,739.86 元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002696&id=12219114"
  - 时间: "2024"
    事项: "2024 年度归属于上市公司股东的净利润 -15,254,206.49 元，扣非净利润 -22,804,863.35 元；该年度不派发现金红利、不送红股、不以公积金转增股本"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002696&id=12219114"
  - 时间: "2026-08-27"
