代码: "600108"
名称: "亚盛集团"
定位: "甘肃省农垦集团控股的现代农业企业集团，种植基地主要分布在甘肃、内蒙，以牧草、马铃薯、制种玉米等规模化种植为基础并延伸加工与农资服务；2026 年上半年盈利微降，经营现金流净流出扩大，资金缺口主要靠借款与中期票据填补。"
沿革:
  - 年: "1995"
    事件: "9 月 19 日经甘肃省人民政府《关于同意甘肃亚盛实业（集团）股份有限公司的批复》（甘政函(1995)36 号）批准，由甘肃亚盛盐化工业集团有限责任公司所属甘肃省亚盛农工商公司、甘肃金塔兴盛实业公司、甘肃金塔永胜农业发展公司三家企业的全部资产整体改组后，联合甘肃金塔农业开发公司、甘肃金盛实业有限公司、甘肃鹏盛农业发展有限责任公司和甘肃省国营生地湾双丰化工厂等四家单位共同发起设立"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600108&id=3707014"
  - 年: "1997"
    事件: "经甘政函[1997]23 号文及证监发字（1997）384、385 号文批准，于 7 月 24 日至 7 月 31 日以全额预交款、比例配售、余款即退方式向社会公众公开发行股票 7,000 万股；8 月 18 日在上海证券交易所挂牌上市，股票简称“亚盛集团”，代码 600108"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-20/8018462.PDF"
  - 年: "1997"
    事件: "11 月注册地址由甘肃省金塔县解放路 128 号变更为甘肃省兰州市城关区张掖路 219 号基隆大厦"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2025/08/28/1224592150.PDF"
  - 年: "2006"
    事件: "经甘肃省国资委《关于甘肃亚盛实业（集团）股份有限公司股权分置改革有关问题的批复》（甘国资产权[2006]100 号）批准实施股权分置改革，股本由 93,756.80 万股增加至 144,119.06 万股"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-20/8018462.PDF"
  - 年: "2009"
    事件: "8 月 20 日经证监会上市公司并购重组委第 22 次会议审核通过，10 月 15 日经证监许可［2009］1092 号文核准向甘肃省农垦集团有限责任公司发行股份购买资产；12 月 10 日完成股份登记，公司注册资本变更为 1,736,991,221 元"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2010/2010-5/2010-05-18/562609.PDF"
主营与结构:
  - 事件: "主业为农业，是集农作物种植、农产品加工、农业技术研发、农资服务、商贸流通为一体的现代农业企业集团；种植基地主要分布在甘肃、内蒙等地，种植作物覆盖牧草、马铃薯、制种玉米、啤酒花、中药材、果品、食葵、辣椒、香辛料等"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600108&id=12558662"
  - 事件: "依托自有及流转土地资源开展主导作物规模化、集约化种植，配套开展农资供应、节水滴灌设备相关业务；经营模式以规模化种植为基础并延伸加工与商贸流通"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600108&id=12558662"
  - 事件: "主导作物占种植面积九成，属“看天吃饭”型业务；2026 年上半年营业收入 14.72 亿元，同比下降 2.63%"
    来源: "https://news.qq.com/rain/a/20260918A051VR00"
  - 事件: "2026 年上半年归属于母公司股东的净利润 2,491.88 万元，同比减少 11.01%；期末资产总额 1,053,417.89 万元，比年初增加 6.52%；负债总额 620,682.6 万元（比年初增加 11.51%）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600108&id=12558662"
