代码: "603609"
名称: "禾丰股份"
定位: "以饲料为核心、肉禽（白羽肉鸡屠宰）与生猪业务协同的农牧食品企业，荷兰 De Heus 持股约 9%；2026 年上半年饲料外销创新高，受猪价拖累归母净利微亏。"
