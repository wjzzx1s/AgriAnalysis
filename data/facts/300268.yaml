代码: '300268'
名称: 佳沃食品
定位: 联想控股旗下佳沃集团控制的动物蛋白上市公司（深交所创业板，2011 年 9 月上市，曾名万福生科、佳沃股份）。2016 年 12 月佳沃集团通过表决权委托取得控制权，2017 年置出大米加工资产、切入水产加工贸易，2019 年以约 60 亿元现金收购智利三文鱼企业 Australis 后陷入高负债与连年巨亏；2022 年末、2024 年末两度因净资产为负被实施退市风险警示，2025 年 6 月以 1 元对价将三文鱼业务子公司北京臻诚 100% 股权出售给控股股东全资子公司实现出表与净资产转正，2026 年 5 月 13 日撤销退市风险警示及其他风险警示。
