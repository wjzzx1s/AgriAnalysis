代码: "603151"
名称: "邦基科技"
定位: "山东淄博的猪饲料专业化企业，以猪预混料、浓缩料、配合料为主业，2022 年 10 月登陆上交所主板；2025—2026 年因向生猪养殖下游延伸并受猪价下行冲击，业绩由盈转亏。"
沿革:
  - 年: "2007"
    事件: "4 月 23 日成立（山东邦基科技股份有限公司），自成立以来一直从事猪饲料的研发、生产和销售"
    来源: "https://basic.10jqka.com.cn/603151/company.html"
  - 年: "2022"
    事件: "10 月 19 日在上海证券交易所主板上市，发行价 17.95 元/股，发行市盈率 22.98 倍"
    来源: "https://basic.10jqka.com.cn/603151/company.html"
主营与结构:
  - 事件: "主要产品为猪预混料、猪浓缩料、猪配合料；销售区域覆盖华东、东北、华北、西南地区并逐步拓展至全国"
    来源: "http://static.cninfo.com.cn/finalpage/2025-04-22/1223188635.PDF"
  - 事件: "2024 年实现营业收入 25.42 亿元（同比 +54.36%），主营业务收入 2,480,474,858.82 元（同比增长 58.63%）"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603151&id=10916088"
  - 事件: "2025 年 6 月起推进以发行股份及支付现金方式收购 Riverstone Farm Pte. Ltd. 旗下生猪养殖资产，打造饲料生产加工、生猪养殖与销售垂直一体化产业链；该重组已于 2025 年 11 月终止"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603151&id=11633427"
  - 事件: "2025 年末总资产 3,439,344,019.60 元，较上年末增长 91.11%"
    来源: "https://stockmc.xueqiu.com/202604/603151_20260421_UZF0.pdf"
融资历史:
  - 时间: "2022-10"
    方式: "IPO（上交所主板）"
    规模: "公开发行 42,000,000 股，发行价 17.95 元/股，募集资金总额 753,900,000.00 元，扣除发行费用 70,977,175.61 元后净额 682,922,824.39 元"
    用途: "投向公司及辽宁、长春、云南、张家口、山西等地子公司的高档配合猪饲料、浓缩饲料智能生产车间等项目"
    说明: "募集资金 2022 年 10 月 14 日到账；项目总投资 68,956.83 万元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603151&id=12117166"
  - 时间: "2024-06-06"
    方式: "股票期权激励（授予）"
    规模: "以 12.85 元/份授予 154 名激励对象 875.00 万份股票期权，后将行权价格调整为 12.65 元/份"
    用途: "员工长期激励"
    说明: "2025 年 5 月 13 日首次授予第一个行权期可行权数量 332.00 万股（140 人），同日以 12.65 元/股授予预留股票期权"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-04-22/603151_20250422_HA0T.pdf"
  - 时间: "2025-06-16"
    方式: "发行股份及支付现金购买资产（重大资产重组，后终止）"
    规模: "拟收购山东北溪农牧、山东瑞东伟力农牧、山东鑫牧农牧、瑞东农牧（利津）、瑞东农牧（山东）、瑞东威力牧业（滨州）各 100% 股权及派斯东畜牧技术咨询（上海）80% 股权"
    用途: "由单一猪饲料业务向下游养殖业延伸"
    说明: "交易对方为 Riverstone Farm Pte. Ltd.，预计构成重大资产重组及关联交易但不构成重组上市；标的评估值及交易价格未确定；2025 年 11 月 11 日董事会审议通过终止该重组"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603151&id=11633427"
