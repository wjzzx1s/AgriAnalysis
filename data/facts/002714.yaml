代码: "002714"
名称: "牧原股份"
定位: "自繁自养一体化模式的全球最大生猪养殖企业，2026 年 H 股上市后形成 A+H 双平台；2026 年上半年猪价深跌录得大额亏损，公司主动调减能繁母猪产能并压降养殖成本。"
沿革:
  - 年: "2014"
    事件: "1 月 28 日在深交所上市，发行价 24.07 元/股，发行 6,050 万股（新股 3,000 万股＋老股转让 3,050 万股），实际募集资金总额 7.221 亿元"
    来源: "http://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/002714.phtml"
  - 年: "2014"
    事件: "上市公告书载明上市时间为 2014 年 1 月 28 日，股票简称“牧原股份”，法定代表人秦英林"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002714&id=5618374"
  - 年: "2019"
    事件: "公司定向增发 49.77 亿元 A 股，用以新增生猪产能；同年设立牧原肉食、正阳肉食、商水肉食，向生猪屠宰板块延伸"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202204141559239147_1.pdf"
  - 年: "2026"
    事件: "2 月 6 日 H 股在香港联交所挂牌上市，最终发行价 39.0 港元/股，基础发行 2.7395 亿股"
    来源: "https://www.thepaper.cn/newsDetail_forward_32553701"
股权与控制权:
  - 事项: 控股股东为牧原实业集团有限公司，持股14.70%；实际控制人为秦英林、钱瑛，二人分别控制48.64%和3.33%的股份，是生猪养殖板块中创始人家族控制比例最高的龙头。
    来源: http://basic.10jqka.com.cn/002714/company.html
  - 事项: 2026年2月6日在港交所挂牌上市，发行价39港元/股，募资约120亿港元且含超额配股权，其中60%投向海外业务，成为国内首家A+H两地上市的生猪养殖企业。
    来源: https://finance.sina.com.cn/wm/2026-08-31/doc-iniqepet7887268.shtml
  - 事项: 2026年上半年公司主体信用等级由AA+上调至AAA，董事与高级管理人员完成5亿元A股增持，董事会另审议通过总金额3亿至5亿港元的H股回购方案。
    来源: https://finance.sina.com.cn/stock/relnews/cn/2026-08-21/doc-inipaens1423838.shtml
  - 事项: 截至2026年二季度末资产负债率54.18%，较一季度末有所上升，主要为经营亏损导致所有者权益减少，同时公司主动储备资金以应对周期波动。
    来源: https://finance.eastmoney.com/a/202608213849457082.html
主营与结构:
  - 事件: "以生猪养殖为核心，采用自繁自养一体化重资产模式；2024 年销售生猪 7,160.2 万头，其中商品猪 6,547.7 万头"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002714&id=10793334"
  - 事件: "2026 年上半年销售商品猪 3,861.5 万头，与上年同期基本持平；屠宰板块在满产状态下持续盈利"
    来源: "https://www.stcn.com/article/detail/4096109.html"
  - 事件: "截至 2026 年 6 月末能繁母猪存栏 311.3 万头，较 2025 年同期 343.1 万头减少约 32 万头，公司计划 9 月底降至 300 万头以下"
    来源: "https://finance.sina.com.cn/jjxw/2026-09-14/doc-inirutny4062970.shtml"
  - 事件: "2026 年 8 月生猪养殖完全成本约 11.5 元/公斤（6 月约 11.7 元/公斤）"
    来源: "https://www.stcn.com/article/detail/4096109.html"
竞争优势:
  - 事项: 2026年7月完全成本已降至约11.5元/公斤，而行业平均完全成本已降至约12元/公斤；新猪派统计的16家头部猪企中，牧原以5.8元/斤的斤成本位列第一梯队，头部与尾部头均成本差距超过300元。
    来源: https://finance.sina.com.cn/wm/2026-08-31/doc-iniqepet7887268.shtml
  - 事项: 约45%的商品猪进入自有屠宰体系，上年同期这一比例不到三成；当养殖业务毛利率转负时屠宰端仍月月盈利，形成养殖亏损与屠宰盈利的内部对冲。
    来源: https://finance.sina.com.cn/wm/2026-08-31/doc-iniqepet7887268.shtml
  - 事项: 2026年6月与阿里云签署战略合作，共建养猪行业垂直大模型，在营养配方、种猪育种、疫病诊断等业务场景中摸索落地路径，依靠数字化平台与人工智能助手提升员工效率。
    来源: https://finance.eastmoney.com/a/202608213849457082.html
  - 事项: 海外业务集中在越南，已设立越南牧原有限公司并与越南BAF公司签署合作协议，2026年上半年海外营收4080.63万元，体量尚小但处于快速成长期。
    来源: https://finance.sina.com.cn/wm/2026-08-31/doc-iniqepet7887268.shtml
行业基本面:
  - 事项: 2026年上半年全国生猪出栏37246万头、同比增长1.7%，猪肉产量3119万吨、同比增长3.3%；二季度末生猪存栏42491万头、同比增长0.1%，上半年生猪价格同比下降23.1%。
    来源: https://www.stats.gov.cn/sj/zxfbhjd/202607/t20260716_1964140.html
  - 事项: 2026年二季度末全国能繁母猪存栏3780万头，同比减少263万头、下降6.5%，为正常保有量3750万头的100.8%，已重新回到产能调控的绿色合理区间。
    来源: https://www.stats.gov.cn/sj/zxfbhjd/202607/t20260716_1964140.html
  - 事项: 2026年5月14日农业农村部印发《生猪产能综合调控实施方案（2026年修订）》，将能繁母猪正常保有量由3900万头下调至3750万头，绿色区域上限由105%收紧至103%。
    来源: https://stcn.com/article/detail/3909962.html
经营要点:
  - 事项: 2026年上半年销售商品猪3861.5万头，营业收入594.10亿元、同比下降22.30%，归母净利润亏损60.78亿元，商品猪销售均价约10.4元/公斤、同比下降约28%。
    来源: https://caifuhao.eastmoney.com/news/20260824223549423871160
  - 事项: 2026年6月生猪养殖完全成本11.7元/公斤，7月进一步降至约11.5元/公斤，断奶至上市成活率约92%，料肉比约2.46，PSY约29头，优秀场线成本低于10.5元/公斤。
    来源: https://finance.sina.com.cn/stock/relnews/cn/2026-08-21/doc-inipaens1423838.shtml
  - 事项: 截至2026年6月末能繁母猪存栏311.3万头，较2025年同期343.1万头减少32万头，公司计划9月底降至300万头以下，距2025年6月阶段性高点累计压减50万至60万头。
    来源: https://finance.sina.com.cn/wm/2026-08-31/doc-iniqepet7887268.shtml
  - 事项: 2026年上半年屠宰生猪1723.4万头、同比增长50.98%，屠宰产能利用率超过100%且每月均实现盈利，屠宰肉食业务营收220.61亿元、毛利率4.24%，同比提升2.14个百分点。
    来源: https://finance.sina.com.cn/stock/relnews/cn/2026-08-21/doc-inipaens1423838.shtml
