代码: "002321"
名称: "华英农业"
定位: "河南信阳潢川的鸭肉全产业链企业（曾称“世界鸭王”），2009 年深交所中小板上市，2020 年因大额亏损、控股股东非经营性占用资金及无法表示意见的审计报告被实施退市风险警示，2021 年完成破产重整、2022 年摘帽，现聚焦食品与羽绒双主业，2026 年上半年归母净亏损 2,928.25 万元。"

沿革:
  - 年: "1991"
    事件: "英国首相撒切尔夫人访华带来一批中英合作项目，其中三个樱桃谷鸭养殖项目之一落户河南信阳潢川县，当地财政局成立国有企业华英农业发展有限公司，利用英国政府贷款实施樱桃谷鸭项目"
    来源: "https://finance.sina.cn/2021-08-17/detail-ikqcfncc3450463.d.html?vt=4"
  - 年: "2009"
    事件: "12 月 16 日在深交所上市（发行主体后更名为河南华英农业发展股份有限公司），经证监许可[2009]1199 号文核准首次公开发行 3,700 万股、发行价 16.98 元/股，实际募集资金 62,826.00 万元，上市后总股本 14,700 万股"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/002321.phtml"
  - 年: "2021"
    事件: "因 2020 年度财务会计报告被亚太（集团）会计师事务所出具无法表示意见的审计报告，深交所于 2021 年 4 月 30 日对公司股票交易实行“退市风险警示”；2021 年 12 月 22 日信阳中院裁定批准《重整计划》并终止重整程序"
    来源: "http://disc.static.szse.cn/download/disc/disk03/finalpage/2022-06-24/5ac7fee4-7175-4ec4-9f65-11bc14819c6f.PDF"
  - 年: "2022"
    事件: "4 月 14 日信阳中院作出（2021）豫 15 破 6-4 号《民事裁定书》，裁定确认《重整计划》执行完毕、终结重整程序；公司控股股东由河南省潢川华英禽业总公司变更为信阳市鼎新兴华产业投资合伙企业（有限合伙），实际控制人变更为许水均"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002321&id=8993574"

主营与结构:
  - 事件: "聚焦食品、羽绒双主业，构建“从农场到餐桌”的全产业链体系，产品包括冻品、熟食、羽绒等，定位为全球优质鸭肉供应商"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002321&id=12112785"
  - 事件: "2025 年冻品实现营业收入 7.66 亿元，同比下降 12.42%，毛利率 0.03%（同比下降 3.34 个百分点）；熟食营业收入 5.64 亿元，同比下降 3.45%，毛利率 21.76%"
    来源: "https://www.cs.com.cn/ssgs/01/2026/04/18/detail_2026041810004881.html"
  - 事件: "2026 年上半年肉鸭行业供需失衡格局延续，主要产品价格维持在低位区间波动"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002321&id=12539601"
  - 事件: "经营范围包括父母代樱桃谷鸭、种蛋的生产经营，禽业养殖、屠宰加工及制品销售，饲料生产销售等"
    来源: "https://q.stock.sohu.com/cn/002321/information.shtml?type=130"

融资历史:
  - 时间: "2009-12"
    方式: "IPO（深圳证券交易所中小板）"
    规模: "3,700 万股，发行价 16.98 元/股，实际募集资金 62,826.00 万元"
    用途: "依序投向淮阳 4000 万只/年商品肉鸡系列加工生产项目、丰城 1000 万只/年及单县 2000 万只/年樱桃谷商品雏鸭生产项目等"
    说明: "本次发行采用网下询价配售（740 万股，占 20%）与网上定价发行（2,960 万股，占 80%）相结合方式，主承销商光大证券"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=002321&id=487991"
  - 时间: "2021-12"
    方式: "破产重整——重整投资人受让转增股票出资"
    规模: "产业投资人鼎新兴华以人民币约 3.62 亿元有条件受让华英农业转增股票约 5.12 亿股，并解决 4,311.25 万元控股股东非经营性资金占用问题"
    用途: "受让转增股票、解决控股股东资金占用"
    说明: "2021 年 12 月 23 日公司与鼎新兴华、光州辰悦、信阳华信、农投新动能、广兴股权签署《重整投资协议》"
    来源: "https://www.zhitongcaijing.com/content/detail/628357.html"
  - 时间: "2021-12"
    方式: "资本公积转增股本（重整出资人权益调整）"
    规模: "以 2021 年 12 月 31 日总股本 53,429.11 万股为基数，按每 10 股转增 29.92 股实施资本公积转增，共转增 159,859.90 万股，总股本增至 213,289.00 万股；转增股票不向原股东分配"
    用途: "其中 531,963,958 股以股抵债形式清偿公司债务，1,066,635,013 股由重整投资人有条件受让"
    说明: "转增后公司总股本由 53,429.11 万股增加至 213,289.00 万股（2,132,890,071 股）"
    来源: "https://q.stock.sohu.com/newpdf/202561987343.pdf"

风险与困境:
  - 时间: "2020"
    事件: "受信贷紧缩及新冠疫情的直接影响，叠加控股股东非经营性占用上市公司资金、合同纠纷等因素，公司经营陷入困境，营收下滑接近腰斩并大额亏损"
    来源: "https://stcn.com/article/detail/1423442.html"
  - 时间: "2021-04-13"
    事件: "光大证券对控股股东所持的部分公司股票进行违约处置，以集中竞价方式减持 2,016,400 股，约占公司总股本的 0.38%"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002321&id=8184855"
  - 时间: "2025-12-31"
    事件: "2025 年营业收入 54.47 亿元，同比增长 15.15%；归属于上市公司股东的净利润 -5,990.38 万元，上年同期盈利 3,236.06 万元，同比下降 285.11%；扣非归母净利润 -1.12 亿元，上年同期 1,081.62 万元；受产品价格承压影响板块毛利率回落"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-18/12112776.PDF"
  - 时间: "2025-12-31"
    事件: "截至报告期末，公司母公司财务报表中存在累计未弥补亏损 395,426.49 万元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002321&id=12112785"
  - 时间: "2026-06-30"
    事件: "2026 年上半年营业收入 237,192.89 万元，同比增长 14.52%；归属于上市公司股东的净利润 -2,928.25 万元，同比下降 41.93%；扣非归母净利润 -3,510.20 万元"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002321&id=12539602"

战略与转型:
  - 时间: "2022"
    事件: "重整落定后提出冲刺“世界鸭王+世界羽王”双产业目标"
    来源: "https://m.bjnews.com.cn/detail/1650525774169799.html"
  - 时间: "2022"
    事件: "公司启动低效资产处置程序，拟处置评估价值为 5.7 亿元的长期股权投资以及评估值为 2.77 亿元的其他应收款资产"
    来源: "https://m.bjnews.com.cn/detail/1650525774169799.html"
  - 时间: "2026"
    事件: "以“食品、羽绒双主业”为核心，持续优化产业链协同效率、深化产品结构调整，通过强化成本管控、拓展高附加值产品销路、加快出口市场布局对冲行业周期压力"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002321&id=12539601"

融资需求线索:
  - 时间: "2026-04-10"
    事件: "控股股东鼎新兴华全体合伙人一致同意解散并将所持华英农业股份按各合伙人实缴出资比例通过非交易过户方式分配给全体合伙人；分配后鼎新兴华持股比例由 24% 降至 0，各合伙人由间接持股转为直接持股，可能引发后续股东结构与融资安排调整"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002321&id=12539601"

其他要点:
  - 要点: "本次权益变动后，信阳产投及其一致行动人信阳华信将合计持有华英农业 21.81% 股份，公司控股股东将变更为信阳产投，实际控制人将变更为信阳市财政局"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-26/1225506762.PDF"
  - 要点: "股份分配方案中，广汉东兴羽绒制品有限公司直接持有华英农业股份比例将由 0 上升至 6.76%，信阳市产业投资集团有限公司直接持股比例将上升至 16%，杭州兴增企业管理有限公司直接持股比例上升至 0.34%"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002321&id=12539601"
  - 要点: "截至 2026 年 6 月 30 日，控股股东鼎新兴华持有公司股票 511,893,617 股（持股比例 24%），实际控制人许水均直接持有 6,612,950 股（0.31%），合计持股 518,506,567 股；许水均于 2022 年 6 月 29 日起任公司法定代表人"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002321&id=12539601"
  - 要点: "重整投资人（信阳市鼎新兴华、信阳市广兴股权、河南光州辰悦、信阳华信、潢川县农投新动能、四川兴华鼎/海南兴华鼎）承诺通过重整程序受让的转增股票自登记至其指定证券账户之日起三十六个月内不转让"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-20/10004335.PDF"
  - 要点: "2024 年前三季度公司实现营业收入 37.57 亿元，同比增长 41.41%；归母净利润 3,279.96 万元，同比增长 104.86%；经营性现金流净额 1.34 亿元，同比增长 160.79%"
    来源: "https://stcn.com/article/detail/1423442.html"

