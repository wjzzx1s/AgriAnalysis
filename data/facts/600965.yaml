代码: "600965"
名称: "福成股份"
定位: "河北三河的牛羊肉屠宰加工与餐饮企业，2015年发行股份收购大股东旗下灵山宝塔陵园，成为A股唯一拥有殡葬业务的公司；2026年5月因2025年财务报表被出具无法表示意见，被实施退市风险警示并叠加其他风险警示，简称变更为“*ST福成”。"
沿革:
  - 年: "1998"
    事件: "前身三河五丰福成食品有限公司于1998年3月18日登记注册，为中外合资经营企业"
    来源: "http://www.aastocks.com/tc/cnhk/analysis/company-fundamental/company-profile?shsymbol=600965"
  - 年: "2001"
    事件: "2001年2月28日在廊坊市工商行政管理局注册登记，三河五丰福成食品有限公司变更为河北福成五丰食品股份有限公司"
    来源: "http://www.aastocks.com/tc/cnhk/analysis/company-fundamental/company-profile?shsymbol=600965"
  - 年: "2004"
    事件: "2004年6月21日经中国证监会批准首次向社会公众发行人民币普通股8,000万股，2004年7月13日在上海证券交易所挂牌上市，发行价3.15元/股，简称“福成五丰”"
    来源: "http://vip.stock.finance.sina.com.cn/corp/go.php/vCI_CorpRule/stockid/600965.phtml"
  - 年: "2013"
    事件: "2013年11月26日取得证监许可〔2013〕1478号批复，向三河福生投资有限公司等发行股份购买福成肥牛餐饮管理有限公司100%股权、三河市福成都市食品有限公司100%股权，2013年12月4日标的资产完成过户"
    来源: "https://qxb-pdf-osscache.qixin.com/AnBaseinfo/21ad91804d0da4a66f49059ee313c3c7.pdf"
  - 年: "2015"
    事件: "2015年3月2日取得证监许可〔2015〕298号批复，向控股股东福成投资集团有限公司发行股份购买三河灵山宝塔陵园有限公司100%股权，交易作价15亿元；2015年7月21日新增290,697,674股完成登记，注册资本由528,003,281元增至818,700,955元"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260429/970d1496d02f4d5698d5c1f3ac2f3076.PDF"
  - 年: "2018"
    事件: "完成对湖南韶山天德福地陵园有限责任公司60%股权的收购（含收购股权并增资，累计实际出资1.62亿元）"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/2023/2023-03-25/1501956cca1f11edae08fa163e26e5de.pdf"
  - 年: "2022"
    事件: "2022年1月28日公告，实际控制人之一李福成收到河北省衡水市冀州区人民法院《刑事判决书（2020）冀1181刑初94号》，数罪并罚决定执行有期徒刑三年、缓刑五年"
    来源: "https://m.21jingji.com/article/20220128/herald/0efe4101e40806d4544d164bd206782e_zaker.html"
  - 年: "2026"
    事件: "2026年5月6日起公司股票被实施退市风险警示并叠加其他风险警示，股票简称由“福成股份”变更为“*ST福成”，日涨跌幅限制为5%"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600965&id=12288810"
主营与结构:
  - 事件: "公司业务涵盖畜牧养殖及屠宰、食品加工（牛肉、羊肉、肉制品、乳制品等）、餐饮服务与殡葬服务四大板块；2018年年报称公司已形成畜牧养殖及屠宰、食品加工行业，餐饮服务行业，殡葬服务行业三大行业格局"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/2019-03-30/600965_2018_n.pdf"
