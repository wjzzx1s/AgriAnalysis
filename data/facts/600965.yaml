    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/2019-03-30/600965_2018_n.pdf"
  - 事件: "主要殡葬资产灵山宝塔陵园总面积765亩，规划设计墓位约12.5万个，位于北京大七环与京秦高速交汇口并接驳京平高速，客户主要集中在北京市"
    来源: "https://emweb.securities.eastmoney.com/pc_hsf10/pages/index.html?type=web&code=sh600965&color=b"
  - 事件: "2026年上半年食品制造业务分产品收入：牛肉110,540,726.08元（同比-20.42%）、肉制品66,031,329.03元（同比+1.65%）、羊肉5,418,422.26元（同比-24.81%）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600965&id=12557240"
