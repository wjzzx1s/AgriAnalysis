代码: "600127"
名称: "金健米业"
定位: "湖南常德地方国资背景的粮油食品加工企业，主营粮油食品加工、农产品贸易与乳品，控股股东为湖南粮食集团，实际控制人为湖南省国资委；收入规模数十亿元但盈利极薄，累计可供分配利润为负，2024 年与控股股东完成资产置换后主业结构调整。"
沿革:
  - 年: "1998"
    事件: "经湖南省人民政府湘政函〔1998〕2 号文件批准，由常德市粮油总公司发起设立，1998 年 4 月 27 日在常德市工商行政管理局登记注册，总部位于湖南省常德市"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2012/2012-4/2012-04-07/876856.PDF"
  - 年: "1998"
    事件: "1998 年 4 月 8 日至 15 日以“全额预缴款、比例配售、余款即退”方式向社会发行公众股 5,000 万股（含公司职工股 500 万股），每股面值 1 元、发行价 5.30 元/股；实际募集资金合计 26,501 万元、募集资金净额 25,500 万元，招股公告日 1998-04-06，1998 年 5 月 6 日在上海证券交易所上市，证券代码 600127"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/600127.phtml"
  - 年: "2001"
    事件: "经中国证监会证监公司字[2000]229 号文批准，2000 年 12 月 29 日至 2001 年 1 月 9 日公募增发 5,000 万 A 股，发行价格 16.10 元/股；本次增发网上发行的 30,000,044 股于 2001 年 2 月 6 日上市流通"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/2003-04-29/600127_2002_n.pdf"
  - 年: "2021"
    事件: "2021 年 7 月公司实际控制人由长沙市国资委变更为湖南省国资委；划转前湖南粮食集团通过金霞粮食持有公司 136,932,251 股（占总股本 21.34%）"
    来源: "http://static.cninfo.com.cn/finalpage/2021-07-16/1210496470.PDF"
  - 年: "2022"
    事件: "2022 年 7 月，实际控制人湖南省国资委旗下的湖南省现代农业产业控股集团有限公司与湖南粮食集团有限责任公司合并组建成立湖南农业发展投资集团有限责任公司"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202303301584711940_1.pdf"
  - 年: "2024"
    事件: "2024 年 11 月 8 日、11 月 25 日董事会与临时股东大会审议通过与控股股东湖南粮食集团实施资产置换的议案，2024 年 12 月完成置换"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2024-12-28/600127_20241228_9RM6.pdf"
主营与结构:
  - 事件: "2024 年资产置换后主营为粮油食品加工、农产品贸易、乳品的生产销售"
    来源: "http://static.cninfo.com.cn/finalpage/2025-06-30/1224029813.PDF"
  - 事件: "2024 年累计实现营业收入 462,716 万元，较上年度 526,943 万元减少 64,227 万元，同比下降 12.19%；综合毛利率 5.75%"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-04-15/600127_20250415_K9XQ.pdf"
  - 事件: "2025 年累计实现营业收入 335,801 万元，较上年度 462,716 万元减少 126,915 万元，同比下降 27.43%；毛利额 25,813 万元；综合毛利率 7.69%，同比增加 1.94 个百分点"
    来源: "https://cniis.aastocks.com/CNSESH_STOCK/2026/2026-4/2026-04-09/12069406.pdf"
  - 事件: "2026 年 1—6 月实现营业收入 19.70 亿元，同比增加 25.19%；归属于上市公司股东的净利润 -957.91 万元，同比减少 2,124.30 万元"
    来源: "https://stockmc.xueqiu.com/202608/600127_20260829_VIPV.pdf"
