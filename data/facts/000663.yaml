代码: '000663'
名称: 永安林业
定位: 全国首家林业综合性股份制公司，1996 年 12 月深交所上市，主营森林资源培育与林木采伐经营、人造板与地板家居（林板一体化）；2021 年 2 月中国林业集团完成战略重组、成为间接控股股东，实际控制人为国务院国资委。2023—2025 年归母净利润由盈转亏并连续两年亏损，生物质能循环利用项目停建并计提减值、引发诉讼，中林集团避免同业竞争的五年承诺已逾期未履行。
沿革:
- 年: '1994'
  事件: 1 月 6 日公司成立，前身为福建省永安林业（集团）总公司体系内企业
  来源: https://www.yonglin.com/static/upload/file/20230323/1679538083716770.pdf
- 年: '1996'
  事件: 12 月 6 日公司股票在深圳证券交易所上市，为全国首家林业综合性股份制公司和林业上市企业
  来源: https://www.yonglin.com/static/upload/file/20230323/1679538083716770.pdf
- 年: '2021'
  事件: 2 月中国林业集团有限公司完成对公司的战略重组，公司成为中林集团控股子公司，最终控制人为国务院国资委
  来源: https://www.yonglin.com/static/upload/file/20230323/1679538083716770.pdf
- 年: '2021'
  事件: 公司基本解决 2016、2017 年度财务虚假记载影响并完成问题整改，实现摘星脱帽，进入正常发展阶段
  来源: https://www.yonglin.com/static/upload/file/20230323/1679538083716770.pdf
- 年: '2024'
  事件: 2 月 19 日起永安市财政局、永安市绿康投资发展有限公司所持股份对应的表决权不再委托给控股股东中林（永安）控股有限公司行使；表决权委托届满后中林永安仍持有 64,884,600 股（占 19.27%），仍为公司控股股东
  来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000663&id=12224857
股权与控制权:
- 时间: '2025-12-31'
  事项: 截至 2025 年 12 月 31 日公司控股股东中林（永安）控股有限公司持股 19.27%（64,884,600 股，无质押冻结）；前十大股东中另有国有法人持股 6.40%
  来源: https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-04-28/cc45be0e-e1a0-40d7-86ea-3b436e36a0d2.PDF
主营与结构:
- 事件: 公司属林业行业，主营森林资源培育与林木采伐经营、森林经营服务、人造板经营；拥有林地 151.8 万亩（以马尾松、杉木为主），一条产能 30 万立方米的纤维板生产线和一条产能 300 万平方米的地板生产线，拥有永林、永林蓝豹、企鹅等注册商标，产业定位为林板一体化
  来源: https://www.yonglin.com/static/upload/file/20230323/1679538083716770.pdf
- 事件: 2025 年度营业收入 324,442,470.47 元（同比增 0.42%），归属于上市公司股东的净利润 -95,104,107.86 元（同比下降 11.84%），扣非归母净利润 -99,377,325.16 元；亏损原因包括林木资产转让较上期减少、生物质能循环利用项目本期计提各项资产减值损失金额同比增加、本期计提持有待售资产减值损失
  来源: https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-28/89f866eb-7035-4cf6-be81-f35cac3ad4eb.PDF
- 事件: 2023 年营业收入 693,162,044.78 元、归母净利润 190,033,530.14 元、扣非归母净利润 180,971,502.82 元；2024 年营业收入 323,086,122.97 元、归母净利润 -85,038,418.13 元、扣非归母净利润 -98,698,032.74 元
  来源: https://epaper.stcn.com/pic/202604/28/a1423b1d29589d07b30b88c61216655f.pdf
- 事件: 2026 年上半年实现营业收入 1.51 亿元，同比增长 14.73%；归母净利润 -1,933.62 万元（上年同期 -1,761.76 万元），扣非归母净利润 -2,006.19 万元；经营活动产生的现金流量净额 -3,139.14 万元；基本每股收益 -0.06 元、加权平均净资产收益率 -2.11%
  来源: https://finance.sina.com.cn/jjxw/2026-08-27/doc-inipuqhs0652188.shtml
- 事件: 2026 年上半年板材家居业务：生产各类纤维板 10.58 万立方米（同比增 24.32%）、销售 9.74 万立方米（增 20.54%）；生产木地板 7.06 万平方米（减 55.79%）、销售 7.12 万平方米（减 46.02%）；生产饰面板 32.58 万平方米（增 117.78%）、销售 34.87 万平方米（增 40.95%）；销售定制衣柜 345.75 万元（减 8.32%）
  来源: http://static.cninfo.com.cn/finalpage/2026-08-28/1225521560.PDF
- 事件: 2026 年上半年归母净利润未能实现盈利，主要系生物质项目停建后产生的诉讼费用、资产减值及政府补助同比减少等因素影响；同时人造板业务因持续强降雨及国际局势导致木质原料供应趋紧、价格上涨，甲醛等化工原料价格亦较快上涨，生产成本持续承压
  来源: https://finance.sina.com.cn/jjxw/2026-08-27/doc-inipuqhs0652188.shtml
- 事件: 截至 2025 年末公司总资产 1,527,393,303.29 元（较上年末 -3.26%）、归属于上市公司股东的净资产 927,300,894.40 元（较上年末 -8.88%）；2023 年末归母净资产 1,102,759,255.18 元
  来源: https://pdf.dfcfw.com/pdf/H2_AN202604271821632340_1.pdf
融资历史:
- 时间: 1996-11
  方式: IPO（深圳证券交易所）
  规模: 向社会公开募集股票 1,950 万股，共募得资金 9,150 万元
  用途: 招股说明书承诺投资项目（后续发生变更，变更原因与程序已在 1997 年年报披露）
  说明: 公司 1996 年 12 月 6 日上市；1997 年 5 月 12 日股东大会决议向全体股东每 10 股派送 1 股红股并以资本公积按 10:7 转增股本，注册资本增至 11,345.40 万元；1998 年 6 月 29 日股东大会决议每 10 股派送 3 股红股，注册资本增至 114,749.02 万元
  来源: https://m.cj.sina.cn/page/aHR0cDovL2ZpbmFuY2Uuc2luYS5jb20uY24vc3RvY2svY29tcGFueS9zei8wMDA2NjMvOV8zLnNodG1s?from=redirect
- 时间: 2015-09
  方式: 发行股份及支付现金购买资产并募集配套资金（重大资产重组）
  规模: 以发行股份方式支付 124,999 万元、发行价格 11.75 元/股，共计发行 106,382,125 股购买苏加旭、李建强、王清云、王清白及固鑫投资、雄创投资持有的福建森源股份有限公司 100% 股权（森源家具）；同时向瀚叶财富、黄友荣非公开发行 31,877,394 股募集配套资金 41,600 万元，发行价格 13.05 元/股
  用途: 本次交易现金对价支付、森源股份信息系统升级改造和营销与服务网点建设、补充上市公司流动资金
  说明: 发行股份购买资产所发行新股上市日为 2015 年 10 月 8 日，增发后公司总股本 309,142,405 股；配套融资所发行新股上市首日为 2015 年 12 月 23 日
  来源: http://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=000663&id=2112055
- 时间: '2023-11-20'
  方式: 2022 年度向特定对象发行 A 股股票（终止）
  规模: 拟募集资金总额不超过人民币 30,000.00 万元，发行数量不超过 43,604,651 股，由中林集团以现金方式全额认购
  用途: 涿州市生物质能循环利用项目、宁晋县生物质能循环利用项目、生物质发酵微生物研发中心项目
  说明: 本次发行方案于 2022 年 9 月 30 日经第九届董事会第二十八次会议审议通过、2022 年 10 月 17 日经 2022 年第五次临时股东大会审议通过；2023 年 11 月 20 日第十届董事会第三次会议和第十届监事会第三次会议审议通过《关于终止公司 2022 年度向特定对象发行股票事项并撤回申请文件的议案》并向深交所申请撤回相关申请文件；保荐机构为国新证券股份有限公司
  来源: http://m.cnhubei.com/content/2023-11/21/content_16975991.html
风险与困境:
- 时间: '2021-08-24'
  事项: 公司时任部分董事、高级管理人员因 2016 年、2017 年期间存在信息披露违法违规事实受到福建证监局行政处罚；截至 2022 年度向特定对象发行募集说明书签署日，累计有 16 名投资者以公司虚假陈述导致其投资损失为由向福州市中级人民法院提起诉讼，索赔共计 2,561.67 万元
  来源: http://xinpi.zqrb.cn/pdf/SZ/000663/2023/0427/144060793.pdf
- 时间: '2022-12-31'
  事项: 报告期各期末公司未分配利润分别为 -132,563.85 万元、-127,101.28 万元和 -100,300.87 万元，存在金额较大的未弥补亏损，预计一段时间内无法向股东分配利润
  来源: http://xinpi.zqrb.cn/pdf/SZ/000663/2023/0427/144060793.pdf
- 时间: '2024-02-27'
  事项: 深圳国际仲裁院就公司诉苏加旭、李建强、固鑫投资、南安雄创关于森源家具业绩承诺补偿事项作出（2020）深国仲裁 5099 号终局裁决：苏加旭、固鑫投资连带向公司补偿股票 1,759,791 股、李建强补偿 102,313 股、南安雄创补偿 184,164 股（合计 2,046,268 股），如不能以股份补偿需按 2015 年发行股份购买森源家具 100% 股权时每股 11.75 元的标准现金补偿；2024 年 3 月 19 日公司向深圳市中级人民法院申请撤销仲裁裁决，2024 年 5 月 31 日深圳中院作出（2024）粤 03 民特 535 号民事裁定书驳回公司申请
  来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000663&id=11376329
- 时间: '2024-12-31'
  事项: 森源家具 2015、2016、2017 年度累计实现净利润较业绩承诺累计净利润 40,923 万元少 3,829.89 万元，承诺方应补偿股份 10,323,209 股，2019 年 5 月已补偿 4,304,773 股，尚需补偿 6,018,436 股；截至 2025 年年度报告披露日承诺方尚未履行剩余业绩补偿义务
  来源: http://static.cninfo.com.cn/finalpage/2026-04-28/1225209828.PDF
- 时间: 2025-10
  事项: 公司全资孙公司向永安市人民法院提起对必奥新能源科技有限公司的买卖合同纠纷诉讼，涉案金额 10,470 万元；后永安市人民法院裁定移送管辖，本案管辖权变更由永安市人民法院变更为南京市玄武区人民法院审理，尚未开庭，公司已申请诉前保全
  来源: http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000663&id=12224857
- 时间: '2025-11-21'
  事项: 股东永安市远兴曹远城镇建设有限公司与永安市财政局签署《解除〈福建省永安林业（集团）股份有限公司股份表决权委托协议〉的协议书》，提前终止将所持公司 12,611,300 股（占总股本 3.75%）表决权委托给永安市财政局行使的安排；2025 年 12 月 1 日中国证监会福建监管局下发《行政监管措施决定》（〔2025〕90 号），认定远兴建设公司违反此前承诺，责令改正并继续履行上述表决权委托承诺；深交所亦对其出具监管函
  来源: https://epaper.stcn.com/att/202512/23/ZQ23B084-MM_eBook.pdf
- 时间: '2026-04-03'
  事项: 深交所向中国林业集团有限公司发出监管函：中林集团、中林集团控股有限公司于 2020 年 4 月出具《关于避免同业竞争的承诺》，承诺五年内通过资产注入、资产重组、委托管理、业务调整等方式解决与永安林业的同业竞争，该承诺 2021 年 2 月生效；截至 2026 年 2 月 28 日中林集团旗下仍有子公司从事林木业务、与公司存在同业竞争，中林集团未按期履行承诺且未在承诺到期前履行承诺变更程序，违反《股票上市规则（2025 年修订）》第 1.4 条、第 2.1.1 条第一款、第 7.7.6 条第一款
  来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000663&id=12062587
- 时间: 2026-04
  事项: 中国证监会福建监管局对中林集团采取出具警示函的行政监管措施，并记入证券期货市场诚信档案数据库，理由同为未按期履行避免同业竞争承诺
  来源: http://www.csrc.gov.cn/fujian/c104066/c7624164/content.shtml
- 时间: '2026-07-09'
  事项: 公司因不服福建省高级人民法院（2024）闽民终 658 号民事判决向最高人民法院申请再审的张强等 17 人诉讼案（涉案金额 3,172.55 万元）被最高人民法院裁定驳回再审申请；本次诉讼裁定涉案金额已于 2025 年 7 月全额支付，对公司本年度经营业绩不造成影响
  来源: https://epaper.stcn.com/att/202607/09/ZQ09B018-BB_eBook.pdf
- 时间: '2023-12-31'
  事项: 公司就未决诉讼及投资者诉讼事项计提预计负债 31,725,513.64 元（期初 25,616,663.31 元）
  来源: https://stockn.xueqiu.com/SZ000663/20240429792426.pdf
战略与转型:
- 时间: '2020-04-12'
  事项: 公司原控股股东福建省永安林业（集团）总公司（林业发展集团）与中林集团控股有限公司签订协议，中林控股成为公司实际控制人；中林控股与林业发展集团以持有的 64,884,600 股永安林业股票出资共同设立中林（永安）控股有限公司（中林控股、林业发展集团持股比例分别为 51%、49%）
  来源: https://stockn.xueqiu.com/SZ000663/20240429792426.pdf
- 时间: '2021-02-09'
  事项: 林业发展集团完成股份过户登记手续，中林永安持有公司股票 64,884,600 股（占总股本 19.27%）并通过表决权委托持有永安市财政局和绿康投资所持股份对应的表决权，成为公司控股股东；中林控股持有中林永安 51% 股权、中林集团持有中林控股 60% 股权、国务院国资委持有中林集团 90% 股权
  来源: http://static.cninfo.com.cn/finalpage/2026-04-28/1225209828.PDF
- 时间: '2021'
  事项: 公司由林场主向林地综合开发运营商转型，全面参与国家储备林建设，组织编制国储林（一期）《森林经营作业规划》（2021—2025 年）
  来源: https://www.yonglin.com/static/upload/file/20230323/1679538083716770.pdf
- 时间: 2022-2023
  事项: 公司筹划 2022 年度向特定对象发行 A 股股票，募投项目转向生物质能循环利用（涿州、宁晋）与生物质发酵微生物研发中心，由中林集团现金全额认购；方案 2023 年 11 月被董事会审议终止并撤回申请文件
  来源: http://m.cnhubei.com/content/2023-11/21/content_16975991.html
- 时间: '2026-05-13'
  事项: 公司在投资者关系活动中说明控股股东已明确延期承诺期限内避免同业竞争的具体措施：结合十五五发展规划于 2026 年启动福建区域专业化整合、于 2027 年底前研究启动与上市公司之间在福建区域内通过资产委托管理及业务调整等方式理顺内部业务管理关系；在相关业务盈利能力和资产状况满足上市公司基本要求的前提下，采取符合监管要求的方式将相关林木产品业务资产注入上市公司
  来源: http://file.finance.sina.com.cn/cn/diaoyan/jgdy/2026/2026-05/2026-05-13/10180442_1.PDF
- 时间: '2026-08-28'
  事项: 公司披露中林集团关于避免同业竞争的具体措施，包括要求涉及永安林业现有产品经营业务的子公司不得在永安林业经营区域内直接开展相同业务、新客户或项目遵循优质资源向上市公司倾斜原则由上市公司享有优先接洽权等
  来源: http://static.cninfo.com.cn/finalpage/2026-08-28/1225521560.PDF
融资需求线索:
- 时间: '2023-11-20'
  事项: 董事会审议终止 2022 年度向特定对象发行股票事项并向深交所申请撤回申请文件，原计划由中林集团全额认购、募资不超过 3 亿元的股权融资方案落空
  来源: http://m.cnhubei.com/content/2023-11/21/content_16975991.html
- 时间: '2026-05-13'
  事项: 控股股东对避免同业竞争的承诺延期至 2029 年（原承诺 2026 年 2 月到期），并明确 2026 年启动福建区域专业化整合、2027 年底前研究启动资产委托管理与业务调整，条件满足时将林木产品业务资产注入上市公司，构成潜在资产注入类融资/重组线索
  来源: http://file.finance.sina.com.cn/cn/diaoyan/jgdy/2026/2026-05/2026-05-13/10180442_1.PDF
- 时间: '2026-06-30'
  事项: 截至检索未查得公司披露新的定增预案、可转债、公司债发行或银行综合授信额度方案；2025 年筹资活动现金流入仅 23,395,329.98 元（上年 19,800,000.00 元）
  来源: http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000663&id=12224857
其他要点:
- 要点: 公司林地中列入国际核证碳减排标准（VCS）林业碳汇试点项目面积 6.3 万亩（占该项目 56.8%），第 1 个核查期签发 26.3 万吨自愿减排量（VCU），已分别于 2016 年 12 月、2021 年 3 月交易 5 万吨、21.3 万吨，公司获得销售收入共计 173.58 万元；公司计划选取 15.75 万亩人工商品乔木林参与中国森林经营碳汇（CCER）开发
  来源: https://www.yonglin.com/static/upload/file/20230323/1679538083716770.pdf
- 要点: 2021 年公司实现收入 5.06 亿元、归母净利润 5,462.57 万元（同口径剔除福建森源家具有限公司剥离影响后分别上升 62.98%、563.43%），总资产 13.66 亿元、净资产 6.80 亿元
  来源: https://www.yonglin.com/static/upload/file/20230323/1679538083716770.pdf
- 要点: 2026 年 8 月人造板生产线尾气治理系统升级改造项目已启动基础施工，省级企业技术中心通过 2026 年考核评价
  来源: https://static.weeklyonstock.com/26/0827/ABB2619051554875.html
- 要点: 公司 2026 年 9 月 9 日召开业绩说明会，管理层表示人造板制造业是公司主责主业之一，将密切关注人造板市场需求形势并采取措施应对原料价格变化
  来源: https://pdf.dfcfw.com/pdf/H2_AN202609091829179170_1.pdf
