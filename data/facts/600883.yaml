代码: "600883"
名称: "博闻科技"
定位: "云南保山起家的老牌上市公司，主业历经水泥—科技—农副食品的多次更迭，现主营云南高原特色农副食品加工（食用菌、火腿、咖啡），并持有新疆众和参股权益与部分证券资产。"
沿革:
  - 年: "1990"
    事件: "经云南保山地区行署经济委员会保署（1990）13 号批准正式成立（原名云南省保山水泥股份有限公司）"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600883&id=12118766"
  - 年: "1993"
    事件: "经国家体改生（1993）223 号文批准确认为继续进行规范化的股份制试点企业"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600883&id=12118766"
  - 年: "1995"
    事件: "1995-12-08 社会公众股股票经批准在上海证券交易所挂牌交易，成为云南省第四家暨全省地州股份制企业第一家上市公司"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600883&id=12118766"
  - 年: "2000"
    事件: "自 2000-03-07 起公司名称由“云南省保山水泥股份有限公司”变更为“云南富邦科技实业股份有限公司”，自 2000-03-13 起上市股票简称由“云南保山”变更为“富邦科技”"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2023-08-29/600883_20230829_GY09.pdf"
  - 年: "2004"
    事件: "2004-06-24 公司名称由“云南富邦科技实业股份有限公司”变更为“云南博闻科技实业股份有限公司”，上市股票简称自 2004-07-08 由“富邦科技”变更为“博闻科技”"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2023-08-29/600883_20230829_GY09.pdf"
  - 年: "2022"
    事件: "基于国家水泥产业政策升级和水泥业务运营现状，公司决定对水泥粉磨站实施停产、不再从事水泥生产经营业务，主营业务范围由“水泥业务和食用菌业务”两个板块变更为“食用菌业务和火腿业务”两个板块"
    来源: "https://stockn.xueqiu.com/SH600883/20230421911458.pdf"
  - 年: "2025"
    事件: "2025-03-28 全资子公司怒江博闻咖啡有限公司注册成立（主要作为咖啡种植基地项目的投资运营主体）"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260515/7d8f7aa3516446a4a665d84098429020.PDF"
主营与结构:
  - 事件: "报告期内主营业务范围包括食用菌业务、火腿业务和咖啡业务三个板块；食用菌以全资子公司香格里拉博闻为实施主体（松茸及其制品、冷冻美味牛肝菌、干牛肝菌、干羊肚菌等），火腿以控股子公司云南诺邓金腿食品科技有限公司实施（“一腿”品牌诺邓火腿、盐泥肉、午餐肉等），咖啡以上市公司为实施主体（咖啡生豆、焙炒咖啡豆、挂耳咖啡及咖啡种植经营）"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260420/e1423396bf3341e5935201fddd9d7496.PDF"
  - 事件: "股权结构：下辖 3 家全资子公司（昆明博闻科技开发有限公司、香格里拉市博闻食品有限公司、怒江博闻咖啡有限公司）、1 家控股子公司（截至报告期末持股 51% 的云南诺邓金腿食品科技有限公司）、1 家参股公司（新疆众和股份有限公司，证券代码 600888）"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260515/7d8f7aa3516446a4a665d84098429020.PDF"
  - 事件: "2025 年度实现营业收入 55,793,446.35 元（同比 +30.68%），其中松茸及食用菌制品销售收入 4,100.87 万元、火腿及其制品销售收入 451.72 万元、咖啡业务销售收入 1,003.28 万元；归属于上市公司股东的净利润 23,982,226.49 元（同比 -66.76%，主因联营企业新疆众和净利润同比减少、按权益法核算的长期股权投资收益减少）"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260515/7d8f7aa3516446a4a665d84098429020.PDF"
  - 事件: "2026 年上半年实现营业收入 26,176,829.62 元（同比 -8.76%），归属于上市公司股东的净利润 15,112,835.24 元（同比 +5.31%），扣非净利润 15,663,699.84 元（同比 +9.35%）"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-8/2026-08-26/12534858.PDF"
