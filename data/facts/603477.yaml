代码: "603477"
名称: "巨星农牧"
定位: "四川乐山的生猪养殖与饲料企业，前身为皮革企业振静股份（2017 年上交所上市），2020 年发行股份购买巨星农牧 100% 股权后主业转型为生猪养殖，2023 年 9 月控股股东变更为四川巨星集团、实际控制人变更为唐光跃；2026 年上半年出栏 280.77 万头但受猪价下行拖累由盈转亏。"

沿革:
  - 年: "2017"
    事件: "12 月 18 日四川振静股份有限公司在上交所上市，股票简称“振静股份”，发行 6,000 万股、发行价 5.58 元/股，实际募集资金 3.35 亿元，主营中高档天然皮革"
    来源: "https://basic.10jqka.com.cn/603477/company.html"
  - 年: "2019"
    事件: "因筹划向巨星农牧股份有限公司全体股东发行股份及支付现金购买其 100% 股份，公司股票自 2019 年 9 月 9 日起停牌，9 月 24 日复牌"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603477&id=5911098"
  - 年: "2020"
    事件: "7 月完成收购巨星农牧有限公司 100% 股权的资产过户，自 2020 年 7 月 1 日起纳入合并范围，主营业务由中高档天然皮革变更为畜禽养殖及饲料生产销售"
    来源: "http://static.cninfo.com.cn/finalpage/2022-04-21/1212999930.PDF"
  - 年: "2021"
    事件: "公司名称由“四川振静股份有限公司”变更为“乐山巨星农牧股份有限公司”，A 股证券简称由“振静股份”变更为“巨星农牧”"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202203111551964703_1.pdf"
  - 年: "2023"
    事件: "控股股东由四川和邦投资集团有限公司变更为四川巨星企业集团有限公司，实际控制人由贺正刚变更为唐光跃，相关股份过户登记于 2023 年 9 月 20 日完成"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202406241636824484_1.pdf"

主营与结构:
  - 事件: "业务以生猪养殖、饲料生产与销售为主，生猪养殖由全资子公司巨星农牧有限公司运营，2024 年末仍保留少量皮革业务"
    来源: "http://static.cninfo.com.cn/finalpage/2022-04-21/1212999930.PDF"
  - 事件: "2026 年上半年生猪出栏量 280.77 万头，同比增长约 47%；生猪业务实现营业收入 32.16 亿元，同比下降 6.29%"
    来源: "http://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/842216782370/index.phtml"
  - 事件: "分产品数据显示皮革产品占公司营业收入约 2.76%（搜狐证券分产品数据）"
    来源: "https://q.stock.sohu.com/cn/603477/index.shtml"

