代码: "300761"
名称: "立华股份"
定位: "全国第二大黄羽鸡养殖企业、江苏首家上市畜禽养殖企业，2019 年创业板上市，近年形成“黄羽鸡＋生猪”双轮驱动；2026 年上半年猪价深跌致整体由盈转亏，黄鸡板块盈利形成对冲。"
沿革:
  - 年: "1997"
    事件: "6 月成立（江苏立华牧业股份有限公司，后更名为江苏立华食品集团股份有限公司），以优质黄羽鸡、猪、鹅养殖和食品加工为主导产业"
    来源: "https://img3.gelonghui.com/pdf/65e10-566eff62-5889-47cd-9ee6-a7b9b363fad3.pdf"
  - 年: "2019"
    事件: "2 月 18 日在深交所创业板上市，发行 4,128 万股（全部为新股），发行价 29.35 元/股，募集资金总额 12.1157 亿元、净额 11.50 亿元（资金 2019 年 2 月 12 日到账）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300761&id=8051401"
  - 年: "2022"
    事件: "8 月完成向特定对象发行股票，新增股份 8 月 31 日上市，实控人程立力全额认购"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=300761&id=8498024"
  - 年: "2024"
    事件: "生猪业务放量：2025 年生猪出栏 211.16 万头（同比 +62.88%），养猪业务年度盈利首次超过养鸡业务"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300761&id=12134716"
主营与结构:
  - 事件: "以黄羽肉鸡与生猪双主业为主，另有肉鹅业务；板块覆盖江苏、安徽、浙江、山东、广东、河南、四川、湖南、贵州、江西、云南、广西等省份"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202301161582031130_1.pdf"
  - 事件: "2026 年上半年上市肉鸡 2.78 亿只、上市肉猪 112.57 万头、上市肉鹅 158.73 万只"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?CompanyCode=80537540&gather=1&id=12520123"
  - 事件: "2025 年全年上市肉鸡 5.67 亿只（同比 +9.90%）、肉猪 211.16 万头；2025 年养鸡完全成本 11.1 元/公斤"
    来源: "http://file.finance.sina.com.cn/cn/diaoyan/jgdy/2026/2026-05/2026-05-14/10180706_1.PDF"
  - 事件: "2026 年上半年黄羽肉鸡板块实现盈利，生猪板块由一季度微利转为半年度亏损；上半年肉猪销售均价同比下降 28%"
    来源: "https://stock.stockstar.com/RB2026082600000809.shtml"
融资历史:
  - 时间: "2019-02-18"
    方式: "IPO（深交所创业板）"
    规模: "4,128 万股，发行价 29.35 元/股，募集资金总额 12.1157 亿元、净额 11.50 亿元"
    用途: "安庆立华年出栏 1,750 万羽一体化养鸡建设项目、扬州立华年出栏 1,750 万羽一体化养鸡建设项目等"
    说明: "证监许可﹝2019﹞104 号核准，资金 2019 年 2 月 12 日到账；2022 年 4 月董事会通过募集资金项目结项及变更部分募集资金用途并永久性补充流动资金"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300761&id=8051401"
  - 时间: "2021-09"
    方式: "可转换公司债券（方案）"
    规模: "拟向不特定对象发行可转债募集资金不超过 204,480.94 万元"
    用途: "黄羽鸡一体化养殖、屠宰等项目"
    说明: "公司第三届董事会第二次会议通过《关于调整公司向不特定对象发行可转换公司债券方案的议案》；未查得该可转债后续发行或终止的公开结果"
    来源: "http://static.cninfo.com.cn/finalpage/2021-09-22/1211127566.PDF"
  - 时间: "2022-08"
    方式: "定向增发（向特定对象发行股票）"
    规模: "55,922,501 股，发行价 22.71 元/股，募集资金总额 12.70 亿元、净额 12.6064 亿元"
    用途: "江苏、湖南等地养鸡及屠宰项目、总部基地项目及补充流动资金（项目总投资 27.14 亿元）"
    说明: "证监许可〔2022〕257 号同意注册，资金 2022 年 8 月 19 日到账，新增股份 2022 年 8 月 31 日上市，限售期 18 个月；由实际控制人程立力全额认购"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=300761&id=8498024"
风险与困境:
  - 时间: "2026-08-21"
    事项: "2026 年上半年营业收入 91.28 亿元（同比 +9.27%，创上市以来同期新高），归母净利润 -7,191.88 万元、扣非 -7,356.33 万元，同比下降 148.33%，由盈转亏；主要因生猪行情低迷、肉猪销售均价同比下降 28%"
    来源: "https://finance.sina.com.cn/roll/2026-08-21/doc-inipazsh1222235.shtml"
  - 时间: "2026-08-24"
    事项: "2026 年第二季度单季归母净利润 -2.27 亿元（上年同期 -0.57 亿元），业绩同比下滑主要受畜禽价格周期性波动影响"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202608241828367091_1.pdf"
  - 时间: "2026-08"
    事项: "2026 年上半年全国生猪市场供给宽松、猪价延续下跌，4 月猪价下探至 10 元/公斤以内，行业深度亏损；二季度末全国能繁母猪存栏 3,780 万头，同比减少 263 万头（-6.5%）"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=840645941841&code=300761&dannoun=lcdetail&announ=lc"
战略与转型:
  - 时间: "2022-08"
    事项: "实际控制人程立力全额认购 12.7 亿元定增，募集资金主要投向黄羽鸡一体化养殖及屠宰、孵化等项目，“all in”养鸡，项目总投资超 18 亿元"
    来源: "http://www.nbd.com.cn/rss/toutiao/articles/2476589.html"
  - 时间: "2025"
    事项: "全年营业收入 187.29 亿元（同比 +5.67%），归母净利润 5.78 亿元（同比 -62.01%）；肉猪出栏 211.16 万头（同比 +62.88%），养猪业务年度盈利首次超过养鸡业务"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300761&id=12134716"
  - 时间: "2026"
    事项: "食品端延伸与智能化转型提速，鸡猪双主业形成上下半年盈利互补的抗周期结构"
    来源: "https://stock.stockstar.com/RB2026082600000809.shtml"
  - 时间: "2026-05"
    事项: "公司提出养猪成本管控进入行业第一方阵，2025 年肉猪完全成本持续下降，黄鸡业务保持持续盈利"
    来源: "https://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/833476920269/index.phtml"
融资需求线索:
  - 时间: "2021-2022"
    事项: "2021 年 9 月调整后的 20.45 亿元可转债方案未查得实施结果，2022 年改以 12.7 亿元定增完成融资（实控人全额认购）"
    来源: "http://static.cninfo.com.cn/finalpage/2021-09-22/1211127566.PDF"
  - 时间: "2026-08"
    事项: "2026 年 4 月 22 日投资者关系活动披露：2025 年营收 187.29 亿元、归母净利润 5.78 亿元；2026 年一季度营业收入 49.85 亿元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300761&id=12153780"
其他要点:
