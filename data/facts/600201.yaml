代码: "600201"
名称: 生物股份
定位: "内蒙古呼和浩特的兽用生物制品企业，全称金宇生物技术股份有限公司，1992年12月设立、1999年1月15日在上海证券交易所上市；主营兽用生物制品的研发、生产与销售，产品涵盖猪、禽、反刍和宠物类四大系列百余种动物疫苗，拥有口蹄疫、高致病性禽流感和布鲁氏菌病三大强制免疫疫苗农业农村部定点生产资质。第一大股东为内蒙古金宇生物控股有限公司，法定代表人张翀宇。2025年归母净利润1.00亿元、同比下降8.14%；2026年上半年归母净利润1.04亿元、同比增长72.28%。公司两次再融资（2021年度、2023年度）均告终止。"

