主营与结构:
  - 事件: "公司主要从事兽用生物制品的研发、生产与销售，产品种类涵盖猪、禽、反刍和宠物类四大系列百余种动物疫苗；拥有口蹄疫、高致病性禽流感和布鲁氏菌病三大强制免疫疫苗农业农村部定点生产资质。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-23/1225154779.PDF"
  - 事件: "公司拥有金宇保灵、金宇优邦和金宇益康三大动物疫苗智能制造生产基地，产品聚焦预防口蹄疫、猪圆环病、猪支原体肺炎、猪繁殖与呼吸综合征、猪伪狂犬病、高致病性禽流感、布鲁氏菌病、牛病毒性腹泻/黏膜病、传染性鼻气管炎、狂犬病等农业农村部认定的一、二、三类动物疫病。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-23/1225154779.PDF"
  - 事件: "公司依托动物生物安全三级实验室（ABSL-3）、兽用疫苗国家工程实验室、农业部反刍动物生物制品重点实验室三大平台开展研发；产品目录中列示圆支二联疫苗、非洲猪瘟亚单位疫苗、犬三联疫苗、犬四联疫苗、猫三联疫苗、猫四联疫苗等。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-23/1225154779.PDF"
  - 事件: "公司所属行业为生物药品制造业，主要经营活动还包括兽用化学药品制剂制造和销售、化学试剂和助剂制造和销售、生物技术开发转让咨询服务、货物及技术进出口等。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-23/1225154779.PDF"
  - 事件: "2025年公司以新设方式取得内蒙古金堃臻味餐饮有限公司、内蒙古金宠天地科技有限公司、武汉掌门生物科技有限公司、浙江金宇保灵供应链有限公司、长春金宇保灵供应链有限公司、巴彦淖尔金宇畜牧业科技发展有限公司、金宇（兴安盟）生态农牧业科技有限公司、海南铂昇投资有限公司等子公司。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-23/1225154779.PDF"

