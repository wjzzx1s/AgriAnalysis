代码: "600191"
名称: "华资实业"
定位: "包头起家的甜菜制糖老牌上市公司，曾是全国甜菜制糖行业唯一上市公司，长期依靠参股华夏银行、恒泰证券（现金融街证券）的投资收益支撑业绩；近年主业转为谷朊粉、食用酒精、黄原胶等粮食深加工与生物发酵，2025年由山东中裕食品通过增资控股股东间接入主。"
沿革:
  - 年: "1998"
    事件: "1998年7月29日经内蒙古自治区人民政府内政股批字（1998）15号文批准，由包头草原糖业（集团）有限责任公司作为主发起人，与包头创业经济技术开发公司、包头市北普实业有限公司共同发起，以社会募集方式设立股份有限公司"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2011/2011-8/2011-08-27/772140.PDF"
  - 年: "1998"
    事件: "经证监发字（1998）276、277号文批准向社会公开发行A股7,000万股，1998年11月2日发行、1998年12月10日在上海证券交易所上市，证券代码600191"
    来源: "https://basic.10jqka.com.cn/600191/company.html"
  - 年: "1998"
    事件: "以上市为契机，“草原”商标成为我国驰名商标；肖建华控制的包头创业、包头北普分别为第二、第三大股东，华资实业随后被市场归入“明天系”三驾马车之一"
    来源: "https://finance.sina.cn/stock/ssgs/2018-01-22/detail-ifyqwiqi1640400.d.html?vt=4"
  - 年: "2012"
    事件: "包头市国资委将控股股东包头草原糖业（集团）100%国有产权在内蒙古产权交易中心整体挂牌转让，确定潍坊创科实业有限公司以挂牌价格111,610万元受让，2012年10月23日双方签订《产权交易合同》"
    来源: "http://pdf.dfcfw.com/pdf/H2_AN201211250005615016_1.pdf"
  - 年: "2021"
    事件: "因2020年度归母净利润为-12,530.24万元、营业收入低于1亿元（3,863.94万元），公司股票自2021年4月30日起被实施退市风险警示，简称变更为“*ST华资”"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202204291562353761_1.pdf?1651359991000.pdf"
  - 年: "2022"
    事件: "2022年5月10日收到中国证券登记结算有限责任公司上海分公司《过户登记确认书》，协议转让股份过户完成，控股股东变更为海南盛泰创发实业有限公司，实际控制人变更为张文国"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-26/10090483.PDF"
  - 年: "2022"
    事件: "2022年8月12日上交所同意撤销退市风险警示，8月15日停牌一天、8月16日复牌，简称由“*ST华资”恢复为“华资实业”，日涨跌幅限制由5%恢复为10%"
    来源: "http://epaper.qdcaijing.com/pc/att/202208/16/449e8373-6d38-4ec6-ba2d-2ad97cc15c04.pdf"
  - 年: "2025"
    事件: "2025年4月15日，控股股东盛泰创发与滨海创发（深圳）贸易有限公司、李延永、张文国、滨州中裕科技投资发展有限公司签署《增资协议》，公司实际控制人由张文国变更为宋民松"
    来源: "https://file.finance.qq.com/finance/hs/pdf/2025/04/16/1223103922.PDF"
主营与结构:
  - 事件: "2025年主营业务为生物发酵技术应用、粮食深加工及制糖业务，主要产品为谷朊粉、食用酒精、黄原胶以及食糖"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-21/12118375.PDF"
  - 事件: "谷朊粉、食用酒精等产品由子公司山东裕维生物科技有限公司开展，主要以面粉为原料进行加工，对外销售取得加工转换过程中的增值"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-21/12118375.PDF"
  - 事件: "黄原胶业务主要将玉米淀粉等原料通过生物发酵技术加工为黄原胶对外销售；2025年实现营业收入62,943.89万元，同比增长主要来自黄原胶项目投产后新增收入"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-21/12118375.PDF"
  - 事件: "2026年上半年主营业务收入98.23%来自粮食深加工业务"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600191&id=12567069"
  - 事件: "参股金融企业投资收益是利润重要来源：2025年度对金融街证券（原恒泰证券）投资收益3,842.59万元；2026年上半年对金融街证券投资收益2,833.98万元"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-21/12118375.PDF"
  - 事件: "持有华夏银行股票61,504,100股，占华夏银行注册资本0.39%，全部为无限售流通股（公司资本运作页面口径）"
    来源: "https://basic.10jqka.com.cn/600191/capital.html"
融资历史:
  - 时间: "1998-11-02"
    方式: "首发A股（上交所）"
    规模: "发行7,000万股，发行价4.30元/股，实际募资3.01亿元；发行市盈率13.20倍，首日开盘价7.80元"
    用途: "未查得"
    说明: "新浪财经报道口径为上市募集资金2.89亿元；同花顺F10登记的“首发A股”实际募集资金净额为2.86亿元"
    来源: "https://basic.10jqka.com.cn/600191/company.html"
  - 时间: "2015-2016"
    方式: "非公开发行股份募集资金（拟用于增资华夏人寿）"
    规模: "拟募集不超过316.8亿元，增资完成后持有华夏人寿股权比例不超过51%"
    用途: "对华夏人寿增资"
    说明: "2016年7月证监会发审委审核通过；2017年11月公司公告称鉴于证券市场发生较大变化并综合考虑融资环境和监管政策变化等因素，决定终止2015年度非公开发行股票的申请并撤回申报材料"
    来源: "https://www.chinawznews.net/news/china/2017-02-06/19418.html"
  - 时间: "2025-04-15"
    方式: "控股股东层面增资（间接控股，非上市公司融资）"
    规模: "中裕科技投资以现金130,000万元对盛泰创发增资，取得增资后55%股权，通过盛泰创发间接持有上市公司1.45亿股、占公司总股本29.90%"
    用途: "取得上市公司控制权"
    说明: "控股股东仍为盛泰创发，中裕科技投资未直接持有上市公司股份；不构成关联交易、不触及要约收购"
    来源: "https://www.stcn.com/article/detail/1665420.html"
风险与困境:
  - 时间: "2021-04-30"
    事项: "因2020年度归母净利润-12,530.24万元、营业收入3,863.94万元低于1亿元，股票被实施退市风险警示（*ST华资）"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202204291562353761_1.pdf?1651359991000.pdf"
  - 时间: "2022-08-16"
    事项: "撤销退市风险警示恢复“华资实业”；同期“明天系”资本版图收缩（包商银行破产清算、新时代信托等风险暴露），公司走到退市风险边缘"
    来源: "https://www.sohu.com/a/562574227_616823"
  - 时间: "2022-12-23"
    事项: "收到上交所警示函相关问询，公司申请延期5个交易日回复（监管关注事项）"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vGP_GetOutOfLine/stockid/600191.phtml"
  - 时间: "2025-12-31"
    事项: "2025年度母公司存在未弥补亏损的相关情况（对分红等事项产生影响，公司已提示）"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-21/1225126275.PDF"
  - 时间: "2017-11"
    事项: "终止2015年度非公开发行股票申请（原计划募资316.8亿元增资华夏人寿），融资渠道受挫"
    来源: "http://finance.sina.com.cn/stock/s/2018-01-22/doc-ifyquptv8494605.shtml"
战略与转型:
  - 时间: "2022"
    事项: "设立全资子公司山东裕维生物科技有限公司，从事粮食深加工业务，生产小麦蛋白、食用酒精、赤藓糖醇等产品"
    来源: "https://finance.sina.com.cn/stock/aiassist/ggsp/2026-08-31/doc-iniqexup7840667.shtml"
  - 时间: "2023"
    事项: "启动大规模产能升级计划，建设年产2万吨黄原胶项目"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-8/2025-08-30/11415604.PDF"
  - 时间: "2025-04"
    事项: "年产2万吨黄原胶项目正式投产（2025年4月30日披露《关于黄原胶项目投产的公告》，编号临2025-023），2025年全面投产；同期完成对裕维生物原有生产设备的技术升级改造，小麦淀粉浆高值化梯次利用系列产品线顺利投产"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-8/2025-08-30/11415604.PDF"
  - 时间: "2025-04"
    事项: "中裕食品入主后从管理、产品、渠道、中长期等维度对公司赋能，形成“中裕赋能”的业务协同逻辑"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202603241820726457_1.pdf?1774379874000.pdf"
  - 时间: "2025-12-31"
    事项: "与中科院环境生物技术重点实验室共建合作平台；自治区首家微生物改造技术领域院士工作站落地公司"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-21/12118375.PDF"
  - 时间: "2026-06-30"
    事项: "2026年上半年实现营业收入34,918.85万元、同比增长58.00%，归属于上市公司股东的净利润3,616.08万元、同比增长722.60%；扣非净利润2,096.99万元、同比增长393.83%"
    来源: "http://static.cninfo.com.cn/finalpage/2026-08-29/1225526393.PDF"
