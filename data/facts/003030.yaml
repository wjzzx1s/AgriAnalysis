- 事件: 2025 年实现营业收入 2,025,086,137.88 元（同比增 21.67%）、归母净利润 25,295,791.91 元（上年 -25,136,060.31 元，同比增 200.64%）、扣非归母净利润 -43,856,260.62 元、经营活动产生的现金流量净额 124,895,230.13 元（同比增 16.88%）、毛利率 23.78%（同比提升 1.04 个百分点）
  来源: https://static.cninfo.com.cn/finalpage/2026-04-28/1225202350.PDF
- 事件: 2025 年生鲜豆制品实现营业收入 13.67 亿元，占总营收比重 67.49%，同比增长 22.66%；公司在浙江省生鲜豆制品供应量突破 15 万吨，杭州地区 7 万余吨，获评杭州市菜篮子重点保供企业
