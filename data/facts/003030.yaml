- 事件: 2024 年营业收入 1,664,401,664.91 元、归母净利润 -25,136,060.31 元、扣非归母净利润 -23,228,404.76 元；2023 年营业收入 1,478,381,743.34 元、归母净利润 40,462,298.46 元、扣非归母净利润 38,629,462.62 元
  来源: https://static.cninfo.com.cn/finalpage/2026-04-28/1225202350.PDF
- 事件: 2026 年上半年实现营业收入 1,012,664,344.11 元（同比增 9.98%）、归母净利润 -24,356,879.76 元（上年同期 -9,094,012.16 元，同比 -167.83%）、扣非归母净利润 -24,129,434.52 元（同比 -135.49%）、经营活动产生的现金流量净额 57,649,431.11 元
  来源: https://disc.static.szse.cn/disc/disk03/finalpage/2026-08-28/1fa0c52e-6362-461f-897e-42aa81a80256.PDF
- 事件: 2026 年上半年植物蛋白饮品类别产品实现营收 1.65 亿元、同比增长 41.88%；生鲜豆制品实现营收 6.82 亿元、增速 6.85%；休闲豆制品收入同比下降 12.18%；经销模式录得收入 5.77 亿元、同比增速仅 0.17%
  来源: https://finance.sina.com.cn/stock/s/2026-09-08/doc-inircewu5985785.shtml
