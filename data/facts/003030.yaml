代码: '003030'
名称: 祖名股份
定位: 国内首家登陆资本市场的豆制品企业（豆腐第一股），2021 年 1 月深交所上市，主营生鲜豆制品、植物蛋白饮品、休闲豆制品等 400 余种产品，以浙江（杭州）区域市场及菜篮子保供为主阵地。2025 年营业收入首破 20 亿元、归母净利润 2,529.58 万元实现扭亏，但扣非仍亏损；2026 年上半年受大豆与能源价格上涨影响亏损扩大至 2,435.69 万元，同时以 10.12% 持股跨界投资芯片设计公司重庆芯联芯，短期刚性债务压力上升。
沿革:
- 年: '2020'
  事件: 8 月 13 日通过中国证监会发审会审核，12 月 11 日取得证监会《关于核准祖名豆制品股份有限公司首次公开发行股票的批复》（证监许可〔2020〕2650 号），公司 IPO 之路历经十年努力终于成行；2020 年 12 月 30 日天健会计师事务所出具天健验〔2020〕672 号《验资报告》
  来源: http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2021/2021-4/2021-04-20/7070204.PDF
- 年: '2021'
  事件: 1 月 6 日公司股票在深圳证券交易所挂牌上市（深证上〔2021〕2 号），成为国内首家登陆资本市场的豆制品企业，上市首日总市值超过 27 亿元
  来源: https://www.jiemian.com/article/5515556.html
- 年: '2024'
  事件: 6 月 7 日确定以 2024 年 6 月 7 日为授权日，向 41 名激励对象授予股票期权 72.00 万份，行权价格调整为 12.21 元/份
  来源: http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=003030&id=12562408
- 年: '2025'
  事件: 公司实现营业收入 20.25 亿元，同比增长 21.67%，首次突破 20 亿元；归属于上市公司股东的净利润 2,529.58 万元，同比增长 200.64%，实现扭亏为盈
  来源: https://finance.sina.com.cn/jjxw/2026-04-28/doc-inhvzfsh8529367.shtml
- 年: '2026'
  事件: 公司名称已变更为祖名豆制品集团股份有限公司，办公地址仍为浙江省杭州市滨江区江陵路 77 号
  来源: https://static.cninfo.com.cn/finalpage/2026-04-28/1225202350.PDF
股权与控制权:
- 时间: '2026-03-31'
  事项: 公司注册及办公地址为浙江省杭州市滨江区江陵路 77 号；股票简称祖名股份，股票代码 003030，上市板块为深圳证券交易所；2026 年一季度报告期末普通股股东总数 8,212 户
  来源: https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=003030&id=12217309
- 时间: '2020-12-23'
  事项: 本次 IPO 前控股股东为蔡祖明、实际控制人为蔡祖明、蔡水埼、王茶英；公司其他股东包括杭州纤品、上海筑景、实际控制人之亲属李国平、李建芳及张志祥等 28 名自然人股东
  来源: https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=003030&id=6799062
主营与结构:
- 事件: 公司专注于豆制品的研发、生产和销售，产品品种涵盖生鲜豆制品、植物蛋白饮品、休闲豆制品、其他类产品等 400 余种主要产品；生鲜豆制品主要包括豆腐、千张、素鸡、豆腐干、油豆腐等，植物蛋白饮品主要包括自立袋豆奶、利乐包豆奶、瓶装豆乳等，休闲豆制品主要包括休闲豆干、休闲豆卷、休闲素肉等
