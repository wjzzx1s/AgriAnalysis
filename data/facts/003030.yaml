  来源: https://disc.static.szse.cn/disc/disk03/finalpage/2026-08-28/1fa0c52e-6362-461f-897e-42aa81a80256.PDF
融资历史:
- 时间: '2021-01-06'
  方式: IPO（深圳证券交易所）
  规模: 首次公开发行人民币普通股（A 股）股票 3,120 万股，每股发行价 15.18 元/股，本次募集资金总额 47,361.60 万元，扣除发行费用（不含增值税）6,851.66 万元后募集资金净额 40,509.94 万元
  用途: 年产 8 万吨生鲜豆制品生产线技改项目（拟投入募集资金 3.4 亿元，项目总投资 36,163.89 万元，位于浙江安吉）、豆制品研发与检测中心提升项目（拟投入募集资金 6,522.78 万元）
  说明: 经证监许可〔2020〕2650 号核准并经深证上〔2021〕2 号同意；发行前总股本 9,358 万股，发行后总股本 12,478 万股，本次发行股份占发行后总股本的 25.00%；发行方式采用网下向配售对象询价配售与网上按市值申购相结合，承销方式为余额包销；保荐机构（主承销商）为第一创业证券承销保荐有限责任公司；2021 年报告期内公司累计使用募集资金 2.76 亿元
  来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=003030&id=7070206
- 时间: '2026-04-24'
  方式: 以简易程序向特定对象发行股票（小额快速融资，董事会获授权）
  规模: 拟发行融资总额不超过人民币 3 亿元且不超过最近一年末净资产 20% 的股票，发行数量按照募集资金总额除以发行价格确定、不超过发行前公司股本总数的 30%
  用途: 未查得（授权议案未明确具体募投项目）
  说明: 公司于 2026 年 4 月 24 日召开第五届董事会第十五次会议审议通过《关于授权董事会办理小额快速融资相关事宜的议案》，授权期限自 2025 年年度股东会审议通过之日起至 2026 年年度股东会召开之日止；发行对象为不超过 35 名特定投资者，采用以简易程序向特定对象发行股票方式，在中国证监会作出予以注册决定后十个工作日内完成发行缴款
