代码: "300138"
名称: "晨光生物"
定位: "河北曲周起家的天然植物提取物龙头，辣椒红色素、辣椒精、叶黄素三大主力产品位居世界第一或前列，棉籽类业务规模大但毛利薄；2010年创业板上市，成本领先与全球份额是核心逻辑。"
沿革:
  - 年: "2000"
    事件: "2000年4月12日成立，注册地河北省曲周县城晨光路1号"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202006141384860259_1.pdf"
  - 年: "2010"
    事件: "2010年10月25日发行，2010年11月5日在深交所创业板上市，证券代码300138，发行2,300万股、发行价30元/股，实际募集资金净额64,908.51万元"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2011/2011-3/2011-03-31/687850.PDF"
  - 年: "2020"
    事件: "2020年6月17日公开发行630万张可转债（“晨光转债”），2020年7月13日在深交所上市"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=300138&id=6431866"
  - 年: "2021"
    事件: "“晨光转债”触发有条件赎回并于2021年3月5日赎回摘牌，累计转股增加股本51,212,972股，转股后股本增至563,080,506股"
    来源: "http://static.cninfo.com.cn/finalpage/2024-08-27/1220981353.PDF"
  - 年: "2021"
    事件: "2021年3月21日董事会通过《关于注销已回购公司股份的议案》，注销已回购股份30,306,515股，注销完成后股本减少至532,773,991股"
    来源: "http://static.cninfo.com.cn/finalpage/2024-08-27/1220981353.PDF"
主营与结构:
  - 事件: "从事天然植物提取物细分领域，主要系列产品为天然色素、天然香辛料提取物和精油、天然营养及药用提取物、天然甜味剂、保健食品、油脂和蛋白"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300138&id=11355360"
  - 事件: "主导产品辣椒红色素、辣椒精、叶黄素位居行业首位；棉籽脱酚蛋白为国内知名品牌；花椒提取物、番茄红素、葡萄籽提取物、甜菊糖等处于上升阶段"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300138&id=3242244"
  - 事件: "公司已有辣椒红、辣椒精、叶黄素三大主力产品位居世界第一或前列，甜菊糖苷、花椒提取物、水飞蓟提取物、姜黄素、葡萄籽提取物等梯队产品处于快速发展的上升阶段"
    来源: "https://www.cfi.net.cn/p20250407003276.html"
  - 事件: "带领中国自主生产的辣椒红色素在国际市场的份额从不到2%提升到80%以上；攻克辣椒提取物连续逆流提取、带柄提取等难题"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300138&id=12039990"
  - 事件: "2026年上半年植物提取类业务收入16.18亿元、同比-6.68%，毛利率19.57%；棉籽类业务收入13.79亿元、同比-21.84%，毛利率6.69%"
    来源: "https://finance.sina.com.cn/roll/2026-08-25/doc-inipncme1822133.shtml?froms=ggmp"
  - 事件: "2025年辣椒红色素销量6,367吨（同比+43%），辣椒精销量1,536吨（同比+81%），市场份额大幅提高"
    来源: "http://static.cninfo.com.cn/finalpage/2025-08-26/1224566487.PDF"
  - 事件: "通过全资/控股子公司布局境外原料基地，晨光生物科技（赞比亚）农业发展有限公司为境外投资主体之一"
    来源: "http://static.cninfo.com.cn/finalpage/2025-08-26/1224566487.PDF"
