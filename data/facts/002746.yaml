代码: "002746"
名称: "仙坛股份"
定位: "山东烟台白羽肉鸡养殖屠宰一体化龙头企业，2001 年成立、2015 年 2 月深交所上市，商品代肉鸡以“公司+农户”委托养殖为主，2020 年定增逾 10 亿元投建诸城年产 1.2 亿羽肉鸡产业生态项目；2026 年上半年营业收入 29.95 亿元、归母净利润 1.80 亿元，同比增长约三成。"

沿革:
  - 年: "2001"
    事件: "6 月 14 日烟台市仙坛饲养有限责任公司成立，注册资本 150 万元；2010 年 8 月第七次增资后注册资本增至 11,950 万元"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=002746&id=1622127"
  - 年: "2011"
    事件: "1 月 25 日由山东仙坛集团有限公司整体变更为山东仙坛股份有限公司，发起人为王寿纯、曲立荣、王可功、贺传虎、赵志明、张华"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN201502050008310568_1.pdf"
  - 年: "2015"
    事件: "2 月 16 日在深圳证券交易所上市，经证监许可[2015]189 号文核准公开发行 3,985 万股、发行价 5.28 元/股，募集资金 2.1 亿元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002746&id=1629326"

主营与结构:
  - 事件: "业务环节涵盖饲料生产、父母代肉种鸡养殖、雏鸡孵化、商品代肉鸡养殖与屠宰、鸡肉产品加工与深加工、预制菜加工，实现从种鸡养殖到鸡肉产品加工销售的一体化经营和全产业链覆盖"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2024-04-23/0396915a-e7c0-4614-9e8e-18273f190597.PDF"
  - 事件: "公司的鸡肉产品主要以分割冻鸡肉产品、冰鲜鸡肉产品和预制菜品的形式销售；商品代肉鸡养殖环节主要以委托加工生产（“公司+农户”）为主"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002746&id=12522503"
  - 事件: "2010—2020 年公司白羽肉鸡出栏量从 0.88 亿羽增长至 1.33 亿羽，复合增速约 4.25%"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202110191523732220_1.pdf"

融资历史:
  - 时间: "2015-02"
    方式: "IPO（深圳证券交易所中小板）"
    规模: "3,985 万股，发行价 5.28 元/股，募集资金 2.1 亿元"
    用途: "未查得"
    说明: "经证监许可[2015]189 号文核准；主承销商民生证券，发行后总股本 15,935 万股"
    来源: "http://finance.china.com.cn/stock/ssgs/20150623/3190867.shtml"
  - 时间: "2015-06"
    方式: "非公开发行股票（预案，后经董事会、股东大会调整）"
    规模: "拟发行不超过 2,619 万股，发行价格不低于 31.98 元/股，募集资金不超过 8.4 亿元"
    用途: "熟食品加工项目、商品鸡饲养立体养殖技术改造项目及补充流动资金"
    说明: "2015 年 6 月 23 日披露预案并同日复牌"
    来源: "http://finance.china.com.cn/stock/ssgs/20150623/3190867.shtml"
  - 时间: "2020-12"
    方式: "非公开发行股票"
    规模: "发行 1.10 亿股，募集资金总额 10.45 亿元、净额 10.31 亿元"
    用途: "年产 1.2 亿羽肉鸡产业生态项目，该项目包括 7 个商品鸡场、饲料厂及屠宰场共 9 处建设项目，总投资超过 28 亿元"
    说明: "项目全部建成投产后公司肉鸡宰杀量将达 2.5 亿至 2.7 亿只、肉食加工能力达 60 万吨、预制菜产能 15 万吨"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202110191523732220_1.pdf"

风险与困境:
  - 时间: "2024-06-30"
    事项: "2024 年上半年营业收入 24.13 亿元，同比下降 13.35%；归属于上市公司股东的净利润 3,075.76 万元，同比下降 84.87%；扣非归母净利润 -1,313.53 万元，同比下降 107.55%；经营活动产生的现金流量净额 -5.96 亿元"
    来源: "https://static.cninfo.com.cn/finalpage/2024-08-27/1220981333.PDF"
  - 时间: "2025-04-19"
    事项: "第五届董事会第十一次会议、第五届监事会第九次会议审议通过《关于公司募投项目延期的议案》，将“年产 1.2 亿羽肉鸡产业生态项目”达到预定可使用状态日期调整为 2027 年 12 月 31 日"
    来源: "https://paper.cnstock.com/html/2025-08/26/content_2109463.htm"
  - 时间: "2026-05"
    事项: "媒体报道公司 2020 年发起的定增募投项目“年产 1.2 亿羽肉鸡产业生态项目”近几年持续亏损，交付时间已从 2024 年底延期至 2027 年底；公司整体毛利率较 2019 年下降达 23.4 个百分点"
    来源: "https://news.qq.com/rain/a/20260521A05RGM00"
  - 时间: "2026-06-30"
    事项: "2026 年上半年经营活动产生的现金流量净额仅 6,006.74 万元，同比大幅下降 82.17%；短期债务 25.3 亿元"
    来源: "https://stock.stockstar.com/RB2026082700056657.shtml"

战略与转型:
  - 时间: "2020-12"
    事项: "定增 10.45 亿元投向诸城年产 1.2 亿羽肉鸡产业生态项目，被定位为“乡村振兴齐鲁样板工程”，建成后公司肉鸡宰杀量与肉食加工能力较定增前翻倍"
    来源: "https://m.21jingji.com/article/20220731/herald/a09065d6214763dbcf1f8a0c16532cbf_ths.html"
  - 时间: "2026-07-28"
    事项: "全资子公司拟使用 2.40 亿元募集资金对全资孙公司山东仙润鸿食品有限公司进行增资，并分期提供总额 1.00 亿元的无息借款以实施募投项目，合计注资金额达 3.40 亿元"
    来源: "https://www.mrjjxw.com/articles/2026-07-28/4524327.html"
  - 时间: "2026-06-30"
    事项: "诸城年产 1.2 亿羽肉鸡产业生态项目一期配套的屠宰加工厂、饲料厂和商品鸡养殖场已全部投产，二期屠宰加工厂已正式投产，二期养殖场建设推进中"
    来源: "https://stock.stockstar.com/RB2026082700056657.shtml"
  - 时间: "2025"
    事项: "公司 2025 年年度报告称诸城项目截至目前已有 36 个商品鸡养殖场投入生产，其余 2 个预计年内相继建设投产；2025 年诸城项目商品代肉鸡出栏量 7,745.38 万羽"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002746&id=12223159"

融资需求线索:
  - 时间: "2026-07-28"
    事项: "以募集资金 2.40 亿元增资孙公司并向其提供 1.00 亿元无息借款，用于推进诸城年产 1.2 亿羽肉鸡产业生态项目，显示项目后续建设仍需持续资金投入"
    来源: "https://www.mrjjxw.com/articles/2026-07-28/4524327.html"

其他要点:
  - 要点: "公司自称上市以来即使在白羽肉鸡行业景气度最为低迷的时候也从未发生亏损"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202110191523732220_1.pdf"
  - 要点: "2025 年公司实现收入 57.72 亿元，同比增长 9.1%；归母净利润 2.43 亿元，同比增长 17.89%；扣非后净利润 2.175 亿元，同比增长 35.21%"
    来源: "https://news.qq.com/rain/a/20260521A05RGM00"
  - 要点: "2026 年上半年公司实现营业收入 299,471.10 万元，同比增加 17.92%；营业利润 18,746.84 万元，同比增加 15.79%；归属于上市公司股东的净利润 18,045.28 万元，同比增加 31.97%；基本每股收益 0.2097 元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002746&id=12522503"
  - 要点: "2026 年半年度业绩预告区间为归母净利润 1.70 亿元—1.81 亿元（同比增加 24.33%—32.37%）、扣非 1.73 亿元—1.84 亿元（同比增加 39.95%—48.84%）"
    来源: "https://static.cninfo.com.cn/finalpage/2026-07-31/1225450974.PDF"
  - 要点: "华西证券研报称，玉米、豆粕等饲料原料价格维持低位运行、单位养殖成本降幅超出预期，叠加下半年供给端收缩下毛鸡及鸡肉产品价格有望低位回升，公司量增利扩的确定性增强，维持“买入”评级"
    来源: "https://finance.sina.com.cn/stock/bxjj/2026-09-03/doc-iniqpvfs4356001.shtml"
  - 要点: "公司注册资本 86,054 万元，法定代表人王寿纯"
    来源: "https://q.stock.sohu.com/cn/002746/index_kp.shtml"

