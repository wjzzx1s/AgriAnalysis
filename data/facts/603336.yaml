代码: "603336"
名称: "宏辉果蔬"
定位: "汕头起家的果蔬采后加工与冷链配送服务商，2016年上交所主板上市；2025年控制权由创始人黄俊辉转让给苏州国资背景的申泽瑞泰，2026年以7亿元收购施美药业41.128%股权跨界医药，形成果蔬+医药双主业。"

沿革:
  - 年: "1992"
    事件: "前身为汕头经济特区宏辉食品有限公司，1992年11月2日经汕头市龙湖区经济发展局批准成立，1992年12月10日取得营业执照，注册资本80万美元、由郑丽珊100%出资"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=5124246"
  - 年: "2011"
    事件: "由黄俊辉、陈雁升、郑幼文等16名自然人股东和恒复投资1家法人股东作为发起人，以截至2011年1月31日经审计净资产16,306.36万元按1:0.6133折成股本10,000万股，2011年4月8日整体变更设立股份公司"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=603336&id=2861570"
  - 年: "2016"
    事件: "2016年10月27日经证监会证监许可〔2016〕2444号核准公开发行3,335万股，2016年11月24日在上交所主板上市，发行后股本13,335万元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=5124246"
  - 年: "2018"
    事件: "2018年4月20日股东大会通过以资本公积向全体股东每股转增0.3股，共转增40,005,000股，股本总额增至17,335.5万元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=5124246"
  - 年: "2025"
    事件: "2025年6月13日控股股东黄俊辉与苏州申泽瑞泰签署《股份转让协议》，转让151,380,521股（26.54%）；至2025年8月23日股份转让与表决权放弃完成，控股股东变更为申泽瑞泰，实际控制人变更为叶桃、刘扬和苏州资产投资管理集团"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12157718"
  - 年: "2026"
    事件: "2026年6月5日施美药业完成董监高及法定代表人变更备案，2026年7月3日第四期股权转让款支付完毕，收购款合计70,005.20万元全部履行完毕，施美药业自2026年6月起纳入合并报表"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12432542"

股权与控制权:
  - 事项: 控股股东苏州申泽瑞泰企业管理合伙企业（有限合伙）持股24.87%，实际控制人为叶桃、刘扬、苏州资产投资管理集团有限公司；原大股东黄俊辉持股16.54%。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12556455
  - 事项: 报告期内公司通过全资子公司上海腾晖医药技术有限公司以自有及自筹资金70,005.20万元收购施美药业41.128%股份并实现控股，施美药业自2026年6月纳入合并报表范围。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12556455
主营与结构:
  - 事件: "业务为果蔬产品的种植管理、采后收购、产地预冷、冷冻仓储、预选分级、加工包装、冷链配送一体化服务"
    来源: "http://pdf.dfcfw.com/pdf/H3_AP201611240125608697_01.pdf"
  - 事件: "2025年实现营业收入105,226.45万元，同比减少2.58%；归属于上市公司股东净利润1,781.30万元，同比减少2.67%"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12157718"
  - 事件: "2026年1-6月果蔬营业收入22,572.03万元，较上年同期减少38.87%；公司称医药业务收入占比约12%但毛利额占比已过半"
    来源: "https://finance.sina.com.cn/jjxw/2026-09-16/doc-inirykph3351096.shtml"
  - 事件: "2025年末总股本608,718,945股"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12157711"

竞争优势:
  - 事项: 采用公司加基地加农户模式，由农户参照GLOBALGAP标准种植，已在全国设立多个仓储加工配送中心、配送区域覆盖全国各地，并建立果品质量追溯体系。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12556455
  - 事项: 果蔬产品已通过多个国家及地区准入认证，是国内果蔬出口企业中取得出口资质较为丰富的企业之一，产品销往美国、加拿大、东南亚、中国香港等国家和地区。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12556455
行业基本面:
  - 事项: 果蔬行业长期存在仓储运输损耗高企、产区布局失衡、产销错配、成本承压、同质竞争等结构性问题，冷链运输及仓储成本持续上涨，品牌溢价能力减弱。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12556455
  - 事项: 果蔬行业整体呈现总量增速回落、结构优化停滞、全链协同不畅的态势，行业需以全链协同与技术创新为突破口加速向数字化、标准化、品牌化升级。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12556455
经营要点:
  - 事项: 2026年上半年营业收入4.18亿元、同比减少11.09%；归母净利润516.89万元、同比减少25.35%；扣非净利润500.74万元、同比减少25.61%。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12556455
  - 事项: 2026年上半年果蔬营业收入2.26亿元，较上年同期减少38.87%，果蔬生鲜赛道竞争白热化、产品价格季节性波动剧烈，传统果蔬业务承压显著。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12556455
  - 事项: 2026年6月施美药业实现营业收入5,134.07万元、占上市公司半年度合并营业收入的12.28%，实现净利润3,305.95万元、占合并净利润的147.40%。
    来源: https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603336&id=12556455
  - 事项: 2025年8月原大股东黄俊辉为支持公司经营发展，向公司提供不超过4.6亿元的无息借款、期限1年，该借款安排已到期结束，具体使用情况已按公司披露的公告执行。
    来源: https://pdf.dfcfw.com/pdf/H2_AN202609151829416736_1.pdf
