代码: "600962"
名称: "国投中鲁"
定位: "国家开发投资集团有限公司控股的浓缩苹果汁加工企业，是国内主板第一家上市的浓缩果汁企业，主业规模与盈利能力有限、母公司长期存在未弥补亏损；2025 年底起筹划以发行股份方式收购中国电子工程设计院 100% 股份，跨界转型电子信息产业。"
沿革:
  - 年: "2001"
    事件: "经原国家经济贸易委员会国经贸企〔2001〕106 号文批准，由原山东中鲁果汁有限公司整体改制设立股份公司，由国家开发投资集团有限公司、乳山市经济开发投资公司等六家共同发起设立，2001 年 3 月 15 日在国家工商行政管理局登记注册，注册资本 10,000 万元"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202003311377292122_1.pdf"
  - 年: "2004"
    事件: "经中国证监会证监发行字〔2004〕72 号文核准，2004 年 6 月 7 日采取上网定价发行（按市值向二级市场投资者配售）方式发行人民币普通股 6,500 万股，发行价 4.80 元/股，扣除发行费用 1,993.2 万元后实际募集资金 29,206.8 万元；6,500 万股 A 股于 2004 年 6 月 22 日在上海证券交易所上市交易，本次发行后注册资本变更为 16,500 万元"
    来源: "http://www.ce.cn/ztpd/tszt/gushi/2005/ssnb/PDF/200503/20/P020050320462494982913.pdf"
  - 年: "2004"
    事件: "成为浓缩苹果汁行业第一家在国内主板上市的国有控股企业"
    来源: "https://zhonglu.sdic.com.cn/gtzl/about/A2118index_1.htm"
  - 年: "2025"
    事件: "2025 年 7 月起市场关注公司筹划以发行股份方式收购中国电子工程设计院股份有限公司（电子院）100% 股份的“蛇吞象”式重组；2025 年 12 月 24 日公告已取得国资委评估备案"
    来源: "https://www.nbd.com.cn/articles/2025-12-30/4202501.html"
  - 年: "2026"
    事件: "2026 年 8 月 7 日公司发行股份购买资产并募集配套资金暨关联交易事项获上海证券交易所并购重组审核委员会审核通过；2026 年 8 月 26 日收到中国证监会《关于同意国投中鲁果汁股份有限公司发行股份购买资产并募集配套资金注册的批复》（证监许可〔2026〕2187 号）"
    来源: "https://stockmc.xueqiu.com/202608/600962_20260829_U1KD.pdf"
主营与结构:
  - 事件: "公司经营范围主要是浓缩果蔬汁（浆）的生产和销售，主导产品为浓缩苹果汁"
    来源: "https://www.nbd.com.cn/articles/2025-12-30/4202501.html"
  - 事件: "控股股东国家开发投资集团有限公司持有公司 44.57% 股份，公司注册资本 26,221 万元"
    来源: "https://zhonglu.sdic.com.cn/gtzl/about/A2118index_1.htm"
  - 事件: "2024 年度实现归属于母公司所有者的净利润 29,253,730.61 元；合并报表口径可供股东分配的利润 39,635,513.42 元；母公司期末未分配利润为 -223,569,188.18 元"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-03-29/600962_20250329_ETYW.pdf"
  - 事件: "2025 年度实现归属于母公司所有者的净利润 40,921,472.89 元；合并报表口径可供股东分配的利润 80,556,986.31 元；母公司仍存在未弥补亏损，2025 年度拟不进行现金股利分配"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600962&id=12032713"
  - 事件: "2026 年上半年营业收入 882,829,946.47 元，同比下降 12.37%；利润总额 5,998,933.54 元，同比下降 83.89%；归母净利润 1,821,158.98 元，同比下降 92.74%；扣非归母净利润 -1,142,135.37 元"
    来源: "https://stockmc.xueqiu.com/202608/600962_20260829_U1KD.pdf"
  - 事件: "2026 年上半年公司管理层将收入下降归因于主要产品售价下行、销量下降；洛川中鲁于 2026 年 3 月 11 日完成工商变更登记并纳入合并报表（通过股权受让与增资）"
    来源: "https://stock.stockstar.com/RB2026090700013832.shtml"
融资历史:
  - 时间: "2004-06-07"
    方式: "IPO（上海证券交易所）"
    规模: "发行 6,500 万股，发行价 4.80 元/股，扣除发行费用 1,993.2 万元后实际募集资金 29,206.8 万元"
    用途: "未查得"
    说明: "发行市盈率 19.94 倍（按 2003 年每股收益全面摊薄计算）；发行后注册资本由 10,000 万元变更为 16,500 万元"
    来源: "http://www.ce.cn/ztpd/tszt/gushi/2005/ssnb/PDF/200503/20/P020050320462494982913.pdf"
  - 时间: "2025-12-30"
    方式: "发行股份购买资产并募集配套资金（重大资产重组暨关联交易）"
    规模: "发行股份购买电子院 100% 股份的交易价格 60.26 亿元（602,581.04 万元）；同时拟向不超过 35 名特定投资者发行股份募集配套资金不超过 17.26 亿元"
    用途: "收购中国电子工程设计院股份有限公司 100% 股份；配套募集资金用于核心技术引领及产业化前沿技术研究——重点实验室建设、PSIM 数字化业务——先进制造组线技术与数字孪生研究及应用、数智化平台建设和补充流动资金（其中补充流动资金 7 亿元，占比约 40.56%）"
    说明: "按发行价 10.98 元/股计算，购买资产发行股份数量总计约 5.49 亿股，占发行后总股本的 67.67%；交易对方为国投集团、新世达壹号、大基金二期、建广投资、湾区智能、科改策源、国华基金；不构成重组上市，交易前后控股股东仍为国投集团、实际控制人仍为国务院国资委"
    来源: "https://www.nbd.com.cn/articles/2025-12-30/4202501.html"
风险与困境:
  - 时间: "2024"
    事项: "2024 年度母公司期末未分配利润为 -223,569,188.18 元，虽当年归母净利润 2,925.37 万元，但因母公司可供分配利润为负仍未达到分红条件，2024 年度不进行现金股利分配"
    来源: "https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-03-29/600962_20250329_ETYW.pdf"
  - 时间: "2025"
    事项: "2025 年度归母净利润 4,092.15 万元，但截至报告期末母公司仍存在未弥补亏损，2025 年度拟不进行现金股利分配，亦不实施资本公积转增股本"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600962&id=12032713"
  - 时间: "2026"
    事项: "2026 年上半年归母净利润仅 182.12 万元，同比下降 92.74%；扣非归母净利润 -114.21 万元，同比下降 105.14%；量价齐降叠加汇兑转负导致利润承压"
    来源: "https://stockmc.xueqiu.com/202608/600962_20260829_U1KD.pdf"
  - 时间: "2026-03-10"
    事项: "公司收到上海证券交易所《关于国投中鲁果汁股份有限公司发行股份购买资产并募集配套资金暨关联交易申请的审核问询函》（上证上审（并购重组））"
    来源: "http://static.sse.com.cn/stock/disclosure/announcement/c/202607/600962_20260724_ETJK.pdf"
  - 时间: "2025-12"
    事项: "重组交易作价 60.26 亿元，而 2025-12-30 收盘公司市值仅 62.07 亿元；交易尚需国务院国资委正式批准、上交所审核通过及中国证监会注册同意等程序，存在暂停、中止或取消风险"
    来源: "https://www.nbd.com.cn/articles/2025-12-30/4202501.html"
战略与转型:
  - 时间: "2025-12-30"
    事项: "第九届董事会第 12 次会议审议通过发行股份购买资产并募集配套资金方案，旨在注入国投集团旗下电子信息产业优质资产、打造第二增长曲线，提升上市公司资产规模和盈利能力"
    来源: "https://www.nbd.com.cn/articles/2025-12-30/4202501.html"
  - 时间: "2025-12"
    事项: "标的电子院成立于 1992 年 8 月 27 日，主营业务聚焦电子信息产业，为半导体、新型显示及其他相关领域客户提供产业化咨询、工艺设计、设备选型与组线等专业服务；以 2025 年 6 月 30 日为评估基准日采用收益法评估，电子院母公司净资产账面值约 24.36 亿元，评估增值约 35.9 亿元，增值率 147.40%"
    来源: "https://www.nbd.com.cn/articles/2025-12-30/4202501.html"
  - 时间: "2025-12"
    事项: "重组包含业绩承诺与补偿安排：标的资产 2026 年度至 2028 年度扣非净利润分别不低于约 3.12 亿元、3.48 亿元和 3.75 亿元；控股股东国投集团持有电子院 54.1% 股份（对应 5 亿股），交易对价约 32.6 亿元"
    来源: "https://www.nbd.com.cn/articles/2025-12-30/4202501.html"
  - 时间: "2026-08"
    事项: "重组获上交所并购重组审核委员会审核通过并取得中国证监会同意注册批复；公司披露重组定位由 2025 年报的“加速战略转型、开辟新增长空间”推进至“收到证监会同意注册批复”，重组由筹划阶段进入实施前夜"
    来源: "https://stock.stockstar.com/RB2026090700013832.shtml"
融资需求线索:
