    事项: "拟向不超过 35 名特定投资者发行股份募集配套资金不超过 17.26 亿元，其中补充流动资金 7 亿元"
    来源: "https://www.nbd.com.cn/articles/2025-12-30/4202501.html"
  - 时间: "2026-08-26"
