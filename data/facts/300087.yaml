    来源: "https://www.cls.cn/detail/2206862"
  - 时间: "2026-06-26"
    事项: "收到安徽证监局《行政处罚事先告知书》（处罚字〔2026〕3号）：2024年年报未如实反映控股子公司四川荃银生物科技与贵州某公司的债权债务关系、未单项计提坏账准备，导致少计提信用减值损失1,871.51万元、虚增利润总额1,871.51万元，占当期披露利润总额10.86%；拟对公司给予警告并罚300万元，对时任董事长应敏杰、副董事长兼总经理张琴各罚150万元，时任董秘兼财务总监张庆一罚130万元"
    来源: "https://www.cls.cn/detail/2410692"
  - 时间: "2026-06-30"
    事项: "因上述虚假记载，公司股票自2026年6月30日起被实施其他风险警示（ST荃银），不触及重大违法强制退市情形；公司将在满足条件后争取尽快申请撤销其他风险警示"
    来源: "https://www.cls.cn/detail/2410692"
  - 时间: "2026-08-28"
    事项: "2026年上半年营业收入1,178,585,641.13元，同比下降17.93%；归属于上市公司股东净利润-55,424,200.71元（上年同期-41,329,142.77元）"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-8/2026-08-29/12571592.PDF"

