代码: "300087"
名称: "ST荃银"
定位: "合肥的水稻、玉米、小麦种子龙头，2010年创业板上市；2021年起由先正达集团系的中化现代农业、中种集团控股，2026年1月中种集团完成部分要约收购后持股40.51%；2025年出现上市以来首次年度亏损，2026年6月因2024年年报虚假记载被实施其他风险警示并受行政处罚。"

沿革:
  - 年: "2010"
    事件: "经2009年第一次、第二次临时股东大会决议及证监许可〔2010〕550号核准，于2010年5月向社会公众公开发行1,320万股，发行后注册资本增至5,280万元，2010年5月26日在深交所创业板上市，代码300087"
    来源: "http://static.cninfo.com.cn/finalpage/2015-11-13/1201767631.PDF"
  - 年: "2011"
    事件: "2011年4月27日经2010年度股东大会决议，以资本公积转增股本5,280万元，注册资本变更为10,560万元"
    来源: "http://static.cninfo.com.cn/finalpage/2015-11-13/1201767631.PDF"
  - 年: "2015"
    事件: "发布预案拟发行股份及支付现金购买四川同路农业科技有限责任公司60%股权（作价14,400万元）并配套募资不超过7,000万元；2016年5月股东大会否决该议案"
    来源: "http://static.cninfo.com.cn/finalpage/2015-11-13/1201767631.PDF"
  - 年: "2017"
    事件: "再次提出收购同路农业100%股权（作价28,800万元，发行价12.38元/股、除权除息后调整为9.5元/股）并配套募资不超过12,520万元；2017年8月25日临时股东大会上17项相关议案被全部否决"
    来源: "http://static.cninfo.com.cn/finalpage/2017-08-10/1203782313.PDF"
  - 年: "2021"
    事件: "2021年1月20日根据市场监管总局《经营者集中反垄断审查不实施进一步审查决定书》，中化现代农业取得公司控制权成为控股股东，公司由无控股股东、无实际控制人变更为实际控制人为国务院国资委"
    来源: "http://notice.10jqka.com.cn/api/pdf/19194b507656e119.pdf"
  - 年: "2021"
    事件: "2021年12月10日现代农业、贾桂兰、王玉林与中种集团签署《表决权委托及一致行动协议的权利义务承继确认函》，约定现代农业将其直接持有的荃银高科股份无偿划转至中种集团完成交割时，由中种集团承继表决权委托协议项下权利义务"
    来源: "https://www.stcn.com/article/detail/3504779.html"
  - 年: "2026"
    事件: "2026年1月8日中种集团完成要约收购清算过户手续，持股由194,294,026股（20.51%）增至383,760,376股（40.51%）"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202604241821567482_1.PDF"
  - 年: "2026"
    事件: "2026年6月30日开市起被实施其他风险警示，股票简称由荃银高科变更为ST荃银，证券代码不变，日涨跌幅限制仍为20%"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-6/2026-06-27/12415747.PDF"

主营与结构:
  - 事件: "主要从事优良水稻、玉米、小麦等主要农作物种子的研发、繁育、推广、服务，以及利用优质特色品种带动的订单农业业务"
    来源: "https://www.stcn.com/article/detail/3504779.html"
  - 事件: "2026年上半年种子收入6.71亿元，同比增长16.97%，占营收比重由上年同期的39.95%提升至56.95%；水稻种子收入同比增加26.32%、毛利率同比增加8.87个百分点；海外业务连续7年位居全国第一"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-8/2026-08-29/12571592.PDF"
  - 事件: "2025年实现营业收入44.95亿元，同比下降4.55%；归属于上市公司股东净利润-2.12亿元"
    来源: "https://static.cninfo.com.cn/finalpage/2026-04-25/1225192807.PDF"
  - 事件: "2025年非主业有序压降，种子主业占比提升；2026年上半年营业收入11.79亿元，其中种子收入占比进一步提升"
    来源: "https://finance.sina.com.cn/tech/roll/2026-08-30/doc-iniqacxz8486882.shtml"

