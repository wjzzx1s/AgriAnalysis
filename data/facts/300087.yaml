  - 时间: "2026-04-25"
    事项: "2025年营业收入44.95亿元，同比下降4.55%；归属于上市公司股东净利润-2.12亿元；2025年度营业收入完成率89.89%、实际归母净利润未完成净利润目标；2025年度不进行现金分红、不送红股、不以公积金转增股本"
