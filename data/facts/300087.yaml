    事项: "公司业绩预告显示2025年归母净利润亏损1.8亿元—2.7亿元，原因为种子行业高库存、同质化竞争加剧、自然灾害致种子销售价格下行与毛利率下降，并对对应收款项、存货及商誉计提减值准备"
