代码: "002772"
名称: "众兴菌业"
定位: "甘肃天水的工厂化食用菌龙头，2015年深交所上市，以金针菇、双孢菇为核心品种（双孢菇满产后日产能达420吨/天）；2025年下半年起行业企稳回暖，价格修复带来利润大幅弹性，同时以技改方式布局冬虫夏草工厂化生态繁育，推进多品种协同与西南总部基地建设。"

