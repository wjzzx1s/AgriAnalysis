    事项: "2025 年归属于上市公司股东的净利润 -2,049.50 万元，连续亏损；公司 2025 年度拟不进行现金分红、不送红股、不进行资本公积转增股本，原因是母公司存在未弥补亏损"
    来源: "https://www.cnfin.com/announ/detail/index.html?id=830745462342&code=688098&dannoun=stibdetail&announ=stib"
