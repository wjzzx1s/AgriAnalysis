代码: "688098"
名称: "申联生物"
定位: "专注口蹄疫疫苗的科创板动保企业（上海），2019 年 10 月 28 日上市、为首家科创板动保公司，主要产品为口蹄疫合成肽疫苗与口蹄疫灭活疫苗；上市后业绩持续承压并处于破发状态，2025 年营业收入 2.88 亿元、归母净利润 -2,049.50 万元（亏损收窄约 54%），2026 年 2 月以 23,744.1789 万元收购扬州世之源控股权、开始构建“人用药品+动物保健”双主业。"

沿革:
  - 年: "2018"
    事件: "自 2018 年 7 月起，申太联投资持有公司 5.75% 股份；聂东升、杨玉芳、杨从州、王东亮四人合计控制公司 40.89% 的有表决权股份，为公司控股股东及实际控制人"
    来源: "http://static.sse.com.cn/stock/information/c/201905/155b8b5552e541fb87e84a396d5e1661.pdf"
  - 年: "2019"
    事件: "10 月 16 日发行股份 5,000 万股（每股 8.80 元），10 月 28 日在上海证券交易所科创板上市，证券简称“申联生物”、代码 688098，保荐机构（主承销商）为国信证券股份有限公司"
    来源: "https://finance.sina.com.cn/roll/2024-11-05/doc-incuyvnx9043935.shtml"
  - 年: "2019"
    事件: "首次公开发行募集资金总额 44,000.00 万元，扣除发行费用 3,982.50 万元后募集资金净额 40,017.50 万元；较招股说明书拟募集的 45,000.00 万元少 4,982.50 万元，募集资金全部用于悬浮培养口蹄疫灭活疫苗项目"
    来源: "http://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/688098.phtml"
  - 年: "2026"
    事件: "2 月经第一次临时股东会审议通过，公司以自有资金及自筹资金（包括银行并购贷款）通过全资子公司上海本天成生物医药有限公司取得联营公司扬州世之源生物科技有限责任公司控股权，构建“人用药品”与“动物保健”双主业协同发展格局"
    来源: "https://paper.cnstock.com/html/2026-02/25/content_2181927.htm"

主营与结构:
  - 事件: "公司主营兽用生物制品，是国内口蹄疫疫苗主要生产商之一，首发募集资金全部投向悬浮培养口蹄疫灭活疫苗项目；2025 年年度报告显示公司上市时未盈利且目前尚未实现盈利的情形不适用（即上市时已盈利）"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688098&id=5693290"
  - 事件: "2025 年实现营业收入 28,826.65 万元、同比减少 4.99%，归属于上市公司股东的净利润 -2,049.50 万元（上年同期 -4,474.01 万元，亏损幅度收窄约 54%），全年疫苗销售头份数同比增长 2.42%"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202604281821704033_1.pdf"
  - 事件: "2025 年度业绩快报口径：营业总收入 28,826.65 万元、同比减少 4.99%，营业利润 -2,637.79 万元、利润总额 -2,497.68 万元，归属于母公司所有者的净利润 -1,909.07 万元，扣非后 -2,446.16 万元，基本每股收益 -0.05 元"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688098&id=11973993"
  - 事件: "2026 年上半年实现营业收入 1.12 亿元、同比减少 8.05%，归属于上市公司股东的净利润 -1,914.64 万元（上年同期 -1,286.97 万元），扣非后 -1,915.58 万元，基本每股收益 -0.05 元、加权平均净资产收益率 -1.39%"
    来源: "https://finance.sina.com.cn/stock/bxjj/2026-08-30/doc-iniqauvr5006193.shtml"
  - 事件: "2026 年上半年营业收入下滑的核心原因是生物制品适用增值税税率调整（税前收入同比实现增长，剔除税率变动影响后模拟测算营收略有增长）"
    来源: "https://finance.sina.com.cn/stock/aigc/stockfs/2026-08-30/doc-iniqauvp8220372.shtml"

融资历史:
  - 时间: "2019-10-16"
    方式: "IPO（上海证券交易所科创板）"
    规模: "发行 5,000 万股（不低于发行后总股本的 10.00%，全部为新股发行、原股东不公开发售），发行价 8.80 元/股，预计募集资金 48,800.00 万元，实际募集资金合计 44,000.00 万元、发行费用总额 3,982.50 万元、募集资金净额 40,017.50 万元"
    用途: "悬浮培养口蹄疫灭活疫苗项目（招股说明书原拟募集资金 45,000.00 万元）"
    说明: "发行市盈率（按发行后总股本）43.87 倍，主承销商国信证券股份有限公司，承销方式余额包销，发行方式为战略配售、网下询价配售与网上定价发行；2019 年 10 月 28 日在科创板上市，上市后长期处于破发状态"
    来源: "http://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/688098.phtml"
  - 时间: "2023-08-30"
    方式: "首发募集资金使用（募投项目）"
    规模: "募集资金 440,000,000.00 元、净额 400,175,0 元量级，截至 2023 年 6 月末按计划投入悬浮培养口蹄疫灭活疫苗项目"
    用途: "增加并扩大公司口蹄疫疫苗种类及生产规模"
    说明: "公司预先以自筹资金开展募投项目，募集资金到位后按规置换"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2023-08-30/688098_20230830_PHC7.pdf"
  - 时间: "2026-02-25"
    方式: "收购联营公司控股权并开展新业务（关联交易，含银行并购贷款安排）"
    规模: "公司拟使用 23,744.1789 万元的自有资金及自筹资金（包括银行并购贷款），通过全资子公司上海本天成生物医药有限公司以股权转让及增资方式取得扬州世之源生物科技有限责任公司控股权：本天成拟支付 3,144.1789 万元受让摩尼肽（上海）生物科技有限公司持有的世之源 1,532.7024 万元注册资本，并出资 20,600 万元认购世之源新增注册资本 10,041.9445 万元，交易后本天成持股由 16.99% 增至 40.65%；一致行动人上海申源启航企业管理合伙企业（有限合伙）（员工持股平台）投资 7,995.6392 万元取得世之源新增 10.35% 股权，两者合计持有世之源 51.00% 股权"
    用途: "加速推进公司创新药战略布局，构建“人用药品”与“动物保健”双主业协同发展新格局"
    说明: "议案经公司 2026 年第一次临时股东会审议；交易完成后世之源纳入公司合并报表范围"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-2/2026-02-25/11969896.PDF"

