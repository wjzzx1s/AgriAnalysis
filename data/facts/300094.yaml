代码: "300094"
名称: "国联水产"
定位: "湛江水产品加工与预制菜龙头，2010 年 7 月在深交所创业板上市，2010 年 IPO 募资 11.50 亿元、2022 年定增募资 10 亿元；2023—2025 年连续亏损、2025 年归母净利润 -16.31 亿元，2026 年上半年扭亏为盈（归母净利润 1,003.92 万元）但资产负债率达 95.19%，公司通过出售子公司与资产、引入益阳市国资股东等方式压降负债与补充流动性。"

