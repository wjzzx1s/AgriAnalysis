  - 年: "2025"
    事件: "12 月 8 日第六届董事会第十七次会议审议通过将全资子公司广东新盈食品科技有限公司 100% 股权转让给控股股东新余国通投资管理有限公司（承债式收购，受让方合计支付 31,543.26 万元），以盘活存量资产、聚焦主营业务"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=300094&id=11680825"
