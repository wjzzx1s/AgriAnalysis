主营与结构:
  - 事件: "公司及子公司主要从事中纤板的生产销售、林木资产的抚育与采伐销售，化肥贸易等；经营范围覆盖木材采运、森林经营和管护、人工造林、林产品采集、木材加工、人造板销售、肥料销售、纸浆制造与销售等。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225182373.PDF"
  - 事件: "公司目前拥有经营林区近90万亩（含委托代管林地面积），在福建省处于行业领先地位；经营林区以杉树、松树为主。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225182373.PDF"
  - 事件: "林木产品加工与销售为公司传统业务，主要产品规格为1-40mm的中高密度纤维板，生产以三剩物、次小薪材等森林废弃物为原料；公司拥有四条中高密度纤维板生产线、三条加工饰面板生产线。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225182373.PDF"
  - 事件: "报告期内公司林业板块实现营业收入5,887.90万元，同比增加407.39万元、增幅7.43%；营业成本5,354.93万元，较上年同期4,801.78万元增加11.52%。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225182373.PDF"
  - 事件: "公司所处行业为林业；受福建省限伐政策影响，短期内公司面临主营收益下滑的风险，但从资源培育角度看林木资源因限伐获得较大的价值增长空间。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225182373.PDF"

