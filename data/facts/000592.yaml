代码: "000592"
名称: 平潭发展
定位: "注册地为福建平潭综合实验区的林业与木材加工企业，1996年3月在深圳证券交易所上市；2007至2008年经股权分置改革与重大资产重组，福建山田实业发展有限公司取得控制权并注入林业资产，现由自然人刘平山实际控制。根据《2024年下半年上市公司行业分类结果》，公司所处行业为木材加工和木、竹、藤、棕、草制品业，主营中纤板生产销售、林木资产的抚育与采伐销售及化肥贸易等业务。2025年归母净利润 -1.13亿元，2026年上半年归母净利润 -0.69亿元，连续亏损；控股子公司中福海峡（平潭）置业有限公司已进入破产清算程序。"

沿革:
  - 年: 1993
    事件: "经福建省经济体制改革委员会闽体改（1993）078号和闽体改（1993）134号文批准，由中国福建国际经济技术合作公司独家发起设立，前身为福建省中福实业股份有限公司。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225182373.PDF"
  - 年: 1996
    事件: "1996年3月在深圳证券交易所上市，首次公开发行3,460.00万股，发行价4.33元/股；主承销商为南方证券有限公司，承销方式为余额包销。"
    来源: "https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/000592.phtml"
  - 年: 2000
    事件: "2000年4月，上海胜龙投资管理有限公司（曾用名上海福建神龙企业集团有限公司）通过收购股权成为公司控股股东。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225182373.PDF"
  - 年: 2003
    事件: "2003年4月公司更名为福建省昌源投资股份有限公司；2007年被中国证监会立案调查期间证券简称为S*ST昌源。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225182373.PDF"
  - 年: 2007
    事件: "公司因延迟披露2005年年度报告被中国证监会立案调查并作出行政处罚（证监罚字[2007]11号）：对福建省昌源投资股份有限公司给予警告并处罚款30万元，对陈克根给予警告并处罚款5万元，另对前任董事会秘书等人员作出处罚。"
    来源: "http://static.cninfo.com.cn/finalpage/2007-05-10/23311343.PDF"
  - 年: 2008
    事件: "2008年1月15日经中国证监会证监许可（2008）85号文核准，公司向福建山田实业发展有限公司发行新股258,454,464股；同时依据2007年第一次临时股东大会决议，以2007年6月30日资本公积金向登记在册的全体流通股股东每10股定向转增3股实施股权分置改革，本次股改增加公司股本26,192,447元；2008年3月26日公司更名为福建中福实业股份有限公司，控股股东变更为福建山田实业发展有限公司。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225182373.PDF"
  - 年: 2014
    事件: "2014年4月29日公司名称变更为中福海峡（平潭）发展股份有限公司，证券简称相应变更为平潭发展。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-25/1225182373.PDF"
  - 年: 2026
    事件: "公司注册地址为福建省平潭综合试验区北厝镇金井湾大道中福广场四层，统一社会信用代码91350000158156419U，法定代表人刘平山。"
