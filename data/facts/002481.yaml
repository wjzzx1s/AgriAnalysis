代码: "002481"
名称: "双塔食品"
定位: "山东招远龙口粉丝行业唯一上市公司，主营豌豆蛋白、粉丝、膳食纤维，是全球领先的豌豆蛋白与豌豆淀粉生产基地；近年受豌豆蛋白海外出口及淀粉售价影响盈利大幅回落，控股股东高比例股权质押构成治理与债务风险关注点。"
沿革:
  - 年: "2010"
    事件: "2010 年 9 月 21 日在深圳证券交易所上市，为粉丝行业唯一上市企业"
    来源: "https://www.shuangtafood.com/about.html"
  - 年: "2014"
    事件: "公司申报的“龙口粉丝传统制作技艺”（项目编号 Ⅷ-234）被列入第四批国家级非物质文化遗产代表性项目名录“传统技艺类”"
    来源: "https://www.cs.com.cn/cj2020/202404/t20240412_6401503.html"
  - 年: "2015"
    事件: "非公开发行股票 7,335.60 万股、发行价 17.50 元/股，募集资金总额 128,373.00 万元、净额 126,524.32 万元，新增股份于 2015 年 1 月 14 日上市，认购股票限售期十二个月"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=002481&id=1599306"
  - 年: "2021"
    事件: "2021 年 3 月 12 日完成 2021 年限制性股票激励计划授予登记，对核心管理人员、核心技术人员、核心业务人员共 152 人授予 969.35 万股，占公司总股本 0.78%（股份来源为回购账户）"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2021/2021-4/2021-04-20/7070602.PDF"
  - 年: "2022"
    事件: "2022 年 9 月 7 日第五届董事会第十七次会议审议通过《关于终止实施公司 2021 年限制性股票激励计划暨回购注销相关限制性股票的议案》，回购注销已获授但尚未解除限售的 4,656,250 股限制性股票，2022 年 9 月 23 日临时股东大会审议通过"
    来源: "https://disc.static.szse.cn/disc/disk03/finalpage/2023-04-25/01a4f3c3-9a0f-4731-9de8-3fc83fe22bbe.PDF"
  - 年: "2023"
    事件: "公司推出 2023 年员工持股计划（截至 2026 年半年报持股 31,626,408 股）"
    来源: "https://static.cninfo.com.cn/finalpage/2026-08-20/1225481527.PDF"
主营与结构:
  - 事件: "公司位于龙口粉丝的发源地和主产地——山东省招远市，主营业务为豌豆蛋白、粉丝、膳食纤维；已形成龙口粉丝、豌豆蛋白、豌豆淀粉、膳食纤维、食用菌、人造肉、植物肉、生物天然气等多元化产品格局"
    来源: "https://www.shuangtafood.com/about.html"
  - 事件: "拥有目前全球领先的粉丝、豌豆淀粉、豌豆蛋白、工厂化香菇生产基地，年销售收入 20 多亿元；豌豆蛋白产品通过美国 FDA 认证等国际认证"
    来源: "https://mch.yantai.gov.cn/col/col17774/art/2026/art_da4f2580737f4903a055c97830e88d65.html"
  - 事件: "2020 年 2 月十万吨豌豆精深加工项目试车成功，投产后公司豌豆蛋白年产能达 7 万吨左右（其中约 4 万吨为高端蛋白）"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202003041375833368_1.pdf"
  - 事件: "2025 年营业收入 2,120,684,739.30 元，同比下降 13.37%；归母净利润 32,662,490.37 元，同比下降 65.48%；扣非归母净利润 28,680,201.25 元，同比下降 65.59%"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002481&id=12128810"
  - 事件: "2026 年上半年营业收入 11.23 亿元，同比增加 7.29%；归母净利润 33,148,787.37 元，同比下降 39.02%；扣非归母净利润 29,915,393.96 元，同比下降 38.60%"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=002481&id=12504782"
