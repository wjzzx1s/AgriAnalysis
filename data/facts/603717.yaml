代码: "603717"
名称: "天域生物"
定位: "重庆起家、总部在上海的园林生态工程企业，2019年起跨界生猪养殖、2021年新增光伏新能源并于2024年更名“天域生物”；2020—2024年连续五年亏损，控股股东及主要股东股权高比例质押并被司法冻结，实控人因违规减持被证监会处罚。"
沿革:
  - 年: "2000"
    事件: "公司成立于2000年6月21日"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603717&id=12569833"
  - 年: "2013"
    事件: "2013年11月30日根据公司股东会决议改制成为股份有限公司（2013年12月增资至注册资本12,500万元）"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603717&id=12569833"
  - 年: "2014"
    事件: "2014年2月13日股东大会决议，公司名称由“重庆天域园林股份有限公司”更名为“天域园林股份有限公司”，2014年3月完成名称变更"
    来源: "http://basic.10jqka.com.cn/603717/company.html"
  - 年: "2017"
    事件: "2017年3月在中国境内公开发行A股股票，2017年3月27日在上海证券交易所主板上市（股票代码603717.SH），发行价14.63元/股"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603717&id=12569833"
  - 年: "2019"
    事件: "公司开始战略转型，新设生态农牧业务（生猪养殖），该业务于2019年下半年开始投入"
    来源: "https://www.stcn.com/article/detail/1090436.html"
  - 年: "2021"
    事件: "对业务重新分类归纳，形成“生态环境”“生态农牧（生猪养殖）”“光伏新能源”三大板块，其中光伏新能源为年末新设板块"
    来源: "https://news.qq.com/rain/a/20260120A04ZE700"
  - 年: "2024"
    事件: "经第四届董事会第二十六次会议和2024年第三次临时股东大会审议通过，完成公司名称变更登记，全称变更为“天域生物科技股份有限公司”，证券简称由“天域生态”变更为“天域生物”；此前2024年7月9日曾公告拟变更公司名称、经营范围并修订《公司章程》"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/2024/2024-08-31/8fbf7ba266c111efaca8fa163e26e5de.pdf"
  - 年: "2025"
    事件: "2025年12月31日公司控股股东、实际控制人、时任董事长罗卫国收到中国证监会《立案告知书》（编号：证监立案字0152025014号），因涉嫌违规减持公司股票被立案；2026年1月6日罗卫国申请辞去董事长、董事及各专门委员会职务"
    来源: "https://www.cls.cn/detail/2249782"
主营与结构:
  - 事件: "公司主营集中在三大业务板块：生态环境业务（园林生态工程、生态环境治理、田园综合体、苗木种植等）、生态农牧业务（生猪养殖、农产品销售）和光伏新能源业务"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603717&id=9176721"
  - 事件: "生猪养殖业务主要采用自繁自养的经营模式和“公司+农户”的养殖回收模式，主要销售产品为仔猪、育肥猪；公司自2019年涉足生猪养殖业务以来完成了对若干猪场的投资及专业化生猪养殖团队建设"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603717&id=9176721"
  - 事件: "生猪养殖业务聚焦地处九省通衢和坐拥长江黄金水道的湖北省，深耕区域化发展，出栏规模维持稳定增长趋势"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603717&id=12569833"
  - 事件: "公司与华中农业大学、中国农科院专家团队及中农种源（深圳）科技有限公司等机构开展产学研合作，推进自有种猪繁育厂建设"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603717&id=12569833"
  - 事件: "2026年上半年生猪销售收入29,474.77万元（同比-5.39%），生猪销售量同比增长60.57%；2025年全年生猪销售收入51,920.70万元（同比-10.38%）"
    来源: "https://stock.stockstar.com/RB2026090800009808.shtml"
  - 事件: "公司在战略缩减生态环境业务的同时，稳健推进生态能源业务发展，作为生态环境工程业务的转换及补充，形成建设业务从传统基建到“新基建”的迭代升级"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=603717&id=12569833"
