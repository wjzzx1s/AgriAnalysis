代码: "600975"
名称: "新五丰"
定位: "湖南省国资委下辖唯一以生猪产业为主业的国有控股上市公司，2004 年上交所上市，2022 年并购天心种业并连续完成多轮再融资，出栏量由 2021 年 44.15 万头增至 2025 年 542.24 万头；2026 年上半年受猪价下行影响营收 28.33 亿元、归母净亏损 7.36 亿元。"

沿革:
  - 年: "2004"
    事件: "6 月 9 日在上海证券交易所上市，发行 3,500 万股、发行价 9.20 元/股，发行股数占发行后总股本 34.95%，保荐机构（上市推荐人）为华欧国际证券"
    来源: "http://money.finance.sina.com.cn/corp/view/vISSUE_MarketBulletinDetail.php?stockid=600975&id=53682"
  - 年: "2021"
    事件: "11 月 5 日完成 2021 年度非公开发行股票，总股本由 652,675,584 股增加为 805,040,967 股"
    来源: "https://stockn.xueqiu.com/SH600975/20220427999843.pdf"
  - 年: "2022"
    事件: "实施重大资产重组，通过发行股份及支付现金购买湖南天心种业有限公司 100% 股权和 200 万元国有独享资本公积、天心种业 4 家子公司少数股权及新五丰基金投资的 6 家项目公司 100% 股权"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202304241585776835_1.pdf"
  - 年: "2022"
    事件: "7 月间接控股股东湖南农业发展投资集团有限责任公司成立，由原间接控股股东现代农业集团和湖南粮食集团有限责任公司合并组建为省属国有大型农业企业"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-28/1225213952.PDF"

主营与结构:
  - 事件: "以生猪养殖为主业，公司为湖南省国资委下辖唯一以生猪产业为主业的国有控股上市公司；间接控股股东农业集团承担全省粮油肉收储功能性任务"
    来源: "http://static.cninfo.com.cn/finalpage/2025-08-23/1224560034.PDF"
  - 事件: "出栏量由 2021 年 44.15 万头增至 2025 年 542.24 万头"
    来源: "https://stock.stockstar.com/RB2026090900020206.shtml"
  - 事件: "2022 年末并购天心种业后生猪出栏数量跃上百万台阶达 182.68 万头，2023 年突破 300 万头达 320.07 万头"
    来源: "https://www.stcn.com/article/detail/1464080.html"

融资历史:
  - 时间: "2004-06"
    方式: "IPO（上海证券交易所）"
    规模: "发行 3,500 万股、发行价 9.20 元/股，预计募集资金净额 30,512.30 万元"
    用途: "未查得"
    说明: "发行前净资产 14,611.98 万元，发行后净资产增至 45,124.28 万元；发行市盈率 16.73 倍"
    来源: "http://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=600975&id=52006"
  - 时间: "2021-10-27"
    方式: "非公开发行股票（向特定对象发行，4 名发行对象）"
    规模: "募集资金总额 102,999.00 万元（152,365,383 股，发行价 6.76 元/股）"
    用途: "湖南新五丰存栏 4.32 万头母猪场项目（拟投入募集资金 51,076.40 万元）及补充流动资金（51,922.60 万元）"
    说明: "发行对象为现代农业集团、粮油集团、兴湘集团、湖南建工集团共 4 名，均为实际控制人湖南省国资委控制的企业；发行后省国资委控制的国有持股比例由 33.11% 增至 45.78%，限售期 36 个月"
    来源: "https://www.stcn.com/article/detail/1401109.html"
  - 时间: "2022"
    方式: "发行股份及支付现金购买资产（重大资产重组）"
    规模: "交易作价合计 220,768.24 万元，其中股份对价 195,978.44 万元、现金对价 24,789.80 万元；发行股份价格 7.22 元/股"
    用途: "收购天心种业 100% 股权（含 200 万元国有独享资本公积）、沅江天心 48.20% 股权、衡东天心 39.00% 股权、荆州湘牧 49.00% 股权、临湘天心 46.70% 股权、湖南天翰牧业 100% 股权、郴州市下思田农业科技 100% 股权、新化县久阳农业开发 100% 股权、衡东鑫邦牧业 100% 股权等"
    说明: "重组前现代农业集团直接及通过粮油集团间接合计持有 36.59%，重组后通过粮油集团、新五丰基金、种业投资合计持有 47.37%"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-12/2022-12-30/8761368.PDF"
  - 时间: "2023-07"
    方式: "发行股份募集配套资金"
    规模: "募集资金总额 1,550,579,366.83 元（184,812,797 股，发行价 8.39 元/股）"
    用途: "部分用于支付本次重组现金对价和补充流动资金，天心种业 5 个募集资金项目获 7.11 亿元建设资金"
    说明: "发行对象 20 名，采用询价发行；公司成为近两年行业内唯一成功询价发行募资超 10 亿元的生猪养殖公司"
    来源: "http://static.cninfo.com.cn/finalpage/2024-04-20/1219705303.PDF"

风险与困境:
  - 时间: "2023-12-25"
    事项: "第六届董事会第三次会议审议通过《关于终止部分募集资金投资项目并将剩余募集资金永久补充流动资金的议案》，终止“双峰县石牛乡 3,600 头原种猪场项目”并将其剩余募集资金全部用于永久补充流动资金"
    来源: "http://epaper.stcn.com/pic/202508/23/de2f70afa08f29e9f46b40cf63b511cf.pdf"
  - 时间: "2026-06-30"
    事项: "2026 年上半年营业收入 28.33 亿元，同比下降 23.18%；归属于上市公司股东的净利润 -7.36 亿元、扣非 -7.43 亿元，同比由盈转亏；经营活动产生的现金流量净额 -3.46 亿元，由上年同期净流入转为净流出"
    来源: "http://dataclouds.cninfo.com.cn/shgonggao/hsomarket/2026/20260830/71bde3d16266457ebb22495e32daf3b8.PDF"
  - 时间: "2026-06-30"
    事项: "报告期内利润总额 -750,208,689.22 元，业绩下滑主要系生猪销售价格持续低迷；公司援引国家统计局数据称 2026 年上半年全国生猪价格同比下降 23.1%"
    来源: "https://stock.stockstar.com/RB2026090900020206.shtml"

战略与转型:
  - 时间: "2022"
    事项: "并购天心种业以解决现代农业集团内部同业竞争问题，夯实种猪繁育体系，提升综合竞争、市场拓展与抗风险能力"
    来源: "https://pdf.dfcfw.com/pdf/H3_AP202305181586740282_1.pdf"
  - 时间: "2023-07"
    事项: "完成募集配套资金 15.5 亿元，为天心种业 5 个募集资金项目提供 7.11 亿元建设资金，进一步夯实种猪繁育体系"
    来源: "https://www.stcn.com/article/detail/1464080.html"
  - 时间: "2026"
    事项: "集中资源提升优质产能效率，主动出清高胎龄及低效母猪以优化种群结构；截至 6 月末能繁母猪存栏量由 2025 年末的 24.93 万头优化至 22.09 万头；上半年养殖综合成本同比下降 8%"
    来源: "https://www.stcn.com/article/detail/4162760.html"

融资需求线索:
  - 时间: "2026-01-19"
    事项: "第六届董事会第二十二次会议审议通过《关于使用闲置募集资金临时补充流动资金的议案》，同意使用闲置募集资金不超过 9,000 万元（含）临时补充流动资金，使用期限不超过 12 个月；截至 2026 年半年报披露日该笔资金尚未归还募集资金专户"
    来源: "https://paper.cnstock.com/html/2026-08/31/content_2263279.htm"
  - 时间: "2025-08-23"
    事项: "第六届董事会第十八次会议审议原“湖南新五丰存栏 4.32 万头母猪场项目”相关事项；该项目投资总额 106,028.24 万元、原拟投入募集资金 51,076.40 万元"
    来源: "http://epaper.stcn.com/pic/202508/23/de2f70afa08f29e9f46b40cf63b511cf.pdf"

其他要点:
  - 要点: "控股股东为湖南省现代农业产业控股集团有限公司，间接控股股东为湖南农业发展投资集团有限责任公司，实际控制人为湖南省人民政府国有资产监督管理委员会"
    来源: "https://qxb-pdf-osscache.qixin.com/AnBaseinfo/13eed9042c93ff0e4a6e0211c96f4da8.pdf"
  - 要点: "2024 年 11 月 6 日公告：控股股东与一致行动人一致行动关系到期终止，不涉及控股股东和实际控制人变更；现代农业集团、粮油集团、兴湘集团、中湘资本自愿承诺所持 2021 年度非公开发行股份自 2024 年 11 月 5 日至 2025 年 5 月 4 日不以任何形式主动减持"
    来源: "https://www.stcn.com/article/detail/1401109.html"
  - 要点: "2021 年年度报告称，2021 年非公开发行使省国资委控制的国有持股比例由发行前的 33.11% 增至 45.78%，国有控股比例及控制的表决权大幅提高"
    来源: "https://stockn.xueqiu.com/SH600975/20220427999843.pdf"

