  - 时间: "2017-09-14"
    方式: "重大资产置换＋发行股份购买资产（借壳上市）"
    规模: "京粮股份（北京京粮食品有限公司）100%股权作价230,852.72万元，置出资产作价60,898.36万元，交易价格差额169,954.36万元；公司发行210,079,552股、发行价8.09元/股向京粮食品原股东发行股份购买差额部分；同时向京粮集团非公开发行48,965,408股新股募集配套资金"
    用途: "资产置换、购买京粮食品100%股权、配套资金"
    说明: "新增股份上市日期为2017年11月15日；发行完成后注册资本685,790,364.00元，京粮集团占股份总数42.06%、成为第一大股东"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000505&id=12026272"
  - 时间: "2017"
    方式: "发行股份募集配套资金"
    规模: "非公开发行不超过48,965,408股，发行价8.82元/股，募集配套资金总额不超过43,187.49万元；实际募集资金总额431,874,898.56元，扣除发行费用45,000,000.00元"
    用途: "配套资金（招股/重组方案约定用途）"
    说明: "股东京粮集团以货币资金认购"
