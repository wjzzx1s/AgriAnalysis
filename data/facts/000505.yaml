代码: "000505"
名称: "京粮控股"
定位: "北京市国资委系统（首农食品集团—京粮集团）旗下油脂油料加工与食品加工上市平台，由原海南珠江控股2017年重大资产置换并注入京粮食品而来；油脂贸易体量大但毛利薄，2025年因贸易收缩与原料成本上升转为大额亏损。"
沿革:
  - 年: "1992"
    事件: "根据海南省人民政府办公厅琼府办函（1992）1号、海南省人民银行琼银（1992）市管字第6号文批准，于1992年1月11日由海南珠江实业公司重新注册成立股份有限公司，重新注册时发行股票总额81,880,000股（原公司净资产折股60,793,600股、新增发行21,086,400股），名称为海南珠江实业股份有限公司"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202203301556090886_1.pdf?1648669152000.pdf"
  - 年: "1992"
    事件: "1992年12月21日在深圳证券交易所上市，证券代码000505，B股代码200505；更名历史含琼珠江A、珠江控股、ST珠江、*ST珠江、京粮控股等"
    来源: "https://q.stock.sohu.com/cn/000505/index.shtml"
  - 年: "1992-2016"
    事件: "1992年至1999年控股股东为广州珠江实业集团有限公司；1999年至2016年控股股东为北京万发房地产开发有限责任公司；2016年9月至今控股股东为北京粮食集团有限责任公司"
    来源: "https://pdf.dfcfw.com/pdf/H2_AN202203301556090886_1.pdf?1648669152000.pdf"
  - 年: "2017"
    事件: "2017年7月28日取得证监会《关于核准海南珠江控股股份有限公司向北京粮食集团有限责任公司等发行股份购买资产并募集配套资金的批复》（证监许可[2017]1391号）；确定2017年7月31日为重大资产交割日，主营业务由房地产开发、酒店旅游、物业管理变更为油脂油料加工销售及贸易和食品制造"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000505&id=12026272"
  - 年: "2018"
    事件: "2017年12月15日北京市国资委下发京国资［2017］215号文，北京首都农业集团、北京粮食集团、北京二商集团联合重组，重组后公司间接控股股东为首农食品集团"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000505&id=10827438"
主营与结构:
  - 事件: "主营业务为油脂油料加工及食品加工：油脂加工指对经过初榨的原油进行精炼、灌装、销售；油料加工指对芝麻、大豆、花生等油料进行压榨、精炼、灌装、销售；食品加工指休闲食品、烘焙产品的研发、生产及销售"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000505&id=12026271"
  - 事件: "按《上市公司行业分类结果》，公司所属行业大类为制造业－农副食品加工业（代码C13），具体为植物油加工行业，同时食品加工业务毛利占比较高"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000505&id=12026271"
  - 事件: "2025年分业务收入：油脂板块71.27亿元、同比下降32.04%；食品板块6.89亿元、同比下降18.79%；其他业务0.42亿元、同比下降57.86%"
    来源: "https://finance.sina.com.cn/stock/aigc/stockfs/2026-03-27/doc-inhsmnzv8306228.shtml"
  - 事件: "2025年分地区收入：东北、华南、华东区域营收分别同比下滑73.02%、85.89%、47.39%，仅西南区域实现29.91%增长"
    来源: "https://finance.sina.com.cn/stock/aigc/stockfs/2026-03-27/doc-inhsmnzv8306228.shtml"
  - 事件: "控股股东为北京粮食集团有限责任公司，间接控股股东为首农食品集团，属地方国资委系统；首农食品集团下属部分子公司的香油、麻酱及烘焙产品与公司业务存在同业竞争情形"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000505&id=10827438"
  - 事件: "截至2024年底公司合并资产总额67.01亿元、所有者权益35.11亿元（含少数股东权益3.68亿元）；2024年营业总收入114.35亿元、利润总额-0.08亿元"
    来源: "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=000505&id=11152621"
