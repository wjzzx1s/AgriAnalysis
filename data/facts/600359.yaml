代码: "600359"
名称: "新农开发"
定位: "新疆生产建设兵团第一师国资委控制的农业上市平台，主营作物种子、大米谷物加工、甘草饮品与肉牛养殖；2023 年剥离乳业，2025 年控股股东变更为农垦集团。"
沿革:
  - 年: "1999"
    事件: "经新疆生产建设兵团新兵函[1998]17 号文批准，由新疆阿克苏农垦农工商联合总公司独家发起、以社会募集方式设立股份有限公司（工商成立日 1999-04-23），设立时股本总额 29,400 万股；社会公众股 9,000 万股于 1999-04-29 在上海证券交易所上市"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2023-04-21/600359_20230421_G8V9.pdf"
  - 年: "2001"
    事件: "2001 年 9 月配股增资，经证监公司字[2001]89 号文核准向社会公众股股东配售 2,700 万股，股份总额由 29,400 万股变更为 32,100 万股"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600359&id=10762931"
  - 年: "2002"
    事件: "公开披露显示公司成立时主营业务为棉花的种植与销售，2002 年起主营业务发生变化（调整后具体构成以当年披露原文为准）"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-5/2023-05-20/9235984.PDF"
  - 年: "2008"
    事件: "经国务院国资委国资产权[2007]900 号文批准，控股股东变更为阿拉尔塔河投资有限责任公司（2008-03-27 完成股权过户）；该公司 2008-10-31 更名为阿拉尔统众国有资产经营有限责任公司，2022-07-08 更名为阿拉尔市统众国有资本投资运营（集团）有限责任公司，2024-06-20 更名为阿拉尔市国有资本投资运营集团有限公司"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12548044"
  - 年: "2014"
    事件: "经证监许可[2014]1128 号文核准非公开发行 60,512,820 股（发行价格 9.75 元/股），2014-12 完成验资，总股本由 321,000,000 股增至 381,512,820 股"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2023-04-21/600359_20230421_G8V9.pdf"
  - 年: "2023"
    事件: "2023-05-24 将所持阿拉尔新农乳业有限责任公司 97.4359% 股权过户至新疆天润乳业股份有限公司，完成乳制品业务剥离"
    来源: "http://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600359&id=11419710"
  - 年: "2025"
    事件: "2025-04-25 以现金收购控股股东农垦集团所持新疆天山雪食品有限责任公司 100% 股权完成工商变更，天山雪成为全资子公司并纳入合并报表"
    来源: "https://paper.cnstock.com/html/2026-04/10/content_2198042.htm"
  - 年: "2025"
    事件: "2025-12-09 国投集团所持 40.32% 股份（153,815,575 股）无偿划转至农垦集团的过户登记完成，控股股东由阿拉尔市国投集团变更为农垦集团，实际控制人仍为新疆生产建设兵团第一师国资委"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12548044"
主营与结构:
  - 事件: "2026 年上半年主营业务涵盖五大板块：种子及农副产品加工销售（控股子公司塔河种业，产品涉棉花、水稻、小麦等大田作物种子）、大米与谷物加工销售（全资子公司天山雪食品）、食品饮料制造销售（全资子公司新农甘草）、甘草制品加工销售（新农甘草）、肉牛养殖（全资子公司新农发）"
    来源: "https://stock.stockstar.com/notice/SN2026082600050121.shtml"
  - 事件: "棉种业务采用“公司+基地+团场（合作社）”繁育模式，塔河种业在南疆区域市场居主导地位、棉种销售规模位居全国前列，拥有 61 项自主知识产权"
    来源: "https://stock.stockstar.com/notice/SN2026082600050121.shtml"
  - 事件: "新农甘草覆盖甘草种植、原料收购、精深加工到国内外销售出口全产业链，产品涉甘草浸膏、甘草黄酮、甘草酸二钾盐、胡萝卜汁等，被披露为国内甘草深加工领域头部企业"
    来源: "https://stock.stockstar.com/notice/SN2026082600050121.shtml"
  - 事件: "2023 年重大资产出售交易价格为 31,760.86 万元，标的为新农乳业 97.4359% 股权，交易对方天润乳业；交易双方分别受兵团第十二师、第一师国资委控制，被认定为不存在关联关系"
    来源: "http://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2023-04-21/600359_20230421_G8V9.pdf"
  - 事件: "2026 年半年度营业收入 195,538,360.82 元，同比下降 31.13%（主要业务板块销售业务量同比下降）；归属于上市公司股东的净利润 18,571,139.32 元，同比下降 1.93%"
    来源: "https://stock.stockstar.com/notice/SN2026082600050121.shtml"
