主营与结构:
  - 事件: "公司从事的主要经营活动是宠物食品的研发、生产和销售，主营犬用和猫用多品类宠物食品，主要产品包括科学营养配方的主粮系列，以畜禽肉、鱼肉等为主要原料的零食系列以及含冻干卵磷脂、乳酸钙等功能原料的保健品系列等。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-23/1225143937.PDF"
  - 事件: "公司持续扩大国内智能工厂产能，加码泰国、新西兰高端产能布局，搭建WCM世界级制造体系；境内主要子公司包括山东海创工贸有限公司、乖宝（山东）供应链有限公司等，境外全资子公司包括乖宝泰国有限公司（Gambol（Thailand）Co., Ltd.）和乖宝宠物（美国）有限公司（Gambol Pet USA Inc.）。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-23/1225143937.PDF"
  - 事件: "公司以自有品牌市占率优先作为核心战略，将长期发展明确为“规模筑基—结构升级—利润兑现”三步走战略阶段；报告期内推进品牌高端化、产品结构化、渠道壁垒化，并完成SAP系统上线与数据中台建设。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-23/1225143937.PDF"
  - 事件: "截至2025年末公司其他债权投资（可转让大额存单）期末余额1,064,016,807.16元，期初余额1,147,276,018.63元，本期新增购买金额中含公允价值变动；期末受限制资产为货币资金1,646,887.34元（保函、国际信用证保证金、封存账户资金）。"
    来源: "http://static.cninfo.com.cn/finalpage/2026-04-23/1225143937.PDF"

