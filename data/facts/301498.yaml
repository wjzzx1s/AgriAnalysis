代码: "301498"
名称: 乖宝宠物
定位: "山东聊城的宠物食品企业，全称乖宝宠物食品集团股份有限公司，2006年6月26日注册成立，2023年8月16日在深圳证券交易所创业板上市；主营犬用和猫用多品类宠物食品的研发、生产和销售，产品包括主粮系列、零食系列与保健品系列，旗下拥有“麦富迪”“弗列加特”等自有品牌，并在泰国、新西兰布局高端产能。控股股东、实际控制人为秦华。2025年归母净利润6.73亿元、同比增长7.75%；2026年上半年营业收入35.430亿元、同比增长10.01%，但归母净利润1.91亿元、同比下降49.57%。2026年8月公司推出向不特定对象发行可转债预案，拟募集资金不超过11亿元。"

