  - 事件: "公司所属行业为医药制造类，许可经营项目包括兽药生产、兽药经营、饲料生产、饲料添加剂生产、中药提取物生产（分支机构经营）等，产品体系涵盖兽用生物制品、兽用药物制剂、功能性添加剂与兽用原料药。"
