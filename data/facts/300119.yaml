代码: "300119"
名称: 瑞普生物
定位: "天津自贸试验区的动物保健企业，全称瑞普生物股份有限公司，2008年5月19日由天津瑞普生物技术集团有限公司整体变更设立，2010年9月在深圳证券交易所创业板上市；所属行业为医药制造类，产品体系涵盖兽用生物制品、兽用药物制剂、功能性添加剂与兽用原料药，并参股瑞派宠物医院（持股9.09%）布局宠物医疗。控股股东、实际控制人为自然人李守军（持股36.04%，任董事长）。2025年归母净利润4.01亿元、同比增长33.18%；2026年上半年归母净利润2.04亿元、同比下降20.43%；2026年3月董事会提请股东会授权以简易程序向特定对象发行融资总额不超过3亿元的股票。"

