  - 时间: "2026-05-21"
    事项: "公司表示未来 3—5 年仍将聚焦蓝莓单一作物，做精做深全产业链；深加工（以蓝莓果汁为代表）目前尚处于研发与市场探索阶段；将依托云南早春气候优势拓展国内外市场"
