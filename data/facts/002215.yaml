战略与转型:
  - 时间: "2018 年以来"
    事项: "以“蓝莓为战略作物”切入现代特色作物生鲜消费领域，实施规模化、标准化、数据化、智能化生产；打造“农业工厂”模式，自主流转土地、全程自种自产自销，构建单一作物研产销全产业链"
