    来源: https://news.qq.com/rain/a/20260917A09VHA00
  - 事项: 2026年云南主要产区蓝莓产量同比增39%；农业农村部2026年第15周全国蓝莓批发均价18.5元/公斤、连续7周下行，云南优质蓝莓地头价跌至30元/公斤、同比约降50%。
    来源: https://news.qq.com/rain/a/20260917A09VHA00
  - 事项: 2024年全国蓝莓总产量78万吨、比2020年增加197%；2025年国内蓝莓需求量约100万吨以上，行业市场规模约500亿元；2022年美国人均消费2.63公斤，我国仅0.26公斤。
