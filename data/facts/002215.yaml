代码: "002215"
名称: "诺普信"
定位: "由农药制剂龙头转型的作物科学公司，以蓝莓为核心的特色生鲜消费业务营收占比已过半，形成“农药制剂＋特色生鲜消费”双轮驱动；实际控制人卢柏强股权质押规模较大，正推进 14.5 亿元定增投向蓝莓基地与研发中心。"
沿革:
  - 年: "1999"
    事件: "9 月 18 日在深圳正式注册成立"
    来源: "https://finance.sina.com.cn/jjxw/2026-09-08/doc-iniraita9315329.shtml"
  - 年: "2008"
    事件: "1 月 28 日向社会公开发行人民币普通股（A 股）3,000 万股，发行价 9.95 元/股；2 月 18 日起在深圳证券交易所中小企业板挂牌交易，股票简称“诺普信”，代码 002215"
    来源: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2008/2008-2/2008-02-15/291847.PDF"
  - 年: "2018"
    事件: "开始探索第二增长曲线，成立爱莓庄农业集团，切入以蓝莓为核心的生鲜消费领域"
    来源: "https://finance.sina.com.cn/jjxw/2026-09-08/doc-iniraita9315329.shtml"
  - 年: "2023"
    事件: "公司由“深圳诺普信农化股份有限公司”更名为“深圳诺普信作物科学股份有限公司”，标志从农药制剂企业向作物科学公司战略升级"
    来源: "https://finance.sina.com.cn/jjxw/2026-09-08/doc-iniraita9315329.shtml"
主营与结构:
  - 事件: "2026 年上半年特色生鲜消费业务营业收入 20.70 亿元（+13.87%），占营业收入 52.22%；农药制剂业务 15.24 亿元（+2.43%），占比 38.45%；田田圈业务 3.70 亿元（-0.77%）"
    来源: "https://stock.stockstar.com/RB2026082000001118.shtml"
  - 事件: "核心子公司爱莓庄农业集团 2026 年上半年营业收入 20.18 亿元、净利润 6.07 亿元，为公司盈利绝对主力"
    来源: "https://stock.stockstar.com/RB2026082000001118.shtml"
  - 事件: "2024 年公司营业收入 52.88 亿元（+28.37%），归母净利润 5.85 亿元（+148.10%）；其中以蓝莓为主的生鲜消费业务贡献收入 21.39 亿元（+251.28%），占营业收入比重 40.45%"
    来源: "https://finance.sina.com.cn/jjxw/2025-05-16/doc-inewukkv4196132.shtml"
  - 事件: "2026 年上半年分地区看华南收入大增 79.37%、出口增长 74.12%，东北、华北、华中、西北、西南等传统制剂市场均出现不同程度下滑"
    来源: "https://stock.stockstar.com/RB2026082000001118.shtml"
  - 事件: "公司称拥有全球最大基质蓝莓基地，蓝莓通过京东、山姆会员店、胖东来等渠道销往国内并开始出口"
    来源: "https://finance.sina.com.cn/jjxw/2026-09-08/doc-iniraita9315329.shtml"
  - 事件: "2026 年上半年营业收入 39.64 亿元（+7.76%），归母净利润 7.65 亿元（+17.98%），扣非净利润 7.50 亿元（+10.45%），加权平均净资产收益率 16.75%，基本每股收益 0.7752 元"
    来源: "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12505508"
