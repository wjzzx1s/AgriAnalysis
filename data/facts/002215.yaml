竞争优势:
  - 事项: 蓝莓采用基质栽培（无土栽培）、设施大棚、水肥一体化和光照调节技术，2024/2025产季亩产超过1.4吨、2023/2024产季约1.3吨，远高于行业平均约0.8吨，公司称单产有望从1.5吨提升至2吨。
    来源: https://static.cninfo.com.cn/finalpage/2025-04-27/1223348087.PDF
  - 事项: 促早技术可将蓝莓产季提前3至4个月，实现在价格高峰的10月至次年2月产果；2026年新产季产果较去年提前约2至3周，春节前产量占比提升至约70%。
    来源: http://xinpi.zqrb.cn/pdf/SZ/002215/2025/1126/d5d989270369a499cb328769404c452f.pdf
  - 事项: 自建60多个农场、40多座冷链加工中心，自有品牌爱莓庄、迷迭蓝进驻京东、盒马、山姆会员店、胖东来等高端渠道，KA渠道出货占比提升至30%以上，最大KA客户为京东。
    来源: https://static.cninfo.com.cn/finalpage/2025-04-27/1223348087.PDF
  - 事项: 与澳洲MBO的品种授权为非独家，2026年初签订框架协议引进新品种；与泰国正大集团签约，核心覆盖5个国家和地区供应，老挝巴松基地首年投产直接供货境外。
    来源: https://stock.10jqka.com.cn/20260827/c679364205.shtml
行业基本面:
